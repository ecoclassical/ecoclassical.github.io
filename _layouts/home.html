<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #080d18;
      --surface:  #0f1726;
      --surface2: #162035;
      --border:   rgba(255,255,255,0.07);
      --bhi:      rgba(255,255,255,0.13);
      --text:     #e2e8f0;
      --muted:    #7a8aa0;
      --green:    #38d9a9;
      --blue:     #4f9cf9;
      --orange:   #f9a84f;
      --purple:   #c084fc;
      --font:     -apple-system, BlinkMacSystemFont, "Segoe UI", "Inter", Helvetica, Arial, sans-serif;
      --max:      1760px;
      --hero-fs:  clamp(0.97rem, 1.05vw, 1.17rem);
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.7;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    /* Grid + glow background */
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background:
        radial-gradient(ellipse 80% 60% at 10% 5%,  rgba(56,217,169,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 85%, rgba(79,156,249,0.05) 0%, transparent 55%);
    }
    body::after {
      content: "";
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.016) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.016) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .wrap {
      position: relative; z-index: 1;
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 clamp(24px, 4vw, 72px);
    }

    /* ── Nav ── */
    nav {
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--border);
      background: rgba(8,13,24,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .nav-inner {
      max-width: var(--max);
      margin: 0 auto;
      padding: 0 clamp(24px, 4vw, 72px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      gap: 1rem;
    }
    .nav-name {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
    .nav-links {
      display: flex;
      gap: 0.1rem;
      flex-wrap: wrap;
    }
    .nav-links a {
      font-size: 0.8rem;
      color: var(--muted);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }
    .nav-links a:hover,
    .nav-links a.active {
      color: var(--green);
      background: rgba(56,217,169,0.08);
    }

    .nav-left { display: flex; align-items: center; gap: 1.1rem; min-width: 0; flex-wrap: wrap; }
    .nav-contact { display: flex; gap: 0.1rem; flex-wrap: wrap; padding-left: 1.1rem; border-left: 1px solid var(--bhi); }
    .nav-contact a {
      font-size: 0.76rem; color: var(--muted); text-decoration: none;
      padding: 3px 7px; border-radius: 4px; transition: color 0.15s, background 0.15s;
    }
    .nav-contact a:hover { color: var(--green); background: rgba(56,217,169,0.08); }
    @media (max-width: 860px) {
      .nav-inner { height: auto; padding-top: 0.6rem; padding-bottom: 0.6rem; flex-wrap: wrap; }
      .nav-contact { padding-left: 0; border-left: none; margin-left: -7px; }
    }

    /* ── Hero: identity + about (left), research questions (right) ── */
    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
      grid-template-areas:
        "id  label"
        "bio list";
      column-gap: clamp(3rem, 6vw, 6rem);
      row-gap: 2.4rem;
      align-content: end;
      /* fill the viewport below the 52px nav; content sits low, small bottom margin */
      min-height: calc(100vh - 53px);
      padding: 4rem 0 2.5rem;
    }
    /* Flatten the two columns into the grid so the first line of the About
       text and the first research question share a row and a baseline. */
    .hero-left, .hero-right { display: contents; }
    .hero-id { grid-area: id; }
    .hero .bio { grid-area: bio; align-self: start; }
    .hero-right .section-label { grid-area: label; align-self: end; margin-bottom: 0; font-size: 0.816rem; }  /* 1.2 × 0.68rem */
    .hero-right .q-list { grid-area: list; align-self: start; }
    .hero-right .q-dot { margin-top: calc(0.875em - 3px); }  /* centred on a 1.75 line */
    @media (max-width: 860px) {
      .hero {
        grid-template-columns: 1fr;
        grid-template-areas: "id" "bio" "label" "list";
        row-gap: 2rem; min-height: 0; padding: 2.5rem 0 3rem;
      }
      .hero-right .section-label { margin-top: 1rem; }
    }
    .hero-id {
      display: flex; align-items: center; gap: 1.8rem;
    }
    .hero-photo {
      flex-shrink: 0;
      width: 120px; height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(56,217,169,0.55);
      box-shadow: 0 0 0 5px rgba(56,217,169,0.08);
    }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--green);
      margin-bottom: 0.5rem;
    }
    .eyebrow::before {
      content: ""; display: inline-block;
      width: 20px; height: 1px; background: var(--green);
    }
    .hero h1 {
      font-size: clamp(1.8rem, 3.6vw, 2.8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      color: #fff;
      margin-bottom: 0.4rem;
    }
    .hero-role {
      font-size: 0.85rem;
      color: var(--muted);
      line-height: 1.5;
    }
    .hero .bio p { font-size: var(--hero-fs); line-height: 1.75; }
    .hero .bio p + p { margin-top: 1.1em; }
    .hero-right .q-list li { font-size: var(--hero-fs); line-height: 1.75; padding: 1.4rem 0; gap: 1.2rem; }
    .hero-right .q-list li:first-child { padding-top: 0; }
    .hero-right .q-list li:last-child { padding-bottom: 0; }

    .bio a { color: var(--green); text-decoration: none; border-bottom: 1px solid rgba(56,217,169,0.35); }
    .bio a:hover { border-bottom-color: var(--green); }

    /* ── Figure slideshow (images/featured/, captions in _data/featured.yml) ── */
    .figures { padding: 2.5rem 0 3rem; border-bottom: 1px solid var(--border); }
    .fig-stage {
      position: relative;
      height: clamp(240px, 34vw, 440px);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .fig {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 1.2rem;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    .fig.on { opacity: 1; }
    .fig img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
    @media (prefers-reduced-motion: reduce) { .fig { transition: none; } }
    .fig-bar {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 1.2rem;
      margin-top: 0.9rem;
    }
    .cap-text { font-size: 0.78rem; color: var(--muted); line-height: 1.55; max-width: 90ch; min-height: 2.4em; }
    .cap-count { font-variant-numeric: tabular-nums; color: rgba(226,232,240,0.55); margin-right: 0.7rem; letter-spacing: 0.06em; }
    .cap-tag { font-weight: 700; font-size: 0.66rem; letter-spacing: 0.1em; text-transform: uppercase; margin-right: 0.35rem; }
    .cap-tag.green  { color: var(--green); }
    .cap-tag.blue   { color: var(--blue); }
    .cap-tag.orange { color: var(--orange); }
    .cap-tag.purple { color: var(--purple); }
    .cap-controls { display: flex; gap: 0.35rem; flex-shrink: 0; }
    .cap-btn {
      width: 30px; height: 30px; border-radius: 50%;
      border: 1px solid var(--bhi); background: var(--surface);
      color: var(--text); font-size: 0.8rem; line-height: 1; cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .cap-btn:hover, .cap-btn:focus-visible { border-color: var(--green); color: var(--green); outline: none; }

    /* ── Bio two-column grid ── */
    .bio-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3rem;
      padding: 3rem 0;
      border-bottom: 1px solid var(--border);
    }
    @media (max-width: 640px) {
      .bio-grid { grid-template-columns: 1fr; gap: 2rem; }
    }
    .bio p { font-size: 0.95rem; color: var(--text); }
    .bio p + p { margin-top: 0.85em; }

    /* ── Research questions ── */
    .questions {
      padding: 3rem 0;
      border-bottom: 1px solid var(--border);
    }
    .section-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.5rem;
    }
    .q-list { list-style: none; }
    .q-list li {
      display: flex;
      gap: 1rem;
      padding: 0.9rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
    }
    .q-list li:last-child { border-bottom: none; }
    .q-dot {
      flex-shrink: 0;
      width: 6px; height: 6px;
      border-radius: 50%;
      margin-top: 0.55rem;
    }
    .q-dot.green  { background: var(--green); }
    .q-dot.blue   { background: var(--blue); }
    .q-dot.orange { background: var(--orange); }
    .q-dot.purple { background: var(--purple); }

    /* ── Visualizations ── */
    .visuals {
      padding: 3rem 0;
      border-bottom: 1px solid var(--border);
    }
    .vis-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    @media (max-width: 540px) { .vis-grid { grid-template-columns: 1fr; } }
    .vis-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .vis-card img { width: 100%; display: block; }
    .vis-caption {
      padding: 0.6rem 0.8rem;
      font-size: 0.72rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    /* ── Contact strip ── */
    .contact-strip {
      padding: 2.5rem 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .contact-links {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
    }
    .contact-links a {
      font-size: 0.82rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .contact-links a:hover { color: var(--green); }
    .contact-note {
      font-size: 0.75rem;
      color: rgba(122,138,160,0.5);
    }
    {% include responsive-navigation.css %}
  </style>
</head>
<body>

<nav aria-label="Main navigation">
  <div class="nav-inner">
    <div class="nav-left">
      <a class="nav-name" href="/">Oriol Vallès Codina</a>
      <div class="nav-contact">
        <a href="mailto:oriolvallescodina@gmail.com">Email</a>
        <a href="https://scholar.google.com/citations?user=jQttkoQAAAAJ" target="_blank" rel="noopener">Google Scholar</a>
        <a href="https://orcid.org/0000-0002-1361-8243" target="_blank" rel="noopener">ORCID</a>
        <a href="/cv/">CV</a>
        <a href="https://www.netzeropolicylab.com/" target="_blank" rel="noopener">NZIPL</a>
      </div>
    </div>
    <div class="nav-links">
      <a href="/research/">Research</a>
      <a href="/publications/">Publications</a>
      <a href="/talks/">Talks</a>
      <a href="/teaching/">Teaching</a>
    </div>
  </div>
</nav>

<div class="wrap">
  {{ content }}

</div>

</body>
</html>
