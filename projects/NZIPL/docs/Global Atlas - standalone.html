document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

code-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Inter';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"d02bcf53-9a6a-4e0d-b41e-404217a0d0f2\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"ce78c649-cb7e-4189-8804-c221f96fe369\"><\u002Fscript>\n<script src=\"5ff9854a-e3ca-4943-aea1-a6be793ff468\"><\u002Fscript>\n\n\n<style>\n:root{\n  --ink:#011821; --black:#000; --white:#fff; --fog:#f6f6f8; --fog-2:#eef0f3;\n  --steel:#e3e4e8; --charcoal:#232730; --slate:#7c7f88; --slate-2:#a4a7b0;\n  --plum:#111a4a; --orange:#ec652b; --grid:#023247; --moss:#44b48b;\n  --info:#7ea7e9; --cyan:#167e6c; --teal:#88deeb;\n  --t-solar:#d39200; --t-nuclear:#2563a8; --t-wind:#0f766e; --t-batteries:#5b3aa1; --t-transmission:#a05a2c;\n  --sans:'Inter','SuisseIntl',system-ui,sans-serif;\n  --serif:'Fraunces',Georgia,serif;\n  --mono:'IBM Plex Mono','SFMono',ui-monospace,monospace;\n}\n*{box-sizing:border-box;margin:0;padding:0}\nhtml,body{background:var(--white);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;font-feature-settings:\"ss01\",\"cv11\"}\nbody{overflow-x:hidden}\nbutton{font:inherit;color:inherit;cursor:pointer;border:none;background:none}\na{color:inherit;text-decoration:none}\n\n/* ── Dotted blueprint background ── */\n.grid-bg{position:fixed;inset:0;pointer-events:none;background-image:radial-gradient(circle, rgba(2,50,71,.07) 1px, transparent 1px);background-size:24px 24px;z-index:0;mask-image:radial-gradient(ellipse at center, #000 30%, transparent 80%)}\n\n/* ── Top chrome (persistent) ── */\n.chrome{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--steel)}\n.chrome-row{display:flex;align-items:center;gap:32px;padding:14px 32px;max-width:1600px;margin:0 auto}\n.brand{display:flex;align-items:baseline;gap:10px;flex-shrink:0}\n.brand-mark{font-family:var(--mono);font-size:11px;letter-spacing:.18em;font-weight:500;color:var(--orange);text-transform:uppercase;border:1px solid var(--orange);padding:3px 7px;border-radius:2px}\n.brand-name{font-family:var(--serif);font-size:18px;font-weight:400;letter-spacing:-.01em;color:var(--ink)}\n.brand-name em{font-style:italic;color:var(--slate)}\n.nav-tabs{display:flex;gap:2px;flex:1}\n.tab{padding:7px 14px;font-size:13px;font-weight:500;color:var(--slate);border-radius:6px;letter-spacing:-.01em;transition:all .15s}\n.tab:hover{color:var(--ink);background:var(--fog)}\n.tab.active{color:var(--ink);background:var(--fog-2)}\n.tab .num{font-family:var(--mono);font-size:10px;color:var(--slate-2);margin-left:6px}\n.chrome-right{display:flex;align-items:center;gap:10px;flex-shrink:0}\n.search-mini{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--steel);border-radius:6px;font-family:var(--mono);font-size:11px;color:var(--slate);min-width:200px}\n.search-mini::before{content:\"\";width:11px;height:11px;border:1.5px solid currentColor;border-radius:50%;box-shadow:5px 5px 0 -3px currentColor;transform:rotate(-45deg);margin-right:2px}\n.btn-cta{padding:7px 14px;border-radius:6px;background:var(--orange);color:#fff;font-size:13px;font-weight:500;letter-spacing:-.01em}\n.kbd{font-family:var(--mono);font-size:10px;padding:1px 5px;border:1px solid var(--steel);border-radius:3px;color:var(--slate);background:#fff;margin-left:auto}\n\n/* ── State container ── */\n.view{position:relative;z-index:1}\n.view[data-hidden]{display:none}\n\n/* ════════════════════ LANDING ════════════════════ */\n.landing{position:relative;min-height:calc(100vh - 53px);padding:0;overflow:hidden}\n.land-grid{display:grid;grid-template-columns:1fr 1.4fr;gap:0;min-height:calc(100vh - 53px)}\n.land-left{padding:64px 56px 48px;display:flex;flex-direction:column;justify-content:space-between;border-right:1px solid var(--steel);position:relative;z-index:2;background:rgba(255,255,255,.6);backdrop-filter:blur(2px)}\n.land-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--slate);text-transform:uppercase;display:flex;align-items:center;gap:14px;margin-bottom:32px}\n.land-eyebrow::before{content:\"\";width:24px;height:1px;background:var(--orange)}\n.land-title{font-family:var(--serif);font-size:76px;line-height:.96;letter-spacing:-.035em;font-weight:300;color:var(--ink);margin-bottom:24px}\n.land-title em{font-style:italic;font-weight:300}\n.land-title b{font-weight:500}\n.land-lede{font-size:19px;line-height:1.5;color:var(--charcoal);max-width:520px;letter-spacing:-.01em;font-weight:300;margin-bottom:36px}\n.land-lede strong{font-weight:500;color:var(--ink)}\n.land-actions{display:flex;gap:10px;margin-bottom:48px}\n.btn{padding:12px 18px;border-radius:8px;font-size:14px;font-weight:500;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:8px;transition:all .15s}\n.btn-primary{background:var(--ink);color:#fff}\n.btn-primary:hover{background:var(--plum)}\n.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--steel)}\n.btn-ghost:hover{background:var(--fog)}\n.btn .arr{width:14px;height:1px;background:currentColor;position:relative}\n.btn .arr::after{content:\"\";position:absolute;right:0;top:-3px;width:7px;height:7px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg)}\n.land-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding-top:24px;border-top:1px solid var(--steel)}\n.meta-stat{font-family:var(--mono)}\n.meta-num{font-family:var(--serif);font-size:40px;font-weight:300;letter-spacing:-.025em;color:var(--ink);line-height:1}\n.meta-num em{font-style:italic;color:var(--orange)}\n.meta-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-top:8px;line-height:1.4}\n\n.land-right{position:relative;background:var(--fog);overflow:hidden}\n.globe-wrap{position:absolute;inset:0}\n#globe-svg{width:100%;height:100%;display:block}\n.globe-axis{position:absolute;font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--slate-2);text-transform:uppercase;pointer-events:none}\n.globe-axis.tl{top:24px;left:24px}\n.globe-axis.tr{top:24px;right:24px;text-align:right}\n.globe-axis.br{bottom:24px;right:24px;text-align:right}\n.globe-axis.bl{bottom:24px;left:24px}\n.globe-axis .v{color:var(--ink);font-weight:500;display:block;margin-top:2px;font-family:var(--serif);font-size:14px;letter-spacing:-.01em;text-transform:none}\n\n.story-rail{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border-top:1px solid var(--steel);padding:16px 24px}\n.rail-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}\n.rail-title{font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--slate);text-transform:uppercase}\n.rail-title b{color:var(--ink);font-weight:500}\n.rail-nav{display:flex;gap:6px}\n.rail-arr{width:26px;height:26px;border-radius:50%;border:1px solid var(--steel);display:flex;align-items:center;justify-content:center;color:var(--slate);font-size:12px}\n.rail-arr:hover{background:var(--ink);color:#fff;border-color:var(--ink)}\n.rail-track{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}\n.rail-track::-webkit-scrollbar{display:none}\n.story-card{flex:0 0 220px;border:1px solid var(--steel);border-radius:8px;padding:14px;background:#fff;cursor:pointer;transition:all .18s;position:relative}\n.story-card:hover{border-color:var(--ink);transform:translateY(-2px);box-shadow:rgba(0,0,0,.05) 0 8px 16px}\n.story-card.featured{backgro ont-style:italic;color:var(--slate)}\n.cr-deck{font-size:17px;color:var(--charcoal);max-width:600px;line-height:1.5;font-weight:300}\n\n.cr-stepper{display:flex;align-items:center;gap:16px;margin-bottom:36px;padding:0;font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}\n.cr-step{display:flex;align-items:center;gap:8px;color:var(--slate-2);padding:8px 0}\n.cr-step.done{color:var(--moss)}\n.cr-step.on{color:var(--ink);font-weight:500}\n.cr-step .nm{width:22px;height:22px;border-radius:50%;border:1px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:500}\n.cr-step.on .nm{background:var(--ink);color:#fff;border-color:var(--ink)}\n.cr-step.done .nm{background:var(--moss);color:#fff;border-color:var(--moss)}\n.cr-line{flex:0 1 60px;height:1px;background:var(--steel)}\n\n.cr-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:0;border:1px solid var(--steel);border-radius:12px;overflow:hidden;background:#fff;min-height:520px}\n.cr-form{padding:36px;border-right:1px solid var(--steel);background:#fff;display:flex;flex-direction:column;gap:24px}\n.cr-fld{display:flex;flex-direction:column;gap:8px}\n.cr-lbl{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--slate);text-transform:uppercase;display:flex;justify-content:space-between}\n.cr-lbl .opt{color:var(--slate-2);text-transform:none;letter-spacing:.04em}\n.cr-q{font-family:var(--serif);font-size:24px;font-weight:400;letter-spacing:-.02em;color:var(--ink);line-height:1.2}\n.cr-q em{font-style:italic;color:var(--slate)}\n.cr-row{display:flex;flex-wrap:wrap;gap:6px}\n.cr-pill{padding:8px 14px;border-radius:99px;border:1px solid var(--steel);background:#fff;font-size:13px;color:var(--charcoal);cursor:pointer;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:6px;transition:all .15s}\n.cr-pill:hover{border-color:var(--ink)}\n.cr-pill.on{background:var(--ink);color:#fff;border-color:var(--ink)}\n.cr-pill .dot{width:8px;height:8px;border-radius:50%}\n.cr-input{padding:14px 16px;border:1px solid var(--steel);border-radius:8px;font-family:var(--serif);font-size:18px;font-weight:300;color:var(--ink);background:var(--fog);letter-spacing:-.01em;width:100%;font-style:italic}\n.cr-input:focus{outline:none;border-color:var(--ink);background:#fff}\n.cr-divider{height:1px;background:var(--fog-2);margin:8px 0}\n.cr-actions{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:24px;border-top:1px solid var(--fog-2)}\n.cr-back{font-family:var(--mono);font-size:11px;color:var(--slate);letter-spacing:.04em;cursor:pointer}\n\n.cr-prev{padding:36px;background:linear-gradient(to bottom right, #fff, var(--fog));position:relative;display:flex;flex-direction:column;gap:18px}\n.cr-prev-top{display:flex;justify-content:space-between;align-items:flex-start}\n.cr-prev-tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--orange);text-transform:uppercase;display:flex;align-items:center;gap:8px}\n.cr-prev-tag::before{content:\"\";width:6px;height:6px;border-radius:50%;background:var(--orange);animation:pulse 1.5s infinite}\n@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}\n.cr-prev-h{font-family:var(--serif);font-size:36px;line-height:1;letter-spacing:-.025em;font-weight:300;color:var(--ink)}\n.cr-prev-h em{font-style:italic;color:var(--slate)}\n.cr-prev-h .accent{color:var(--t-batteries)}\n.cr-prev-deck{font-size:14px;color:var(--charcoal);line-height:1.55;font-weight:300}\n.cr-prev-charts{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.cr-pc{border:1px solid var(--steel);border-radius:6px;padding:14px;background:#fff;height:120px;position:relative;display:flex;flex-direction:column;gap:6px}\n.cr-pc-l{font-family:var(--mono);font-size:9px;letter-spacing:.14em;color:var(--slate);text-transform:uppercase}\n.cr-pc-svg{flex:1;display:block;width:100%}\n.cr-prev-meta{font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--slate);display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid var(--fog-2);margin-top:auto}\n\n/* Footer */\n.foot{padding:32px 56px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--slate);text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--steel)}\n.foot a{color:var(--slate)}\n.foot a:hover{color:var(--ink)}\n\n/* misc */\n.tooltip{position:fixed;background:var(--ink);color:#fff;padding:8px 12px;border-radius:6px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:100;max-width:240px;line-height:1.4}\n.tooltip strong{display:block;font-family:var(--serif);font-size:14px;font-weight:400;margin-bottom:2px;letter-spacing:-.01em}\n.tooltip .meta{font-family:var(--mono);font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.04em;margin-top:2px}\n\n@media (max-width:1100px){\n  .land-grid{grid-template-columns:1fr}\n  .land-left{border-right:none;border-bottom:1px solid var(--steel)}\n  .scatter-frame{grid-template-columns:1fr}\n  .map-frame{grid-template-columns:1fr}\n  .next-grid{grid-template-columns:1fr 1fr}\n  .pull-grid{grid-template-columns:1fr;gap:32px}\n  .cr-grid{grid-template-columns:1fr}\n  .exp-body{grid-template-columns:1fr}\n  .filters{padding-left:32px}\n}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n<div class=\"grid-bg\"><\u002Fdiv>\n\n<!-- ─────────── CHROME ─────────── -->\n<header class=\"chrome\">\n  <div class=\"chrome-row\">\n    <div class=\"brand\">\n      <span class=\"brand-mark\">NZIPL<\u002Fspan>\n      <span class=\"brand-name\">Global Atlas <em>of the Clean Industrial Base<\u002Fem><\u002Fspan>\n    <\u002Fdiv>\n    <nav class=\"nav-tabs\" id=\"nav\">\n      <button class=\"tab active\" data-view=\"landing\">Atlas <span class=\"num\">/00<\u002Fspan><\u002Fbutton>\n      <button class=\"tab\" data-view=\"story\">Stories <span class=\"num\">/16<\u002Fspan><\u002Fbutton>\n      <button class=\"tab\" data-view=\"explore\">Explore <span class=\"num\">/2.4k<\u002Fspan><\u002Fbutton>\n      <button class=\"tab\" data-view=\"create\">Compose <span class=\"num\">/new<\u002Fspan><\u002Fbutton>\n    <\u002Fnav>\n    <div class=\"chrome-right\">\n      <div class=\"search-mini\">Search countries, products, HS codes <span class=\"kbd\">⌘K<\u002Fspan><\u002Fdiv>\n      <button class=\"btn-cta\">Sign in<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<!-- ═══════════════════════ LANDING ═══════════════════════ -->\n<section class=\"view landing\" data-view=\"landing\">\n  <div class=\"land-grid\">\n    <div class=\"land-left\">\n      <div>\n        <div class=\"land-eyebrow\">Atlas · Edition 2026.01 · 16 stories<\u002Fdiv>\n        <h1 class=\"land-title\">A <em>cartography<\u002Fem> of the&nbsp;<b>clean industrial base<\u002Fb>.<\u002Fh1>\n        <p class=\"land-lede\">From a copper seam in the Atacama to a polysilicon kiln in Inner Mongolia, every clean technology rests on a stack of materials, machines and capabilities. <strong>NZIPL maps that stack<\u002Fstrong> — country by country, product by product, year by year — so policymakers, industry and the public can see who makes what, and where the leverage lies.<\u002Fp>\n        <div class=\"land-actions\">\n          <button class=\"btn btn-primary\" data-go=\"story\">Read this week's story <span class=\"arr\"><\u002Fspan><\u002Fbutton>\n          <button class=\"btn btn-ghost\" data-go=\"explore\">Explore the data<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"land-meta\">\n        <div class=\"meta-stat\">\n          <div class=\"meta-num\">13<\u002Fdiv>\n          <div class=\"meta-lbl\">Country–technology<br>stories<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"meta-stat\">\n          <div class=\"meta-num\">2,431<\u002Fdiv>\n          <div class=\"meta-lbl\">HS-6 products in<br>the green dictionary<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"meta-stat\">\n          <div class=\"meta-num\"><em>22<\u002Fem>yr<\u002Fdiv>\n          <div class=\"meta-lbl\">Of harmonised<br>trade data, 2003–2024<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"land-right\">\n      <div class=\"globe-wrap\">\n        <svg id=\"globe-svg\" viewBox=\"0 0 800 700\" preserveAspectRatio=\"xMidYMid meet\"><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"globe-axis tl\">Lat 23°N<span class=\"v\">India · Solar<\u002Fspan><\u002Fdiv>\n      <div class=\"globe-axis tr\">Edition 2026.01<span class=\"v\">16 stories<\u002Fspan><\u002Fdiv>\n      <div class=\"globe-axis br\">Centroid 76°E<span class=\"v\">Indo-Pacific arc<\u002Fspan><\u002Fdiv>\n      <div class=\"globe-axis bl\">Drag to rotate<\u002Fdiv>\n\n      <div class=\"story-rail\">\n        <div class=\"rail-head\">\n          <div class=\"rail-title\">Featured stories <b>· 16 country–technology pairs<\u002Fb><\u002Fdiv>\n          <div class=\"rail-nav\"><button class=\"rail-arr\" id=\"rail-l\">‹<\u002Fbutton><button class=\"rail-arr\" id=\"rail-r\">›<\u002Fbutton><\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"rail-track\" id=\"rail-track\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ═══════════════════════ STORY (India · Solar) ═══════════════════════ -->\n<section class=\"view story\" data-view=\"story\" data-hidden=\"\">\n\n  <div class=\"story-hero\">\n    <div class=\"hero-eyebrow\" id=\"hero-eyebrow\">\n      <span class=\"crumb\">Atlas<\u002Fspan><span class=\"sep\">→<\u002Fspan>\n      <span class=\"crumb\" id=\"hero-storynum\">Story 01 / 16<\u002Fspan><span class=\"sep\">→<\u002Fspan>\n      <span class=\"tech-pill\" id=\"hero-techpill\" style=\"background:var(--t-solar)\">Solar PV<\u002Fspan>\n      <span class=\"crumb\" id=\"hero-country\" style=\"margin-left:8px\">India · 🇮🇳<\u002Fspan>\n    <\u002Fdiv>\n    <h1 class=\"story-headline\" id=\"hero-headline\">India is <em>building solar panels<\u002Fem> faster than anyone — but on borrowed&nbsp;<b class=\"accent\">silicon<\u002Fb>, glass and copper.<\u002Fh1>\n    <p class=\"story-deck\" id=\"hero-deck\">Modules assembled in Tamil Nadu and Gujarat now cover roofs from Texas to Saudi Arabia. The cell, the wafer, the polysilicon and the copper feeding them, however, are <strong>imported almost entirely<\u002Fstrong> — overwhelmingly through a single supplier. India's exporting downstream while its upstream deepens. This is what energy autonomy looks like, halfway built.<\u002Fp>\n    <div class=\"story-byline\">\n      <div class=\"byline-block\"><strong>Reference year<\u002Fstrong>2024 · HS-2024 dictionary<\u002Fdiv>\n      <div class=\"byline-block\"><strong>Coverage<\u002Fstrong>2,431 products · 196 countries<\u002Fdiv>\n      <div class=\"byline-block\"><strong>Read time<\u002Fstrong>9 minutes<\u002Fdiv>\n      <div class=\"byline-block\"><strong>Last updated<\u002Fstrong>27 Apr 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- §1 At a glance -->\n  <div class=\"sec\">\n    <div class=\"sec-head\">\n      <div class=\"sec-head-left\">\n        <div class=\"sec-num\">§01 — Position<\u002Fdiv>\n        <h2 class=\"sec-title\">A <em>net importer<\u002Fem>, by a factor of five.<\u002Fh2>\n        <p class=\"sec-deck\">Across the solar value chain, India bought $56.1B of inputs in 2024 and sold $11.3B abroad. That gap is concentrated in two places: copper ore and module-production equipment.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"sec-aside\" id=\"sec1-aside\">All values, USD 2024<b>56.1<span style=\"font-size:14px;color:var(--slate)\">B<\u002Fspan><\u002Fb>imports / 11.3B exports<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"glance\" id=\"glance-row\">\n      <div class=\"glance-cell\"><div class=\"gc-lbl\">Imports — Solar<\u002Fdiv><div class=\"gc-num\">$56.1<span class=\"unit\">B<\u002Fspan><\u002Fdiv><div class=\"gc-sub\"><span class=\"gc-trend up\">▲ 21%<\u002Fspan><span>vs 2023<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"glance-cell\"><div class=\"gc-lbl\">Exports — Solar<\u002Fdiv><div class=\"gc-num\">$11.3<span class=\"unit\">B<\u002Fspan><\u002Fdiv><div class=\"gc-sub\"><span class=\"gc-trend up\">▲ 8%<\u002Fspan><span>vs 2023<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"glance-cell\"><div class=\"gc-lbl\">Net deficit<\u002Fdiv><div class=\"gc-num\"><em>−$44.8<\u002Fem><span class=\"unit\">B<\u002Fspan><\u002Fdiv><div class=\"gc-sub\"><span>1.23% of GDP, ↑ 0.18pp<\u002Fspan><\u002Fdiv><\u002Fdiv>\n      <div class=\"glance-cell\"><div class=\"gc-lbl\">Capability score<\u002Fdiv><div class=\"gc-num\">0.62<\u002Fdiv><div class=\"gc-sub\"><span style=\"color:var(--moss);font-weight:500\">▲ rank 5/196<\u002Fspan><span>downstream solar<\u002Fspan><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- §2 Map: where it comes from, where it goes -->\n  <div class=\"sec alt\">\n    <div class=\"sec-head\">\n      <div class=\"sec-head-left\">\n        <div class=\"sec-num\">§02 — Geography of supply<\u002Fdiv>\n        <h2 class=\"sec-title\">The map of <em>solar dependency<\u002Fem> doesn't look like solar.<\u002Fh2>\n        <p class=\"sec-deck\">Indonesia, Chile and China feed the kilns. Modules flow back to America, the Gulf and Russia. The shape of a solar supply chain is the shape of a copper, alumina and float-glass supply chain — with one outlier dominating cells.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"sec-aside\">Top-15 partners shown<b>30<\u002Fb>partner countries total<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"map-frame\">\n      <div class=\"map-canvas\">\n        <svg id=\"story-map\"><\u002Fsvg>\n        <div class=\"map-overlay-tl\">\n          <button class=\"chip on\">Trade flows<\u002Fbutton>\n          <button class=\"chip\">Firm clusters<\u002Fbutton>\n          <button class=\"chip\">All products<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"map-legend-bl\">\n          <div class=\"lg-item\"><span class=\"lg-dot\" style=\"background:rgba(236,101,43,.2);border-color:var(--orange)\"><\u002Fspan>Supplier (imports from)<\u002Fdiv>\n          <div class=\"lg-item\"><span class=\"lg-dot\" style=\"background:rgba(126,167,233,.2);border-color:var(--info)\"><\u002Fspan>Buyer (exports to)<\u002Fdiv>\n          <div class=\"lg-item\"><span class=\"lg-dot\" style=\"background:var(--t-solar);border-color:var(--ink)\"><\u002Fspan>Focal · India<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"map-side\">\n        <div>\n          <div class=\"ms-title\">Top suppliers · 2024<\u002Fdiv>\n          <div id=\"ms-suppliers\"><\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div class=\"ms-title\">Top buyers · 2024<\u002Fdiv>\n          <div id=\"ms-buyers\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- §3 Value chain ladder -->\n  <div class=\"sec\">\n    <div class=\"sec-head\">\n      <div class=\"sec-head-left\">\n        <div class=\"sec-num\">§03 — The ladder<\u002Fdiv>\n        <h2 class=\"sec-title\">India climbs <em>from the top<\u002Fem> — modules first, then cells.<\u002Fh2>\n        <p class=\"sec-deck\">Read the chain left to right: copper ore, polysilicon, wafers, cells, modules. India runs a surplus only at module scale; every step before it bleeds dollars. The capability is real, but it's tethered to upstream imports.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"sec-aside\">Bands show net trade<b>5<\u002Fb>stages of the value chain<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"ladder\" id=\"ladder\"><\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- §4 Timeline -->\n  <div class=\"sec alt\">\n    <div class=\"sec-head\">\n      <div class=\"sec-head-left\">\n        <div class=\"sec-num\">§04 — Time<\u002Fdiv>\n        <h2 class=\"sec-title\">Twenty-two years of <em>compounding imports<\u002Fem>.<\u002Fh2>\n        <p class=\"sec-deck\">The deficit didn't widen suddenly. From 2003 onward, every solar phase has scaled — but raw materials and processed materials scaled fastest. The post-2017 inflection in module exports is real. So is the post-2020 surge in inputs needed to make them.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"sec-aside\">2003–2024 · indexed flows<b>14×<\u002Fb>imports growth, raw materials<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tl-frame\">\n      <div class=\"tl-head\">\n        <div>\n          <div class=\"box-d\">USD millions · stage × role<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tl-toggle\">\n          <button class=\"tl-tg on\" data-tl=\"imp\">Imports<\u002Fbutton>\n          <button class=\"tl-tg\" data-tl=\"exp\">Exports<\u002Fbutton>\n          <button class=\"tl-tg\" data-tl=\"bal\">Balance<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <svg id=\"tl-svg\"><\u002Fsvg>\n      <div class=\"tl-legend\" id=\"tl-legend\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- §5 Competitiveness -->\n  <div class=\"sec\">\n    <div class=\"sec-head\">\n      <div class=\"sec-head-left\">\n        <div class=\"sec-num\">§05 — Competitiveness<\u002Fdiv>\n        <h2 class=\"sec-title\">India is <em>good at solar<\u002Fem>, but not at making solar.<\u002Fh2>\n        <p class=\"sec-deck\">The capability score combines export specialisation, scale and complexity. India is solidly mid-pack — ahead of every European peer except Germany, but a full order of magnitude behind China and the Vietnam–Malaysia–Thailand assembly belt.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"sec-aside\">2023 · 196 economies<b>Rank 14<\u002Fb>by capability, all solar<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"scatter-frame\">\n      <div class=\"scatter-box\">\n        <div class=\"box-h\"><div class=\"box-t\">Capability vs export scale<\u002Fdiv><div class=\"box-d\">log $B · 2023<\u002Fdiv><\u002Fdiv>\n        <p class=\"box-deck\">Each circle is one economy. Position on the x-axis is export scale; the y-axis is capability (a composite of RCA, complexity and growth). India sits in the upper-middle band, rising fast.<\u002Fp>\n        <svg id=\"scatter-svg\"><\u002Fsvg>\n      <\u002Fdiv>\n      <div class=\"radar-box\">\n        <div class=\"box-h\"><div class=\"box-t\">Stage profile<\u002Fdiv><div class=\"box-d\">India vs world avg<\u002Fdiv><\u002Fdiv>\n        <p class=\"box-deck\">A balanced producer concentrates near the centre. India's profile leans hard toward the downstream — components and equipment — and away from raw materials and final assembly.<\u002Fp>\n        <svg id=\"radar-svg\"><\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- §6 Pull quote -->\n  <div class=\"pull\">\n    <div class=\"pull-grid\">\n      <div>\n        <div class=\"pull-quote\" id=\"pull-quote\">\"India's solar story is not <em>weakness<\u002Fem>. It's <em>asymmetry<\u002Fem> — a country that learned to assemble a panel before it learned to grow a wafer.\"<\u002Fdiv>\n        <div class=\"pull-attr\"><b>NZIPL Atlas, 2026 edition<\u002Fb><span id=\"pull-attr-line\">Editorial · Story 01 / 16<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"pull-fig\" id=\"pull-fig\">\n        <div class=\"pf-cell\"><div class=\"pf-l\">Imports from China · all solar<\u002Fdiv><div class=\"pf-v\">$10.7<em>B<\u002Fem><\u002Fdiv><\u002Fdiv>\n        <div class=\"pf-cell\"><div class=\"pf-l\">Modules exported to USA<\u002Fdiv><div class=\"pf-v\">$1.53<em>B<\u002Fem><\u002Fdiv><\u002Fdiv>\n        <div class=\"pf-cell\"><div class=\"pf-l\">Polysilicon produced domestically<\u002Fdiv><div class=\"pf-v\"><em>≈ 0%<\u002Fem><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- §7 What next -->\n  <div class=\"next\">\n    <div class=\"sec-head\">\n      <div class=\"sec-head-left\">\n        <div class=\"sec-num\">§06 — Continue<\u002Fdiv>\n        <h2 class=\"sec-title\">Adjacent <em>stories &amp; angles<\u002Fem>.<\u002Fh2>\n        <p class=\"sec-deck\">Three threads pulled from this story — a comparison, a capability deep-dive, and a counterfactual. Or compose your own from the data.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"next-grid\">\n      <div class=\"next-card\" data-go=\"story\">\n        <div class=\"nc-tag\"><span class=\"dot\" style=\"background:var(--t-batteries)\"><\u002Fspan>Compare · Story 06<\u002Fdiv>\n        <div class=\"nc-t\">India's <em>battery<\u002Fem> story rhymes with solar.<\u002Fdiv>\n        <div class=\"nc-b\">Same downstream-first pattern, same Chinese upstream — but lithium replaces polysilicon as the bottleneck and the module surplus has yet to materialise.<\u002Fdiv>\n        <div class=\"nc-arr\">Read story <span class=\"arr\" style=\"background:currentColor;width:14px;height:1px;display:inline-block\"><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"next-card\" data-go=\"explore\">\n        <div class=\"nc-tag\"><span class=\"dot\" style=\"background:var(--orange)\"><\u002Fspan>Drill · Capability<\u002Fdiv>\n        <div class=\"nc-t\">Which firms are <em>actually making<\u002Fem> the panels?<\u002Fdiv>\n        <div class=\"nc-b\">3,182 firms cluster around Pune, Mumbai, Ahmedabad and Bangalore. Filter by stage, role, headcount or year of incorporation in Explore.<\u002Fdiv>\n        <div class=\"nc-arr\">Open Explore <span class=\"arr\" style=\"background:currentColor;width:14px;height:1px;display:inline-block\"><\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"next-card\" data-go=\"create\">\n        <div class=\"nc-tag\"><span class=\"dot\" style=\"background:var(--ink)\"><\u002Fspan>Compose · Custom<\u002Fdiv>\n        <div class=\"nc-t\">What if the question were <em>Vietnam<\u002Fem> &amp; wafers?<\u002Fdiv>\n        <div class=\"nc-b\">Spin up a story for any country–technology pair. The atlas drafts the narrative; you edit, annotate and share. Takes about a minute.<\u002Fdiv>\n        <div class=\"nc-arr\">Open C ss=\"cr-pill\">🇮🇳 India<\u002Fbutton>\n          <button class=\"cr-pill on\">🇧🇷 Brazil<\u002Fbutton>\n          <button class=\"cr-pill\">🇻🇳 Vietnam<\u002Fbutton>\n          <button class=\"cr-pill\">🇰🇷 South Korea<\u002Fbutton>\n          <button class=\"cr-pill\">🇯🇵 Japan<\u002Fbutton>\n          <button class=\"cr-pill\">+ pick another<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cr-divider\"><\u002Fdiv>\n\n      <div class=\"cr-fld\">\n        <div class=\"cr-lbl\"><span>02 — Technology<\u002Fspan><span class=\"opt\">required<\u002Fspan><\u002Fdiv>\n        <div class=\"cr-q\">Which clean <em>technology<\u002Fem>?<\u002Fdiv>\n        <div class=\"cr-row\">\n          <button class=\"cr-pill\"><span class=\"dot\" style=\"background:var(--t-solar)\"><\u002Fspan>Solar PV<\u002Fbutton>\n          <button class=\"cr-pill on\"><span class=\"dot\" style=\"background:var(--t-batteries)\"><\u002Fspan>Batteries<\u002Fbutton>\n          <button class=\"cr-pill\"><span class=\"dot\" style=\"background:var(--t-wind)\"><\u002Fspan>Wind<\u002Fbutton>\n          <button class=\"cr-pill\"><span class=\"dot\" style=\"background:var(--t-nuclear)\"><\u002Fspan>Nuclear<\u002Fbutton>\n          <button class=\"cr-pill\"><span class=\"dot\" style=\"background:var(--t-transmission)\"><\u002Fspan>Transmission<\u002Fbutton>\n          <button class=\"cr-pill\">+ 7 more<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"cr-divider\"><\u002Fdiv>\n\n      <div class=\"cr-fld\">\n        <div class=\"cr-lbl\"><span>03 — Framing question<\u002Fspan><span class=\"opt\">choose one or write your own<\u002Fspan><\u002Fdiv>\n        <div class=\"cr-q\">What's the <em>angle<\u002Fem>?<\u002Fdiv>\n        <div class=\"cr-row\">\n          <button class=\"cr-pill on\">Where does the supply chain leak?<\u002Fbutton>\n          <button class=\"cr-pill\">What's the export ceiling at current capability?<\u002Fbutton>\n          <button class=\"cr-pill\ ished vs in production\nconst READY_KEYS = new Set(['01','02','03','06','07']);\nSTORIES.forEach(s=>{ s.ready = READY_KEYS.has(s.n); });\n// Sort: ready first, preserving original order within each group\nconst SORTED_STORIES = [...STORIES].sort((a,b)=>(b.ready?1:0)-(a.ready?1:0));\nSORTED_STORIES.forEach((s,i)=>{\n  const el = document.createElement('div');\n  el.className = 'story-card' + (s.ready && i===0?' featured':(s.ready?'':' soon'));\n  const statusBadge = s.ready\n    ? '<span class=\"sc-status\">✓ Read now<\u002Fspan>'\n    : '<span class=\"sc-status soon\">In production<\u002Fspan>';\n  el.innerHTML = `\n    <div class=\"sc-top\">\n      <div class=\"sc-num\">${s.n} / 16<\u002Fdiv>\n      ${statusBadge}\n    <\u002Fdiv>\n    <div class=\"sc-tagrow\">\n      <div class=\"sc-tag\" style=\"color:${s.hex}\"><span class=\"dot\"><\u002Fspan>${s.tech}<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"sc-title\">${s.country} <em>· ${s.tech.toLowerCase()}<\u002Fem><\u002Fdiv>\n    <div class=\"sc-meta\">${s.dek}<\u002Fdiv>\n    <svg class=\"sc-spark\" viewBox=\"0 0 60 24\" preserveAspectRatio=\"none\"><path d=\"M0,18 L12,16 L24,12 L36,8 L48,5 L60,2\" fill=\"none\" stroke=\"${s.ready && i===0?'rgba(255,255,255,.5)':s.hex}\" stroke-width=\"1.2\"/><\u002Fsvg>\n  `;\n  el.addEventListener('click',()=>{ if(s.ready){ applyStory(s.n); go('story'); } });\n  rail.appendChild(el);\n});\ndocument.getElementById('rail-l').onclick = ()=>rail.scrollBy({left:-240,behavior:'smooth'});\ndocument.getElementById('rail-r').onclick = ()=>rail.scrollBy({left:240,behavior:'smooth'});\n\n// ════════════ STORY CONTENT (per-pair narrative swap) ════════════\nconst FLAG = {IN:'🇮🇳',JP:'🇯🇵',KR:'🇰🇷',BR:'🇧🇷',CN:'🇨🇳',CL:'🇨🇱',DE:'🇩🇪',ID:'🇮🇩',VN:'🇻🇳',US:'🇺🇸'};\nconst STORY_CONTENT = {\n  '01': {\n    headline: 'India is <em>building solar panels<\u002Fem> faster than anyone — but on borrowed&nbsp;<b class=\"accent\">silicon<\u002Fb>, glass and copper.',\n    dek: 'Modules assembled in Tamil Nadu and Gujarat now cover roofs from Texas to Saudi Arabia. The cell, the wafer, the polysilicon and the copper feeding them, however, are <strong>imported almost entirely<\u002Fstrong> — overwhelmingly through a single supplier. India\\'s exporting downstream while its upstream deepens. This is what energy autonomy looks like, halfway built.',\n    aside: 'All values, USD 2024<b>56.1<span style=\"font-size:14px;color:var(--slate)\">B<\u002Fspan><\u002Fb>imports / 11.3B exports',\n    cells: [\n      {l:'Imports — Solar', v:'$56.1', u:'B', sub:'<span class=\"gc-trend up\">▲ 21%<\u002Fspan><span>vs 2023<\u002Fspan>'},\n      {l:'Exports — Solar', v:'$11.3', u:'B', sub:'<span class=\"gc-trend up\">▲ 8%<\u002Fspan><span>vs 2023<\u002Fspan>'},\n      {l:'Net deficit', v:'<em>−$44.8<\u002Fem>', u:'B', sub:'<span>1.23% of GDP, ↑ 0.18pp<\u002Fspan>'},\n      {l:'Capability score', v:'0.62', u:'', sub:'<span style=\"color:var(--moss);font-weight:500\">▲ rank 5/196<\u002Fspan><span>downstream solar<\u002Fspan>'},\n    ],\n    quote: '\"India\\'s solar story is not <em>weakness<\u002Fem>. It\\'s <em>asymmetry<\u002Fem> — a country that learned to assemble a panel before it learned to grow a wafer.\"',\n    figs: [\n      {l:'Imports from China · all solar', v:'$10.7<em>B<\u002Fem>'},\n      {l:'Modules exported to USA',         v:'$1.53<em>B<\u002Fem>'},\n      {l:'Polysilicon produced domestically', v:'<em>≈ 0%<\u002Fem>'},\n    ],\n  },\n  '02': {\n    headline: 'Japan can still <em>build a reactor<\u002Fem> — but the&nbsp;<b class=\"accent\">uranium<\u002Fb>, the enrichment, the order book have all moved offshore.',\n    dek: 'Three Japanese vendors — Hitachi, Toshiba and Mitsubishi — between them hold half the world\\'s installed reactor IP. Yet not a single new domestic build has broken ground in fifteen years. The fuel arrives by ship, the engineers arrive by plane, and the export pipeline runs through Eastern Europe and Southeast Asia. Capability without a home market is a different kind of fragility.',\n    aside: 'All values, USD 2024<b>170<span style=\"font-size:14px;color:var(--slate)\">B<\u002Fspan><\u002Fb>imports / 10.6B exports',\n    cells: [\n      {l:'Imports — Nuclear', v:'$170', u:'B', sub:'<span class=\"gc-trend up\">▲ 6%<\u002Fspan><span>fuel + components<\u002Fspan>'},\n      {l:'Exports — Nuclear', v:'$10.6', u:'B', sub:'<span class=\"gc-trend down\">▼ 3%<\u002Fspan><span>vs 2023<\u002Fspan>'},\n      {l:'Net deficit', v:'<em>−$159<\u002Fem>', u:'B', sub:'<span>3.94% of GDP, ↑ 0.41pp<\u002Fspan>'},\n      {l:'Capability score', v:'0.74', u:'', sub:'<span style=\"color:var(--moss);font-weight:500\">▲ rank 3/196<\u002Fspan><span>reactor systems<\u002Fspan>'},\n    ],\n    quote: '\"Japan kept the <em>knowledge<\u002Fem> and lost the <em>fuel cycle<\u002Fem> — and the second, in the long run, decides the first.\"',\n    figs: [\n      {l:'Uranium imports · enriched', v:'$2.4<em>B<\u002Fem>'},\n      {l:'Reactor pressure vessels exported', v:'$0.61<em>B<\u002Fem>'},\n      {l:'Domestic reactors started · 2010–24', v:'<em>0<\u002Fem>'},\n    ],\n  },\n  '03': {\n    headline: 'South Korea is the <em>only country<\u002Fem> to ship a&nbsp;<b class=\"accent\">reactor<\u002Fb> on time, on budget, this decade.',\n    dek: 'APR1400 units in Barakah came in close to schedule and close to plan — a feat the French, the Americans and the British are still trying to reproduce. KEPCO\\'s order book now stretches from Egypt to the Czech Republic. The bottleneck has shifted from engineering to <strong>steel forgings, large-bore pumps and trained welders<\u002Fstrong>, where Korean industrial depth genuinely shines.',\n    aside: 'All values, USD 2024<b>48<span style=\"font-size:14px;color:var(--slate)\">B<\u002Fspan><\u002Fb>imports / 22B exports',\n    cells: [\n      {l:'Imports — Nuclear', v:'$48', u:'B', sub:'<span class=\"gc-trend\" style=\"color:var(--slate)\">— flat<\u002Fspan><span>vs 2023<\u002Fspan>'},\n      {l:'Exports — Nuclear', v:'$22', u:'B', sub:'<span class=\"gc-trend up\">▲ 14%<\u002Fspan><span>incl. APR1400<\u002Fspan>'},\n      {l:'Net deficit', v:'<em>−$26<\u002Fem>', u:'B', sub:'<span>1.41% of GDP, ↓ 0.08pp<\u002Fspan>'},\n      {l:'Capability score', v:'0.81', u:'', sub:'<span style=\"color:var(--moss);font-weight:500\">▲ rank 1/196<\u002Fspan><span>delivery on schedule<\u002Fspan>'},\n    ],\n    quote: '\"The world has plenty of reactor <em>designers<\u002Fem>. It has exactly one country that still <em>pours the concrete<\u002Fem> on time.\"',\n    figs: [\n      {l:'APR1400 units delivered · UAE', v:'<em>4 of 4<\u002Fem>'},\n      {l:'Forging exports · large-bore', v:'$1.2<em>B<\u002Fem>'},\n      {l:'Active export bids · 2026', v:'<em>11<\u002Fem>'},\n    ],\n  },\n  '06': {\n    headline: 'India\\'s battery story is <em>solar, again<\u002Fem> — assembly first,&nbsp;<b class=\"accent\">cathode<\u002Fb> later, lithium never.',\n    dek: 'PLI subsidies have pulled in 50 GWh of announced gigafactory capacity, but a domestic cell has yet to leave a domestic line at meaningful scale. The cathode active material is imported. The separator is imported. The lithium hydroxide is imported. What India has — and what most countries do not — is an <strong>order book<\u002Fstrong>: two-wheelers, three-wheelers, grid storage. Demand pull, in this game, is itself a capability.',\n    aside: 'All values, USD 2024<b>8<span style=\"font-size:14px;color:var(--slate)\">B<\u002Fspan><\u002Fb>imports / 1.4B exports',\n    cells: [\n      {l:'Imports — Batteries', v:'$8.0', u:'B', sub:'<span class=\"gc-trend up\">▲ 38%<\u002Fspan><span>cells + CAM<\u002Fspan>'},\n      {l:'Exports — Batteries', v:'$1.4', u:'B', sub:'<span class=\"gc-trend up\">▲ 22%<\u002Fspan><span>mostly packs<\u002Fspan>'},\n      {l:'Net deficit', v:'<em>−$6.6<\u002Fem>', u:'B', sub:'<span>0.18% of GDP, ↑ 0.05pp<\u002Fspan>'},\n      {l:'Capability score', v:'0.34', u:'', sub:'<span style=\"color:var(--slate);font-weight:500\">▼ rank 18/196<\u002Fspan><span>cell manufacturing<\u002Fspan>'},\n    ],\n    quote: '\"India is replaying its solar playbook on <em>batteries<\u002Fem> — buy the cell, build the&nbsp;<em>pack<\u002Fem>, hope the upstream follows.\"',\n    figs: [\n      {l:'Announced gigafactory capacity', v:'<em>50<\u002Fem> GWh'},\n      {l:'Lithium hydroxide imported', v:'$0.9<em>B<\u002Fem>'},\n      {l:'Domestic cell production · 2024', v:'<em>≈ 3<\u002Fem> GWh'},\n    ],\n  },\n  '07': {\n    headline: 'Brazil chose <em>iron-phosphate<\u002Fem> — and discovered an Atlantic supply&nbsp;<b class=\"accent\">advantage<\u002Fb> nobody had priced in.',\n    dek: 'Iron, phosphate, hydropower and a domestic auto industry: Brazil holds an unusually clean LFP stack. The pivot — quietly underway in Minas Gerais and Bahia — is from raw materials exporter to <strong>cathode active material<\u002Fstrong> producer, with cell assembly to follow. The North Atlantic is a 9-day shipping route to Europe. The South Atlantic, to West Africa. The arithmetic is starting to look serious.',\n    aside: 'All values, USD 2024<b>3<span style=\"font-size:14px;color:var(--slate)\">B<\u002Fspan><\u002Fb>imports / 0.8B exports',\n    cells: [\n      {l:'Imports — Batteries', v:'$3.0', u:'B', sub:'<span class=\"gc-trend up\">▲ 12%<\u002Fspan><span>vs 2023<\u002Fspan>'},\n      {l:'Exports — Batteries', v:'$0.8', u:'B', sub:'<span class=\"gc-trend up\">▲ 41%<\u002Fspan><span>CAM + raw<\u002Fspan>'},\n      {l:'Net deficit', v:'<em>−$2.2<\u002Fem>', u:'B', sub:'<span>0.11% of GDP, ↓ 0.02pp<\u002Fspan>'},\n      {l:'Capability score', v:'0.48', u:'', sub:'<span style=\"color:var(--moss);font-weight:500\">▲ rank 9/196<\u002Fspan><span>LFP feedstock<\u002Fspan>'},\n    ],\n    quote: '\"<em>Geography<\u002Fem> is a capability too. Brazil\\'s LFP advantage starts in the&nbsp;<em>iron mine<\u002Fem>, not the laboratory.\"',\n    figs: [\n      {l:'Iron ore exports · battery-grade', v:'$1.8<em>B<\u002Fem>'},\n      {l:'Phosphate rock production', v:'<em>6.4<\u002Fem> Mt'},\n      {l:'Announced LFP CAM capacity', v:'<em>120<\u002Fem> kt/yr'},\n    ],\n  },\n};\n\nfunction applyStory(key){\n  const s = STORIES.find(x=>x.n===key); if(!s) return;\n  const c = STORY_CONTENT[key]; if(!c) return;\n  // CSS accent variable for em color in headline + pull quote\n  document.documentElement.style.setProperty('--story-accent', s.hex);\n  // Eyebrow\n  document.getElementById('hero-storynum').textContent = `Story ${s.n} / 16`;\n  const pill = document.getElementById('hero-techpill');\n  pill.textContent = s.tech;\n  pill.style.background = s.color;\n  document.getElementById('hero-country').innerHTML = `${s.country} · ${FLAG[s.iso]||''}`;\n  // Headline + dek\n  document.getElementById('hero-headline').innerHTML = c.headline;\n  document.getElementById('hero-deck').innerHTML = c.dek;\n  // §1 aside + glance cells\n  document.getElementById('sec1-aside').innerHTML = c.aside;\n  const glance = document.getElementById('glance-row');\n  glance.innerHTML = c.cells.map(cell => `\n    <div class=\"glance-cell\">\n      <div class=\"gc-lbl\">${cell.l}<\u002Fdiv>\n      <div class=\"gc-num\">${cell.v}${cell.u?`<span class=\"unit\">${cell.u}<\u002Fspan>`:''}<\u002Fdiv>\n      <div class=\"gc-sub\">${cell.sub}<\u002Fdiv>\n    <\u002Fdiv>\n  `).join('');\n  // §6 pull quote + figs + attribution line\n  document.getElementById('pull-quote').innerHTML = c.quote;\n  document.getElementById('pull-attr-line').textContent = `Editorial · Story ${s.n} / 16`;\n  document.getElementById('pull-fig').innerHTML = c.figs.map(f =>\n    `<div class=\"pf-cell\"><div class=\"pf-l\">${f.l}<\u002Fdiv><div class=\"pf-v\">${f.v}<\u002Fdiv><\u002Fdiv>`\n  ).join('');\n}\n// Wire CTA buttons that go to story (default to India · Solar)\ndocument.querySelectorAll('[data-go=\"story\"]').forEach(b=>b.addEventListener('click',()=>applyStory('01')));\n\n// ════════════ GLOBE ════════════\n(async function(){\n  const svg = d3.select('#globe-svg');\n  const w=800,h=700;\n  const proj = d3.geoOrthographic().scale(290).translate([w/2,h/2+10]).rotate([-78,-12,0]).clipAngle(90);\n  const path = d3.geoPath(proj);\n  const g = svg.append('g');\n\n  // sphere & graticule\n  g.append('path').datum({type:'Sphere'}).attr('d',path).attr('fill','#fff').attr('stroke','#e3e4e8').attr('stroke-width',1);\n  const grat = d3.geoGraticule().step([15,15]);\n  g.append('path').datum(grat).attr('d',path).attr('fill','none').attr('stroke','#e3e4e8').attr('stroke-width',.6).attr('opacity',.7);\n\n  let world;\n  try{\n    world = await d3.json(window.__resources.worldAtlas);\n    const land = topojson.feature(world, world.objects.countries);\n    g.append('g').selectAll('path').data(land.features).enter().append('path')\n      .attr('d',path).attr('fill','#011821').attr('stroke','#fff').attr('stroke-width',.4).attr('fill-opacity',.92);\n  } catch(e){\n    // Fallback: dotted continents\n    g.append('circle').attr('cx',w/2).attr('cy',h/2+10).attr('r',290).attr('fill','none').attr('stroke','#011821').attr('stroke-width',.5);\n  }\n\n  // Story pins\n  const pins = [\n    {ll:[78,22],s:STORIES[0]},{ll:[138,36],s:STORIES[1]},{ll:[127,37],s:STORIES[2]},\n    {ll:[140,36],s:STORIES[3]},{ll:[127,37],s:STORIES[4]},{ll:[78,22],s:STORIES[5]},\n    {ll:[-53,-14],s:STORIES[6]},{ll:[140,36],s:STORIES[7]},{ll:[128,37],s:STORIES[8]},\n    {ll:[107,15],s:STORIES[9]},{ll:[140,36],s:STORIES[10]},{ll:[107,15],s:STORIES[11]},\n    {ll:[78,22],s:STORIES[12]},{ll:[-71,-30],s:STORIES[13]},{ll:[10,51],s:STORIES[14]},{ll:[120,-2],s:STORIES[15]},\n  ];\n  const pinG = svg.append('g').attr('class','pins');\n  function drawPins(){\n    const sel = pinG.selectAll('g.pin').data(pins);\n    const e = sel.enter().append('g').attr('class','pin').style('cursor','pointer');\n    e.append('circle').attr('r',9).attr('fill','none').attr('stroke-width',1).attr('class','ring');\n    e.append('circle').attr('r',4).attr('class','dot');\n    e.append('text').attr('class','lbl').attr('font-family','IBM Plex Mono').attr('font-size',9).attr('fill','#011821').attr('dy',-12).attr('text-anchor','middle');\n    pinG.selectAll('g.pin').each(function(d){\n      const p = proj(d.ll);\n      const visible = d3.geoDistance(d.ll, [-proj.rotate()[0], -proj.rotate()[1]]) < Math.PI/2;\n      d3.select(this).attr('transform', visible?`translate(${p[0]},${p[1]})`:'translate(-9999,-9999)')\n        .attr('opacity', visible?1:0);\n      d3.select(this).select('.ring').attr('stroke',d.s.hex);\n      d3.select(this).select('.dot').attr('fill',d.s.hex);\n      d3.select(this).select('.lbl').text(d.s.iso);\n    });\n    pinG.selectAll('g.pin')\n      .on('mouseenter',(e,d)=>ttShow(`<strong>${d.s.country} · ${d.s.tech}<\u002Fstrong><div style=\"margin-top:4px\">${d.s.dek}<\u002Fdiv><div class=\"meta\">Story ${d.s.n} / 16<\u002Fdiv>`,e))\n      .on('mousemove',ttMove).on('mouseleave',ttHide)\n      .on('click',()=>go('story'));\n  }\n  drawPins();\n\n  // Drag to rotate\n  let dragging=false, last=null;\n  svg.on('mousedown',(e)=>{ dragging=true; last=[e.clientX,e.clientY]; });\n  d3.select(window).on('mousemove.globe',(e)=>{\n    if(!dragging) return;\n    const dx=e.clientX-last[0], dy=e.clientY-last[1];\n    const r=proj.rotate();\n    proj.rotate([r[0]+dx*0.4, Math.max(-60,Math.min(60,r[1]-dy*0.4))]);\n    g.selectAll('path').attr('d',path);\n    drawPins();\n    last=[e.clientX,e.clientY];\n  }).on('mouseup.globe',()=>dragging=false);\n\n  // Slow auto-rotate when idle\n  let auto=true;\n  svg.on('mouseenter',()=>auto=false).on('mouseleave',()=>auto=true);\n  d3.timer(()=>{\n    if(!auto||dragging) return;\n    const r=proj.rotate(); proj.rotate([r[0]+0.06,r[1]]);\n    g.selectAll('path').attr('d',path); drawPins();\n  });\n})();\n\n// ════════════ STORY: SUPPLIERS / BUYERS ════════════\nfunction fillSide(id, rows, cls){\n  const max = d3.max(rows,d=>d.val);\n  const wrap = document.getElementById(id);\n  wrap.innerHTML='';\n  rows.slice(0,7).forEach((d,i)=>{\n    const el = document.createElement('div');\n    el.className='ms-row bbar';\n    el.innerHTML=`\n      <div class=\"ms-rowtop\">\n        <div class=\"ms-flag\">${d.iso}<\u002Fdiv>\n        <div class=\"ms-name\">${d.name}<\u002Fdiv>\n        <div class=\"ms-val\">$${(d.val/1000).toFixed(1)}B<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"ms-bar\"><i style=\"width:${(d.val/max*100).toFixed(0)}%;background:${cls==='b'?'var(--info)':'var(--t-solar)'}\"><\u002Fi><\u002Fdiv>`;\n    wrap.appendChild(el);\n  });\n}\nfillSide('ms-suppliers',SUPPLIERS,'s');\nfillSide('ms-buyers',BUYERS,'b');\n\n// ════════════ STORY MAP ════════════\n(async function(){\n  const svg = d3.select('#story-map');\n  const node = svg.node().parentElement;\n  const w = node.clientWidth || 900, h=node.clientHeight||560;\n  svg.attr('viewBox',`0 0 ${w} ${h}`);\n  const proj = d3.geoNaturalEarth1().scale(w*0.18).translate([w/2,h/2+10]);\n  const path = d3.geoPath(proj);\n  const g = svg.append('g');\n\n  let world;\n  try{ world = await d3.json(window.__resources.worldAtlas); }catch(e){}\n  if(world){\n    const land = topojson.feature(world, world.objects.countries);\n    const supplierIds = new Set(['360','152','156','36','604','324','704','276','124']); // ID,CL,CN,AU,PE,GN,VN,DE,CA\n    const buyerIds = new Set(['840','512','643','784','156','484','634','818','792']); // US,OM,RU,AE,CN,MX,QA,EG,TR\n    const indiaId = '356';\n    g.selectAll('path').data(land.features).enter().append('path').attr('d',path)\n      .attr('fill',d=>{\n        const id=String(+d.id);\n        if(id===indiaId) return '#d39200';\n        if(supplierIds.has(id)) return 'rgba(236,101,43,.18)';\n        if(buyerIds.has(id)) return 'rgba(126,167,233,.18)';\n        return '#eef0f3';\n      })\n      .attr('stroke','#fff').attr('stroke-width',.5)\n      .attr('class',d=>{\n        const id=String(+d.id);\n        if(id===indiaId) return 'focal';\n        if(supplierIds.has(id)) return 'sup';\n        if(buyerIds.has(id)) return 'buy';\n        return '';\n      })\n      .style('cursor','pointer')\n      .on('mouseenter',function(e,d){\n        const n = d.properties.name || 'Country';\n        const id=String(+d.id);\n        let role='—';\n        if(id===indiaId) role='Focal · India';\n        else if(supplierIds.has(id)) role='Supplier (imports from)';\n        else if(buyerIds.has(id)) role='Buyer (exports to)';\n        ttShow(`<strong>${n}<\u002Fstrong><div class=\"meta\">${role}<\u002Fdiv>`,e);\n        d3.select(this).attr('stroke','#011821').attr('stroke-width',1);\n      }).on('mousemove',ttMove).on('mouseleave',function(){ ttHide(); d3.select(this).attr('stroke','#fff').attr('stroke-width',.5); });\n  }\n\n  // Trade arcs from India to top 5 suppliers + 5 buyers\n  const indiaLL=[78,22];\n  const arcs = [\n    {to:[120,-2],c:\"#ec652b\"},{to:[-71,-30],c:\"#ec652b\"},{to:[105,35],c:\"#ec652b\"},\n    {to:[133,-25],c:\"#ec652b\"},{to:[-77,-9],c:\"#ec652b\"},\n    {to:[-98,38],c:\"#7ea7e9\"},{to:[57,21],c:\"#7ea7e9\"},{to:[100,60],c:\"#7ea7e9\"},\n    {to:[54,24],c:\"#7ea7e9\"},{to:[105,35],c:\"#7ea7e9\"}\n  ];\n  const arcG = svg.append('g').attr('fill','none').attr('opacity',.55);\n  arcs.forEach(a=>{\n    const line = {type:\"LineString\",coordinates:[indiaLL,a.to]};\n    arcG.append('path').datum(line).attr('d',path).attr('stroke',a.c).attr('stroke-width',1.2).attr('stroke-dasharray','3 3');\n  });\n})();\n\n// ════════════ LADDER ════════════\nconst ladder = document.getElementById('ladder');\nLADDER.forEach(r=>{\n  const tot = r.imp+r.exp;\n  const impPct = r.imp/tot*100, expPct=r.exp/tot*100;\n  const net = r.exp-r.imp;\n  const netClass = net>=0?'pos':'neg';\n  const el = document.createElement('div');\n  el.className='rung'+(r.focus?' focus':'');\n  el.innerHTML = `\n    <div class=\"rung-stage\"><span>${r.stage}<\u002Fspan><span class=\"step\">${r.step}<\u002Fspan><\u002Fdiv>\n    <div class=\"rung-name\">${r.name}<\u002Fdiv>\n    <div style=\"font-family:var(--mono);font-size:10px;color:var(--slate);letter-spacing:.04em;line-height:1.5\">${r.ex}<br><span style=\"color:var(--slate-2)\">${r.note}<\u002Fspan><\u002Fdiv>\n    <div class=\"rung-bal\">\n      <div class=\"rung-bal-row\"><span>Imports<\u002Fspan><span class=\"v\">$${(r.imp/1000).toFixed(1)}B<\u002Fspan><\u002Fdiv>\n      <div class=\"rung-bal-row\"><span>Exports<\u002Fspan><span class=\"v\">$${(r.exp/1000).toFixed(1)}B<\u002Fspan><\u002Fdiv>\n      <div class=\"rung-bal-bar\"><i class=\"imp\" style=\"flex:${impPct}\"><\u002Fi><i class=\"exp\" style=\"flex:${expPct}\"><\u002Fi><\u002Fdiv>\n      <div class=\"rung-net ${netClass}\">${net>=0?'+':''}$${(net/1000).toFixed(1)}B net<\u002Fdiv>\n    <\u002Fdiv>`;\n  ladder.appendChild(el);\n});\n\n// ════════════ TIMELINE ════════════\nfunction drawTL(){\n  const svg = d3.select('#tl-svg');\n  const node = svg.node();\n  const w = node.clientWidth || 800, h=340;\n  svg.attr('viewBox',`0 0 ${w} ${h}`).selectAll('*').remove();\n  const m={t:14,r:24,b:32,l:50};\n  const x = d3.scaleLinear().domain([2003,2024]).range([m.l,w-m.r]);\n  const max = d3.max(TLDATA, d=>TLSERIES.reduce((a,s)=>a+d[s.k],0));\n  const y = d3.scaleLinear().domain([0,max]).range([h-m.b,m.t]);\n\n  // grid\n  y.ticks(5).forEach(t=>{\n    svg.append('line').attr('x1',m.l).attr('x2',w-m.r).attr('y1',y(t)).attr('y2',y(t)).attr('stroke','#eef0f3').attr('stroke-width',1);\n    svg.append('text').attr('x',m.l-8).attr('y',y(t)+3).attr('text-anchor','end').attr('font-family','IBM Plex Mono').attr('font-size',9).attr('fill','#7c7f88').text('$'+(t/1000).toFixed(0)+'B');\n  });\n  [2005,2010,2015,2020,2024].forEach(yr=>{\n    svg.append('text').attr('x',x(yr)).attr('y',h-m.b+16).attr('text-anchor','middle').attr('font-family','IBM Plex Mono').attr('font-size',9).attr('fill','#7c7f88').text(yr);\n  });\n\n  // stacked area\n  const stack = d3.stack().keys(TLSERIES.map(s=>s.k))(TLDATA);\n  const area = d3.area().x(d=>x(d.data.y)).y0(d=>y(d[0])).y1(d=>y(d[1])).curve(d3.curveMonotoneX);\n  stack.forEach((layer,i)=>{\n    svg.append('path').datum(layer).attr('d',area).attr('fill',TLSERIES[i].c).attr('fill-opacity',.85).attr('stroke','#fff').attr('stroke-width',.5);\n  });\n\n  // annotation\n  const peak = TLDATA[TLDATA.length-1];\n  const peakSum = TLSERIES.reduce((a,s)=>a+peak[s.k],0);\n  svg.append('line').attr('x1',x(2024)).attr('x2',x(2024)).attr('y1',m.t).attr('y2',h-m.b).attr('stroke','#011821').attr('stroke-dasharray','2 3').attr('stroke-width',1);\n  svg.append('text').attr('x',x(2024)-8).attr('y',m.t+12).attr('text-anchor','end').attr('font-family','IBM Plex Mono').attr('font-size',10).attr('fill','#011821').attr('font-weight',500).text('2024 · $'+(peakSum/1000).toFixed(1)+'B imports');\n\n  // legend\n  const lg = document.getElementById('tl-legend');\n  lg.innerHTML='';\n  TLSERIES.forEach(s=>{\n    const el = document.createElement('div');\n    el.className='tl-lg';\n    el.innerHTML=`<span class=\"tl-lg-sw\" style=\"background:${s.c}\"><\u002Fspan>${s.l}`;\n    lg.appendChild(el);\n  });\n}\ndrawTL();\nwindow.addEventListener('resize',()=>{ drawTL(); drawScatter(); drawRadar(); });\n\n// ════════════ SCATTER ════════════\nfunction drawScatter(){\n  const svg = d3.select('#scatter-svg');\n  const node = svg.node();\n  const w = node.clientWidth || 600, h = 420;\n  svg.attr('viewBox',`0 0 ${w} ${h}`).selectAll('*').remove();\n  const m={t:16,r:20,b:36,l:40};\n  const x = d3.scaleLog().domain([0.5,250]).range([m.l,w-m.r]);\n  const y = d3.scaleLinear().domain([0,1]).range([h-m.b,m.t]);\n\n  // grid\n  y.ticks(5).forEach(t=>{\n    svg.append('line').attr('x1',m.l).attr('x2',w-m.r).attr('y1',y(t)).attr('y2',y(t)).attr('stroke','#eef0f3');\n    svg.append('text').attr('x',m.l-6).attr('y',y(t)+3).attr('text-anchor','end').attr('font-family','IBM Plex Mono').attr('font-size',9).attr('fill','#7c7f88').text(t.toFixed(1));\n  });\n  [1,5,10,50,100,200].forEach(t=>{\n    svg.append('line').attr('x1',x(t)).attr('x2',x(t)).attr('y1',m.t).attr('y2',h-m.b).attr('stroke','#eef0f3');\n    svg.append('text').attr('x',x(t)).attr('y',h-m.b+16).attr('text-anchor','middle').attr('font-family','IBM Plex Mono').attr('font-size',9).attr('fill','#7c7f88').text('$'+t+'B');\n  });\n  // axes labels\n  svg.append('text').attr('x',w-m.r).attr('y',h-6).attr('text-anchor','end').attr('font-family','IBM Plex Mono').attr('font-size',9).attr('fill','#7c7f88').attr('letter-spacing','.1em').text('EXPORTS, USD BILLIONS (LOG) →');\n  svg.append('text').attr('transform','rotate(-90)').attr('x',-m.t-6).attr('y',12).attr('text-anchor','end').attr('font-family','IBM Plex Mono').attr('font-size',9).attr('fill','#7c7f88').attr('letter-spacing','.1em').text('CAPABILITY SCORE →');\n\n  // points\n  SCATTER.forEach(d=>{\n    const cx=x(Math.max(0.5,d.eb)), cy=y(d.pc);\n    svg.append('circle').attr('cx',cx).attr('cy',cy).attr('r',d.focal?9:6)\n      .attr('fill',d.focal?'#d39200':REG_COLOR[d.reg]).attr('fill-opacity',d.focal?1:.35).attr('stroke',d.focal?'#011821':REG_COLOR[d.reg]).attr('stroke-width',d.focal?2:1)\n      .style('cursor','pointer')\n      .on('mouseenter',(e)=>ttShow(`<strong>${d.name}<\u002Fstrong><div class=\"meta\">Cap ${d.pc.toFixed(2)} · $${d.eb.toFixed(1)}B exports<\u002Fdiv>`,e))\n      .on('mousemove',ttMove).on('mouseleave',ttHide);\n    if(d.focal||d.eb>40||(d.pc>0.6&&d.eb>10)){\n      svg.append('text').attr('x',cx+12).attr('y',cy+3).attr('font-family','IBM Plex Mono').attr('font-size',10).attr('fill','#011821').attr('font-weight',d.focal?500:400).text(d.name);\n    }\n  });\n\n  // annotation: India label\n  const ind = SCATTER.find(d=>d.focal);\n  const ix=x(ind.eb), iy=y(ind.pc);\n  svg.append('line').attr('x1',ix+10).attr('y1',iy-10).attr('x2',ix+50).attr('y2',iy-40).attr('stroke','#011821').attr('stroke-width',.8);\n  svg.append('text').attr('x',ix+54).attr('y',iy-44).attr('font-family','Fraunces').attr('font-size',13).attr('fill','#011821').attr('font-style','italic').text('India climbs');\n  svg.append('text').attr('x',ix+54).attr('y',iy-30).attr('font-family','IBM Plex Mono').attr('font-size',9).attr('fill','#7c7f88').text('cap 0.62 · $13.7B');\n}\ndrawScatter();\n\n// ════════════ RADAR ════════════\nfunction drawRadar(){\n  const svg = d3.select('#radar-svg');\n  const node = svg.node();\n  const w = node.clientWidth || 360, h = Math.max(280, node.clientHeight||280);\n  svg.attr('viewBox',`0 0 ${w} ${h}`).selectAll('*').remove();\n  const cx=w/2, cy=h/2+8, R=Math.min(w,h)/2-32;\n  const N=RADAR.length;\n  const angle = i => -Math.PI/2 + i*2*Math.PI/N;\n  // rings\n  [0.25,0.5,0.75,1].forEach(t=>{\n    svg.append('circle').attr('cx',cx).attr('cy',cy).attr('r',R*t).attr('fill','none').attr('stroke','#eef0f3');\n  });\n  // axes\n  RADAR.forEach((d,i)=>{\n    const a=angle(i), x1=cx+Math.cos(a)*R, y1=cy+Math.sin(a)*R;\n    svg.append('line').attr('x1',cx).attr('y1',cy).attr('x2',x1).attr('y2',y1).attr('stroke','#e3e4e8').attr('stroke-width',.6);\n    const lx=cx+Math.cos(a)*(R+18), ly=cy+Math.sin(a)*(R+18);\n    svg.append('text').attr('x',lx).attr('y',ly).attr('text-anchor','middle').attr('dy','0.32em').attr('font-family','IBM Plex Mono').attr('font-size',10).attr('fill','#011821').text(d.label);\n  });\n  // world\n  const wMax = d3.max(RADAR,d=>Math.max(d.focal,d.world));\n  const pts = (k)=>RADAR.map((d,i)=>{ const a=angle(i), r=d[k]/wMax*R; return [cx+Math.cos(a)*r, cy+Math.sin(a)*r]; });\n  const wPts = pts('world');\n  svg.append('polygon').attr('points',wPts.map(p=>p.join(',')).join(' ')).attr('fill','rgba(124,127,136,.15)').attr('stroke','#7c7f88').attr('stroke-width',1).attr('stroke-dasharray','3 3');\n  const fPts = pts('focal');\n  svg.append('polygon').attr('points',fPts.map(p=>p.join(',')).join(' ')).attr('fill','rgba(211,146,0,.18)').attr('stroke','#d39200').attr('stroke-width',2);\n  fPts.forEach(p=>svg.append('circle').attr('cx',p[0]).attr('cy',p[1]).attr('r',3).attr('fill','#d39200'));\n\n  // legend\n  const lg = svg.append('g').attr('transform',`translate(${w-130},${h-40})`);\n  lg.append('rect').attr('x',0).attr('y',-2).attr('width',12).attr('height',3).attr('fill','#d39200');\n  lg.append('text').attr('x',16).attr('y',2).attr('font-family','IBM Plex Mono').attr('font-size',10).attr('fill','#011821').text('India');\n  lg.append('rect').attr('x',0).attr('y',12).attr('width',12).attr('height',3).attr('fill','#7c7f88');\n  lg.append('text').attr('x',16).attr('y',16).attr('font-family','IBM Plex Mono').attr('font-size',10).attr('fill','#7c7f88').text('World avg');\n}\ndrawRadar();\n\n// ════════════ EXPLORE VIEW SWITCHER ════════════\nconst expVTs = document.querySelectorAll('.exp-vt');\nconst expWraps = {table:'exp-table-wrap',map:'exp-map-wrap',scatter:'exp-scatter-wrap'};\nexpVTs.forEach(b=>b.addEventListener('click',()=>{\n  expVTs.forEach(x=>x.classList.toggle('on',x===b));\n  Object.entries(expWraps).forEach(([k,id])=>{\n    document.getElementById(id).style.display = (k===b.dataset.ev)?'block':'none';\n  });\n  if(b.dataset.ev==='map') drawExpMap();\n  if(b.dataset.ev==='scatter') drawExpScatter();\n}));\n\n// ════════════ EXPLORE MAP (choropleth) ════════════\nlet expMapDrawn=false;\nasync function drawExpMap(){\n  if(expMapDrawn) return; expMapDrawn=true;\n  const svg = d3.select('#exp-map-svg');\n  const node = svg.node().parentElement;\n  const w = node.clientWidth || 900, h = 560;\n  svg.attr('viewBox',`0 0 ${w} ${h}`);\n  const proj = d3.geoNaturalEarth1().scale(w*0.18).translate([w/2,h/2+10]);\n  const path = d3.geoPath(proj);\n  // capability map by country (max across selected techs)\n  const CAPMAP = {'356':0.62,'156':0.99,'392':0.95,'410':0.73,'704':0.57,'458':0.96,'764':0.93,'608':0.91,'702':0.86,'116':0.81,'528':0.67,'76':0.12,'32':0.08,'484':0.06,'276':0.39,'724':0.05,'380':0.04,'250':0.02,'826':0.01,'840':0.07,'124':0.03,'643':0.04,'792':0.02,'616':0.05,'36':0.02,'360':0.04,'152':0.001,'604':0.001,'324':0.001};\n  let world; try{ world = await d3.json(window.__resources.worldAtlas); }catch(e){}\n  if(world){\n    const land = topojson.feature(world, world.objects.countries);\n    const color = d3.scaleSequential().domain([0,1]).interpolator(t=>{\n      if(t<0.05) return '#eef0f3';\n      const r=Math.round(255-(255-211)*Math.min(1,t*1.5));\n      const g=Math.round(255-(255-146)*Math.min(1,t*1.5));\n      const b=Math.round(255-(255-0)*Math.min(1,t*1.5));\n      return `rgb(${r},${g},${b})`;\n    });\n    svg.append('g').selectAll('path').data(land.features).enter().append('path').attr('d',path)\n      .attr('fill',d=>{ const v=CAPMAP[String(+d.id)]; return v==null?'#f6f6f8':color(v); })\n      .attr('stroke','#fff').attr('stroke-width',.4)\n      .style('cursor','pointer')\n      .on('mouseenter',function(e,d){ const v=CAPMAP[String(+d.id)];\n        ttShow(`<strong>${d.properties.name}<\u002Fstrong><div class=\"meta\">Capability ${v==null?'—':v.toFixed(2)} · all selected techs<\u002Fdiv>`,e);\n        d3.select(this).attr('stroke','#011821').attr('stroke-width',1);\n      }).on('mousemove',ttMove).on('mouseleave',function(){ ttHide(); d3.select(this).attr('stroke','#fff').attr('stroke-width',.4); })\n      .on('click',()=>go('story'));\n  }\n}\n\n// ════════════ EXPLORE SCATTER ════════════\nlet expScatterDrawn=false;\nfunction drawExpScatter(){\n  if(expScatterDrawn) return; expScatterDrawn=true;\n  const svg = d3.select('#exp-scatter-svg');\n  const node = svg.node();\n  const w = node.clientWidth || 900, h = 520;\n  svg.attr('viewBox',`0 0 ${w} ${h}`);\n  const m={t:24,r:24,b:44,l:56};\n  const x = d3.scaleLog().domain([0.3,250]).range([m.l,w-m.r]);\n  const y = d3.scaleLinear().domain([0,1]).range([h-m.b,m.t]);\n  // build pairs from EXP_ROWS + a sprinkle of synthetic ones\n  const TECH_COL={'Solar PV':'#d39200','Batteries':'#5b3aa1','Nuclear':'#2563a8','Wind':'#0f766e','Transmission':'#a05a2c'};\n  const pairs = EXP_ROWS.map(r=>({c:r.c,iso:r.iso,t:r.tech,cap:r.cap,eb:parseFloat(r.exp.replace(/[$B]/g,'')),focal:r.featured}));\n  // synth filler\n  const fillerC = ['Mexico','Spain','Poland','Turkey','Indonesia','Australia','Chile','Peru','UK','France','Italy','Canada','Egypt','UAE','Saudi Arabia','Argentina','Czechia','Sweden','Norway','Finland'];\n  const techs=['Solar PV','Batteries','Nuclear','Wind','Transmission'];\n  for(let i=0;i<60;i++){\n    pairs.push({c:fillerC[i%fillerC.length],iso:'XX',t:techs[i%5],cap:Math.random()**1.5*0.7,eb:Math.exp(Math.random()*5)});\n  }\n  // grid\n  y.ticks(5).forEach(t=>{\n    svg.append('line').attr('x1',m.l).attr('x2',w-m.r).attr('y1',y(t)).attr('y2',y(t)).attr('stroke','#eef0f3');\n    svg.append('text').attr('x',m.l-8).attr('y',y(t)+3).attr('text-anchor','end').attr('font-family','IBM Plex Mono').attr('font-size',9).attr('fill','#7c7f88').text(t.toFixed(1));\n  });\n  [1,5,10,50,100,200].forEach(t=>{\n    svg.append('line').attr('x1',x(t)).attr('x2',x(t)).attr('y1',m.t).attr('y2',h-m.b).attr('stroke','#eef0f3');\n    svg.append('text').attr('x',x(t)).attr('y',h-m.b+18).attr('text-anchor','middle').attr('font-family','IBM Plex Mono').attr('font-size',9).attr('fill','#7c7f88').text('$'+t+'B');\n  });\n  svg.append('text').attr('x',w-m.r).attr('y',h-8).attr('text-anchor','end').attr('font-family','IBM Plex Mono').attr('font-size',9).attr('fill','#7c7f88').attr('letter-spacing','.1em').text('EXPORTS, USD BILLIONS (LOG) →');\n  svg.append('text').attr('transform','rotate(-90)').attr('x',-m.t-6).attr('y',14).attr('text-anchor','end').attr('font-family','IBM Plex Mono').attr('font-size',9).attr('fill','#7c7f88').attr('letter-spacing','.1em').text('CAPABILITY SCORE →');\n\n  // points\n  const r = d3.scaleSqrt().domain([0.1,200]).range([3,16]);\n  pairs.forEach(p=>{\n    const cx=x(Math.max(0.3,p.eb)), cy=y(p.cap);\n    const c = TECH_COL[p.t]||'#7c7f88';\n    svg.append('circle').attr('cx',cx).attr('cy',cy).attr('r',r(p.eb))\n      .attr('fill',c).attr('fill-opacity',p.focal?0.95:0.4).attr('stroke',p.focal?'#011821':c).attr('stroke-width',p.focal?2:1)\n      .style('cursor','pointer')\n      .on('mouseenter',(e)=>ttShow(`<strong>${p.c} · ${p.t}<\u002Fstrong><div class=\"meta\">Cap ${p.cap.toFixed(2)} · $${p.eb.toFixed(1)}B exports<\u002Fdiv>`,e))\n      .on('mousemove',ttMove).on('mouseleave',ttHide)\n      .on('click',()=>go('story'));\n    if(p.focal||p.eb>40||(p.cap>0.7&&p.eb>10)){\n      svg.append('text').attr('x',cx+r(p.eb)+4).attr('y',cy+3).attr('font-family','IBM Plex Mono').attr('font-size',10).attr('fill','#011821').attr('font-weight',p.focal?500:400).text(p.c);\n    }\n  });\n  // quadrant labels\n  svg.append('text').attr('x',w-m.r-8).attr('y',m.t+14).attr('text-anchor','end').attr('font-family','Fraunces').attr('font-size',12).attr('font-style','italic').attr('fill','#7c7f88').text('high capability · large scale');\n  svg.append('text').attr('x',m.l+8).attr('y',h-m.b-8).attr('font-family','Fraunces').attr('font-size',12).attr('font-style','italic').attr('fill','#7c7f88').text('low capability · small scale');\n}\n\n// ════════════ EXPLORE TABLE ════════════\nconst tbody = document.getElementById('exp-tbody');\nEXP_ROWS.forEach(r=>{\n  const tr = document.createElement('tr');\n  if(r.featured) tr.style.background='#fffbf3';\n  // sparkline\n  const sparkPts = Array.from({length:8},(_,i)=>{\n    const v = 0.5 + Math.sin(i*0.7+r.r)*0.2 + (r.trend==='up'?i*0.06:0);\n    return [i*11.4, 16-v*14].join(',');\n  }).join(' ');\n  tr.innerHTML = `\n    <td class=\"rt-rank\">${r.r}<\u002Ftd>\n    <td><div class=\"rt-pair\"><div class=\"rt-flag\">${r.iso}<\u002Fdiv><div><div class=\"rt-name\">${r.c}${r.featured?' <span style=\"color:var(--orange);font-family:var(--mono);font-size:9px;letter-spacing:.1em;margin-left:6px\">★ FEATURED<\u002Fspan>':''}<\u002Fdiv><div class=\"rt-tech\"><span class=\"dot\" style=\"background:${r.col}\"><\u002Fspan>${r.tech}<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Ftd>\n    <td><span style=\"font-family:var(--mono);font-size:11px;color:var(--charcoal)\">${r.stage}<\u002Fspan><\u002Ftd>\n    <td><div style=\"display:flex;align-items:center;gap:8px\"><div style=\"font-family:var(--mono);font-size:12px;color:var(--ink);font-weight:500\">${r.cap.toFixed(3)}<\u002Fdiv><div style=\"width:60px;height:4px;background:var(--fog-2);border-radius:2px;overflow:hidden\"><div style=\"height:100%;width:${(r.cap*100).toFixed(0)}%;background:${r.col}\"><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Ftd>\n    <td><svg class=\"rt-mini\" viewBox=\"0 0 80 18\" preserveAspectRatio=\"none\"><polyline points=\"${sparkPts}\" fill=\"none\" stroke=\"${r.dn?'var(--orange)':'var(--moss)'}\" stroke-width=\"1.4\"/><\u002Fsvg><\u002Ftd>\n    <td class=\"rt-num\">${r.exp} <span class=\"pct ${r.dn?'dn':''}\">${r.d}<\u002Fspan><\u002Ftd>\n    <td class=\"rt-cta\">Open →<\u002Ftd>`;\n  tr.style.cursor='pointer';\n  tr.addEventListener('click',()=>go('story'));\n  tbody.appendChild(tr);\n});\n\n// ════════════ COMPOSE PREVIEWS (small) ════════════\nfunction tinyArea(svgId,c1,c2){\n  const s = d3.select('#'+svgId);\n  s.selectAll('*').remove();\n  const pts1 = Array.from({length:14},(_,i)=>[i*15+5, 60-Math.sin(i*0.4)*15-i*1.5].join(',')).join(' ');\n  const pts2 = Array.from({length:14},(_,i)=>[i*15+5, 65-Math.sin(i*0.4)*8-i*0.6].join(',')).join(' ');\n  s.append('polyline').attr('points',pts1+' 195,70 5,70').attr('fill',c1).attr('fill-opacity',.2);\n  s.append('polyline').attr('points',pts2+' 195,70 5,70').attr('fill',c2).attr('fill-opacity',.2);\n  s.append('polyline').attr('points',pts1).attr('fill','none').attr('stroke',c1).attr('stroke-width',1.4);\n  s.append('polyline').attr('points',pts2).attr('fill','none').attr('stroke',c2).attr('stroke-width',1.4);\n}\ntinyArea('cpc1','#5b3aa1','#ec652b');\nfunction tinyBars(id,c){\n  const s = d3.select('#'+id); s.selectAll('*').remove();\n  const v = [0.3,0.6,0.85,0.5,0.2];\n  v.forEach((vv,i)=>{ s.append('rect').attr('x',i*38+10).attr('y',60-vv*45).attr('width',28).attr('height',vv*45).attr('fill',c).attr('opacity',0.5+vv*0.4); });\n}\ntinyBars('cpc2','#5b3aa1');\nfunction tinyDots(id){\n  const s = d3.select('#'+id); s.selectAll('*').remove();\n  const reg=['#2563a8','#d39200','#5b3aa1','#0f766e','#a05a2c'];\n  for(let i=0;i<26;i++){\n    const x=10+Math.random()*180, y=10+Math.random()*55;\n    s.append('circle').attr('cx',x).attr('cy',y).attr('r',2+Math.random()*3).attr('fill',reg[i%5]).attr('opacity',0.5);\n  }\n  s.append('circle').attr('cx',135).attr('cy',38).attr('r',6).attr('fill','#5b3aa1').attr('stroke','#011821').attr('stroke-width',1);\n}\ntinyDots('cpc3');\nfunction tinyNet(id){\n  const s = d3.select('#'+id); s.selectAll('*').remove();\n  const cx=100,cy=35;\n  s.append('circle').attr('cx',cx).attr('cy',cy).attr('r',8).attr('fill','#5b3aa1');\n  const nodes = [[30,15],[40,55],[170,18],[160,55],[100,8],[80,60]];\n  nodes.forEach(([x,y])=>{\n    s.append('line').attr('x1',cx).attr('y1',cy).attr('x2',x).attr('y2',y).attr('stroke','#7c7f88').attr('stroke-width',.5);\n    s.append('circle').attr('cx',x).attr('cy',y).attr('r',3).attr('fill','#011821');\n  });\n}\ntinyNet('cpc4');\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
