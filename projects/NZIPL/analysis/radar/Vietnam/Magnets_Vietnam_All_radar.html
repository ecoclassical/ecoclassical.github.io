<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Magnets Vietnam · Capability Radar · All</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1520;
  font-family:"Archivo",-apple-system,"Segoe UI",sans-serif;color:#e2e8f0}
#module-wrap{width:100%;height:100%;display:flex;flex-direction:column}
#module-header{padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:10px;flex-shrink:0;min-height:36px;background:#0a1218}
.m-tech{font-size:.82rem;font-weight:800}
.m-sep{color:rgba(255,255,255,.25);font-size:.75rem}
.m-title{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.7);
  text-transform:uppercase;letter-spacing:.07em}
.m-meta{font-size:.62rem;color:rgba(255,255,255,.3);margin-left:auto}
.m-sel{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:3px;padding:1px 6px;color:rgba(255,255,255,.45)}
#module-body{flex:1;min-height:0;position:relative}
#module-body>svg,#module-body>canvas{width:100%!important;height:100%!important}
#tooltip{position:fixed;pointer-events:none;background:rgba(0,0,0,.88);color:#fff;
  font-size:12px;padding:8px 12px;border-radius:5px;opacity:0;transition:opacity .15s;
  max-width:260px;z-index:9999;line-height:1.55}
/* Pane aliases expected by drawing functions */
#pane-shap,#pane-sc,#pane-tl,#pane-tm,#pane-den,#pane-sankey,#pane-map{
  position:absolute;inset:0}


</style>
</head>
<body>
<div id="module-wrap">
  <div id="module-header">
    <span class="m-tech" style="color:#ec4899">Magnets</span>
    <span class="m-sep">·</span>
    <span style="color:rgba(255,255,255,.55);font-size:.82rem;font-weight:600">Vietnam</span>
    <span class="m-sep">·</span>
    <span class="m-title">Capability Radar</span>
    <span class="m-meta">SHAP weight vs Country RCA · 2023</span>
    <span class="m-sel">All</span>
  </div>
  <div id="module-body">
    <div id="pane-shap" style="position:absolute;inset:0">
      <svg id="shap-svg" style="width:100%;height:100%"></svg>
      
    </div>
  </div>
</div>
<div id="tooltip"></div>
<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
const ALL_CASES=[{tech:"Magnets",color:"#ec4899",focal:"VNM",radar_data:{"categories":["Chemicals","Electronics","Industrial Materials","Machinery","Metals"],"focal":[9e-04,1.4081,0.5437,0.1948,0.0113],"shap":[0.1271,0.1197,0.1254,0.2527,0.3751],"region":[1.2214,0.3849,0.6481,0.7436,3.7083],"world":[0.696,0.3014,0.3114,0.2968,3.6875],"region_name":"East Asia & Pacific"}}];
let currentIdx=0;
const c=()=>ALL_CASES[currentIdx];
let selStage="ALL", selRole="ALL", selProduct="ALL";
let tlMode="exports", scMode="pct", sankeyFocus=null;

const SR_COLORS={
  "Upstream|Raw Material":"#b45309","Upstream|Processed Material":"#c17a2e",
  "Midstream|Processed Material":"#22c55e","Midstream|Process Equipment":"#65a30d",
  "Midstream|Product Component":"#16a34a","Downstream|Product Component":"#4ade80",
  "Downstream|Process Equipment":"#6b7280","Downstream|Final Product":"#f97316",
  "Final Product|Final Product":"#f97316","Other|Product Component":"#9ca3af",
  "Other|Process Equipment":"#9ca3af"
};
const SR_ORDER=["Upstream|Raw Material","Upstream|Processed Material","Midstream|Processed Material","Midstream|Process Equipment","Midstream|Product Component","Downstream|Product Component","Downstream|Process Equipment","Downstream|Final Product","Final Product|Final Product"];
const STAGE_COLORS={"Upstream":"#b45309","Midstream":"#22c55e","Downstream":"#4ade80","Final Product":"#f97316"};
const STAGES_ORDER=["Upstream","Midstream","Downstream","Final Product"];
const REGION_COLOR={EAP:"#0369a1",ECA:"#6366f1",SAS:"#10b981",NAC:"#f59e0b",LCN:"#ef4444",MEA:"#8b5cf6",SSF:"#84cc16"};
const PROD_COLORS=["#f59e0b","#38bdf8","#4ade80","#f87171","#c084fc","#fb923c","#a78bfa","#34d399","#f472b6","#60a5fa"];
const tip={_el:null,_get(){return this._el||(this._el=document.getElementById("tooltip"));},style(k,v){const e=this._get();if(e)e.style[k]=v;return this;},html(h){const e=this._get();if(e)e.innerHTML=h;return this;}};
function showTip(html,ev){const vw=window.innerWidth;const tx=ev.clientX+14;const offset=tx+260>vw?ev.clientX-270:tx;tip.style("opacity","1").html(html).style("left",offset+"px").style("top",(ev.clientY-10)+"px")}
function hideTip(){tip.style("opacity","0")}
const fmtV=v=>v>=1e6?`$${(v/1e6).toFixed(1)}B`:v>=1e3?`$${(v/1e3).toFixed(1)}M`:`$${v.toFixed(0)}K`;
function srColor(sr){return SR_COLORS[sr]||"#9ca3af"}
function srColorSR(stage,role){return SR_COLORS[stage+"|"+role]||"#9ca3af"}


function getPV() {
  const c0 = c();
  const pv = c0.selected_pv;
  if (pv) return pv;
  return c0.selected_pv || {code:"ALL",label:"All",stage:"ALL",role:"ALL",
    suppliers:[],buyers:[],timeline:[],total_imp:0,total_exp:0};
}

function drawShapRadar(){
  const c0=c();
  const rd=c0.radar_data;
  const svg=d3.select("#shap-svg"); svg.selectAll("*").remove();
  const W=document.getElementById("pane-shap").clientWidth||240;
  const H=document.getElementById("pane-shap").clientHeight-36||200;
  svg.attr("viewBox",`0 0 ${W} ${H}`);
  if(!rd||!rd.categories||!rd.focal){
    svg.append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle")
      .attr("fill","rgba(255,255,255,.25)").attr("font-size",10).text("No radar data");
    return;
  }
  const cats=rd.categories;
  const N=cats.length;
  const shap=rd.shap||cats.map(()=>1/N);
  const focal=rd.focal;
  const cx=W/2, cy=H/2+4;
  const R=Math.min(W,H)/2-30;
  const ang=i=>(i/N)*2*Math.PI-Math.PI/2;
  const pt=(r,i)=>[cx+r*Math.cos(ang(i)), cy+r*Math.sin(ang(i))];
  // RCA scale
  const maxRCA=Math.max(d3.max(focal.filter(v=>v!=null&&!isNaN(v)))||1.5,1.2);
  const scR=v=>R*Math.min(Math.max(v||0,0),maxRCA)/maxRCA;
  // SHAP scale: 50% share → edge (R)
  const shR=s=>Math.min(R*s*2,R);
  // Outer pentagon
  svg.append("polygon")
    .attr("points",cats.map((_,i)=>pt(R,i).join(",")).join(" "))
    .attr("fill","none").attr("stroke","rgba(255,255,255,.1)").attr("stroke-width",0.5);
  // RCA=1 ring (dashed reference)
  svg.append("polygon")
    .attr("points",cats.map((_,i)=>pt(scR(1.0),i).join(",")).join(" "))
    .attr("fill","none").attr("stroke","rgba(255,255,255,.22)")
    .attr("stroke-width",0.8).attr("stroke-dasharray","4,3");
  svg.append("text").attr("x",cx+3).attr("y",cy-scR(1.0)-2)
    .attr("fill","rgba(255,255,255,.2)").attr("font-size",5.5).text("RCA=1");
  // Spokes
  cats.forEach((_,i)=>{
    const [x2,y2]=pt(R,i);
    svg.append("line").attr("x1",cx).attr("y1",cy).attr("x2",x2).attr("y2",y2)
      .attr("stroke","rgba(255,255,255,.08)").attr("stroke-width",0.5);
  });
  // SHAP polygon — amber, "what the model needs"
  svg.append("polygon")
    .attr("points",cats.map((_,i)=>pt(shR(shap[i]||1/N),i).join(",")).join(" "))
    .attr("fill","rgba(245,158,11,.14)").attr("stroke","#f59e0b")
    .attr("stroke-width",1.8).attr("stroke-linejoin","round");
  // Focal RCA polygon — tech color dashed, "what the country has"
  svg.append("polygon")
    .attr("points",cats.map((_,i)=>pt(scR(focal[i]||0),i).join(",")).join(" "))
    .attr("fill",`${c0.color}18`).attr("stroke",c0.color)
    .attr("stroke-width",1.8).attr("stroke-dasharray","4,2").attr("stroke-linejoin","round");
  // Classify
  const classify=(s,r)=>{
    if(s>=0.25&&r<0.5) return {tag:"CRIT GAP",   col:"#ef4444"};
    if(r<0.5&&s>=0.10)  return {tag:"GAP",        col:"#f97316"};
    if(r>=1.0)           return {tag:"STRENGTH",   col:"#22c55e"};
    if(r>=0.5)           return {tag:"BUILD",      col:"#22d3ee"};
    return                {tag:"LOW PRIORITY", col:"#6b7280"};
  };
  // Dots + tooltips
  cats.forEach((_,i)=>{
    const cls=classify(shap[i]||0,focal[i]||0);
    const [sx,sy]=pt(shR(shap[i]||1/N),i);
    svg.append("circle").attr("cx",sx).attr("cy",sy).attr("r",2.6)
      .attr("fill","#f59e0b");
    const [rx,ry]=pt(scR(focal[i]||0),i);
    svg.append("circle").attr("cx",rx).attr("cy",ry).attr("r",3.2)
      .attr("fill",c0.color).attr("stroke","white").attr("stroke-width",0.8)
      .on("mousemove",ev=>showTip(
        `<b>${cats[i]}</b><br><span style="color:${cls.col}">${cls.tag}</span><br>`+
        `SHAP: <b>${Math.round((shap[i]||0)*100)}%</b> &nbsp; RCA: <b>${(focal[i]||0).toFixed(2)}</b>`,ev))
      .on("mouseleave",hideTip);
  });
  // Axis labels: name + classification tag + SHAP%·RCA
  cats.forEach((cat,i)=>{
    const [lx,ly]=pt(R+14,i);
    const anc=Math.cos(ang(i))>0.12?"start":Math.cos(ang(i))<-0.12?"end":"middle";
    const cls=classify(shap[i]||0,focal[i]||0);
    const shortCat=cat==="Industrial Materials"?"Ind. Materials":cat;
    const tEl=svg.append("text").attr("text-anchor",anc).attr("pointer-events","none");
    tEl.append("tspan").attr("x",lx).attr("y",ly)
      .attr("font-size",7).attr("font-weight",700).attr("fill","rgba(255,255,255,.85)").text(shortCat);
    tEl.append("tspan").attr("x",lx).attr("dy","8")
      .attr("font-size",5.5).attr("font-weight",700).attr("letter-spacing","0.04em")
      .attr("fill",cls.col).text(cls.tag);
    tEl.append("tspan").attr("x",lx).attr("dy","7")
      .attr("font-size",5).attr("fill","rgba(255,255,255,.32)")
      .text(`${Math.round((shap[i]||0)*100)}% · ${(focal[i]||0).toFixed(2)}`);
  });
  // Legend
  const legY=H-16;
  [["#f59e0b","SHAP weight",false],[c0.color,"Country RCA",true],["rgba(255,255,255,.2)","RCA=1","dotted"]].forEach(([col,lbl,dash],i)=>{
    const lx=4+i*70;
    svg.append("line").attr("x1",lx).attr("y1",legY).attr("x2",lx+11).attr("y2",legY)
      .attr("stroke",col).attr("stroke-width",dash?"dotted"===dash?0.8:1.2:2)
      .attr("stroke-dasharray",dash==="dotted"?"4,3":dash?"4,2":"");
    svg.append("text").attr("x",lx+13).attr("y",legY+3.5)
      .attr("fill","rgba(255,255,255,.38)").attr("font-size",5.5).text(lbl);
  });
}
document.addEventListener("DOMContentLoaded",()=>{ drawShapRadar(); });
window.addEventListener("resize",()=>{ drawShapRadar(); });

</script>
</body>
</html>
