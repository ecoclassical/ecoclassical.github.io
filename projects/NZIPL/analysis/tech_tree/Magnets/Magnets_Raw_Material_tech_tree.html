<!DOCTYPE html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1520;
  font-family:"Archivo",-apple-system,"Segoe UI",sans-serif;color:#e2e8f0}
#module-wrap{width:100%;height:100%;display:flex;flex-direction:column}
#module-header{padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.06);
  display:flex;align-items:center;gap:10px;flex-shrink:0;min-height:36px;background:#0a1218}
.m-tech{font-size:.82rem;font-weight:800}
.m-sep{color:rgba(255,255,255,.25);font-size:.75rem}
.m-title{font-size:.72rem;font-weight:700;color:rgba(255,255,255,.7);
  text-transform:uppercase;letter-spacing:.07em}
.m-sel{font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
  border-radius:3px;padding:1px 6px;color:rgba(255,255,255,.45)}
#module-body{flex:1;min-height:0;position:relative;overflow:hidden}
#pane-den{position:absolute;inset:0;width:100%;height:100%}
#den-title,#den-meta{display:none}
#tooltip{position:fixed;pointer-events:none;background:rgba(0,0,0,.88);color:#fff;
  font-size:12px;padding:8px 12px;border-radius:5px;opacity:0;transition:opacity .15s;
  max-width:260px;z-index:9999;line-height:1.55}
</style>

<body>
<div id="module-wrap">

    <span class="m-tech" style="color:#ec4899">Magnets</span>

    <span style="color:rgba(255,255,255,.3);font-size:.65rem;margin-left:4px">HS6 value chain dendrite</span>
    <span class="m-sel" style="margin-left:auto">Raw_Material</span>
  </div>
  <div id="module-body">
    <div id="pane-den">
      <svg id="den-svg" style="width:100%;height:100%"></svg>
    </div>
  </div>
</div>
<div id="tooltip"></div>
<script>
const ALL_CASES=[{tech:"Magnets",color:"#ec4899",focal:"ALL",den_edges:[{"fcn":"850519 Magnets: permanent magnets a","tcn":"850511 Magnets: permanent magnets a","fc":"850519","tc":"850511","fn":"Magnets: permanent magnets and a","tn":"Magnets: permanent magnets and a","fs":"Downstream","ts":"Final Product","fr":"Product Component","tr":"Final Product"},{"fcn":"854330 Electrical machines and appa","tcn":"850519 Magnets: permanent magnets a","fc":"854330","tc":"850519","fn":"Electrical machines and apparatu","tn":"Magnets: permanent magnets and a","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Product Component"},{"fcn":"283324 Sulphates: of nickel","tcn":"854330 Electrical machines and appa","fc":"283324","tc":"854330","fn":"Sulphates: of nickel","tn":"Electrical machines and apparatu","fs":"Midstream","ts":"Downstream","fr":"Processed Material","tr":"Process Equipment"},{"fcn":"260400 Nickel ores and concentrates","tcn":"283324 Sulphates: of nickel","fc":"260400","tc":"283324","fn":"Nickel ores and concentrates","tn":"Sulphates: of nickel","fs":"Upstream","ts":"Midstream","fr":"Raw Material","tr":"Processed Material"},{"fcn":"845630 Machine-tools: for working a","tcn":"854330 Electrical machines and appa","fc":"845630","tc":"854330","fn":"Machine-tools: for working any m","tn":"Electrical machines and apparatu","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"680421 Millstones, grindstones, gri","tcn":"845630 Machine-tools: for working a","fc":"680421","tc":"845630","fn":"Millstones, grindstones, grindin","tn":"Machine-tools: for working any m","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"847989 Machines and mechanical appl","tcn":"680421 Millstones, grindstones, gri","fc":"847989","tc":"680421","fn":"Machines and mechanical applianc","tn":"Millstones, grindstones, grindin","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"850590 Magnets: electro-magnets, ho","tcn":"847989 Machines and mechanical appl","fc":"850590","tc":"847989","fn":"Magnets: electro-magnets, holdin","tn":"Machines and mechanical applianc","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"847982 Machines: for mixing, kneadi","tcn":"850590 Magnets: electro-magnets, ho","fc":"847982","tc":"850590","fn":"Machines: for mixing, kneading, ","tn":"Magnets: electro-magnets, holdin","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"854330 Electrical machines and appa","tcn":"847982 Machines: for mixing, kneadi","fc":"854330","tc":"847982","fn":"Electrical machines and apparatu","tn":"Machines: for mixing, kneading, ","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"820720 Tools, interchangeable: (for","tcn":"854330 Electrical machines and appa","fc":"820720","tc":"854330","fn":"Tools, interchangeable: (for mac","tn":"Electrical machines and apparatu","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"851440 Heating equipment: for the h","tcn":"820720 Tools, interchangeable: (for","fc":"851440","tc":"820720","fn":"Heating equipment: for the heat ","tn":"Tools, interchangeable: (for mac","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"760120 Aluminium: unwrought, alloys","tcn":"851440 Heating equipment: for the h","fc":"760120","tc":"851440","fn":"Aluminium: unwrought, alloys","tn":"Heating equipment: for the heat ","fs":"Midstream","ts":"Downstream","fr":"Processed Material","tr":"Process Equipment"},{"fcn":"260120 Iron pyrites: roasted","tcn":"851440 Heating equipment: for the h","fc":"260120","tc":"851440","fn":"Iron pyrites: roasted","tn":"Heating equipment: for the heat ","fs":"Upstream","ts":"Downstream","fr":"Raw Material","tr":"Process Equipment"},{"fcn":"261590 Niobium, tantalum, vanadium ","tcn":"851440 Heating equipment: for the h","fc":"261590","tc":"851440","fn":"Niobium, tantalum, vanadium ores","tn":"Heating equipment: for the heat ","fs":"Upstream","ts":"Downstream","fr":"Raw Material","tr":"Process Equipment"},{"fcn":"284690 Compounds, inorganic or orga","tcn":"851440 Heating equipment: for the h","fc":"284690","tc":"851440","fn":"Compounds, inorganic or organic ","tn":"Heating equipment: for the heat ","fs":"Midstream","ts":"Downstream","fr":"Processed Material","tr":"Process Equipment"},{"fcn":"280530 Earth-metals, rare: scandium","tcn":"851440 Heating equipment: for the h","fc":"280530","tc":"851440","fn":"Earth-metals, rare: scandium and","tn":"Heating equipment: for the heat ","fs":"Midstream","ts":"Downstream","fr":"Processed Material","tr":"Process Equipment"}],den_products:[{"code":"260120","name":"Iron pyrites: roasted","stage":"Upstream","role":"Raw Material","exp":0,"imp":0},{"code":"260300","name":"Copper ores and concentrates","stage":"Upstream","role":"Raw Material","exp":0,"imp":0},{"code":"260400","name":"Nickel ores and concentrates","stage":"Upstream","role":"Raw Material","exp":0,"imp":0},{"code":"260600","name":"Aluminium ores and concentrates","stage":"Upstream","role":"Raw Material","exp":0,"imp":0},{"code":"261590","name":"Niobium, tantalum, vanadium ores and con","stage":"Upstream","role":"Raw Material","exp":0,"imp":0},{"code":"280530","name":"Earth-metals, rare: scandium and yttrium","stage":"Midstream","role":"Processed Material","exp":0,"imp":0},{"code":"283324","name":"Sulphates: of nickel","stage":"Midstream","role":"Processed Material","exp":0,"imp":0},{"code":"284690","name":"Compounds, inorganic or organic (excludi","stage":"Midstream","role":"Processed Material","exp":0,"imp":0},{"code":"680421","name":"Millstones, grindstones, grinding wheels","stage":"Downstream","role":"Process Equipment","exp":0,"imp":0},{"code":"720293","name":"Ferro-alloys: ferro-niobium","stage":"Midstream","role":"Processed Material","exp":0,"imp":0},{"code":"760120","name":"Aluminium: unwrought, alloys","stage":"Midstream","role":"Processed Material","exp":0,"imp":0},{"code":"820720","name":"Tools, interchangeable: (for machine or ","stage":"Downstream","role":"Process Equipment","exp":0,"imp":0},{"code":"845630","name":"Machine-tools: for working any material ","stage":"Downstream","role":"Process Equipment","exp":0,"imp":0},{"code":"847982","name":"Machines: for mixing, kneading, crushing","stage":"Downstream","role":"Process Equipment","exp":0,"imp":0},{"code":"847989","name":"Machines and mechanical appliances: havi","stage":"Downstream","role":"Process Equipment","exp":0,"imp":0},{"code":"850511","name":"Magnets: permanent magnets and articles ","stage":"Final Product","role":"Final Product","exp":0,"imp":0},{"code":"850519","name":"Magnets: permanent magnets and articles ","stage":"Downstream","role":"Product Component","exp":0,"imp":0},{"code":"850590","name":"Magnets: electro-magnets, holding device","stage":"Downstream","role":"Process Equipment","exp":0,"imp":0},{"code":"851440","name":"Heating equipment: for the heat treatmen","stage":"Downstream","role":"Process Equipment","exp":0,"imp":0},{"code":"854330","name":"Electrical machines and apparatus: for e","stage":"Downstream","role":"Process Equipment","exp":0,"imp":0}],product_views:[{"code":"260400","label":"Nickel ores and concentrates","stage":"Upstream","role":"Raw Material","total_imp":0,"total_exp":0,"suppliers":[],"buyers":[],"timeline":[]},{"code":"260120","label":"Iron pyrites: roasted","stage":"Upstream","role":"Raw Material","total_imp":0,"total_exp":0,"suppliers":[],"buyers":[],"timeline":[]},{"code":"261590","label":"Niobium, tantalum, vanadium ores and con","stage":"Upstream","role":"Raw Material","total_imp":0,"total_exp":0,"suppliers":[],"buyers":[],"timeline":[]}]}];
let currentIdx=0;
const c=()=>ALL_CASES[currentIdx];
let selStage="ALL", selRole="Raw Material", selProduct="ALL";
let tlMode="exports", scMode="pct", sankeyFocus=null;

const SR_COLORS={
  "Upstream|Raw Material":"#b45309","Upstream|Processed Material":"#c17a2e",
  "Midstream|Processed Material":"#22c55e","Midstream|Process Equipment":"#65a30d",
  "Midstream|Product Component":"#16a34a","Downstream|Product Component":"#4ade80",
  "Downstream|Process Equipment":"#6b7280","Downstream|Final Product":"#f97316",
  "Final Product|Final Product":"#f97316","Other|Product Component":"#9ca3af",
  "Other|Process Equipment":"#9ca3af"
};
const SR_ORDER=["Upstream|Raw Material","Upstream|Processed Material","Midstream|Processed Material","Midstream|Process Equipment","Midstream|Product Component","Downstream|Product Component","Downstream|Process Equipment","Downstream|Final Product","Final Product|Final Product"];
const STAGE_COLORS={"Upstream":"#b45309","Midstream":"#22c55e","Downstream":"#4ade80","Final Product":"#f97316"};
const STAGES_ORDER=["Upstream","Midstream","Downstream","Final Product"];
const tip={_el:null,_get(){return this._el||(this._el=document.getElementById("tooltip"));},style(k,v){const e=this._get();if(e)e.style[k]=v;return this;},html(h){const e=this._get();if(e)e.innerHTML=h;return this;}};
function showTip(html,ev){const vw=window.innerWidth;const tx=ev.clientX+14;const offset=tx+260>vw?ev.clientX-270:tx;tip.style("opacity","1").html(html).style("left",offset+"px").style("top",(ev.clientY-10)+"px")}
function hideTip(){tip.style("opacity","0")}
const fmtV=v=>v>=1e6?`$${(v/1e6).toFixed(1)}B`:v>=1e3?`$${(v/1e3).toFixed(1)}M`:`$${v.toFixed(0)}K`;
function srColor(sr){return SR_COLORS[sr]||"#9ca3af"}
function srColorSR(stage,role){return SR_COLORS[stage+"|"+role]||"#9ca3af"}

function drawDendrite(){
  const c0=c();
  document.getElementById("den-title").textContent=c0.tech+" Process of Production";
  const denMeta=document.getElementById("den-meta"); if(denMeta) denMeta.textContent=`Node size ∝ ${tlMode} · SR palette`;
  const svg=d3.select("#den-svg");svg.selectAll("*").remove();
  const W=document.getElementById("pane-den").clientWidth||460;
  const H=document.getElementById("pane-den").clientHeight-36||250;
  svg.attr("viewBox",`0 0 ${W} ${H}`);
  svg.append("rect").attr("width",W).attr("height",H).attr("fill","transparent");

  const edges=c0.den_edges||[];
  const keyPvs=(c0.product_views||[]).filter(pv=>!pv.code.startsWith("STAGE:")&&!pv.code.startsWith("ROLE:")&&pv.code!=="ALL");
  const keyCodes=new Set(keyPvs.map(pv=>pv.code));
  const selCode=selProduct!=="ALL"?selProduct:null;

  if(!edges.length){svg.append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle").attr("fill","rgba(255,255,255,.25)").attr("font-size","11").text("No dendrite data");return;}

  const pad={top:30,bottom:30};
  const prodCatMap=new Map([...(c0.den_products||[]),...(c0.all_products||[])].map(p=>[p.code,p.cat||"Other"]));
  const nodeMap=new Map();
  edges.forEach(e=>{
    if(!nodeMap.has(e.fcn)) nodeMap.set(e.fcn,{cn:e.fcn,code:e.fc,name:e.fn,stage:e.fs,role:e.fr,cat:prodCatMap.get(e.fc)||"Other"});
    if(!nodeMap.has(e.tcn)) nodeMap.set(e.tcn,{cn:e.tcn,code:e.tc,name:e.tn,stage:e.ts,role:e.tr,cat:prodCatMap.get(e.tc)||"Other"});
  });
  const allNodes=[...nodeMap.values()];
  const stepMap=new Map();
  allNodes.forEach(n=>stepMap.set(n.cn,0));
  let changed=true;
  for(let i=0;i<25&&changed;i++){
    changed=false;
    edges.forEach(e=>{
      const ts=stepMap.get(e.tcn)||0,fs=stepMap.get(e.fcn)||0;
      if(fs<ts+1){stepMap.set(e.fcn,ts+1);changed=true;}
    });
  }
  const maxStep=Math.max(...stepMap.values());
  const displayLv=s=>maxStep-s;
  const stepToX=s=>W*0.08+(W*0.84)*displayLv(s)/(maxStep||1);
  const stepBuckets={};
  allNodes.forEach(n=>{
    const s=stepMap.get(n.cn)||0;
    if(!stepBuckets[s]) stepBuckets[s]=[];
    stepBuckets[s].push(n);
  });
  Object.values(stepBuckets).forEach(ns=>{
    ns.sort((a,b)=>{
      const ak=(selCode&&a.code===selCode)?-2:(keyCodes.has(a.code)?-1:0);
      const bk=(selCode&&b.code===selCode)?-2:(keyCodes.has(b.code)?-1:0);
      return ak-bk||a.name.localeCompare(b.name);
    });
  });
  const nodeY=new Map();
  Object.entries(stepBuckets).forEach(([s,ns])=>{
    const avail=H-pad.top-pad.bottom;
    const step=avail/ns.length;
    ns.forEach((n,i)=>nodeY.set(n.cn,pad.top+step*(i+0.5)));
  });
  for(let s=0;s<=maxStep;s++){
    const lv=displayLv(s);
    svg.append("text").attr("x",stepToX(s)).attr("y",H-3).attr("text-anchor","middle")
      .attr("font-size","6").attr("fill","rgba(255,255,255,.18)").attr("font-weight","600")
      .text(lv===maxStep?`${maxStep}`:lv===0?"0":`${lv}`);
  }
  const edgeG=svg.append("g");
  edges.forEach(e=>{
    const fn=nodeMap.get(e.fcn),tn=nodeMap.get(e.tcn);
    if(!fn||!tn) return;
    const x1=stepToX(stepMap.get(fn.cn)||0),y1=nodeY.get(fn.cn)||H/2;
    const x2=stepToX(stepMap.get(tn.cn)||0),y2=nodeY.get(tn.cn)||H/2;
    const isSelE=selCode&&(e.fc===selCode||e.tc===selCode);
    const isKeyE=!isSelE&&(keyCodes.has(e.fc)||keyCodes.has(e.tc));
    const col=isSelE?"rgba(255,255,255,.8)":isKeyE?"rgba(255,255,255,.45)":"rgba(255,255,255,.18)";
    const sw=isSelE?1.6:isKeyE?1.0:0.5;
    edgeG.append("line").attr("x1",x1).attr("y1",y1).attr("x2",x2).attr("y2",y2)
      .attr("stroke",col).attr("stroke-width",sw);
  });
  const tvFn=p=>tlMode==="imports"?(p.imp||0):tlMode==="balance"?Math.abs((p.exp||0)-(p.imp||0)):(p.exp||0);
  const tradeMap=new Map((c0.den_products||[]).map(p=>[p.code,tvFn(p)]));
  const maxTV=d3.max([...tradeMap.values()])||1;
  const rBase=d3.scaleSqrt().domain([0,maxTV]).range([5,14]);
  const hasDenFilter=selStage!=="ALL"||selRole!=="ALL"||!!selCode||selCat!=="ALL";
  const selCodeNode=selCode?allNodes.find(n=>n.code===selCode):null;
  const isDenGroupActive=n=>{
    if(!hasDenFilter) return true;
    if(selCat!=="ALL"&&(n.cat||"Other")!==selCat) return false;
    if(selCodeNode) return n.stage===selCodeNode.stage&&n.role===selCodeNode.role;
    if(selStage!=="ALL"&&selRole!=="ALL") return n.stage===selStage&&n.role===selRole;
    if(selRole!=="ALL") return n.role===selRole;
    if(selStage!=="ALL") return n.stage===selStage;
    return true;
  };
  const nodeG=svg.append("g");
  const labelItems=[];
  allNodes.forEach(n=>{
    const x=stepToX(stepMap.get(n.cn)||0),y=nodeY.get(n.cn)||H/2;
    const isSel=selCode&&n.code===selCode;
    const isKey=keyCodes.has(n.code);
    const active=isDenGroupActive(n);
    const tv=tradeMap.get(n.code)||0;
    const srCol=nodeColor(n.stage+"|"+n.role,n.cat);
    // Brighten for stage/role selection; keep SR color for product group; brighter still for selected node
    const col=isSel?d3.color(srCol).brighter(0.7).formatHex():
              (hasDenFilter&&!selCodeNode&&active)?d3.color(srCol).brighter(0.5).formatHex():srCol;
    const r=isSel?Math.max(rBase(tv),10):(isKey?Math.max(rBase(tv),8):Math.max(rBase(tv)*0.65,3));
    const op=!hasDenFilter?(isKey?0.9:0.7):isSel?1:active?0.88:0.15;
    const pv=(c0.den_products||[]).find(p=>p.code===n.code);
    nodeG.append("circle").attr("cx",x).attr("cy",y).attr("r",r)
      .attr("fill",col).attr("stroke",active?"rgba(0,0,0,.35)":"rgba(0,0,0,.2)")
      .attr("stroke-width",isKey?1.2:0.5).attr("opacity",op)
      .on("mousemove",ev=>showTip(
        `<strong>${n.name}</strong><br>HS ${n.code}<br>${n.stage} · ${n.role}`+
        (pv?`<br>Imp: ${fmtV(pv.imp)} | Exp: ${fmtV(pv.exp)}`:""),ev))
      .on("mouseleave",hideTip);
    if(isSel){
      nodeG.append("circle").attr("cx",x).attr("cy",y).attr("r",r+4)
        .attr("fill","none").attr("stroke","#fff").attr("stroke-width",2.2).attr("opacity",1)
        .attr("pointer-events","none");
    }
  }); // no text labels or dashed lines — nodes speak for themselves
}

const D3_CDNS=["https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js",
                "https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js",
                "https://d3js.org/d3.v7.min.js"];
function safeDraw(){
  // Use requestAnimationFrame so layout is complete before measuring clientHeight
  requestAnimationFrame(()=>{
    // Ensure pane-den has a valid height before drawDendrite measures it
    const el=document.getElementById("pane-den");
    if(el&&el.clientHeight<=0){
      el.style.height=(window.innerHeight-document.getElementById("module-header").offsetHeight)+"px";
    }
    drawDendrite();
  });
}
function loadD3(idx){
  if(idx>=D3_CDNS.length){return;}
  const s=document.createElement("script");
  s.src=D3_CDNS[idx];
  s.onload=()=>{safeDraw();window.addEventListener("resize",drawDendrite);};
  s.onerror=()=>loadD3(idx+1);
  document.head.appendChild(s);
}
loadD3(0);
</script>
</body>
</html>
