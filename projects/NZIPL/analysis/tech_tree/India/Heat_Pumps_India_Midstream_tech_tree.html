<script>
const ALL_CASES=[{tech:"Heat Pumps",color:"#f97316",focal:"IND",den_edges:[{"fcn":"841861 Heat Pump","tcn":"841581 Air Conditioner (w Heat Pump","fc":"841861","tc":"841581","fn":"Heat Pump","tn":"Air Conditioner (w Heat Pump)","fs":"Final Product","ts":"Final Product","fr":"Final Product","tr":"Final Product"},{"fcn":"841899 Miscellaneous Heat Pump Comp","tcn":"841861 Heat Pump","fc":"841899","tc":"841861","fn":"Miscellaneous Heat Pump Componen","tn":"Heat Pump","fs":"Downstream","ts":"Final Product","fr":"Product Component","tr":"Final Product"},{"fcn":"846241 Sheet Metal Box Encasement P","tcn":"841861 Heat Pump","fc":"846241","tc":"841861","fn":"Sheet Metal Box Encasement Produ","tn":"Heat Pump","fs":"Downstream","ts":"Final Product","fr":"Process Equipment","tr":"Final Product"},{"fcn":"846241 Sheet Metal Box Encasement P","tcn":"841861 Heat Pump","fc":"846241","tc":"841861","fn":"Sheet Metal Box Encasement Produ","tn":"Heat Pump","fs":"Downstream","ts":"Final Product","fr":"Process Equipment","tr":"Final Product"},{"fcn":"846229 Sheet Metal Box Encasement P","tcn":"841861 Heat Pump","fc":"846229","tc":"841861","fn":"Sheet Metal Box Encasement Produ","tn":"Heat Pump","fs":"Downstream","ts":"Final Product","fr":"Process Equipment","tr":"Final Product"},{"fcn":"841430 Reciprocating Compressors","tcn":"841861 Heat Pump","fc":"841430","tc":"841861","fn":"Reciprocating Compressors","tn":"Heat Pump","fs":"Downstream","ts":"Final Product","fr":"Product Component","tr":"Final Product"},{"fcn":"841410 Air Pumps","tcn":"841861 Heat Pump","fc":"841410","tc":"841861","fn":"Air Pumps","tn":"Heat Pump","fs":"Downstream","ts":"Final Product","fr":"Product Component","tr":"Final Product"},{"fcn":"841381 Liquid Pumps","tcn":"841861 Heat Pump","fc":"841381","tc":"841861","fn":"Liquid Pumps","tn":"Heat Pump","fs":"Downstream","ts":"Final Product","fr":"Product Component","tr":"Final Product"},{"fcn":"841490 Fans","tcn":"841861 Heat Pump","fc":"841490","tc":"841861","fn":"Fans","tn":"Heat Pump","fs":"Downstream","ts":"Final Product","fr":"Product Component","tr":"Final Product"},{"fcn":"841590 Condenser Coil / Evaporator ","tcn":"841861 Heat Pump","fc":"841590","tc":"841861","fn":"Condenser Coil / Evaporator Coil","tn":"Heat Pump","fs":"Midstream","ts":"Final Product","fr":"Product Component","tr":"Final Product"},{"fcn":"851521 Condenser and Evaporator Tub","tcn":"841590 Condenser Coil / Evaporator ","fc":"851521","tc":"841590","fn":"Condenser and Evaporator Tube Pr","tn":"Condenser Coil / Evaporator Coil","fs":"Downstream","ts":"Midstream","fr":"Process Equipment","tr":"Product Component"},{"fcn":"846229 Condenser and Evaporator Tub","tcn":"851521 Condenser and Evaporator Tub","fc":"846229","tc":"851521","fn":"Condenser and Evaporator Tube Pr","tn":"Condenser and Evaporator Tube Pr","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"741110 Evaporator Coil; Copper Tubi","tcn":"846229 Condenser and Evaporator Tub","fc":"741110","tc":"846229","fn":"Evaporator Coil; Copper Tubing","tn":"Condenser and Evaporator Tube Pr","fs":"Midstream","ts":"Downstream","fr":"Product Component","tr":"Process Equipment"},{"fcn":"846150 Tube Production; Tube Cuttin","tcn":"741110 Evaporator Coil; Copper Tubi","fc":"846150","tc":"741110","fn":"Tube Production; Tube Cutting","tn":"Evaporator Coil; Copper Tubing","fs":"Midstream","ts":"Midstream","fr":"Process Equipment","tr":"Product Component"},{"fcn":"820720 Tube Production; Dies for Tu","tcn":"846150 Tube Production; Tube Cuttin","fc":"820720","tc":"846150","fn":"Tube Production; Dies for Tube E","tn":"Tube Production; Tube Cutting","fs":"Midstream","ts":"Midstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"740313 Copper Billets Unwrought; Co","tcn":"820720 Tube Production; Dies for Tu","fc":"740313","tc":"820720","fn":"Copper Billets Unwrought; Copper","tn":"Tube Production; Dies for Tube E","fs":"Midstream","ts":"Midstream","fr":"Processed Material","tr":"Process Equipment"},{"fcn":"740110 Copper Mattes","tcn":"740313 Copper Billets Unwrought; Co","fc":"740110","tc":"740313","fn":"Copper Mattes","tn":"Copper Billets Unwrought; Copper","fs":"Midstream","ts":"Midstream","fr":"Processed Material","tr":"Processed Material"},{"fcn":"260300 Copper Ore","tcn":"740110 Copper Mattes","fc":"260300","tc":"740110","fn":"Copper Ore","tn":"Copper Mattes","fs":"Upstream","ts":"Midstream","fr":"Raw Material","tr":"Processed Material"},{"fcn":"760820 Evaporator Coil; Aluminum Tu","tcn":"846229 Condenser and Evaporator Tub","fc":"760820","tc":"846229","fn":"Evaporator Coil; Aluminum Tubing","tn":"Condenser and Evaporator Tube Pr","fs":"Midstream","ts":"Downstream","fr":"Product Component","tr":"Process Equipment"},{"fcn":"846150 Tube Production; Tube Cuttin","tcn":"760820 Evaporator Coil; Aluminum Tu","fc":"846150","tc":"760820","fn":"Tube Production; Tube Cutting","tn":"Evaporator Coil; Aluminum Tubing","fs":"Midstream","ts":"Midstream","fr":"Process Equipment","tr":"Product Component"},{"fcn":"820720 Tube Production; Dies for Tu","tcn":"846150 Tube Production; Tube Cuttin","fc":"820720","tc":"846150","fn":"Tube Production; Dies for Tube E","tn":"Tube Production; Tube Cutting","fs":"Midstream","ts":"Midstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"760120 Alloyed Unwrought Aluminum","tcn":"820720 Tube Production; Dies for Tu","fc":"760120","tc":"820720","fn":"Alloyed Unwrought Aluminum","tn":"Tube Production; Dies for Tube E","fs":"Midstream","ts":"Midstream","fr":"Processed Material","tr":"Process Equipment"},{"fcn":"281820 Alumina","tcn":"760120 Alloyed Unwrought Aluminum","fc":"281820","tc":"760120","fn":"Alumina","tn":"Alloyed Unwrought Aluminum","fs":"Midstream","ts":"Midstream","fr":"Processed Material","tr":"Processed Material"},{"fcn":"260600 Bauxite Ore","tcn":"281820 Alumina","fc":"260600","tc":"281820","fn":"Bauxite Ore","tn":"Alumina","fs":"Upstream","ts":"Midstream","fr":"Raw Material","tr":"Processed Material"}],den_products:[{"code":"741110","name":"Evaporator Coil; Copper Tubing","stage":"Midstream","role":"Product Component","exp":56753,"imp":1100681},{"code":"841381","name":"Liquid Pumps","stage":"Downstream","role":"Product Component","exp":37582,"imp":75957},{"code":"841490","name":"Fans","stage":"Downstream","role":"Product Component","exp":490720,"imp":668878},{"code":"841590","name":"Evaporator","stage":"Downstream","role":"Product Component","exp":178982,"imp":459956},{"code":"281820","name":"Alumina","stage":"Midstream","role":"Processed Material","exp":880044,"imp":937920},{"code":"760120","name":"Alloyed Unwrought Aluminum","stage":"Midstream","role":"Processed Material","exp":1136921,"imp":813683},{"code":"760820","name":"Evaporator Coil; Aluminum Tubing","stage":"Midstream","role":"Product Component","exp":11494,"imp":63593},{"code":"820720","name":"Tube Extrusion; Dies for Drawing or Extr","stage":"Midstream","role":"Process Equipment","exp":20417,"imp":35851},{"code":"840290","name":"Heat Exchanger","stage":"Downstream","role":"Product Component","exp":63821,"imp":42154},{"code":"841410","name":"Air Pumps","stage":"Downstream","role":"Product Component","exp":26148,"imp":99186},{"code":"841430","name":"Reciprocating Compressors","stage":"Downstream","role":"Product Component","exp":186665,"imp":489986},{"code":"841899","name":"Miscellaneous Heat Pump Components","stage":"Downstream","role":"Product Component","exp":77333,"imp":123121},{"code":"846150","name":"Tube Production; Tube Cutting","stage":"Midstream","role":"Process Equipment","exp":12233,"imp":37994},{"code":"846229","name":"Sheet Metal Box Encasement Production; N","stage":"Downstream","role":"Process Equipment","exp":6821,"imp":78014},{"code":"853400","name":"Smart Controls; Electronic Printed Circu","stage":"Midstream","role":"Product Component","exp":125540,"imp":1428605},{"code":"251910","name":"Magnesium Ore","stage":"Upstream","role":"Raw Material","exp":123,"imp":357},{"code":"841581","name":"Air Conditioner (w Heat Pump)","stage":"Final Product","role":"Final Product","exp":7152,"imp":29991},{"code":"841861","name":"Heat Pump","stage":"Final Product","role":"Final Product","exp":3287,"imp":21051},{"code":"260600","name":"Bauxite Ore","stage":"Upstream","role":"Raw Material","exp":14185,"imp":348861},{"code":"260300","name":"Copper Ore","stage":"Upstream","role":"Raw Material","exp":47526,"imp":3991552},{"code":"740313","name":"Copper Billets Unwrought; Copper Tubing","stage":"Midstream","role":"Processed Material","exp":90793,"imp":18814},{"code":"260400","name":"Nickel Ore","stage":"Upstream","role":"Raw Material","exp":429,"imp":0},{"code":"261390","name":"Molybdenum Ore","stage":"Upstream","role":"Raw Material","exp":668,"imp":6677},{"code":"252921","name":"Refrigerant","stage":"Midstream","role":"Product Component","exp":483,"imp":11789}],product_views:[{"code":"STAGE:Midstream","label":"Midstream products","stage":"Midstream","role":"ALL","total_imp":9937536,"total_exp":6177423,"suppliers":[{"iso3":"IDN","name":"2850826.8","value":NA},{"iso3":"VNM","name":"1576669.4","value":NA},{"iso3":"AUS","name":"1541779.6","value":NA},{"iso3":"CHN","name":"1321288.1","value":NA},{"iso3":"MYS","name":"1157544.2","value":NA},{"iso3":"BHR","name":" 374460.6","value":NA},{"iso3":"QAT","name":" 368567.5","value":NA},{"iso3":"ARE","name":" 324517.9","value":NA},{"iso3":"KOR","name":" 258624.8","value":NA},{"iso3":"THA","name":" 163257.2","value":NA}],"buyers":[{"iso3":"OMN","name":"1687182.6","value":NA},{"iso3":"RUS","name":"1101554.7","value":NA},{"iso3":"ARE","name":" 764154.3","value":NA},{"iso3":"QAT","name":" 514342.1","value":NA},{"iso3":"MEX","name":" 473339.0","value":NA},{"iso3":"USA","name":" 402853.8","value":NA},{"iso3":"EGY","name":" 377026.3","value":NA},{"iso3":"BRA","name":" 329940.2","value":NA},{"iso3":"JPN","name":" 266258.8","value":NA},{"iso3":"KOR","name":" 260771.2","value":NA}],"timeline":[]}]}];
let currentIdx=0;
const c=()=>ALL_CASES[currentIdx];
let selStage="Midstream", selRole="ALL", selProduct="ALL";
let tlMode="exports", scMode="pct", sankeyFocus=null;

const SR_COLORS={
  "Upstream|Raw Material":"#b45309","Upstream|Processed Material":"#c17a2e",
  "Midstream|Processed Material":"#22c55e","Midstream|Process Equipment":"#65a30d",
  "Midstream|Product Component":"#16a34a","Downstream|Product Component":"#4ade80",
  "Downstream|Process Equipment":"#6b7280","Downstream|Final Product":"#f97316",
  "Final Product|Final Product":"#f97316","Other|Product Component":"#9ca3af",
  "Other|Process Equipment":"#9ca3af"
};
const SR_ORDER=["Upstream|Raw Material","Upstream|Processed Material","Midstream|Processed Material","Midstream|Process Equipment","Midstream|Product Component","Downstream|Product Component","Downstream|Process Equipment","Downstream|Final Product","Final Product|Final Product"];
const STAGE_COLORS={"Upstream":"#b45309","Midstream":"#22c55e","Downstream":"#4ade80","Final Product":"#f97316"};
const STAGES_ORDER=["Upstream","Midstream","Downstream","Final Product"];
const REGION_COLOR={EAP:"#0369a1",ECA:"#6366f1",SAS:"#10b981",NAC:"#f59e0b",LCN:"#ef4444",MEA:"#8b5cf6",SSF:"#84cc16"};
const PROD_COLORS=["#f59e0b","#38bdf8","#4ade80","#f87171","#c084fc","#fb923c","#a78bfa","#34d399","#f472b6","#60a5fa"];
const tip={_el:null,_get(){return this._el||(this._el=document.getElementById("tooltip"));},style(k,v){const e=this._get();if(e)e.style[k]=v;return this;},html(h){const e=this._get();if(e)e.innerHTML=h;return this;}};
function showTip(html,ev){const vw=window.innerWidth;const tx=ev.clientX+14;const offset=tx+260>vw?ev.clientX-270:tx;tip.style("opacity","1").html(html).style("left",offset+"px").style("top",(ev.clientY-10)+"px")}
function hideTip(){tip.style("opacity","0")}
const fmtV=v=>v>=1e6?`$${(v/1e6).toFixed(1)}B`:v>=1e3?`$${(v/1e3).toFixed(1)}M`:`$${v.toFixed(0)}K`;
function srColor(sr){return SR_COLORS[sr]||"#9ca3af"}
function srColorSR(stage,role){return SR_COLORS[stage+"|"+role]||"#9ca3af"}


function getPV() {
  const c0 = c();
  const pv = c0.selected_pv;
  if (pv) return pv;
  return c0.selected_pv || {code:"ALL",label:"All",stage:"ALL",role:"ALL",
    suppliers:[],buyers:[],timeline:[],total_imp:0,total_exp:0};
}

function drawDendrite(){
  const c0=c();
  document.getElementById("den-title").textContent=c0.tech+" Process of Production";
  const denMeta=document.getElementById("den-meta"); if(denMeta) denMeta.textContent=`Node size ∝ ${tlMode} · SR palette`;
  const svg=d3.select("#den-svg");svg.selectAll("*").remove();
  const W=document.getElementById("pane-den").clientWidth||460;
  const H=document.getElementById("pane-den").clientHeight-36||250;
  svg.attr("viewBox",`0 0 ${W} ${H}`);
  svg.append("rect").attr("width",W).attr("height",H).attr("fill","transparent");

  const edges=c0.den_edges||[];
  const keyPvs=(c0.product_views||[]).filter(pv=>!pv.code.startsWith("STAGE:")&&!pv.code.startsWith("ROLE:")&&pv.code!=="ALL");
  const keyCodes=new Set(keyPvs.map(pv=>pv.code));
  const selCode=selProduct!=="ALL"?selProduct:null;

  if(!edges.length){svg.append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle").attr("fill","rgba(255,255,255,.25)").attr("font-size","11").text("No dendrite data");return;}

  const pad={top:30,bottom:30};
  const nodeMap=new Map();
  edges.forEach(e=>{
    if(!nodeMap.has(e.fcn)) nodeMap.set(e.fcn,{cn:e.fcn,code:e.fc,name:e.fn,stage:e.fs,role:e.fr});
    if(!nodeMap.has(e.tcn)) nodeMap.set(e.tcn,{cn:e.tcn,code:e.tc,name:e.tn,stage:e.ts,role:e.tr});
  });
  const allNodes=[...nodeMap.values()];
  const stepMap=new Map();
  allNodes.forEach(n=>stepMap.set(n.cn,0));
  let changed=true;
  for(let i=0;i<25&&changed;i++){
    changed=false;
    edges.forEach(e=>{
      const ts=stepMap.get(e.tcn)||0,fs=stepMap.get(e.fcn)||0;
      if(fs<ts+1){stepMap.set(e.fcn,ts+1);changed=true;}
    });
  }
  const maxStep=Math.max(...stepMap.values());
  const displayLv=s=>maxStep-s;
  const stepToX=s=>W*0.08+(W*0.84)*displayLv(s)/(maxStep||1);
  const stepBuckets={};
  allNodes.forEach(n=>{
    const s=stepMap.get(n.cn)||0;
    if(!stepBuckets[s]) stepBuckets[s]=[];
    stepBuckets[s].push(n);
  });
  Object.values(stepBuckets).forEach(ns=>{
    ns.sort((a,b)=>{
      const ak=(selCode&&a.code===selCode)?-2:(keyCodes.has(a.code)?-1:0);
      const bk=(selCode&&b.code===selCode)?-2:(keyCodes.has(b.code)?-1:0);
      return ak-bk||a.name.localeCompare(b.name);
    });
  });
  const nodeY=new Map();
  Object.entries(stepBuckets).forEach(([s,ns])=>{
    const avail=H-pad.top-pad.bottom;
    const step=avail/ns.length;
    ns.forEach((n,i)=>nodeY.set(n.cn,pad.top+step*(i+0.5)));
  });
  for(let s=0;s<=maxStep;s++){
    const lv=displayLv(s);
    svg.append("text").attr("x",stepToX(s)).attr("y",H-3).attr("text-anchor","middle")
      .attr("font-size","6").attr("fill","rgba(255,255,255,.18)").attr("font-weight","600")
      .text(lv===maxStep?`${maxStep}`:lv===0?"0":`${lv}`);
  }
  const edgeG=svg.append("g");
  edges.forEach(e=>{
    const fn=nodeMap.get(e.fcn),tn=nodeMap.get(e.tcn);
    if(!fn||!tn) return;
    const x1=stepToX(stepMap.get(fn.cn)||0),y1=nodeY.get(fn.cn)||H/2;
    const x2=stepToX(stepMap.get(tn.cn)||0),y2=nodeY.get(tn.cn)||H/2;
    const isSelE=selCode&&(e.fc===selCode||e.tc===selCode);
    const isKeyE=!isSelE&&(keyCodes.has(e.fc)||keyCodes.has(e.tc));
    const col=isSelE?"rgba(255,255,255,.8)":isKeyE?"rgba(255,255,255,.45)":"rgba(255,255,255,.18)";
    const sw=isSelE?1.6:isKeyE?1.0:0.5;
    edgeG.append("line").attr("x1",x1).attr("y1",y1).attr("x2",x2).attr("y2",y2)
      .attr("stroke",col).attr("stroke-width",sw);
  });
  const tvFn=p=>tlMode==="imports"?(p.imp||0):tlMode==="balance"?Math.abs((p.exp||0)-(p.imp||0)):(p.exp||0);
  const tradeMap=new Map((c0.den_products||[]).map(p=>[p.code,tvFn(p)]));
  const maxTV=d3.max([...tradeMap.values()])||1;
  const rBase=d3.scaleSqrt().domain([0,maxTV]).range([5,14]);
  const hasDenFilter=selStage!=="ALL"||selRole!=="ALL"||!!selCode;
  const selCodeNode=selCode?allNodes.find(n=>n.code===selCode):null;
  const isDenGroupActive=n=>{
    if(!hasDenFilter) return true;
    if(selCodeNode) return n.stage===selCodeNode.stage&&n.role===selCodeNode.role;
    if(selStage!=="ALL"&&selRole!=="ALL") return n.stage===selStage&&n.role===selRole;
    if(selRole!=="ALL") return n.role===selRole;
    if(selStage!=="ALL") return n.stage===selStage;
    return true;
  };
  const nodeG=svg.append("g");
  const labelItems=[];
  allNodes.forEach(n=>{
    const x=stepToX(stepMap.get(n.cn)||0),y=nodeY.get(n.cn)||H/2;
    const isSel=selCode&&n.code===selCode;
    const isKey=keyCodes.has(n.code);
    const active=isDenGroupActive(n);
    const tv=tradeMap.get(n.code)||0;
    const srCol=SR_COLORS[n.stage+"|"+n.role]||"#9ca3af";
    // Brighten for stage/role selection; keep SR color for product group; brighter still for selected node
    const col=isSel?d3.color(srCol).brighter(0.7).formatHex():
              (hasDenFilter&&!selCodeNode&&active)?d3.color(srCol).brighter(0.5).formatHex():srCol;
    const r=isSel?Math.max(rBase(tv),10):(isKey?Math.max(rBase(tv),8):Math.max(rBase(tv)*0.65,3));
    const op=!hasDenFilter?(isKey?0.9:0.7):isSel?1:active?0.88:0.15;
    const pv=(c0.den_products||[]).find(p=>p.code===n.code);
    nodeG.append("circle").attr("cx",x).attr("cy",y).attr("r",r)
      .attr("fill",col).attr("stroke",active?"rgba(0,0,0,.35)":"rgba(0,0,0,.2)")
      .attr("stroke-width",isKey?1.2:0.5).attr("opacity",op)
      .on("mousemove",ev=>showTip(
        `<strong>${n.name}</strong><br>HS ${n.code}<br>${n.stage} · ${n.role}`+
        (pv?`<br>Imp: ${fmtV(pv.imp)} | Exp: ${fmtV(pv.exp)}`:""),ev))
      .on("mouseleave",hideTip);
    if(isSel){
      nodeG.append("circle").attr("cx",x).attr("cy",y).attr("r",r+4)
        .attr("fill","none").attr("stroke","#fff").attr("stroke-width",2.2).attr("opacity",1)
        .attr("pointer-events","none");
    }
  }); // no text labels or dashed lines — nodes speak for themselves
}
document.addEventListener("DOMContentLoaded",()=>{ drawDendrite(); });
window.addEventListener("resize",()=>{ drawDendrite(); });

</script>
