  allNodes.forEach(n=>{
    const s=stepMap.get(n.cn)||0;
    if(!stepBuckets[s]) stepBuckets[s]=[];
    stepBuckets[s].push(n);
  });
  Object.values(stepBuckets).forEach(ns=>{
    ns.sort((a,b)=>{
      const ak=(selCode&&a.code===selCode)?-2:(keyCodes.has(a.code)?-1:0);
      const bk=(selCode&&b.code===selCode)?-2:(keyCodes.has(b.code)?-1:0);
      return ak-bk||a.name.localeCompare(b.name);
    });
  });
  const nodeY=new Map();
  Object.entries(stepBuckets).forEach(([s,ns])=>{
    const avail=H-pad.top-pad.bottom;
    const step=avail/ns.length;
    ns.forEach((n,i)=>nodeY.set(n.cn,pad.top+step*(i+0.5)));
  });
  for(let s=0;s<=maxStep;s++){
    const lv=displayLv(s);
    svg.append("text").attr("x",stepToX(s)).attr("y",H-3).attr("text-anchor","middle")
      .attr("font-size","6").attr("fill","rgba(255,255,255,.18)").attr("font-weight","600")
      .text(lv===maxStep?`${maxStep}`:lv===0?"0":`${lv}`);
  }
  const edgeG=svg.append("g");
  edges.forEach(e=>{
    const fn=nodeMap.get(e.fcn),tn=nodeMap.get(e.tcn);
    if(!fn||!tn) return;
    const x1=stepToX(stepMap.get(fn.cn)||0),y1=nodeY.get(fn.cn)||H/2;
    const x2=stepToX(stepMap.get(tn.cn)||0),y2=nodeY.get(tn.cn)||H/2;
    const isSelE=selCode&&(e.fc===selCode||e.tc===selCode);
    const isKeyE=!isSelE&&(keyCodes.has(e.fc)||keyCodes.has(e.tc));
    const col=isSelE?"rgba(255,255,255,.8)":isKeyE?"rgba(255,255,255,.45)":"rgba(255,255,255,.18)";
    const sw=isSelE?1.6:isKeyE?1.0:0.5;
    edgeG.append("line").attr("x1",x1).attr("y1",y1).attr("x2",x2).attr("y2",y2)
      .attr("stroke",col).attr("stroke-width",sw);
  });
  const tvFn=p=>tlMode==="imports"?(p.imp||0):tlMode==="balance"?Math.abs((p.exp||0)-(p.imp||0)):(p.exp||0);
  const tradeMap=new Map((c0.den_products||[]).map(p=>[p.code,tvFn(p)]));
  const maxTV=d3.max([...tradeMap.values()])||1;
  const rBase=d3.scaleSqrt().domain([0,maxTV]).range([5,14]);
  const hasDenFilter=selStage!=="ALL"||selRole!=="ALL"||!!selCode;
  const selCodeNode=selCode?allNodes.find(n=>n.code===selCode):null;
  const isDenGroupActive=n=>{
    if(!hasDenFilter) return true;
    if(selCodeNode) return n.stage===selCodeNode.stage&&n.role===selCodeNode.role;
    if(selStage!=="ALL"&&selRole!=="ALL") return n.stage===selStage&&n.role===selRole;
    if(selRole!=="ALL") return n.role===selRole;
    if(selStage!=="ALL") return n.stage===selStage;
    return true;
  };
  const nodeG=svg.append("g");
  const labelItems=[];
  allNodes.forEach(n=>{
    const x=stepToX(stepMap.get(n.cn)||0),y=nodeY.get(n.cn)||H/2;
    const isSel=selCode&&n.code===selCode;
    const isKey=keyCodes.has(n.code);
    const active=isDenGroupActive(n);
    const tv=tradeMap.get(n.code)||0;
    const srCol=SR_COLORS[n.stage+"|"+n.role]||"#9ca3af";
    // Brighten for stage/role selection; keep SR color for product group; brighter still for selected node
    const col=isSel?d3.color(srCol).brighter(0.7).formatHex():
              (hasDenFilter&&!selCodeNode&&active)?d3.color(srCol).brighter(0.5).formatHex():srCol;
    const r=isSel?Math.max(rBase(tv),10):(isKey?Math.max(rBase(tv),8):Math.max(rBase(tv)*0.65,3));
    const op=!hasDenFilter?(isKey?0.9:0.7):isSel?1:active?0.88:0.15;
    const pv=(c0.den_products||[]).find(p=>p.code===n.code);
    nodeG.append("circle").attr("cx",x).attr("cy",y).attr("r",r)
      .attr("fill",col).attr("stroke",active?"rgba(0,0,0,.35)":"rgba(0,0,0,.2)")
      .attr("stroke-width",isKey?1.2:0.5).attr("opacity",op)
      .on("mousemove",ev=>showTip(
        `<strong>${n.name}</strong><br>HS ${n.code}<br>${n.stage} · ${n.role}`+
        (pv?`<br>Imp: ${fmtV(pv.imp)} | Exp: ${fmtV(pv.exp)}`:""),ev))
      .on("mouseleave",hideTip);
    if(isSel){
      nodeG.append("circle").attr("cx",x).attr("cy",y).attr("r",r+4)
        .attr("fill","none").attr("stroke","#fff").attr("stroke-width",2.2).attr("opacity",1)
        .attr("pointer-events","none");
    }
  }); // no text labels or dashed lines — nodes speak for themselves
}
document.addEventListener("DOMContentLoaded",()=>{ drawDendrite(); });
window.addEventListener("resize",()=>{ drawDendrite(); });

</script>
</body>
</html>
