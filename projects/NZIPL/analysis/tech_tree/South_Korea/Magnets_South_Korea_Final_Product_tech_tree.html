<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1520;
  font-family:"Archivo",-apple-system,"Segoe UI",sans-serif;color:#e2e8f0}
#module-wrap{width:100%;height:100%;display:flex;flex-direction:column}
#module-header{padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.06);

#tooltip{position:fixed;pointer-events:none;background:rgba(0,0,0,.88);color:#fff;

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
const ALL_CASES=[{tech:"Magnets",color:"#ec4899",focal:"KOR",den_edges:[{"fcn":"850519 Permanent Magnet Components","tcn":"850511 Permanent Magnets","fc":"850519","tc":"850511","fn":"Permanent Magnet Components","tn":"Permanent Magnets","fs":"Downstream","ts":"Final Product","fr":"Product Component","tr":"Final Product"},{"fcn":"854330 Electroplating; Electroplati","tcn":"850519 Permanent Magnet Components","fc":"854330","tc":"850519","fn":"Electroplating; Electroplating M","tn":"Permanent Magnet Components","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Product Component"},{"fcn":"283324 Nickel Sulfates","tcn":"854330 Electroplating; Electroplati","fc":"283324","tc":"854330","fn":"Nickel Sulfates","tn":"Electroplating; Electroplating M","fs":"Midstream","ts":"Downstream","fr":"Processed Material","tr":"Process Equipment"},{"fcn":"260400 Nickel Ores and Concentrates","tcn":"283324 Nickel Sulfates","fc":"260400","tc":"283324","fn":"Nickel Ores and Concentrates","tn":"Nickel Sulfates","fs":"Upstream","ts":"Midstream","fr":"Raw Material","tr":"Processed Material"},{"fcn":"845630 Thin Wire Electrode Cutting;","tcn":"854330 Electroplating; Electroplati","fc":"845630","tc":"854330","fn":"Thin Wire Electrode Cutting; Wir","tn":"Electroplating; Electroplating M","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"680421 Griding; Diamond Griding Whe","tcn":"845630 Thin Wire Electrode Cutting;","fc":"680421","tc":"845630","fn":"Griding; Diamond Griding Wheel","tn":"Thin Wire Electrode Cutting; Wir","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"847989 Pressing; Cold Isostatic Pre","tcn":"680421 Griding; Diamond Griding Whe","fc":"847989","tc":"680421","fn":"Pressing; Cold Isostatic Press","tn":"Griding; Diamond Griding Wheel","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"850590 Pressing; Magnetic Field Pre","tcn":"847989 Pressing; Cold Isostatic Pre","fc":"850590","tc":"847989","fn":"Pressing; Magnetic Field Press","tn":"Pressing; Cold Isostatic Press","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"847982 Compressed Air/gas grinding","tcn":"850590 Pressing; Magnetic Field Pre","fc":"847982","tc":"850590","fn":"Compressed Air/gas grinding","tn":"Pressing; Magnetic Field Press","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"854330 Decrepitation; Hydrogen Decr","tcn":"847982 Compressed Air/gas grinding","fc":"854330","tc":"847982","fn":"Decrepitation; Hydrogen Decrepit","tn":"Compressed Air/gas grinding","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"820720 Casting; Strip Caster","tcn":"854330 Decrepitation; Hydrogen Decr","fc":"820720","tc":"854330","fn":"Casting; Strip Caster","tn":"Decrepitation; Hydrogen Decrepit","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"851440 Induction Heating; Induction","tcn":"820720 Casting; Strip Caster","fc":"851440","tc":"820720","fn":"Induction Heating; Induction Fur","tn":"Casting; Strip Caster","fs":"Downstream","ts":"Downstream","fr":"Process Equipment","tr":"Process Equipment"},{"fcn":"760120 Aluminum Unwrought; Alloyed","tcn":"851440 Induction Heating; Induction","fc":"760120","tc":"851440","fn":"Aluminum Unwrought; Alloyed","tn":"Induction Heating; Induction Fur","fs":"Midstream","ts":"Downstream","fr":"Processed Material","tr":"Process Equipment"},{"fcn":"260120 Roasted Iron Pyrite","tcn":"851440 Induction Heating; Induction","fc":"260120","tc":"851440","fn":"Roasted Iron Pyrite","tn":"Induction Heating; Induction Fur","fs":"Upstream","ts":"Downstream","fr":"Raw Material","tr":"Process Equipment"},{"fcn":"261590 Niobium, Tantalum and Vanadi","tcn":"851440 Induction Heating; Induction","fc":"261590","tc":"851440","fn":"Niobium, Tantalum and Vanadium O","tn":"Induction Heating; Induction Fur","fs":"Upstream","ts":"Downstream","fr":"Raw Material","tr":"Process Equipment"},{"fcn":"284690 Compounds, Mixes of Rare-ear","tcn":"851440 Induction Heating; Induction","fc":"284690","tc":"851440","fn":"Compounds, Mixes of Rare-earths,","tn":"Induction Heating; Induction Fur","fs":"Midstream","ts":"Downstream","fr":"Processed Material","tr":"Process Equipment"},{"fcn":"280530 Rare-earth Metals, Scandium ","tcn":"851440 Induction Heating; Induction","fc":"280530","tc":"851440","fn":"Rare-earth Metals, Scandium and ","tn":"Induction Heating; Induction Fur","fs":"Midstream","ts":"Downstream","fr":"Processed Material","tr":"Process Equipment"}],den_products:[{"code":"847989","name":"Pressing; Cold Isostatic Press","stage":"Downstream","role":"Process Equipment","exp":4449644,"imp":1221319},{"code":"680421","name":"Griding; Diamond Griding Wheel","stage":"Downstream","role":"Process Equipment","exp":228145,"imp":28717},{"code":"760120","name":"Aluminum Unwrought; Alloyed","stage":"Midstream","role":"Processed Material","exp":765502,"imp":1174623},{"code":"820720","name":"Casting; Strip Caster","stage":"Downstream","role":"Process Equipment","exp":22020,"imp":17042},{"code":"847982","name":"Compressed Air/gas grinding","stage":"Downstream","role":"Process Equipment","exp":339171,"imp":175884},{"code":"850519","name":"Permanent Magnet Components","stage":"Downstream","role":"Product Component","exp":70485,"imp":58338},{"code":"850511","name":"Permanent Magnets","stage":"Final Product","role":"Final Product","exp":17301,"imp":153176},{"code":"851440","name":"Induction Heating; Induction Furnace","stage":"Downstream","role":"Process Equipment","exp":16717,"imp":11504},{"code":"284690","name":"Compounds, Mixes of Rare-earths, Yttrium","stage":"Midstream","role":"Processed Material","exp":26048,"imp":62035},{"code":"260300","name":"Copper Ore and Concentrate","stage":"Upstream","role":"Raw Material","exp":599702,"imp":4721271},{"code":"280530","name":"Rare-earth Metals, Scandium and Yttrium","stage":"Midstream","role":"Processed Material","exp":1006,"imp":9547},{"code":"283324","name":"Nickel Sulfates","stage":"Midstream","role":"Processed Material","exp":217059,"imp":80209},{"code":"720293","name":"Ferro-niobium","stage":"Midstream","role":"Processed Material","exp":3057,"imp":211863},{"code":"854330","name":"Decrepitation; Hydrogen Decrepitation Ma","stage":"Downstream","role":"Process Equipment","exp":83870,"imp":48154},{"code":"261590","name":"Niobium, Tantalum and Vanadium Ores and ","stage":"Upstream","role":"Raw Material","exp":2375,"imp":708},{"code":"260400","name":"Nickel Ores and Concentrates","stage":"Upstream","role":"Raw Material","exp":165,"imp":212269},{"code":"260600","name":"Bauxite Ore","stage":"Upstream","role":"Raw Material","exp":0,"imp":35167}],product_views:[{"code":"ROLE:Final Product","label":"Final Product","stage":"Final Product","role":"Final Product","total_imp":459527,"total_exp":49397,"suppliers":[{"iso3":"CHN","name":"402520.5630","value":NA},{"iso3":"PHL","name":" 49846.9530","value":NA},{"iso3":"JPN","name":"  2714.4345","value":NA},{"iso3":"USA","name":"  1997.7990","value":NA},{"iso3":"VNM","name":"  1035.2085","value":NA},{"iso3":"DEU","name":"   608.7060","value":NA},{"iso3":"ITA","name":"   508.8825","value":NA},{"iso3":"NLD","name":"   294.3360","value":NA}],"buyers":[{"iso3":"USA","name":"12740.133","value":NA},{"iso3":"MEX","name":"12026.592","value":NA},{"iso3":"VNM","name":"10141.311","value":NA},{"iso3":"IND","name":" 4531.882","value":NA},{"iso3":"CHN","name":" 3230.729","value":NA},{"iso3":"DEU","name":" 2341.213","value":NA},{"iso3":"JPN","name":" 2136.508","value":NA},{"iso3":"GBR","name":"  821.751","value":NA},{"iso3":"HKG","name":"  807.483","value":NA},{"iso3":"HUN","name":"  619.737","value":NA}],"timeline":[]}]}];
let currentIdx=0;
const c=()=>ALL_CASES[currentIdx];
let selStage="Final Product", selRole="Final Product", selProduct="ALL";
let tlMode="exports", scMode="pct", sankeyFocus=null;

const SR_COLORS={
  "Upstream|Raw Material":"#b45309","Upstream|Processed Material":"#c17a2e",
  "Midstream|Processed Material":"#22c55e","Midstream|Process Equipment":"#65a30d",
  "Midstream|Product Component":"#16a34a","Downstream|Product Component":"#4ade80",
  "Downstream|Process Equipment":"#6b7280","Downstream|Final Product":"#f97316",
  "Final Product|Final Product":"#f97316","Other|Product Component":"#9ca3af",
  "Other|Process Equipment":"#9ca3af"
};
const SR_ORDER=["Upstream|Raw Material","Upstream|Processed Material","Midstream|Processed Material","Midstream|Process Equipment","Midstream|Product Component","Downstream|Product Component","Downstream|Process Equipment","Downstream|Final Product","Final Product|Final Product"];
const STAGE_COLORS={"Upstream":"#b45309","Midstream":"#22c55e","Downstream":"#4ade80","Final Product":"#f97316"};
const STAGES_ORDER=["Upstream","Midstream","Downstream","Final Product"];
const REGION_COLOR={EAP:"#0369a1",ECA:"#6366f1",SAS:"#10b981",NAC:"#f59e0b",LCN:"#ef4444",MEA:"#8b5cf6",SSF:"#84cc16"};
const PROD_COLORS=["#f59e0b","#38bdf8","#4ade80","#f87171","#c084fc","#fb923c","#a78bfa","#34d399","#f472b6","#60a5fa"];
const tip={_el:null,_get(){return this._el||(this._el=document.getElementById("tooltip"));},style(k,v){const e=this._get();if(e)e.style[k]=v;return this;},html(h){const e=this._get();if(e)e.innerHTML=h;return this;}};
function showTip(html,ev){const vw=window.innerWidth;const tx=ev.clientX+14;const offset=tx+260>vw?ev.clientX-270:tx;tip.style("opacity","1").html(html).style("left",offset+"px").style("top",(ev.clientY-10)+"px")}
function hideTip(){tip.style("opacity","0")}
const fmtV=v=>v>=1e6?`$${(v/1e6).toFixed(1)}B`:v>=1e3?`$${(v/1e3).toFixed(1)}M`:`$${v.toFixed(0)}K`;
function srColor(sr){return SR_COLORS[sr]||"#9ca3af"}
function srColorSR(stage,role){return SR_COLORS[stage+"|"+role]||"#9ca3af"}


function getPV() {
  const c0 = c();
  const pv = c0.selected_pv;
  if (pv) return pv;
  return c0.selected_pv || {code:"ALL",label:"All",stage:"ALL",role:"ALL",
    suppliers:[],buyers:[],timeline:[],total_imp:0,total_exp:0};
}

function drawDendrite(){
  const c0=c();
  document.getElementById("den-title").textContent=c0.tech+" Process of Production";
  const denMeta=document.getElementById("den-meta"); if(denMeta) denMeta.textContent=`Node size ∝ ${tlMode} · SR palette`;
  const svg=d3.select("#den-svg");svg.selectAll("*").remove();
  const W=document.getElementById("pane-den").clientWidth||460;
  const H=document.getElementById("pane-den").clientHeight-36||250;
  svg.attr("viewBox",`0 0 ${W} ${H}`);
  svg.append("rect").attr("width",W).attr("height",H).attr("fill","transparent");

  const edges=c0.den_edges||[];
  const keyPvs=(c0.product_views||[]).filter(pv=>!pv.code.startsWith("STAGE:")&&!pv.code.startsWith("ROLE:")&&pv.code!=="ALL");
  const keyCodes=new Set(keyPvs.map(pv=>pv.code));
  const selCode=selProduct!=="ALL"?selProduct:null;

  if(!edges.length){svg.append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle").attr("fill","rgba(255,255,255,.25)").attr("font-size","11").text("No dendrite data");return;}

  const pad={top:30,bottom:30};
  const nodeMap=new Map();
  edges.forEach(e=>{
    if(!nodeMap.has(e.fcn)) nodeMap.set(e.fcn,{cn:e.fcn,code:e.fc,name:e.fn,stage:e.fs,role:e.fr});
    if(!nodeMap.has(e.tcn)) nodeMap.set(e.tcn,{cn:e.tcn,code:e.tc,name:e.tn,stage:e.ts,role:e.tr});
  });
  const allNodes=[...nodeMap.values()];
  const stepMap=new Map();
  allNodes.forEach(n=>stepMap.set(n.cn,0));
  let changed=true;
  for(let i=0;i<25&&changed;i++){
    changed=false;
    edges.forEach(e=>{
      const ts=stepMap.get(e.tcn)||0,fs=stepMap.get(e.fcn)||0;
      if(fs<ts+1){stepMap.set(e.fcn,ts+1);changed=true;}
    });
  }
  const maxStep=Math.max(...stepMap.values());
  const displayLv=s=>maxStep-s;
  const stepToX=s=>W*0.08+(W*0.84)*displayLv(s)/(maxStep||1);
  const stepBuckets={};
  allNodes.forEach(n=>{
    const s=stepMap.get(n.cn)||0;
    if(!stepBuckets[s]) stepBuckets[s]=[];
    stepBuckets[s].push(n);
  });
  Object.values(stepBuckets).forEach(ns=>{
    ns.sort((a,b)=>{
      const ak=(selCode&&a.code===selCode)?-2:(keyCodes.has(a.code)?-1:0);
      const bk=(selCode&&b.code===selCode)?-2:(keyCodes.has(b.code)?-1:0);
      return ak-bk||a.name.localeCompare(b.name);
    });
  });
  const nodeY=new Map();
  Object.entries(stepBuckets).forEach(([s,ns])=>{
    const avail=H-pad.top-pad.bottom;
    const step=avail/ns.length;
    ns.forEach((n,i)=>nodeY.set(n.cn,pad.top+step*(i+0.5)));
  });
  for(let s=0;s<=maxStep;s++){
    const lv=displayLv(s);
    svg.append("text").attr("x",stepToX(s)).attr("y",H-3).attr("text-anchor","middle")
      .attr("font-size","6").attr("fill","rgba(255,255,255,.18)").attr("font-weight","600")
      .text(lv===maxStep?`${maxStep}`:lv===0?"0":`${lv}`);
  }
  const edgeG=svg.append("g");
  edges.forEach(e=>{
    const fn=nodeMap.get(e.fcn),tn=nodeMap.get(e.tcn);
    if(!fn||!tn) return;
    const x1=stepToX(stepMap.get(fn.cn)||0),y1=nodeY.get(fn.cn)||H/2;
    const x2=stepToX(stepMap.get(tn.cn)||0),y2=nodeY.get(tn.cn)||H/2;
    const isSelE=selCode&&(e.fc===selCode||e.tc===selCode);
    const isKeyE=!isSelE&&(keyCodes.has(e.fc)||keyCodes.has(e.tc));
    const col=isSelE?"rgba(255,255,255,.8)":isKeyE?"rgba(255,255,255,.45)":"rgba(255,255,255,.18)";
    const sw=isSelE?1.6:isKeyE?1.0:0.5;
    edgeG.append("line").attr("x1",x1).attr("y1",y1).attr("x2",x2).attr("y2",y2)
      .attr("stroke",col).attr("stroke-width",sw);
  });
  const tvFn=p=>tlMode==="imports"?(p.imp||0):tlMode==="balance"?Math.abs((p.exp||0)-(p.imp||0)):(p.exp||0);
  const tradeMap=new Map((c0.den_products||[]).map(p=>[p.code,tvFn(p)]));
  const maxTV=d3.max([...tradeMap.values()])||1;
  const rBase=d3.scaleSqrt().domain([0,maxTV]).range([5,14]);
  const hasDenFilter=selStage!=="ALL"||selRole!=="ALL"||!!selCode;
  const selCodeNode=selCode?allNodes.find(n=>n.code===selCode):null;
  const isDenGroupActive=n=>{
    if(!hasDenFilter) return true;
    if(selCodeNode) return n.stage===selCodeNode.stage&&n.role===selCodeNode.role;
    if(selStage!=="ALL"&&selRole!=="ALL") return n.stage===selStage&&n.role===selRole;
    if(selRole!=="ALL") return n.role===selRole;
    if(selStage!=="ALL") return n.stage===selStage;
    return true;
  };
  const nodeG=svg.append("g");
  const labelItems=[];
  allNodes.forEach(n=>{
    const x=stepToX(stepMap.get(n.cn)||0),y=nodeY.get(n.cn)||H/2;
    const isSel=selCode&&n.code===selCode;
    const isKey=keyCodes.has(n.code);
    const active=isDenGroupActive(n);
    const tv=tradeMap.get(n.code)||0;
    const srCol=SR_COLORS[n.stage+"|"+n.role]||"#9ca3af";
    // Brighten for stage/role selection; keep SR color for product group; brighter still for selected node
    const col=isSel?d3.color(srCol).brighter(0.7).formatHex():
              (hasDenFilter&&!selCodeNode&&active)?d3.color(srCol).brighter(0.5).formatHex():srCol;
    const r=isSel?Math.max(rBase(tv),10):(isKey?Math.max(rBase(tv),8):Math.max(rBase(tv)*0.65,3));
    const op=!hasDenFilter?(isKey?0.9:0.7):isSel?1:active?0.88:0.15;
    const pv=(c0.den_products||[]).find(p=>p.code===n.code);
    nodeG.append("circle").attr("cx",x).attr("cy",y).attr("r",r)
      .attr("fill",col).attr("stroke",active?"rgba(0,0,0,.35)":"rgba(0,0,0,.2)")
      .attr("stroke-width",isKey?1.2:0.5).attr("opacity",op)
      .on("mousemove",ev=>showTip(
        `<strong>${n.name}</strong><br>HS ${n.code}<br>${n.stage} · ${n.role}`+
        (pv?`<br>Imp: ${fmtV(pv.imp)} | Exp: ${fmtV(pv.exp)}`:""),ev))
      .on("mouseleave",hideTip);
    if(isSel){
      nodeG.append("circle").attr("cx",x).attr("cy",y).attr("r",r+4)
        .attr("fill","none").attr("stroke","#fff").attr("stroke-width",2.2).attr("opacity",1)
        .attr("pointer-events","none");
    }
  }); // no text labels or dashed lines — nodes speak for themselves
}
document.addEventListener("DOMContentLoaded",()=>{ drawDendrite(); });
window.addEventListener("resize",()=>{ drawDendrite(); });

</script>
