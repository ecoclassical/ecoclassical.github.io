<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moved → Clean Supply Chain Navigator</title>
<!--
  Redirect stub, 2026-08-07.

  This page WAS the Supply Chain Navigator. The project consolidated its two
  navigators into one at navigator.html, and this file's content moved there.

  This stub exists because the URL has been live on ecoclassical.github.io since
  29dea6b and is linked from the deployed index — a 404 is worse than three lines.
  It is tracked in git (.gitignore carries an exemption for it) so a clone can
  deploy it without a build step.

  The query string is preserved by script, not by the meta refresh: a bare
  <meta http-equiv="refresh"> drops ?tech=&country=, which would silently land
  every existing bookmark on Solar × India instead of the pair it asked for.
  The meta tag is the no-JS fallback and is deliberately kept.
-->
<link rel="canonical" href="navigator.html">
<meta name="robots" content="noindex">
<meta http-equiv="refresh" content="0; url=navigator.html">
<script>
  location.replace('navigator.html' + location.search + location.hash);
</script>
<style>
  html{color-scheme:dark light}
  body{margin:0;min-height:100vh;display:grid;place-items:center;
       font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;
       background:#0b1410;color:#e8f0ea;text-align:center;padding:24px}
  a{color:#3cb54a}
  @media (prefers-color-scheme:light){body{background:#f6f8f6;color:#16261b}}
</style>
</head>
<body>
  <div>
    <p><strong>The Supply Chain Navigator has moved.</strong></p>
    <p>It is now the Clean Supply Chain Navigator at
       <a href="navigator.html">navigator.html</a>.</p>
  </div>
</body>
</html>
