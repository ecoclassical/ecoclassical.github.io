<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NZIPL panel</title>
<!--
  Single-panel embed of the data-driven engine (Option A). Renders ONE visual for
  one tech×country case using the shared viz.js — the report builder / module
  browser iframe this instead of a pre-rendered standalone panel.

  Params:  ?tech=<TechSlug>&country=<CountrySlug>&panel=<module>[&theme=light]
    tech    = case_registry tech slug (underscored, e.g. Heat_Pumps)
    country = case_registry country slug (e.g. India)
    panel   = report-builder module id (radar, pc_scatter, trade_timeline,
              trade_composition, trade_map, activity_map, sankey, tech_tree)
  Data:    data/<tech>_<country>.json  (+ data/_tech_<tech>.json for sankey/tree)
-->
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<script src="geo.js"></script>
<script src="viz.js"></script>
<style>
  html,body{margin:0;height:100%;background:#0a1218;color:#e2e8f0;
    font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;}
  body.light{background:#ffffff;color:#0f172a;}
  #stage{display:block;width:100vw;height:100vh;}
  #tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;z-index:9;
    background:rgba(10,18,15,.96);border:1px solid rgba(60,181,74,.3);border-radius:6px;
    padding:6px 9px;font-size:.72rem;color:#e2e8f0;max-width:260px;line-height:1.45;}
  .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:rgba(148,163,184,.7);font-size:.8rem;}
</style>
</head>
<body>
<svg id="stage"></svg>
<div id="tip"></div>
<script>
// module id -> draw closure (mirrors report.html's VISUALS, into a single #stage svg)
const DRAW = {
  radar:             (d,td)=>VIZ.radar('#stage', d.radar),
  pc_scatter:        (d,td)=>VIZ.scatter('#stage', d.scatter),
  trade_timeline:    (d,td)=>VIZ.timeline('#stage', (d.timeline||[]).filter(r=>r.flow==='exp')),
  trade_composition: (d,td)=>VIZ.treemap('#stage', d.products),
  trade_map:         (d,td)=>VIZ.map('#stage', d.partners, d.iso),
  activity_map:      (d,td)=>VIZ.firms('#stage', d.firms, d.iso),
  sankey:            (d,td)=>VIZ.sankey('#stage', td && td.sankey),
  tech_tree:         (d,td)=>VIZ.tree('#stage', td && td.tree),
  solar_system:      (d,td)=>VIZ.solarsystem('#stage', td && td.tree),
};
// engine-native aliases, so ?panel=scatter also works
const ALIAS = { scatter:'pc_scatter', timeline:'trade_timeline', treemap:'trade_composition',
                map:'trade_map', firms:'activity_map', tree:'tech_tree',
                solarsystem:'solar_system', orrery:'solar_system' };

function msg(t){ document.getElementById('stage').innerHTML =
  '<text x="50%" y="50%" text-anchor="middle" fill="rgba(148,163,184,.7)" font-size="12">'+t+'</text>'; }

async function boot(){
  const p = new URLSearchParams(location.search);
  const tech = (p.get('tech')||'Solar');
  const country = (p.get('country')||'India');
  let panel = (p.get('panel')||'radar'); if(ALIAS[panel]) panel = ALIAS[panel];
  if(p.get('theme')==='light') document.body.classList.add('light');
  VIZ.setTheme(p.get('theme')==='light' ? 'light' : 'dark');
  const draw = DRAW[panel];
  if(!draw){ return msg('unknown panel: '+panel); }

  // geo (inlined for file://; fetch fallback) — needed for trade_map / activity_map
  try{ VIZ.initGeo(window.__WORLD110 || await (await fetch('../lib/countries-110m.json')).json()); }catch(e){ console.warn('geo',e); }

  const id = tech.replace(/ /g,'_')+'_'+country;
  let d; try{ d = await (await fetch('data/'+id+'.json')).json(); }
  catch(e){ return msg('no data for '+id); }
  d = Array.isArray(d) ? d[0] : d;

  let td = null;
  if(panel==='sankey' || panel==='tech_tree' || panel==='solar_system'){
    try{ td = await (await fetch('data/_tech_'+tech.replace(/ /g,'_')+'.json')).json(); td = Array.isArray(td)?td[0]:td; }
    catch(e){ td = null; }
  }

  const render = ()=>{ try{ draw(d,td); }catch(e){ console.warn('draw',panel,e); msg('render error'); } };
  render();
  let rt; window.addEventListener('resize', ()=>{ clearTimeout(rt); rt=setTimeout(render,150); });
}
boot();
</script>
</body>
</html>
