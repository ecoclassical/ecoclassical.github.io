<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clean Supply Chain Atlas Navigator</title>
<!--
  navigator.html — the Clean Supply Chain Atlas Navigator.
  (Renamed 2026-07-30 from integrated_explorer.html / "Integrated Explorer".
   Its numeric companion is data_explorer.html, the Clean Supply Chain Data Explorer.
   It navigates ACROSS the per-country atlas sheets in analysis/atlas/, hence "Atlas".)

  A single integrated visual fusing three atlas panes into one:
    ① focal-centered world map           (cockpit zoom on the focus country)
    ② domestic S&P firm activity INSIDE the focus country
    ③ external trade arrows to top import sources / export destinations,
       clamped to the map edge at the partner's true bearing
    ④ the process-of-production dendrite, radiating from the focal centroid,
       acting as the product NAVIGATOR (click a node to walk the supply chain)

  Navigation:
    • click a country on the map      → refocus there (reloads that case)
    • click a dendrite node           → select that product (highlights firms/edges)
    • tech dropdown                   → switch technology

  Params: ?tech=<TechSlug>&country=<CountrySlug>   (default Solar / India)

  PHASE 1 CAVEAT: trade arrows use the engine's TECH-LEVEL `partners` list.
  Per-product arrows need the proto builder to nest partners per product
  (Phase 2). Firms are focal-7 only and tagged by stage·role (not HS code).

  Reuses the shared engine core (geo.js + viz.js): VIZ.baseMap / centroids /
  feats / ISO3N / SR / fmtV — no duplicated geo tables.
-->
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<script src="geo.js"></script>
<script src="viz.js"></script>
<style>
  :root{ --bg:#0a1218; --ink:#e2e8f0; --faint:rgba(226,232,240,.6); --line:rgba(255,255,255,.1);
         --panel:rgba(10,18,15,.82); --accent:#3cb54a; --panel-w:300px; --panel-h:440px;
         --nav-w:360px; --nav-h:396px;
         /* LEFT stack: every panel exactly 255px = 85% of the old 300px --panel-w */
         --stack-w:255px;
         /* RIGHT stack: the drum/dendrite column keeps its existing --nav-w width */
         --stack-r-w:var(--nav-w);
         --pnl-hd-h:28px; --pnl-anim:200ms; }
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
    font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  /* the map now owns the FULL viewport — the old fixed 144px top bar is gone, its contents
     live in the two collapsible overlay stacks (#lstack / #rstack) instead */
  #split{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;}
  #left{position:relative;flex:1;min-width:0;}   /* globe/map now spans the full width */
  /* map-mode + firm toggles: bottom-left corner of the globe panel */
  #left #mapmode,#left #firmtoggle{position:absolute;left:14px;z-index:4;
    background:#0e1a22;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 11px;
    font:inherit;font-size:.76rem;cursor:pointer;white-space:nowrap;backdrop-filter:blur(3px);}
  #left #mapmode{bottom:50px;}
  #left #firmtoggle{bottom:12px;}
  #left #mapmode:hover,#left #firmtoggle:hover{border-color:var(--accent);color:#fff;}
  #left #firmtoggle.off{opacity:.55;}
  #stage{display:block;width:100%;height:100%;}
  /* ── collapsible overlay panel stacks ──────────────────────────────────────────
     Two vertical columns of panels floating over the full-bleed map. The stack itself is
     pointer-transparent so the gaps between panels stay clickable on the map; each .pnl
     re-enables pointer events for itself. */
  .stack{position:fixed;top:14px;z-index:6;display:flex;flex-direction:column;gap:8px;
    pointer-events:none;overflow-y:auto;scrollbar-width:none;}
  .stack::-webkit-scrollbar{display:none;}
  #lstack{left:16px;width:var(--stack-w);max-height:calc(100vh - 28px);}
  #rstack{right:16px;width:var(--stack-r-w);max-height:calc(100vh - 52px);}
  .pnl{pointer-events:auto;flex:0 0 auto;background:rgba(6,13,8,.93);
    border:1px solid rgba(60,181,74,.2);border-radius:8px;backdrop-filter:blur(3px);overflow:hidden;}
  /* header stub — ALWAYS visible, even when the panel is shut (that is how you get it back) */
  .pnl-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;
    height:var(--pnl-hd-h);min-height:var(--pnl-hd-h);padding:0 12px;margin:0;box-sizing:border-box;
    background:transparent;border:0;border-radius:8px;font-family:inherit;color:var(--ink);
    cursor:pointer;text-align:left;}
  .pnl-hd:hover{background:rgba(60,181,74,.08);}
  .pnl-hd:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .pnl-t{font-size:.78rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chev{flex-shrink:0;font-size:.72rem;color:var(--faint);transition:transform var(--pnl-anim) ease;}
  .pnl.pnl-closed .chev{transform:rotate(-90deg);}
  .pnl.pnl-closed .pnl-hd{border-bottom:0;}
  .pnl-bd{overflow:hidden;max-height:var(--bh,420px);opacity:1;
    transition:max-height var(--pnl-anim) ease,opacity calc(var(--pnl-anim) - 30ms) ease;}
  .pnl.pnl-closed .pnl-bd{max-height:0;opacity:0;}
  .pnl-in{box-sizing:border-box;max-height:var(--bh,420px);overflow-y:auto;overflow-x:hidden;
    padding:2px 12px 10px;scrollbar-width:thin;}
  .pnl-in::-webkit-scrollbar{width:6px;}
  .pnl-in::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:3px;}
  .pnl.pnl-noanim .pnl-bd,.pnl.pnl-noanim .chev{transition:none;}
  @media (prefers-reduced-motion:reduce){
    .pnl-bd,.chev{transition:none;}
  }
  /* the fixed (never-collapsible) title panel at the head of the left stack.
     HORIZONTAL split: brand identity on the left, the tech/country/year readout on the right,
     separated by a 1px rule that runs the full height of the taller column (align-items:stretch
     + border-left on the right half). The Data Explorer link sits under the brand, occupying the
     slack the shorter left column would otherwise waste — so the panel stays 3 text lines tall. */
  #p-title{padding:9px 12px 10px;}
  #p-title .title-split{display:flex;align-items:stretch;gap:9px;}
  #p-title .brand-2l{flex:0 0 auto;}
  #p-title #bar-title{flex:1 1 0;min-width:0;border-left:1px solid rgba(255,255,255,.14);
    padding-left:9px;display:flex;flex-direction:column;justify-content:center;}

  /* Supply Chain Map (formerly "Process of Production") — bottom of the right stack, two view modes */
  .nav-toggle{display:flex;gap:4px;margin:2px 0 3px;}
  .nav-mode-btn{padding:2px 9px;border:1px solid rgba(255,255,255,.1);border-radius:8px;background:transparent;
    cursor:pointer;color:rgba(255,255,255,.45);font-size:.62rem;font-family:inherit;transition:all .12s;}
  .nav-mode-btn.active{background:rgba(60,181,74,.15);border-color:var(--accent);color:var(--accent);font-weight:600;}
  #nav-hd-sub{display:block;font-size:.63rem;color:var(--faint);margin-bottom:4px;line-height:1.35;}
  #nav{display:block;width:100%;height:var(--nav-svg-h,286px);cursor:default;}

  /* cross-link to the numeric companion (data_explorer.html) */
  .de-link{flex-shrink:0;padding:3px 7px;border-radius:4px;
           background:rgba(255,255,255,.13);color:#dfe8ee;text-decoration:none;
           font-size:.56rem;font-weight:700;letter-spacing:.3px;text-transform:uppercase;
           border:1px solid rgba(255,255,255,.18);white-space:nowrap;align-self:flex-start;}
  .de-link:hover{background:var(--accent);color:#04210a;border-color:var(--accent);}
  /* two-line brand at the head of the left stack: CLEAN SUPPLY CHAIN / ATLAS NAVIGATOR
     (the product name stays on ONE line — it is a name, not two words to be stacked) */
  .brand-2l{display:flex;flex-direction:column;white-space:nowrap;line-height:1.15;flex-shrink:0;gap:1px;}
  .brand-2l .l1{font-size:.58rem;font-weight:700;letter-spacing:.4px;color:var(--accent);text-transform:uppercase;}
  .brand-2l .l2{font-size:.8rem;font-weight:800;letter-spacing:.2px;color:#fff;text-transform:uppercase;}
  .brand-2l .de-link{margin-top:6px;}
  /* tech + country selectors (row 1, side by side) + year slider (row 2, value at the right) */
  .tcy-block{display:flex;flex-direction:column;gap:8px;padding-top:5px;}
  .tcy-row1{display:flex;align-items:center;gap:10px;}
  .tcy-item{display:flex;flex-direction:column;gap:3px;flex:1 1 0;min-width:0;}
  .tcy-item select{width:100%;}
  .tcy-lab{font-size:.55rem;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);flex-shrink:0;}
  .tcy-row2{display:flex;align-items:center;gap:8px;}
  .tcy-row2 .yr-track{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .yr-lab{font-size:.55rem;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);flex-shrink:0;}
  .yr-val{font-size:.92rem;font-weight:800;color:var(--ink);flex-shrink:0;min-width:2.4em;
    text-align:right;align-self:flex-end;line-height:1.4;}
  #year-slider{width:100%;min-width:0;accent-color:var(--accent);cursor:pointer;}
  /* year playback: ▶ steps the slider forward one year per PLAY_MS, ⏸ stops it */
  .yr-play{flex:0 0 auto;width:24px;height:24px;padding:0;display:flex;align-items:center;
    justify-content:center;background:#0e1a22;color:var(--ink);border:1px solid var(--line);
    border-radius:50%;font:inherit;font-size:.68rem;line-height:1;cursor:pointer;align-self:flex-end;
    margin-bottom:1px;transition:color .12s,border-color .12s,background .12s;}
  .yr-play:hover{border-color:var(--accent);color:#fff;}
  .yr-play:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .yr-play.playing{border-color:var(--accent);color:var(--accent);background:rgba(60,181,74,.15);}
  /* atlas-style tech/country/year reference readout — right half of the fixed title panel.
     Each line is independently nowrap/ellipsis; fitBarTitle() (JS) shrinks the tech and country
     type just enough for long names (Electrolyzers, UNITED KINGDOM) to fit the narrow column. */
  #bar-title{line-height:1.22;white-space:nowrap;overflow:hidden;}
  #bar-title>div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #bar-title .tech{font-size:1.2rem;font-weight:800;letter-spacing:.2px;}
  #bar-title .country{font-size:.78rem;font-weight:700;letter-spacing:.6px;color:var(--ink);text-transform:uppercase;}
  #bar-title .year{font-size:.74rem;font-weight:600;letter-spacing:.4px;color:var(--faint);}
  /* ── Selection text: its own collapsible panel, directly BELOW the drums that produce it and
     ABOVE the (stable, reference-only) legend. Text is colored with the atlas's own SR/category
     palette, so the title itself signals what kind of thing (product / stage·role / category) is
     currently selected. WIDER AND SHORTER than the old bar column: it spans the full right-stack
     width and lays the HS code out inline with its description instead of stacking them. ── */
  #sel-title{display:flex;flex-direction:row;align-items:center;gap:10px;width:100%;}
  #sel-title .stx{font-size:.82rem;font-weight:800;color:var(--ink);line-height:1.32;flex:1;min-width:0;}
  #sel-title .stx .stx-hs{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:rgba(255,255,255,.45);display:inline;margin-right:6px;}
  #sel-title button{flex-shrink:0;background:#1a2430;color:var(--faint);border:1px solid var(--line);
    border-radius:6px;padding:2px 8px;font:inherit;font-size:.62rem;cursor:pointer;white-space:nowrap;}
  #sel-title button:hover{color:#fff;border-color:var(--accent);}
  /* drums: fluid widths so the four wheels fill the right stack instead of a fixed 426px run */
  .drums{display:flex;gap:6px;align-items:flex-end;width:100%;}
  .drum-row{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1 1 0;min-width:0;}
  .drum-row.drum-row-product{flex:1.8 1 0;}
  .drum-lab{font-size:.54rem;text-transform:uppercase;letter-spacing:.4px;color:var(--faint);}
  .drum-wrap{height:74px;overflow:hidden;position:relative;width:100%;cursor:ns-resize;}
  .drum-wrap::before,.drum-wrap::after{content:"";position:absolute;left:0;right:0;height:18px;z-index:2;pointer-events:none;}
  .drum-wrap::before{top:0;background:linear-gradient(rgba(6,13,8,.98),transparent);}
  .drum-wrap::after{bottom:0;background:linear-gradient(transparent,rgba(6,13,8,.98));}
  .drum-hl{position:absolute;top:50%;transform:translateY(-50%);left:2px;right:2px;height:24px;border-top:1px solid rgba(255,255,255,.15);border-bottom:1px solid rgba(255,255,255,.15);border-radius:4px;background:rgba(255,255,255,.03);z-index:1;pointer-events:none;}
  .drum-inner{overflow-y:scroll;scroll-snap-type:y mandatory;height:100%;scrollbar-width:none;-ms-overflow-style:none;}
  .drum-inner::-webkit-scrollbar{display:none;}
  .drum-opt{scroll-snap-align:center;height:22px;line-height:22px;padding:0 6px;font-size:.68rem;color:rgba(255,255,255,.3);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .drum-opt.drum-active{color:var(--accent);font-weight:700;font-size:.72rem;}
  .drum-spacer{height:22px;scroll-snap-align:none;}
  #p-tcy select{background:#0e1a22;color:var(--ink);border:1px solid var(--line);border-radius:6px;
    padding:5px 8px;font:inherit;font-size:.76rem;cursor:pointer;}

  /* ── stats blocks (atlas-parity overlay, ported .ov-* from build_country_atlas.R). Trade Flows
     and Top Partners are now two INDEPENDENT collapsible panels in the left stack, so #stats and
     #partners are plain flow containers rather than one fixed-size overlay box. ── */
  #stats,#partners{width:100%;}
  /* section headers, kept for parity though the panel headers now carry the titles */
  .ov-section{font-size:.86rem;font-weight:800;color:var(--ink);text-transform:uppercase;letter-spacing:.4px;margin:0 0 6px;}
  .ov-section.second{margin-top:10px;border-top:1px solid rgba(255,255,255,.14);padding-top:8px;}
  .ov-cols{display:flex;gap:10px;align-items:flex-start;margin-bottom:5px;}
  .ov-col{display:flex;flex-direction:column;min-width:75px;}
  .ov-col-sep{width:1px;background:rgba(255,255,255,.1);align-self:stretch;margin:0 2px;}
  .ov-col-label{font-size:.64rem;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px;font-weight:600;}
  .ov-col-val{font-size:1.3rem;font-weight:800;color:#e2e8f0;line-height:1.1;white-space:nowrap;}
  .ov-col-gdp{font-size:.63rem;color:rgba(255,255,255,.45);margin-top:2px;}
  .ov-net{font-size:.7rem;margin-top:3px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .ov-stat-block{margin-top:5px;border-top:1px solid rgba(255,255,255,.07);padding-top:5px;display:flex;flex-direction:column;gap:2px;}
  .ov-stat-row{display:flex;justify-content:space-between;align-items:center;font-size:.62rem;}
  .ov-stat-key{color:rgba(255,255,255,.4);font-size:.58rem;text-transform:uppercase;letter-spacing:.06em;}
  .ov-stat-vals{display:flex;gap:8px;align-items:center;}
  .ov-stat-pct{color:rgba(255,255,255,.8);font-weight:600;}
  .ov-stat-rank{color:#3cb54a;font-size:.58rem;font-weight:700;background:rgba(60,181,74,.1);border-radius:5px;padding:1px 5px;white-space:nowrap;}
  .ov-part-title{font-size:.55rem;color:rgba(255,255,255,.3);text-transform:uppercase;letter-spacing:.09em;margin:6px 0 2px;}
  .ov-row{display:flex;align-items:center;gap:6px;padding:2px 0;border-top:1px solid rgba(255,255,255,.06);font-size:.67rem;}
  .ov-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .ov-cname{color:rgba(255,255,255,.7);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .ov-cval{color:#3cb54a;font-weight:600;white-space:nowrap;}
  /* growth arrows: green ▲ / red ▼ / gray flat — intensity graded by |growth%|, "--" past the last year */
  .gr{font-size:.62rem;font-weight:700;white-space:nowrap;}
  .gr-na{color:rgba(255,255,255,.3);font-weight:600;}

  /* atlas-style SR legend (ported from build_country_atlas.R buildFixedLegend/hleg-*), now in its
     own collapsible panel with markedly more breathing room than the cramped top-bar version. */
  /* VERTICAL rhythm cut ~60% from the first pass (row gap 4→2, group gap 11→4, stage margin 3→1,
     leading 1.6→1.24 — i.e. 40% of the leading over 1.0). The COLUMN gutter (18px padding/margin
     either side of the divider) and the horizontal padding are deliberately untouched. */
  #legend{display:flex;flex-direction:row;align-items:flex-start;gap:0;padding:2px 2px 1px;
    overflow-x:auto;scrollbar-width:none;min-width:0;}
  #legend::-webkit-scrollbar{display:none;}
  .hleg-col{display:flex;flex-direction:column;gap:4px;padding-right:18px;border-right:1px solid rgba(255,255,255,.09);margin-right:18px;flex-shrink:0;}
  .hleg-col:last-child{border-right:none;margin-right:0;padding-right:0;}
  .hleg-group{display:flex;flex-direction:column;gap:2px;}
  .hleg-stage{font-size:.53rem;color:rgba(255,255,255,.34);text-transform:uppercase;letter-spacing:.09em;margin-bottom:1px;line-height:1.2;}
  .hleg-item{display:flex;align-items:center;gap:5px;font-size:.66rem;color:rgba(255,255,255,.62);
    transition:opacity .15s,color .15s;white-space:nowrap;line-height:1.24;cursor:pointer;}
  .hleg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .hleg-item.hleg-active{color:rgba(255,255,255,.95);font-weight:700;}
  .hleg-item.hleg-dim{opacity:.5;}
  #phase{position:fixed;bottom:14px;right:16px;z-index:5;font-size:.64rem;color:rgba(226,232,240,.4);
    background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 9px;}

  #tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;z-index:9;
    background:rgba(10,18,15,.96);border:1px solid rgba(60,181,74,.35);border-radius:6px;
    padding:6px 9px;font-size:.72rem;color:var(--ink);max-width:260px;line-height:1.45;}
</style>
</head>
<body>
<div id="split">
  <div id="left">
    <svg id="stage"></svg>
    <button id="mapmode" title="Toggle flat map / 3D globe">🌐 Globe</button>
    <button id="firmtoggle" title="Show/hide S&amp;P firm activity dots">🏭 Firms</button>
  </div>
</div>

<!-- ══ LEFT STACK — 255px wide (--stack-w). Panel 1 is FIXED (never collapsible); 2–4 collapse. ══ -->
<div id="lstack" class="stack">

  <div class="pnl pnl-fixed" id="p-title">
    <div class="title-split">
      <div class="brand-2l">
        <span class="l1">Clean Supply Chain</span><span class="l2">Atlas&nbsp;Navigator</span>
        <a class="de-link" href="data_explorer.html" title="Open the numeric companion: raw BACI trade data, HS-6 codes in line, everything downloadable">Data&nbsp;Explorer&nbsp;&rarr;</a>
      </div>
      <div id="bar-title">
        <div class="tech" id="bar-title-tech"></div>
        <div class="country" id="bar-title-country"></div>
        <div class="year" id="bar-title-year"></div>
      </div>
    </div>
  </div>

  <div class="pnl" id="p-tcy" style="--bh:120px">
    <button class="pnl-hd" type="button" data-pnl="p-tcy" aria-expanded="true" aria-controls="p-tcy-bd">
      <span class="pnl-t">Tech · Country · Year</span><span class="chev" aria-hidden="true">▾</span></button>
    <div class="pnl-bd" id="p-tcy-bd"><div class="pnl-in">
      <div class="tcy-block">
        <div class="tcy-row1">
          <span class="tcy-item"><span class="tcy-lab">Tech</span><select id="tech-sel" title="Technology"></select></span>
          <span class="tcy-item"><span class="tcy-lab">Country</span><select id="country-sel" title="Focus country (grouped by bloc)"></select></span>
        </div>
        <div class="tcy-row2">
          <button type="button" id="yr-play" class="yr-play" title="Play the year forward"
                  aria-label="Play the year forward">&#9654;</button>
          <span class="yr-track">
            <span class="yr-lab">Year</span>
            <input type="range" id="year-slider" min="2003" max="2024" step="1" value="2023"
                   title="Focal year for the stats panel — growth shown is this year → the next year">
          </span>
          <span class="yr-val" id="yr-val">2023</span>
        </div>
      </div>
    </div></div>
  </div>

  <div class="pnl" id="p-flows" style="--bh:175px">
    <button class="pnl-hd" type="button" data-pnl="p-flows" aria-expanded="true" aria-controls="p-flows-bd">
      <span class="pnl-t">Trade Flows</span><span class="chev" aria-hidden="true">▾</span></button>
    <div class="pnl-bd" id="p-flows-bd"><div class="pnl-in"><div id="stats"></div></div></div>
  </div>

  <div class="pnl" id="p-partners" style="--bh:210px">
    <button class="pnl-hd" type="button" data-pnl="p-partners" aria-expanded="true" aria-controls="p-partners-bd">
      <span class="pnl-t">Top Partners</span><span class="chev" aria-hidden="true">▾</span></button>
    <div class="pnl-bd" id="p-partners-bd"><div class="pnl-in"><div id="partners"></div></div></div>
  </div>

</div>

<!-- ══ RIGHT STACK — keeps the drum/dendrite column width (--nav-w). All four panels collapse.
     Order: drums → selection text (the consequence of the drums) → legend → supply chain map. ══ -->
<div id="rstack" class="stack">

  <div class="pnl" id="p-drums" style="--bh:112px">
    <button class="pnl-hd" type="button" data-pnl="p-drums" aria-expanded="true" aria-controls="p-drums-bd">
      <span class="pnl-t">Supply Chain Selector</span><span class="chev" aria-hidden="true">▾</span></button>
    <div class="pnl-bd" id="p-drums-bd"><div class="pnl-in">
      <div class="drums">
        <div class="drum-row"><span class="drum-lab">Stage</span><div class="drum-wrap" id="drum-stage"><div class="drum-hl"></div><div class="drum-inner" id="drum-stage-inner"></div></div></div>
        <div class="drum-row"><span class="drum-lab">Role</span><div class="drum-wrap" id="drum-role"><div class="drum-hl"></div><div class="drum-inner" id="drum-role-inner"></div></div></div>
        <div class="drum-row"><span class="drum-lab">Category</span><div class="drum-wrap" id="drum-cat"><div class="drum-hl"></div><div class="drum-inner" id="drum-cat-inner"></div></div></div>
        <div class="drum-row drum-row-product"><span class="drum-lab">Product</span><div class="drum-wrap drum-product" id="drum-product"><div class="drum-hl"></div><div class="drum-inner" id="drum-product-inner"></div></div></div>
      </div>
    </div></div>
  </div>

  <div class="pnl" id="p-sel" style="--bh:74px">
    <button class="pnl-hd" type="button" data-pnl="p-sel" aria-expanded="true" aria-controls="p-sel-bd">
      <span class="pnl-t">Selection</span><span class="chev" aria-hidden="true">▾</span></button>
    <div class="pnl-bd" id="p-sel-bd"><div class="pnl-in">
      <div id="sel-title"><span class="stx" id="sel-stx">Whole technology</span>
        <button id="sel-clear" type="button" style="display:none">✕ clear all</button></div>
    </div></div>
  </div>

  <div class="pnl" id="p-legend" style="--bh:120px">
    <button class="pnl-hd" type="button" data-pnl="p-legend" aria-expanded="true" aria-controls="p-legend-bd">
      <span class="pnl-t">Legend · Stage &amp; Role</span><span class="chev" aria-hidden="true">▾</span></button>
    <div class="pnl-bd" id="p-legend-bd"><div class="pnl-in"><div id="legend"></div></div></div>
  </div>

  <div class="pnl" id="p-nav" style="--bh:356px;--nav-svg-h:280px">
    <button class="pnl-hd" type="button" data-pnl="p-nav" aria-expanded="true" aria-controls="p-nav-bd">
      <span class="pnl-t">Supply Chain Map</span><span class="chev" aria-hidden="true">▾</span></button>
    <div class="pnl-bd" id="p-nav-bd"><div class="pnl-in" style="overflow:hidden">
      <div class="nav-toggle">
        <button class="nav-mode-btn active" type="button" id="nav-mode-product" data-mode="product">By Product</button>
        <button class="nav-mode-btn" type="button" id="nav-mode-sr" data-mode="sr">By Stage/Role</button>
      </div>
      <span id="nav-hd-sub">upstream → final product, left to right · click a node to trace it on the map</span>
      <svg id="nav"></svg>
    </div></div>
  </div>

</div>

<div id="phase">Phase 1 shell · arrows are tech-level</div>

<div id="tip"></div>

<script>
/* ── engine country roster ─────────────────────────────────────────────────── */
// COUNTRIES is loaded from data/_countries.json (generated from case_registry.csv),
// so the picker + click-to-refocus map auto-expand as the engine's roster grows.
let COUNTRIES = [];               // [{iso, slug, name, bloc, focal}]
let ISO2SLUG = {};                // iso3 → slug (rebuilt from COUNTRIES)
const BLOC_ORDER = ["Factory North America","Factory Asia","Factory Europe",
                    "Supplier South America","Supplier Africa","Supplier Oceania",
                    "Supplier Eurasia","Other"];
const TECHS = ["Solar","Wind","Batteries","Biofuel","Electrolyzers","Geothermal",
  "Heat_Pumps","Magnets","Nuclear","Transmission","EVs"];
// canonical tech palette (CLAUDE.md) — drives the #bar-title reference readout
const TECH_COLORS = {Solar:'#eab308',Nuclear:'#0ea5e9',Batteries:'#f59e0b',Transmission:'#06b6d4',
  Wind:'#3b82f6',Biofuel:'#84cc16',Electrolyzers:'#a855f7',Geothermal:'#ef4444',
  Heat_Pumps:'#f97316',Magnets:'#ec4899',EVs:'#14b8a6'};

/* ── state ─────────────────────────────────────────────────────────────────── */
let TECH="Solar", COUNTRY="India";
let D=null, TD=null;           // case json, tech json (dendrite tree)
let selProduct=null;           // selected HS code (solar-system navigation)
let selStage='ALL', selRole='ALL', selCat='ALL';   // drum filters (top-bar drumwheels)
let root=null, zoomB=null, zoomT=d3.zoomIdentity;   // pan/zoom container + behavior + transform
let mapMode='flat', globeRot=null, globeScale=1;    // flat map ⇄ 3D orthographic globe
let showFirms=true;   // toggle for the S&P firm-activity dots layer
// Phase D: stats-panel focal year. Growth is FORWARD-looking (selYear → selYear+1) — picking the
// latest available year shows "--" for every growth field, since there's no next year to compare.
let selYear=2023, YEAR_MIN=2003, YEAR_MAX=2024;
/* year playback (the ▶ button next to the slider). A CHAINED setTimeout, not setInterval: every
   redraw is synchronous, so the next step is scheduled only once the current one has painted and
   rapid stepping can never queue overlapping redraws. animArrows/prevArrows let drawFusion tween
   each trade arrow from last year's width to this year's instead of hard-cutting. */
let playing=false, playTimer=null;
const PLAY_MS=820;                 // one year per ~0.8s
const ARROW_MS=420;                // arrow tween — kept well under PLAY_MS so it always lands
let animArrows=false;              // true only for a playback-driven drawFusion
let prevArrows=new Map();          // "dir|partner" -> {w,o,r} as drawn for the previous year
let GDP=new Map();   // "iso3|year" -> gdp_mil_usd, shared across all techs (data/_gdp.json)
const REGION_ABBR={"East Asia & Pacific":"EAP","Europe & Central Asia":"ECA","South Asia":"SAS",
  "North America":"NAC","Latin America & Caribbean":"LCN","Middle East & North Africa":"MEA","Sub-Saharan Africa":"SSA"};

/* ── tiny helpers ──────────────────────────────────────────────────────────── */
const tipEl=()=>document.getElementById('tip');
function tip(e,h){ const t=tipEl(); t.style.opacity=1; t.style.left=(e.clientX+13)+'px'; t.style.top=(e.clientY+13)+'px'; t.innerHTML=h; }
function tipOut(){ tipEl().style.opacity=0; }
function msg(t){ d3.select('#stage').selectAll('*').remove();
  d3.select('#stage').append('text').attr('x','50%').attr('y','50%').attr('text-anchor','middle')
    .attr('fill','rgba(148,163,184,.7)').attr('font-size',13).text(t); }

function hashCode(s){ let h=0; s=String(s); for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }
function selSR(){
  if(!selProduct) return null;
  const p=(D.products||[]).find(x=>x.code===selProduct);
  if(p) return p.stage+'|'+p.role;
  const e=((TD&&TD.tree)||[]).find(x=>x.from_code===selProduct||x.to_code===selProduct);
  if(e) return e.from_code===selProduct?(e.from_stage+'|'+e.from_role):(e.to_stage+'|'+e.to_role);
  return null;
}
function selName(){
  if(!selProduct) return null;
  const e=((TD&&TD.tree)||[]).find(x=>x.from_code===selProduct||x.to_code===selProduct);
  if(e) return e.from_code===selProduct?(e.from_full||e.from_name):(e.to_full||e.to_name);
  const p=(D.products||[]).find(x=>x.code===selProduct); return p?(p.desc_full||p.product_name):selProduct;
}

/* ── the cockpit render ────────────────────────────────────────────────────── */
function drawFusion(){
  if(!D) return;
  const svg=d3.select('#stage');
  const {W,H}=VIZ.dims('#stage');
  svg.selectAll('*').remove();
  const CENT=VIZ.centroids(), FEATS=VIZ.feats(), ISO3N=VIZ.ISO3N;
  const iso4id=id=>{ const s=String(id).padStart(3,'0'); return Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(s)); };
  let proj, fc, front=()=>true;   // front(lonlat) → is the point on the visible hemisphere (globe only)

  if(mapMode==='globe'){
    root=svg.append('g').attr('class','zoom-root');            // globe rotates via projection, not a group transform
    const c0=CENT[D.iso]||[0,0];
    const rot=globeRot||[-c0[0],-c0[1],0];
    const scale=(Math.min(W,H)/2-24)*globeScale;
    proj=d3.geoOrthographic().rotate(rot).translate([W/2,H/2]).scale(scale).clipAngle(90);
    const gp=d3.geoPath(proj), centerLL=[-rot[0],-rot[1]];
    front=ll=>d3.geoDistance(ll,centerLL)<=Math.PI/2+0.02;
    root.append('path').datum({type:'Sphere'}).attr('d',gp)          // ocean sphere
      .attr('fill','#0a1a12').attr('stroke','rgba(96,165,250,.28)').attr('stroke-width',1);
    root.append('path').datum(d3.geoGraticule10()).attr('d',gp)      // graticule
      .attr('fill','none').attr('stroke','rgba(255,255,255,.06)').attr('stroke-width',0.5);
    root.append('g').selectAll('path').data(FEATS).join('path').attr('d',gp)  // land (clipAngle culls back)
      .attr('fill',d=>iso4id(d.id)===D.iso?'#1c3d2c':'#12281c')
      .attr('stroke',d=>iso4id(d.id)===D.iso?'rgba(60,181,74,.85)':'rgba(255,255,255,.08)')
      .attr('stroke-width',d=>iso4id(d.id)===D.iso?1.1:0.4);
    fc=proj(c0)||[W/2,H/2];      // focal country's OWN projected position — tracks rotation/drag,
                                  // rather than a fixed screen-center point (was the origin-doesn't-move bug)
  } else {
    root=svg.append('g').attr('class','zoom-root').attr('transform',zoomT);  // pan/zoom container
    const b=VIZ.baseMap(root,W,H,D.iso,'world');   // fixed whole-world fit (not zoomed to the focal country) —
    // so every partner's true coordinates land inside the visible canvas, not just nearby ones
    if(!b){ msg('world map unavailable'); return; }
    proj=b.proj;
    fc = CENT[D.iso] ? proj(CENT[D.iso]) : [W/2,H/2];
  }

  // arrowhead markers
  const defs=root.append('defs');
  [['dest','#3cb54a'],['src','#f97316']].forEach(([k,c])=>{
    defs.append('marker').attr('id','ah-'+k).attr('viewBox','0 0 10 10').attr('refX',8).attr('refY',5)
      .attr('markerWidth',16).attr('markerHeight',16).attr('markerUnits','userSpaceOnUse')  // fixed size, not ∝ stroke
      .attr('orient','auto-start-reverse')
      .append('path').attr('d','M0,0 L10,5 L0,10 z').attr('fill',c);
  });

  // ① invisible country hit-layer (click-to-refocus / hover) — under the marks
  root.append('g').selectAll('path').data(FEATS).join('path')
    .attr('d',d3.geoPath(proj)).attr('fill','transparent').attr('stroke','none')
    .attr('cursor',d=>{const iso=iso4id(d.id);return (iso&&ISO2SLUG[iso]&&iso!==D.iso)?'pointer':'default';})
    .on('click',(e,d)=>{const iso=iso4id(d.id); if(iso&&ISO2SLUG[iso]&&iso!==D.iso) loadCase(TECH,ISO2SLUG[iso]);})
    .on('mousemove',(e,d)=>{const iso=iso4id(d.id); if(iso&&ISO2SLUG[iso]) tip(e,'<b>'+ISO2SLUG[iso].replace(/_/g,' ')+'</b>'+(iso===D.iso?'<br>focal country':'<br>click to refocus')); else tipOut();})
    .on('mouseout',tipOut);

  // ③ partner trade arrows — width ∝ sqrt(value); great-circle arcs on the globe. Filtered to the
  // year slider (selYear) so the map stays consistent with the stats panel, rather than showing
  // an all-time aggregate for a different implied period.
  const yearParts=(D.partners_yearly||[]).filter(p=>p.year===selYear);
  const dests=yearParts.filter(p=>p.dir==='dest'&&CENT[p.partner]).sort((a,b)=>b.v-a.v).slice(0,8);
  const srcs =yearParts.filter(p=>p.dir==='src' &&CENT[p.partner]).sort((a,b)=>b.v-a.v).slice(0,8);
  const arr=[...dests,...srcs];
  const maxV=d3.max(arr,p=>p.v)||1;
  const minV=Math.max(1, d3.min(arr,p=>p.v)||1);
  const wsc=d3.scaleSqrt().domain([minV, Math.max(maxV, minV+1)]).range([3,28]).clamp(true);  // wide, rank-legible width
  const rsc=d3.scaleSqrt().domain([0,maxV]).range([3,11]);
  const ag=root.append('g').attr('class','arrows');
  const gpArc=d3.geoPath(proj);
  // Arrows are drawn full-length (centroid → partner) but MASKED to "everything outside the focal
  // country's own silhouette" — a white full-canvas rect with the country's real path painted
  // black on top (SVG <mask> luminance: white=visible, black=hidden). So the segment inside the
  // country is invisible and the visible arrow starts exactly on the true coastline, for any
  // shape. (Tried an evenodd clip-path rect-minus-country hole first — verified mathematically
  // correct via isPointInFill sampling, but Chromium silently fails to rasterize it for a path
  // this complex/high-vertex-count; the country shape alone clips fine, just not combined with
  // the rect under evenodd. The mask/compositing approach sidesteps that renderer quirk entirely.)
  const focalFeat=FEATS.find(f=>iso4id(f.id)===D.iso);
  if(focalFeat){
    const maskG=defs.append('mask').attr('id','mask-hide-focal');
    maskG.append('rect').attr('x',0).attr('y',0).attr('width',W).attr('height',H).attr('fill','#fff');
    maskG.append('path').attr('d',gpArc(focalFeat)).attr('fill','#000');
    ag.attr('mask','url(#mask-hide-focal)');
  }
  const nextArrows=new Map();   // this year's arrow geometry, keyed dir|partner (see prevArrows)
  arr.forEach(p=>{
    const cll=CENT[p.partner]; if(!cll) return;
    if(mapMode==='globe' && !front(cll)) return;    // hide partners on the far side of the globe
    const tgt=proj(cll); if(!tgt) return;
    const col=p.dir==='dest'?'#3cb54a':'#f97316', w=wsc(Math.max(1,p.v));   // exports green, imports orange
    const start=fc;   // true centroid — the mask (above) hides the in-country segment visually
    // arc bowed perpendicular to the chord. Fixed relative side (not "whichever is outward") —
    // since A/B swap ends between dest/src, this alone bows exports and imports of the SAME
    // partner to opposite sides, so they no longer overlap (e.g. China as both a big import
    // source and export destination for many countries). On the flat map the fixed whole-world
    // fit (see VIZ.baseMap 'world' mode above) already lands every partner inside the canvas,
    // so no edge-clamping is needed — only the bow and the opacity differ between the modes.
    const A=p.dir==='dest'?start:tgt, B=p.dir==='dest'?tgt:start;
    const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2;
    const dx=B[0]-A[0], dy=B[1]-A[1], len=Math.hypot(dx,dy)||1;
    const nx=-dy/len, ny=dx/len;
    const bow = mapMode==='globe' ? len*0.3+16 : len*0.12+8;
    const op  = mapMode==='globe' ? .7 : .62;
    const ctrl=[mx+nx*bow, my+ny*bow];
    const r=rsc(p.v), key=p.dir+'|'+p.partner, prev=animArrows?prevArrows.get(key):null;
    const pth=ag.append('path').attr('d',`M${A[0]},${A[1]} Q${ctrl[0]},${ctrl[1]} ${B[0]},${B[1]}`)
      .attr('fill','none').attr('stroke',col).attr('stroke-opacity',op)
      .attr('stroke-width',w).attr('stroke-linecap','round').attr('marker-end','url(#ah-'+p.dir+')');
    // partner dot + label — the partner's true projected position, on both the globe and the map
    const dp=tgt;
    const cir=ag.append('circle').attr('cx',dp[0]).attr('cy',dp[1]).attr('r',r)
      .attr('fill',col).attr('fill-opacity',.45).attr('stroke',col).attr('stroke-width',1).attr('cursor','pointer')
      .on('mousemove',e=>tip(e,'<b>'+p.partner+'</b><br>'+(p.dir==='dest'?'export destination':'import source')+' · '+VIZ.fmtV(p.v))).on('mouseout',tipOut);
    ag.append('text').attr('x',dp[0]).attr('y',dp[1]-r-3).attr('text-anchor','middle')
      .attr('font-size','9px').attr('fill',col).attr('font-weight','700').attr('pointer-events','none').text(p.partner);
    // playback only: tween width/opacity/radius from last year's values (0 for a new partner), so
    // stepping through the years reads as flows swelling and shrinking rather than as a slideshow.
    if(animArrows){
      pth.attr('stroke-width',prev?prev.w:0.4).attr('stroke-opacity',prev?prev.o:0)
         .transition().duration(ARROW_MS).ease(d3.easeCubicOut)
         .attr('stroke-width',w).attr('stroke-opacity',op);
      cir.attr('r',prev?prev.r:0)
         .transition().duration(ARROW_MS).ease(d3.easeCubicOut).attr('r',r);
    }
    nextArrows.set(key,{w,o:op,r});
  });
  prevArrows=nextArrows;

  // ② domestic firms inside the focal country
  const firms=D.firms||[]; const sr=selSR();
  const drumOn = selStage!=='ALL'||selRole!=='ALL';
  const firmActive=f=>{
    if(selStage!=='ALL'&&f.stage!==selStage) return false;
    if(selRole!=='ALL'&&f.role!==selRole) return false;
    if(sr && (f.stage+'|'+f.role)!==sr) return false;
    return true;
  };
  const anyFilter = !!sr || drumOn;
  if(showFirms && firms.length){
    const maxN=d3.max(firms,f=>f.n)||1;
    const fr=d3.scaleSqrt().domain([0,maxN]).range([2.5,12]);
    const fg=root.append('g').attr('class','firms');
    [...firms].sort((a,b)=>b.n-a.n).forEach(f=>{
      const ll=[+f.lon,+f.lat];
      if(mapMode==='globe' && !front(ll)) return;   // hide firms on the far side of the globe
      const px=proj(ll); if(!px) return; const [x,y]=px;
      if(x<-20||x>W+20||y<-20||y>H+20) return;
      const k=f.stage+'|'+f.role, col=VIZ.SR[k]||'#888', active=firmActive(f), r=fr(f.n);
      fg.append('circle').attr('cx',x).attr('cy',y).attr('r',r)
        .attr('fill',col).attr('opacity',anyFilter?(active?0.95:0.1):0.68)
        .attr('stroke','rgba(10,15,20,.9)').attr('stroke-width',.5).attr('cursor','pointer')
        .on('mousemove',e=>tip(e,f.stage+' · '+f.role+'<br><b>'+f.n+'</b> firm'+(f.n>1?'s':''))).on('mouseout',tipOut);
      if(sr&&active) fg.append('circle').attr('cx',x).attr('cy',y).attr('r',r+3)
        .attr('fill','none').attr('stroke','#fff').attr('stroke-width',1.5).attr('pointer-events','none');
    });
  }

  // (product navigator lives in the right-hand solar-system panel — see drawNav)
}

/* ── Supply Chain Map — two view modes, toggled via #nav-mode-* buttons ───────── */
let navMode='product';   // 'product' (per-HS-code dendrite) | 'sr' (7-node stage/role network)
function drawNav(){ navMode==='sr' ? drawNavSR() : drawNavProduct(); }
function setNavMode(m){
  if(navMode===m) return;
  navMode=m;
  document.getElementById('nav-mode-product').classList.toggle('active',m==='product');
  document.getElementById('nav-mode-sr').classList.toggle('active',m==='sr');
  document.getElementById('nav-hd-sub').textContent = m==='sr'
    ? 'value chain by stage · role — node size = this country’s trade value · click to filter'
    : 'upstream → final product, left to right · click a node to trace it on the map';
  drawNav();
}

/* Process of Production (atlas-style linear step layout, ported from build_country_atlas.R
   drawDendrite() — replaces the earlier orrery/solar-system design, which read as confusing
   once de-crowded) — the "By Product" mode ───────────────────────────────────────────────── */
function drawNavProduct(){
  const svg=d3.select('#nav'); svg.selectAll('*').remove();
  const {W,H}=VIZ.dims('#nav');
  const edges=(TD&&TD.tree)||[];
  if(!edges.length){ svg.append('text').attr('x',W/2).attr('y',H/2).attr('text-anchor','middle')
    .attr('fill','rgba(255,255,255,.3)').attr('font-size',11).text('no value-chain data for this tech'); return; }
  // node identity = from_cn/to_cn ("HS code | process-step name"), NOT the bare HS code — many
  // distinct process-of-production steps share one HS6 (e.g. Solar's 848620 covers 15 separate
  // module/cell-line steps). Keying by code alone collapses them and fabricates cycles. Falls
  // back to the bare code only for stale cached JSON predating this fix.
  const cnOf=(code,cn)=>cn||code;
  const nm=new Map(); const reg=(cn,c,nn,ff,st,ro)=>{ if(!nm.has(cn)) nm.set(cn,{cn,code:c,name:nn,full:ff,stage:st,role:ro}); return nm.get(cn); };
  edges.forEach(e=>{
    reg(cnOf(e.from_code,e.from_cn),e.from_code,e.from_name,e.from_full,e.from_stage,e.from_role);
    reg(cnOf(e.to_code,e.to_cn),e.to_code,e.to_name,e.to_full,e.to_stage,e.to_role);
  });
  const nodes=[...nm.values()];

  // step = longest distance to a sink (a final product with no further downstream edge) —
  // same topological-layering algorithm as the atlas dendrite: raw materials end up with the
  // biggest step, final products at step 0.
  const stepMap=new Map(nodes.map(n=>[n.cn,0]));
  let changed=true;
  for(let i=0;i<25&&changed;i++){ changed=false;
    edges.forEach(e=>{ const fcn=cnOf(e.from_code,e.from_cn), tcn=cnOf(e.to_code,e.to_cn);
      const ts=stepMap.get(tcn)||0, fs=stepMap.get(fcn)||0;
      if(fs<ts+1){ stepMap.set(fcn,ts+1); changed=true; } }); }
  const maxStep=Math.max(0,...stepMap.values());
  const displayLv=s=>maxStep-s;                          // flip: raw material (left) → final product (right)
  const stepToX=s=>W*0.08+(W*0.82)*displayLv(s)/(maxStep||1);

  const buckets={};
  nodes.forEach(n=>{ const s=stepMap.get(n.cn)||0; (buckets[s]=buckets[s]||[]).push(n); });
  Object.values(buckets).forEach(ns=>ns.sort((a,b)=>(a.name||'').localeCompare(b.name||'')));
  const pad={top:16,bottom:16};
  const nodeY=new Map();
  Object.values(buckets).forEach(ns=>{ const avail=H-pad.top-pad.bottom, stp=avail/ns.length;
    ns.forEach((n,i)=>nodeY.set(n.cn,pad.top+stp*(i+0.5))); });
  const pos=cn=>[stepToX(stepMap.get(cn)||0), nodeY.get(cn)||H/2];

  // node size ∝ focal-country export+import trade value AT THE SELECTED YEAR (fallback: all-time
  // total, then connectivity) — same sqrt-scale transformation as the map's trade-flow arrows/dots
  // (VIZ arrows use d3.scaleSqrt so visual AREA, not radius, is linear in value — the standard fix
  // for circles/line-widths, since eyes compare areas). Trade value is per HS code, so sibling
  // steps sharing one code also share its size — that's expected, not a bug.
  const tvY=new Map(((D&&D.products_yearly)||[]).filter(p=>p.year===selYear).map(p=>[p.code,p.v]));
  const tvAll=new Map(((D&&D.products)||[]).map(p=>[p.code,p.v]));
  const deg=new Map(nodes.map(n=>[n.cn,0]));
  edges.forEach(e=>{ const fcn=cnOf(e.from_code,e.from_cn), tcn=cnOf(e.to_code,e.to_cn);
    deg.set(fcn,(deg.get(fcn)||0)+1); deg.set(tcn,(deg.get(tcn)||0)+1); });
  const useYear=!!tvY.size, useAll=!useYear&&!!tvAll.size;
  const sval=n=>useYear?(tvY.get(n.code)||0):useAll?(tvAll.get(n.code)||0):(deg.get(n.cn)||0);
  const rSc=d3.scaleSqrt().domain([0,d3.max(nodes,sval)||1]).range([3,11]);

  const cm=catMap();
  const drumOn = selStage!=='ALL'||selRole!=='ALL'||selCat!=='ALL';
  const passDrum=n=>(selStage==='ALL'||n.stage===selStage)&&(selRole==='ALL'||n.role===selRole)&&(selCat==='ALL'||(cm[n.code]||'Other')===selCat);
  const isSel=e=>selProduct&&(e.from_code===selProduct||e.to_code===selProduct);

  svg.append('g').selectAll('line').data(edges).join('line')
    .attr('x1',e=>pos(cnOf(e.from_code,e.from_cn))[0]).attr('y1',e=>pos(cnOf(e.from_code,e.from_cn))[1])
    .attr('x2',e=>pos(cnOf(e.to_code,e.to_cn))[0]).attr('y2',e=>pos(cnOf(e.to_code,e.to_cn))[1])
    .attr('stroke',e=>isSel(e)?'rgba(255,255,255,.85)':'rgba(255,255,255,.14)')
    .attr('stroke-width',e=>isSel(e)?1.6:.6);

  // no text labels, no dashed connectors — nodes speak for themselves (atlas convention)
  svg.append('g').selectAll('circle').data(nodes).join('circle')
    .attr('cx',n=>pos(n.cn)[0]).attr('cy',n=>pos(n.cn)[1])
    .attr('r',n=>{ const r=Math.max(3,rSc(sval(n))); return n.code===selProduct?r+2:r; })
    .attr('fill',n=>VIZ.SR[n.stage+'|'+n.role]||'#888')
    .attr('stroke',n=>n.code===selProduct?'#fff':'rgba(0,0,0,.35)').attr('stroke-width',n=>n.code===selProduct?2.2:.6)
    .attr('opacity',n=>{ if(selProduct) return n.code===selProduct?1:.35; if(drumOn) return passDrum(n)?.98:.14; return .92; })
    .attr('cursor','pointer')
    .on('click',(e,n)=>{ selProduct=(selProduct===n.code)?null:n.code; drawFusion(); drawNav(); updateReadout(); })
    .on('mousemove',(e,n)=>tip(e,'HS '+n.code+'<br><b>'+(n.full||n.name||n.code)+'</b><br>'+n.stage+' · '+n.role+' · step '+stepMap.get(n.cn)+(sval(n)?'<br>'+VIZ.fmtV(sval(n))+' · '+selYear:'')))
    .on('mouseout',tipOut);
}

/* Country-level value-chain flows, ported from build_country_atlas.R drawAtlasSankey() — the
   same 7-lane (5-column) structure as the atlas's Trade Flows sankey. "By Stage/Role" mode. */
/* "By Stage/Role" mode: the value chain as a 7-NODE network (one node per stage·role, not per
   country and not per HS code) — same left-to-right topology the old country-ribbon sankey used
   (raw material → processed material → {process equipment, product component} at midstream →
   same split carried into downstream → final product), but drawn as a plain node-link diagram
   like the By-Product view above, so the two modes read as parallel "network" views of the same
   value chain at two different levels of granularity. */
function drawNavSR(){
  const svg=d3.select('#nav'); svg.selectAll('*').remove();
  const {W,H}=VIZ.dims('#nav');
  const LANE_SR=['Upstream|Raw Material','Midstream|Processed Material','Midstream|Process Equipment',
    'Midstream|Product Component','Downstream|Product Component','Downstream|Process Equipment','Final Product|Final Product'];
  const LANE_LABEL=['Raw Material','Processed Material','Process Equipment','Product Component','Product Component','Process Equipment','Final Product'];
  const EDGES_SR=[[0,1],[1,2],[1,3],[2,5],[3,4],[5,6],[4,6]];
  const COLX=[0.09,0.30,0.51,0.51,0.72,0.72,0.91];        // x-fraction per lane (2&3 share a column; 5&4 share a column)
  const VSLOT=['full','full','top','bottom','bottom','top','full'];  // vertical half within that shared column

  // Node size ∝ the FOCAL COUNTRY's own export+import trade value for that stage·role AT THE
  // SELECTED YEAR (from D.timeline: already year × stage × role × flow) — same sqrt-scale
  // transformation the map's trade-flow arrows/dots use: encoding value as radius ∝ √value makes
  // the visual AREA (what the eye actually compares) linear in value, not the radius itself.
  const tlY=((D&&D.timeline)||[]).filter(t=>t.year===selYear);
  const srVal=new Map();
  tlY.forEach(t=>{ const k=t.stage+'|'+t.role; srVal.set(k,(srVal.get(k)||0)+(+t.v||0)); });
  const vals=LANE_SR.map(k=>srVal.get(k)||0);
  const rSc=d3.scaleSqrt().domain([0,d3.max(vals)||1]).range([5,26]);

  const P={t:14,b:16,l:10,r:10};
  const iw=W-P.l-P.r, ih=H-P.t-P.b, yT=P.t, yB=P.t+ih, yMid=(yT+yB)/2;
  const yFor=slot=>slot==='full'?yMid:slot==='top'?(yT+yMid)/2:(yMid+yB)/2;
  const pos=LANE_SR.map((k,i)=>({key:k,lane:i,x:P.l+COLX[i]*iw,y:yFor(VSLOT[i]),r:rSc(vals[i]),v:vals[i]}));

  const defs=svg.append('defs');
  defs.append('marker').attr('id','sr-ah').attr('viewBox','0 0 10 10').attr('refX',8).attr('refY',5)
    .attr('markerWidth',9).attr('markerHeight',9).attr('markerUnits','userSpaceOnUse').attr('orient','auto')
    .append('path').attr('d','M0,0 L10,5 L0,10 z').attr('fill','rgba(255,255,255,.45)');

  const eg=svg.append('g');
  EDGES_SR.forEach(([a,b])=>{
    const A=pos[a], B=pos[b];
    const dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
    eg.append('line').attr('x1',A.x+ux*(A.r+2)).attr('y1',A.y+uy*(A.r+2))
      .attr('x2',B.x-ux*(B.r+6)).attr('y2',B.y-uy*(B.r+6))
      .attr('stroke','rgba(255,255,255,.4)').attr('stroke-width',1.8).attr('marker-end','url(#sr-ah)');
  });

  const ng=svg.append('g');
  pos.forEach(n=>{
    const [nSt,nRo]=n.key.split('|'), active=selStage===nSt&&selRole===nRo;
    const col=VIZ.SR[n.key]||'#9ca3af';
    ng.append('circle').attr('cx',n.x).attr('cy',n.y).attr('r',n.r)
      .attr('fill',col).attr('opacity',active?0.98:0.82)
      .attr('stroke',active?'#fff':'rgba(255,255,255,.25)').attr('stroke-width',active?1.8:.8)
      .attr('cursor','pointer').on('click',()=>pickSR(nSt,nRo))
      .on('mousemove',ev=>tip(ev,'<b>'+n.key.replace('|',' · ')+'</b><br>'+VIZ.fmtV(n.v)+' · '+selYear))
      .on('mouseout',tipOut);
    svg.append('text').attr('x',n.x).attr('y',n.y+n.r+11).attr('text-anchor','middle')
      .attr('font-size',7).attr('fill','rgba(255,255,255,.55)').attr('pointer-events','none')
      .text(LANE_LABEL[n.lane]);
  });
}

/* ── drum-wheel selectors (Stage → Role → Category → Product) ─────────────────── */
function catMap(){ const m={}; ((D&&D.scatter)||[]).forEach(s=>{ if(s.code) m[s.code]=s.category||'Other'; }); return m; }
function allProducts(){ const cm=catMap(); return ((D&&D.products)||[]).map(p=>({code:p.code,name:p.product_name||p.code,stage:p.stage,role:p.role,cat:cm[p.code]||'Other',v:p.v||0})); }
function redrawAll(){ drawFusion(); drawNav(); updateReadout(); }
function clearFilters(){ selStage='ALL'; selRole='ALL'; selCat='ALL'; selProduct=null; initDrums(); redrawAll(); }
function anyFilter(){ return selProduct||selStage!=='ALL'||selRole!=='ALL'||selCat!=='ALL'; }

/* ── atlas-style SR legend (ported from build_country_atlas.R buildFixedLegend/hleg-*), plus a
   3rd column for the export/import direction colors Oriol asked for. Clicking an item sets the
   SAME selStage+selRole filter as the Stage/Role drums (richer than the old stage-only swatches). */
function pickSR(stage,role){
  if(selStage===stage&&selRole===role){ selStage='ALL'; selRole='ALL'; }
  else { selStage=stage; selRole=role; }
  selCat='ALL'; selProduct=null; initDrums(); redrawAll();
}
function buildLegend(){
  const el=document.getElementById('legend'); if(!el) return;
  const mkItem=([srKey,rn])=>
    `<div class="hleg-item" data-sr="${srKey}"><div class="hleg-dot" style="background:${VIZ.SR[srKey]||'#9ca3af'}"></div>${rn}</div>`;
  const mkGrp=(stage,items)=>`<div class="hleg-group"><div class="hleg-stage">${stage}</div>${items.map(mkItem).join('')}</div>`;
  const mkCol=(groups)=>`<div class="hleg-col">${groups}</div>`;
  // export/import colors live in the stats panel's Imports/Exports labels now — no separate
  // Trade Flow legend column needed here.
  el.innerHTML=
    mkCol(mkGrp('UPSTREAM',[['Upstream|Raw Material','Raw Material']])+
          mkGrp('MIDSTREAM',[['Midstream|Processed Material','Processed Material'],['Midstream|Process Equipment','Process Equipment'],['Midstream|Product Component','Product Component']]))+
    mkCol(mkGrp('DOWNSTREAM',[['Downstream|Product Component','Product Component'],['Downstream|Process Equipment','Process Equipment']])+
          mkGrp('FINAL',[['Final Product|Final Product','Final Product']]));
  el.querySelectorAll('.hleg-item[data-sr]').forEach(item=>{
    item.addEventListener('click',()=>{ const [st,ro]=item.dataset.sr.split('|'); pickSR(st,ro); });
  });
}
function updateLegend(){
  const hasFilter=selStage!=='ALL'||selRole!=='ALL';
  document.querySelectorAll('#legend .hleg-item[data-sr]').forEach(item=>{
    if(!hasFilter){ item.classList.remove('hleg-active','hleg-dim'); return; }
    const [st,ro]=item.dataset.sr.split('|');
    const active=(selStage==='ALL'||selStage===st)&&(selRole==='ALL'||selRole===ro);
    item.classList.toggle('hleg-active',active); item.classList.toggle('hleg-dim',!active);
  });
}
function fillDrum(innerId, options, currentVal, onChange){
  const inner=document.getElementById(innerId); if(!inner) return;
  inner.innerHTML='<div class=drum-spacer></div><div class=drum-spacer></div>'+
    options.map(o=>`<div class="drum-opt${o.value===currentVal?' drum-active':''}" data-val="${o.value}">${o.label}</div>`).join('')+
    '<div class=drum-spacer></div><div class=drum-spacer></div>';
  const idx=Math.max(0,options.findIndex(o=>o.value===currentVal));
  inner.scrollTop=19+idx*22;                                  // atlas scroll geometry (spacer=22)
  let t; inner.onscroll=()=>{ clearTimeout(t); t=setTimeout(()=>{
    const cIdx=Math.max(0,Math.min(options.length-1,Math.round((inner.scrollTop-19)/22)));
    inner.querySelectorAll('.drum-opt').forEach((el,i)=>el.classList.toggle('drum-active',i===cIdx));
    const nv=options[cIdx].value; if(nv!==inner._cur){ inner._cur=nv; onChange(nv); }
  },80); };
  inner._cur=currentVal;
}
function initDrums(){
  const stageOpts=[{value:'ALL',label:'All'},{value:'Upstream',label:'Upstream'},{value:'Midstream',label:'Midstream'},{value:'Downstream',label:'Downstream'},{value:'Final Product',label:'Final'}];
  fillDrum('drum-stage-inner',stageOpts,selStage,v=>{ selStage=v; selRole='ALL'; selCat='ALL'; selProduct=null; updateDrumRole(); updateDrumCat(); updateDrumProduct(); redrawAll(); });
  updateDrumRole(); updateDrumCat(); updateDrumProduct();
}
function updateDrumRole(){
  const roles=['ALL',...new Set(allProducts().filter(p=>selStage==='ALL'||p.stage===selStage).map(p=>p.role).filter(Boolean))];
  fillDrum('drum-role-inner',roles.map(r=>({value:r,label:r==='ALL'?'All':r.replace(' Material','').replace(' Product','Prod.')})),selRole,
    v=>{ selRole=v; selCat='ALL'; selProduct=null; updateDrumCat(); updateDrumProduct(); redrawAll(); });
}
function updateDrumCat(){
  const base=allProducts().filter(p=>(selStage==='ALL'||p.stage===selStage)&&(selRole==='ALL'||p.role===selRole));
  const cats=['ALL',...[...new Set(base.map(p=>p.cat||'Other'))].sort()];
  fillDrum('drum-cat-inner',cats.map(ct=>({value:ct,label:ct==='ALL'?'All':ct.replace(' Materials','Mat.')})),selCat,
    v=>{ selCat=v; selProduct=null; updateDrumProduct(); redrawAll(); });
}
function updateDrumProduct(){
  const prods=allProducts().filter(p=>(selStage==='ALL'||p.stage===selStage)&&(selRole==='ALL'||p.role===selRole)&&(selCat==='ALL'||p.cat===selCat)).sort((a,b)=>b.v-a.v);
  const opts=[{value:'ALL',label:'All'},...prods.map(p=>({value:p.code,label:`${p.code} — ${(p.name||'').substring(0,24)}`}))];
  fillDrum('drum-product-inner',opts,selProduct||'ALL',v=>{ selProduct=(v==='ALL')?null:v; redrawAll(); });
}

/* ── control-bar readouts ──────────────────────────────────────────────────── */
// atlas-style "Tech / COUNTRY / year" reference title in the bar — kept in sync on case load
// (updateReadout) and on every year-slider move (onYearChange)
function syncBarTitle(){
  const btTech=document.getElementById('bar-title-tech'), btCountry=document.getElementById('bar-title-country'),
        btYear=document.getElementById('bar-title-year');
  if(btTech){ btTech.textContent=TECH.replace(/_/g,' '); btTech.style.color=TECH_COLORS[TECH]||'#fff'; }
  if(btCountry) btCountry.textContent=(COUNTRY||'').replace(/_/g,' ');
  if(btYear) btYear.textContent=selYear;
  fitBarTitle();
}
// The readout now shares the title panel with the brand block, so its column is narrow. Shrink a
// line's type only as far as it must go to fit (long techs like Electrolyzers, long countries like
// United Kingdom); everything shorter keeps the atlas's own sizes untouched.
function fitLine(el,baseRem,minRem){
  if(!el) return;
  let rem=baseRem; el.style.fontSize=rem+'rem';
  // iterate: letter-spacing is a fixed px value, so the width is not exactly proportional to the
  // font size and a single ratio pass can still leave a pixel or two of overflow
  for(let i=0;i<4 && el.clientWidth>0 && el.scrollWidth>el.clientWidth;i++){
    const next=Math.max(minRem, rem*el.clientWidth/el.scrollWidth - 0.005);
    if(next>=rem) break;                       // clamped at the floor — let it ellipsize
    rem=next; el.style.fontSize=rem.toFixed(3)+'rem';
  }
}
function fitBarTitle(){
  const t=document.getElementById('bar-title-tech');
  fitLine(t,1.2,0.72);
  // whatever the tech line had to give up, the two lines under it give up too — otherwise a long
  // tech (Electrolyzers, Transmission) would end up set smaller than its own country line
  const tr=(t&&parseFloat(t.style.fontSize))||1.2;
  fitLine(document.getElementById('bar-title-country'), Math.min(0.78, tr*0.85), 0.54);
  const y=document.getElementById('bar-title-year');
  if(y) y.style.fontSize=Math.min(0.74, tr*0.8).toFixed(3)+'rem';
}
function updateReadout(){
  const cs=document.getElementById('country-sel'); if(cs&&cs.value!==COUNTRY) cs.value=COUNTRY;
  syncBarTitle();
  // Selection title: what's picked right now.
  //  - Product: HS code colored by the TECH's own color, description in plain white below it.
  //  - Stage/Role: "Stage · Role" on one line — colored via the atlas's SR palette when both are
  //    exact (or when the stage has only one role anyway: Upstream/Final Product).
  //  - Category: colored via the atlas's category palette.
  const stx=document.getElementById('sel-stx'), clr=document.getElementById('sel-clear');
  if(selProduct){
    stx.style.color='';   // plain white (var(--ink)) for the description
    stx.innerHTML='<span class="stx-hs" style="color:'+(TECH_COLORS[TECH]||'#e2e8f0')+'">HS '+selProduct+'</span>'+(selName()||'');
  } else if(selStage!=='ALL'||selRole!=='ALL'){
    let col=(selStage!=='ALL'&&selRole!=='ALL')?VIZ.SR[selStage+'|'+selRole]:null;
    if(!col&&selRole==='ALL'){
      if(selStage==='Upstream') col=VIZ.SR['Upstream|Raw Material'];
      else if(selStage==='Final Product') col=VIZ.SR['Final Product|Final Product'];
    }
    stx.style.color=col||'#e2e8f0';
    stx.innerHTML=[selStage,selRole].filter(x=>x!=='ALL').join(' · ');   // one line — the panel is wide and short now
  } else if(selCat!=='ALL'){
    stx.style.color=VIZ.CAT[selCat]||'#e2e8f0';
    stx.innerHTML=selCat;
  } else {
    stx.style.color='';
    stx.innerHTML='Whole technology';
  }
  clr.style.display=anyFilter()?'':'none';
  updateLegend();
}

/* ── Phase D: atlas-parity stats panel — year-selected headline $, %GDP, world/region
   rank+share, top-5 partners, all with FORWARD-looking growth (selYear → selYear+1) ─────────── */
function growthArrow(cur,next){
  if(cur==null||next==null||!cur) return '<span class="gr gr-na">--</span>';
  const pct=(next-cur)/cur*100, abs=Math.abs(pct);
  if(abs<0.5) return `<span class="gr" style="color:rgba(148,163,184,.8)">— ${abs.toFixed(1)}%</span>`;
  const mag=Math.min(1,abs/25), alpha=0.5+0.5*mag;                 // graded intensity, saturates at 25%+
  const up=pct>0;
  return `<span class="gr" style="color:rgba(${up?'74,222,128':'248,113,113'},${alpha})">${up?'▲':'▼'} ${abs.toFixed(1)}%</span>`;
}
function rankShare(rows,iso,valKey){    // rows: [{iso3,region,exports_kusd,imports_kusd}] for one year
  const me=rows.find(r=>r.iso3===iso), val=me?(me[valKey]||0):0;
  if(!val) return {share:0,rank:null};
  const total=d3.sum(rows,r=>r[valKey]||0)||1;
  const sorted=[...rows].filter(r=>(r[valKey]||0)>0).sort((a,b)=>b[valKey]-a[valKey]);
  return {share:val/total*100, rank:sorted.findIndex(r=>r.iso3===iso)+1};
}
function gdpRankShare(rows,iso,valKey,year){
  const withGDP=rows.map(r=>({iso3:r.iso3,val:r[valKey]||0,gdp:GDP.get(r.iso3+'|'+year)}))
    .filter(r=>r.gdp>0).map(r=>({iso3:r.iso3,pct:r.val/r.gdp/10}));   // KUSD/MUSD/10 = %  (CLAUDE.md unit convention)
  const me=withGDP.find(r=>r.iso3===iso), pct=me?me.pct:0;
  if(!pct) return {pct:0,rank:null};
  const sorted=[...withGDP].filter(r=>r.pct>0).sort((a,b)=>b.pct-a.pct);
  return {pct, rank:sorted.findIndex(r=>r.iso3===iso)+1};
}
function renderStats(){
  // two independently collapsible panels now: #stats (Trade Flows) and #partners (Top Partners)
  const el=document.getElementById('stats'), pel=document.getElementById('partners');
  if(!el||!pel||!D) return;
  const yrRow=y=>((D.yearly||[]).find(r=>r.year===y))||null;
  const cur=yrRow(selYear), next=yrRow(selYear+1);
  const exp=cur?cur.exports_kusd:0, imp=cur?cur.imports_kusd:0, net=exp-imp;
  const expN=next?next.exports_kusd:null, impN=next?next.imports_kusd:null;
  const gdp=GDP.get(D.iso+'|'+selYear);
  const expGDPpct=(exp>0&&gdp)?(exp/gdp/10):0, impGDPpct=(imp>0&&gdp)?(imp/gdp/10):0;

  const ranks=((TD&&TD.ranks)||[]).filter(r=>r.year===selYear);
  const wExp=rankShare(ranks,D.iso,'exports_kusd'), wImp=rankShare(ranks,D.iso,'imports_kusd');
  const region=(ranks.find(r=>r.iso3===D.iso)||{}).region||'';
  const regAbbr=REGION_ABBR[region]||region||'Reg';
  const regRows=ranks.filter(r=>r.region===region);
  const rExp=rankShare(regRows,D.iso,'exports_kusd'), rImp=rankShare(regRows,D.iso,'imports_kusd');
  const gExp=gdpRankShare(ranks,D.iso,'exports_kusd',selYear), gImp=gdpRankShare(ranks,D.iso,'imports_kusd',selYear);

  const fmt1=v=>v>0?v.toFixed(v<1?2:1)+'%':'—';
  const rk=r=>r&&r>0?`#${r}`:'—';
  const py=(D.partners_yearly||[]);
  const top=(dir)=>py.filter(p=>p.dir===dir&&p.year===selYear).sort((a,b)=>b.v-a.v).slice(0,5);
  const partnerRow=(p,dir)=>{
    const nextRow=py.find(q=>q.year===selYear+1&&q.dir===dir&&q.partner===p.partner);
    const col=dir==='dest'?'#3cb54a':'#f97316';
    return `<div class="ov-row"><span class="ov-dot" style="background:${col}"></span>
      <span class="ov-cname">${p.partner}</span><span class="ov-cval">${VIZ.fmtV(p.v)}</span>
      ${growthArrow(p.v, nextRow?nextRow.v:null)}</div>`;
  };
  const dests=top('dest'), srcs=top('src');

  el.innerHTML =
    `<div class="ov-cols">`+
      `<div class="ov-col"><span class="ov-col-label" style="color:#f97316">Imports</span><span class="ov-col-val">${VIZ.fmtV(imp)}</span>`+
        `<span class="ov-col-gdp">${impGDPpct>0?impGDPpct.toFixed(2)+'% GDP':''}</span>`+
        `<div style="margin-top:3px">${growthArrow(imp,impN)}</div></div>`+
      `<div class="ov-col-sep"></div>`+
      `<div class="ov-col"><span class="ov-col-label" style="color:#3cb54a">Exports</span><span class="ov-col-val">${VIZ.fmtV(exp)}</span>`+
        `<span class="ov-col-gdp">${expGDPpct>0?expGDPpct.toFixed(2)+'% GDP':''}</span>`+
        `<div style="margin-top:3px">${growthArrow(exp,expN)}</div></div>`+
    `</div>`+
    `<div class="ov-net" style="color:${net>=0?'#4ade80':'#f87171'}">${net>=0?'+':'−'}${VIZ.fmtV(Math.abs(net))} net</div>`+
    `<div class="ov-stat-block">`+
      `<div class="ov-stat-row"><span class="ov-stat-key">% of GDP</span><span class="ov-stat-vals"><span class="ov-stat-pct">${fmt1(gImp.pct)} / ${fmt1(gExp.pct)}</span><span class="ov-stat-rank">${rk(gImp.rank)} / ${rk(gExp.rank)}</span></span></div>`+
      `<div class="ov-stat-row"><span class="ov-stat-key">World share</span><span class="ov-stat-vals"><span class="ov-stat-pct">${fmt1(wImp.share)} / ${fmt1(wExp.share)}</span><span class="ov-stat-rank">${rk(wImp.rank)} / ${rk(wExp.rank)}</span></span></div>`+
      `<div class="ov-stat-row"><span class="ov-stat-key">${regAbbr} share</span><span class="ov-stat-vals"><span class="ov-stat-pct">${fmt1(rImp.share)} / ${fmt1(rExp.share)}</span><span class="ov-stat-rank">${rk(rImp.rank)} / ${rk(rExp.rank)}</span></span></div>`+
      `<div class="ov-stat-row"><span class="ov-stat-key">Firm sites</span><span class="ov-stat-vals"><span class="ov-stat-pct">${(D.firms||[]).length||'—'}</span></span></div>`+
    `</div>`;

  pel.innerHTML =
    (dests.length?`<div class="ov-part-title">Top Export Destinations</div>${dests.map(p=>partnerRow(p,'dest')).join('')}`:'')+
    (srcs.length?`<div class="ov-part-title">Top Import Sources</div>${srcs.map(p=>partnerRow(p,'src')).join('')}`:'')+
    ((!dests.length&&!srcs.length)?`<div class="ov-part-title">no partner data for ${selYear}</div>`:'');
}
function onYearChange(v){
  selYear=+v; document.getElementById('yr-val').textContent=selYear;
  syncBarTitle(); renderStats(); drawFusion(); drawNav();   // both nav-panel node sizes are year-specific now
}

/* ── year playback ─────────────────────────────────────────────────────────────
   NOTE (CLAUDE.md): every one of these is declared at top-level scope on purpose — a function
   declared inside an if-block is invisible globally and fails silently at call time. */
function setPlayIcon(){
  const b=document.getElementById('yr-play'); if(!b) return;
  b.textContent = playing ? '⏸' : '▶';
  b.classList.toggle('playing', playing);
  const lab = playing ? 'Pause the year playback' : 'Play the year forward';
  b.title=lab; b.setAttribute('aria-label',lab);
}
// pause: called by the button, by dragging the slider, and by loadCase (so switching tech,
// switching country or clicking a new focal country on the map all stop playback)
function stopPlay(){
  if(playTimer){ clearTimeout(playTimer); playTimer=null; }
  if(playing){ playing=false; setPlayIcon(); }
}
// onYearChange (and therefore drawFusion) is fully synchronous, so toggling animArrows around it
// is enough to scope the arrow tween to playback steps only
function setYear(y,anim){
  const ys=document.getElementById('year-slider'); if(ys) ys.value=y;
  animArrows=!!anim; onYearChange(y); animArrows=false;
}
function playStep(){
  playTimer=null;
  if(!playing) return;
  const y=Math.min(YEAR_MAX, selYear+1);
  setYear(y,true);
  if(y>=YEAR_MAX){ stopPlay(); return; }                 // stop at the last year, reset to ▶
  playTimer=setTimeout(playStep, PLAY_MS);               // chained, never overlapping
}
function togglePlay(){
  if(playing){ stopPlay(); return; }
  playing=true; setPlayIcon();
  if(selYear>=YEAR_MAX) setYear(YEAR_MIN,true);          // ▶ on the final year restarts from the first
  playTimer=setTimeout(playStep, PLAY_MS);
}

/* ── collapsible overlay panels ────────────────────────────────────────────────
   Every .pnl (except the fixed title panel) has a <button class="pnl-hd"> header. Clicking or
   pressing Enter/Space on it toggles .pnl-closed, which animates the body's max-height/opacity
   to 0 while LEAVING THE HEADER STUB VISIBLE — a shut panel is always recoverable. Open/closed
   state is persisted in localStorage under PNL_KEY.
   NOTE (CLAUDE.md): all of these are declared at top-level scope on purpose. A function declared
   inside an if-block is invisible globally and fails silently at call time. */
const PNL_KEY='navigator.panels.v1';
function pnlState(){
  try{ return JSON.parse(localStorage.getItem(PNL_KEY)||'{}')||{}; }catch(e){ return {}; }
}
function pnlSave(st){ try{ localStorage.setItem(PNL_KEY, JSON.stringify(st)); }catch(e){} }
function pnlIsOpen(id){ const st=pnlState(); return st[id]!==false; }
// Panels holding an SVG must be redrawn on expand: while collapsed their box is 0-height, so
// anything drawn then would be laid out against VIZ.dims()'s fallback size.
function pnlAfterOpen(id){ if(id==='p-nav') drawNav(); }
function pnlApply(id,open,animate){
  const p=document.getElementById(id); if(!p) return;
  const hd=p.querySelector('.pnl-hd'); if(!hd) return;
  if(!animate) p.classList.add('pnl-noanim');          // restore persisted state without a slide
  p.classList.toggle('pnl-closed',!open);
  hd.setAttribute('aria-expanded', open?'true':'false');
  if(!animate) requestAnimationFrame(()=>p.classList.remove('pnl-noanim'));
  if(open) setTimeout(()=>pnlAfterOpen(id), animate?220:0);
}
function pnlToggle(id){
  const open=!pnlIsOpen(id);
  const st=pnlState(); st[id]=open; pnlSave(st);
  pnlApply(id,open,true);
}
function initPanels(){
  document.querySelectorAll('.pnl-hd[data-pnl]').forEach(hd=>{
    const id=hd.dataset.pnl;
    // native <button> semantics: click fires for mouse AND for Enter/Space, so one listener
    // covers both pointer and keyboard activation (no extra keydown handler, which would
    // double-toggle on Space in some browsers).
    hd.addEventListener('click',()=>pnlToggle(id));
    pnlApply(id, pnlIsOpen(id), false);
  });
}

/* ── loading ───────────────────────────────────────────────────────────────── */
async function loadCase(tech,slug){
  stopPlay();   // a new tech/country/focal country always pauses the year playback
  TECH=tech; COUNTRY=slug;
  const id=tech.replace(/ /g,'_')+'_'+slug;
  try{ D=await (await fetch('data/'+id+'.json')).json(); D=Array.isArray(D)?D[0]:D; }
  catch(e){ msg(location.protocol==='file:'
      ? 'Open over HTTP, not file:// — browsers block fetch on file://. Run  python3 -m http.server  in the project root, then open the localhost URL.'
      : 'no data for '+id); return; }
  try{ TD=await (await fetch('data/_tech_'+tech.replace(/ /g,'_')+'.json')).json(); TD=Array.isArray(TD)?TD[0]:TD; }
  catch(e){ TD=null; }
  selProduct=null; selStage='ALL'; selRole='ALL'; selCat='ALL';   // reset filters on new case
  zoomT=d3.zoomIdentity; if(zoomB) d3.select('#stage').call(zoomB.transform, d3.zoomIdentity);  // recenter on new focal
  globeRot=null; globeScale=1;   // globe recenters/​rezooms on the new focal country
  document.getElementById('tech-sel').value=tech;
  const cs=document.getElementById('country-sel'); if(cs) cs.value=slug;
  drawFusion(); drawNav(); updateReadout(); initDrums(); renderStats();
}

// grouped country picker: <optgroup> per bloc, focal countries sorted first within each bloc
function populateCountrySel(){
  const cs=document.getElementById('country-sel'); cs.innerHTML='';
  const byBloc=d3.groups(COUNTRIES,c=>c.bloc)
    .sort((a,b)=>(BLOC_ORDER.indexOf(a[0])+1||99)-(BLOC_ORDER.indexOf(b[0])+1||99));
  byBloc.forEach(([bloc,cs2])=>{
    const og=document.createElement('optgroup'); og.label=bloc;
    cs2.sort((a,b)=>(b.focal-a.focal)||a.name.localeCompare(b.name)).forEach(c=>{
      const o=document.createElement('option'); o.value=c.slug; o.textContent=c.name; og.appendChild(o); });
    cs.appendChild(og);
  });
  cs.value=COUNTRY;
  cs.onchange=e=>loadCase(TECH,e.target.value);
}

async function boot(){
  const q=new URLSearchParams(location.search);
  TECH=q.get('tech')||'Solar'; COUNTRY=q.get('country')||'India';
  VIZ.setTheme('dark');
  // tech dropdown
  const ts=document.getElementById('tech-sel');
  TECHS.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t.replace(/_/g,' ');ts.appendChild(o);});
  ts.value=TECH;
  ts.onchange=e=>loadCase(e.target.value,COUNTRY);
  document.getElementById('sel-clear').onclick=clearFilters;   // clear all drum filters + selected product
  document.getElementById('mapmode').onclick=()=>setMapMode(mapMode==='globe'?'flat':'globe');
  const ft=document.getElementById('firmtoggle');
  ft.onclick=()=>{ showFirms=!showFirms; ft.classList.toggle('off',!showFirms); ft.textContent=showFirms?'🏭 Firms':'🏭 Firms (hidden)'; drawFusion(); };
  document.getElementById('nav-mode-product').onclick=()=>setNavMode('product');
  document.getElementById('nav-mode-sr').onclick=()=>setNavMode('sr');
  initPanels();    // collapsible overlay panels (restores the persisted open/closed layout)
  buildLegend();   // atlas-style SR legend (click an item to filter by stage+role)
  // country roster (bloc-grouped picker + click-to-refocus map) from the manifest
  try{ COUNTRIES=await (await fetch('data/_countries.json')).json();
       ISO2SLUG=Object.fromEntries(COUNTRIES.map(c=>[c.iso,c.slug])); populateCountrySel(); }
  catch(e){ console.warn('countries manifest',e); }
  // Phase D: year bounds (from _index.json) + shared GDP table, for the year slider + stats panel
  try{ const idx=await (await fetch('data/_index.json')).json();
       if(idx.year_min) YEAR_MIN=idx.year_min; if(idx.year_max) YEAR_MAX=idx.year_max; }
  catch(e){ console.warn('year index',e); }
  try{ const gdpRows=await (await fetch('data/_gdp.json')).json();
       gdpRows.forEach(r=>GDP.set(r.iso3+'|'+r.year, r.gdp_mil_usd)); }
  catch(e){ console.warn('gdp',e); }
  const ys=document.getElementById('year-slider');
  ys.min=YEAR_MIN; ys.max=YEAR_MAX;
  selYear=Math.min(Math.max(+(q.get('year')||2023), YEAR_MIN), YEAR_MAX);
  ys.value=selYear; document.getElementById('yr-val').textContent=selYear;
  ys.oninput=e=>{ stopPlay(); onYearChange(e.target.value); };   // dragging the slider pauses playback
  const pb=document.getElementById('yr-play'); if(pb){ pb.onclick=togglePlay; setPlayIcon(); }
  // geo (inline for file://, fetch fallback)
  try{ VIZ.initGeo(window.__WORLD110 || await (await fetch('../lib/countries-110m.json')).json()); }
  catch(e){ console.warn('geo',e); }
  // pan/zoom: scroll to zoom out and reach any country, drag to pan — then click to focus
  zoomB=d3.zoom().scaleExtent([0.6,8]).on('zoom',ev=>{ zoomT=ev.transform; if(root) root.attr('transform',zoomT); });
  d3.select('#stage').call(zoomB).on('dblclick.zoom',null);
  await loadCase(TECH,COUNTRY);
  const pp=q.get('product'); if(pp){ selProduct=pp; drawFusion(); drawNav(); updateReadout(); }
  if(q.get('map')!=='flat') setMapMode('globe');   // default to 3D globe (use ?map=flat for the flat map)
  let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{drawFusion();drawNav();fitBarTitle();},150);});
}
boot();
</script>
