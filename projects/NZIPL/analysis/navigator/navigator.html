/* ── control-bar readouts ──────────────────────────────────────────────────── */
// atlas-style "Tech / COUNTRY / year" reference title in the bar — kept in sync on case load
// (updateReadout) and on every year-slider move (onYearChange)
function syncBarTitle(){
  const btTech=document.getElementById('bar-title-tech'), btCountry=document.getElementById('bar-title-country'),
        btYear=document.getElementById('bar-title-year');
  if(btTech){ btTech.textContent=TECH.replace(/_/g,' '); btTech.style.color=TECH_COLORS[TECH]||'#fff'; }
  if(btCountry) btCountry.textContent=(COUNTRY||'').replace(/_/g,' ');
  if(btYear) btYear.textContent=selYear;
  fitBarTitle();
}
// The readout now shares the title panel with the brand block, so its column is narrow. Shrink a
// line's type only as far as it must go to fit (long techs like Electrolyzers, long countries like
// United Kingdom); everything shorter keeps the atlas's own sizes untouched.
function fitLine(el,baseRem,minRem){
  if(!el) return;
  let rem=baseRem; el.style.fontSize=rem+'rem';
  // iterate: letter-spacing is a fixed px value, so the width is not exactly proportional to the
  // font size and a single ratio pass can still leave a pixel or two of overflow
  for(let i=0;i<4 && el.clientWidth>0 && el.scrollWidth>el.clientWidth;i++){
    const next=Math.max(minRem, rem*el.clientWidth/el.scrollWidth - 0.005);
    if(next>=rem) break;                       // clamped at the floor — let it ellipsize
    rem=next; el.style.fontSize=rem.toFixed(3)+'rem';
  }
}
// Same idea as fitLine(), one axis over: a WRAPPING block in a fixed-height box. Used by the
// selection readout, whose content runs from 8 characters ("Upstream") to 249 (a full HS
// description) — the box stays put and the type gives way. Measured unclamped, because a live
// -webkit-line-clamp truncates layout and scrollHeight would report the already-clipped height,
// so the loop would think everything fits and never shrink anything.
function fitBlock(el,baseRem,minRem){
  if(!el) return baseRem;
  const box=el.clientHeight;                   // fixed by CSS — this is the whole point
  const disp=el.style.display;
  el.style.display='block'; el.style.setProperty('-webkit-line-clamp','unset');
  let rem=baseRem; el.style.fontSize=rem+'rem';
  // step down rather than ratio-scale: wrapped height is quantised to whole lines, so a single
  // proportional pass overshoots the floor on anything that needs one line less
  for(let i=0;i<16 && box>0 && el.scrollHeight>box+0.5;i++){
    const next=Math.max(minRem, rem-0.02);
    if(next>=rem) break;                       // clamped at the floor — let it ellipsize
    rem=next; el.style.fontSize=rem.toFixed(3)+'rem';
  }
  el.style.display=disp;                       // back to the clamped -webkit-box
  const lh=parseFloat(getComputedStyle(el).lineHeight)||(rem*16*1.32);
  el.style.setProperty('-webkit-line-clamp', String(Math.max(1,Math.floor((box+0.5)/lh))));
  return rem;
}
// Re-run on EVERY selection change. Hooked at the tail of updateReadout(), which is the single
// choke point for all of them: the four drums, the legend click, the dendrite node click, the
// ?product= deep link, "✕ clear all", and case load — they all reach it via redrawAll().
function fitSelTitle(){ fitBlock(document.getElementById('sel-stx'), 0.82, 0.62); }
function fitBarTitle(){
  const t=document.getElementById('bar-title-tech');
  fitLine(t,1.2,0.72);
  // whatever the tech line had to give up, the two lines under it give up too — otherwise a long
  // tech (Electrolyzers, Transmission) would end up set smaller than its own country line
  const tr=(t&&parseFloat(t.style.fontSize))||1.2;
  fitLine(document.getElementById('bar-title-country'), Math.min(0.78, tr*0.85), 0.54);
  const y=document.getElementById('bar-title-year');
  if(y) y.style.fontSize=Math.min(0.74, tr*0.8).toFixed(3)+'rem';
}
function updateReadout(){
  const cs=document.getElementById('country-sel'); if(cs&&cs.value!==COUNTRY) cs.value=COUNTRY;
  syncBarTitle();
  // Selection readout (#sel-stx, inside the Supply Chain Selector panel): what's picked right now.
  //  - Product: HS code colored by the TECH's own color, description in plain white below it.
  //  - Stage/Role: "Stage · Role" on one line — colored via the atlas's SR palette when both are
  //    exact (or when the stage has only one role anyway: Upstream/Final Product).
  //  - Category: colored via the atlas's category palette.
  const stx=document.getElementById('sel-stx'), clr=document.getElementById('sel-clear');
  //  - The readout box is a fixed height, so a long description is shrunk and finally ellipsized
  //    by fitSelTitle() below; stx.title always carries the untruncated string, because this line
  //    is the answer to "what am I looking at" and must never become unrecoverable.
  if(activeCode()){
    const ac=activeCode();
    stx.style.color='';   // plain white (var(--ink)) for the description
    stx.innerHTML='<span class="stx-hs" style="color:'+(TECH_COLORS[TECH]||'#e2e8f0')+'">HS '+ac+'</span>'+(selName()||'');
    stx.title='HS '+ac+' · '+(selName()||'');
  } else if(selStage!=='ALL'||selRole!=='ALL'){
    let col=(selStage!=='ALL'&&selRole!=='ALL')?VIZ.SR[selStage+'|'+selRole]:null;
    if(!col&&selRole==='ALL'){
      if(selStage==='Upstream') col=VIZ.SR['Upstream|Raw Material'];
      else if(selStage==='Final Product') col=VIZ.SR['Final Product|Final Product'];
    }
    stx.style.color=col||'#e2e8f0';
    stx.innerHTML=stx.title=[selStage,selRole].filter(x=>x!=='ALL').join(' · ');   // one line — the readout spans the full panel width
  } else if(selCat!=='ALL'){
    stx.style.color=VIZ.CAT[selCat]||'#e2e8f0';
    stx.innerHTML=stx.title=selCat;
  } else {
    stx.style.color='';
    stx.innerHTML=stx.title='Whole technology';
  }
  clr.style.display=anyFilter()?'':'none';
  fitSelTitle();   // AFTER the text is in the DOM and after the ✕ button's width is settled —
                   // showing/hiding "✕ clear all" changes how much width the readout has to fit in
  updateLegend();
  updateScopeFlags();
}

/* ── Phase D: atlas-parity stats panel — year-selected headline $, %GDP, world/region
   rank+share, top-5 partners, all with FORWARD-looking growth (selYear → selYear+1) ─────────── */
function growthArrow(cur,next){
  if(cur==null||next==null||!cur) return '<span class="gr gr-na">--</span>';
  const pct=(next-cur)/cur*100, abs=Math.abs(pct);
  if(abs<0.5) return `<span class="gr" style="color:rgba(148,163,184,.8)">— ${abs.toFixed(1)}%</span>`;
  const mag=Math.min(1,abs/25), alpha=0.5+0.5*mag;                 // graded intensity, saturates at 25%+
  const up=pct>0;
  return `<span class="gr" style="color:rgba(${up?'74,222,128':'248,113,113'},${alpha})">${up?'▲':'▼'} ${abs.toFixed(1)}%</span>`;
}
function rankShare(rows,iso,valKey){    // rows: [{iso3,region,exports_kusd,imports_kusd}] for one year
  const me=rows.find(r=>r.iso3===iso), val=me?(me[valKey]||0):0;
  if(!val) return {share:0,rank:null};
  const total=d3.sum(rows,r=>r[valKey]||0)||1;
  const sorted=[...rows].filter(r=>(r[valKey]||0)>0).sort((a,b)=>b[valKey]-a[valKey]);
  return {share:val/total*100, rank:sorted.findIndex(r=>r.iso3===iso)+1};
}
function gdpRankShare(rows,iso,valKey,year){
  const withGDP=rows.map(r=>({iso3:r.iso3,val:r[valKey]||0,gdp:GDP.get(r.iso3+'|'+year)}))
    .filter(r=>r.gdp>0).map(r=>({iso3:r.iso3,pct:r.val/r.gdp/10}));   // KUSD/MUSD/10 = %  (CLAUDE.md unit convention)
  const me=withGDP.find(r=>r.iso3===iso), pct=me?me.pct:0;
  if(!pct) return {pct:0,rank:null};
  const sorted=[...withGDP].filter(r=>r.pct>0).sort((a,b)=>b.pct-a.pct);
  return {pct, rank:sorted.findIndex(r=>r.iso3===iso)+1};
}

/* ── sparklines ───────────────────────────────────────────────────────────────────────────────
   NOTE (CLAUDE.md): every function below is declared at TOP-LEVEL scope on purpose — a function
   declared inside an if-block or another function is invisible globally and fails silently.

   Why these exist: growth here is forward-looking (selYear → selYear+1), so on the last year of
   the series every arrow can only print "--". The sparkline shows the whole series regardless of
   where the slider sits, and marks the selected year with a dot.

   Rendering: renderStats() rebuilds both panels with innerHTML, so the SVGs cannot be built
   inline. Each row emits an empty <span class="spk" data-spk="ID"> placeholder and queues its
   series in SPK_JOBS; flushSparks() draws into the placeholders once the HTML is in the DOM. The
   whole-innerHTML rebuild is also what keeps the node count flat across playback — the previous
   year's SVGs are dropped with the markup that held them, never accumulated.

   Fixed vs elastic width: a Top Partners row spends its width on a 3-letter ISO code, so the full
   42px is always free there. A stats row is not so lucky — it has to seat a two-value string AND a
   rank chip next to a label as long as "World share", and across a sweep of 8 tech×country cases ×
   22 years that combination leaves anywhere from ~8px to ~40px over. So stat sparklines pass w=0,
   meaning "measure the row and use what is left" — the DRAWING gives way, never the label or the
   figures. */
const SPK_W=42, SPK_MIN=20, SPK_H=13;
let SPK_JOBS=[];
function spkTag(id){ return `<span class="spk" data-spk="${id}"></span>`; }
function spkQueue(id,lines,w){ SPK_JOBS.push({id,lines,w:(w===undefined?SPK_W:w)}); return spkTag(id); }
/* lines: [{pts:[{y,v}], color}] — v===null means "no datum for that year", which is NOT zero. */
function drawSpark(el,lines,selY,width){
  if(!el) return;
  const vals=[];
  lines.forEach(L=>L.pts.forEach(p=>{ if(p.v!=null&&isFinite(p.v)) vals.push(p.v); }));
  if(vals.length<2) return;                       // a single point is not a trend; draw nothing
  const w=width||SPK_W, h=SPK_H, pad=2;
  const xs=d3.scaleLinear().domain([YEAR_MIN,YEAR_MAX]).range([pad,w-pad]);
  const hi=d3.max(vals), lo=Math.min(0,d3.min(vals));
  const ys=d3.scaleLinear().domain([lo, hi>lo?hi:lo+1]).range([h-pad,pad]);
  const svg=d3.select(el).append('svg').attr('width',w).attr('height',h)
    .attr('viewBox',`0 0 ${w} ${h}`).attr('aria-hidden','true');
  // Where you are on the slider. Drawn first so the series sits on top of it, and kept inset and
  // faint so on a sparse series it reads as a backdrop rather than competing with the two or three
  // real observations in front of it.
  svg.append('line').attr('x1',xs(selY)).attr('x2',xs(selY)).attr('y1',1).attr('y2',h-1)
    .attr('stroke','rgba(255,255,255,.16)').attr('stroke-width',1);
  const ln=d3.line().defined(p=>p.v!=null&&isFinite(p.v)).x(p=>xs(p.y)).y(p=>ys(p.v));
  lines.forEach(L=>{
    svg.append('path').attr('d',ln(L.pts)||'').attr('fill','none').attr('stroke',L.color)
      .attr('stroke-width',1).attr('stroke-linejoin','round').attr('stroke-linecap','round')
      .attr('opacity',.85);
    // A year present with both neighbours missing draws no line segment at all, so it would vanish
    // silently. Give it a dot — an isolated observation is still an observation.
    L.pts.forEach((p,i)=>{
      if(p.v==null||!isFinite(p.v)) return;
      const a=L.pts[i-1], b=L.pts[i+1];
      if((!a||a.v==null)&&(!b||b.v==null))
        svg.append('circle').attr('cx',xs(p.y)).attr('cy',ys(p.v)).attr('r',1)
          .attr('fill',L.color).attr('opacity',.85);
    });
    const cur=L.pts.find(p=>p.y===selY);
    if(cur&&cur.v!=null&&isFinite(cur.v))
      svg.append('circle').attr('cx',xs(cur.y)).attr('cy',ys(cur.v)).attr('r',1.8)
        .attr('fill',L.color).attr('stroke','#060d08').attr('stroke-width',.7);
  });
}
function flushSparks(){
  SPK_JOBS.forEach(j=>{
    const el=document.querySelector('[data-spk="'+j.id+'"]');
    if(!el) return;
    // w===0 means elastic: the placeholder is a flex:1 box, so its measured width IS the space the
    // row has left once the label, the values and the rank chip have taken theirs. Measuring here
    // rather than at queue time is the whole point — the markup is already in the DOM and laid out.
    const w = j.w || Math.floor(el.getBoundingClientRect().width);
    if(w<SPK_MIN){ el.style.flex='0 0 auto'; return; }   // too narrow to say anything; give the space back
    drawSpark(el,j.lines,selYear,Math.min(w,SPK_W));
  });
  SPK_JOBS=[];
}

/* Per-year world share, regional share and % of GDP for the focal country.
   TD.ranks carries EVERY year (≈155 countries × 22 years), not just the selected one, so these
   three rows genuinely have a series and get a sparkline. Firm sites does NOT: D.firms has no year
   field at all, so any "series" there would have to be invented — it stays a bare count.
   Memoised per tech+country: the series depends on neither selYear nor the drum filters (the world
   and regional totals are whole-technology, which is exactly what the amber note above them says). */
let SHARE_CACHE={key:null,series:null};
function shareSeries(){
  const key=TECH+'|'+(D?D.iso:'');
  if(SHARE_CACHE.key===key&&SHARE_CACHE.series) return SHARE_CACHE.series;
  const rows=((TD&&TD.ranks)||[]), iso=D?D.iso:'';
  const byYear=d3.group(rows,r=>r.year);
  const region=(rows.find(r=>r.iso3===iso)||{}).region||'';
  const out={gdpImp:[],gdpExp:[],wImp:[],wExp:[],rImp:[],rExp:[]};
  for(let y=YEAR_MIN;y<=YEAR_MAX;y++){
    const yr=byYear.get(y), me=yr?yr.find(r=>r.iso3===iso):null;
    if(!me){ Object.keys(out).forEach(k=>out[k].push({y,v:null})); continue; }
    const reg=yr.filter(r=>r.region===region), gdpY=GDP.get(iso+'|'+y);
    out.wImp.push({y,v:rankShare(yr,iso,'imports_kusd').share});
    out.wExp.push({y,v:rankShare(yr,iso,'exports_kusd').share});
    out.rImp.push({y,v:rankShare(reg,iso,'imports_kusd').share});
    out.rExp.push({y,v:rankShare(reg,iso,'exports_kusd').share});
    // no GDP for that year → null, not 0: a missing denominator is not a zero ratio
    out.gdpImp.push({y,v:gdpY>0?gdpRankShare(yr,iso,'imports_kusd',y).pct:null});
    out.gdpExp.push({y,v:gdpY>0?gdpRankShare(yr,iso,'exports_kusd',y).pct:null});
  }
  SHARE_CACHE={key,series:out};
  return out;
}

/* One partner's 22-year series, from the SAME source the row's headline value came from: the
   whole-tech partners_yearly with no filter, the matching segments of partners_yearly_sr under a
   stage/role filter. A filtered row must not be given an unfiltered picture of itself. Cached per
   tech+country+stage+role so switching drums rebuilds it.
   Either series only stores each year's TOP partners, so a year in which a partner is absent means
   "outside that year's top list" — it does NOT mean zero trade. Those years stay null and d3's
   .defined() BREAKS the line there. Interpolating across the gap or plotting a 0 would both assert
   something the data does not say. (This is why MYS and VNM read "--": they drop out of the top
   list rather than out of trade.) Filtering makes those gaps MORE common, not fewer — the _sr top-8
   is per segment — and they are shown as gaps just the same. */
let PY_CACHE={key:null,map:null};
function partnerSeries(dir,partner){
  // muOn belongs in the cache key: flipping the toggle changes every point in every series, and a
  // stale cache would leave the sparklines drawing the other basis under the new numbers.
  const key=TECH+'|'+COUNTRY+'|'+selStage+'|'+selRole+'|'+(muOn?'c':'r')+'|'+(activeCode()||'');
  if(PY_CACHE.key!==key||!PY_CACHE.map){
    const m=new Map();
    const ac=activeCode();
    if(FLOW_STATE==='ready'&&ac&&FLOWS.by.has(ac)){
      // Per-product sparklines, so the trend under a row is the trend OF that row. The rows
      // themselves already come from this series (see panelPartners); a sparkline still drawn
      // from the whole technology would put a rising tech-wide curve under a falling product.
      const sh=muShare(ac, PROD_ROLE.get(ac));
      FLOWS.by.get(ac).forEach((byYear,dir)=>byYear.forEach((rows,yr)=>
        rows.forEach(r=>m.set(dir+'|'+r.partner+'|'+yr,(m.get(dir+'|'+r.partner+'|'+yr)||0)+r.v*sh))));
    } else if(srOn()){
      ((D&&D.partners_yearly_sr)||[]).forEach(p=>{
        if(!srPass(p.stage,p.role)) return;
        const k=p.dir+'|'+p.partner+'|'+p.year;
        m.set(k,(m.get(k)||0)+muV(p));
      });
    } else {
      (((D&&(muOn?D.partners_yearly_c:D.partners_yearly)))||[])
        .forEach(p=>m.set(p.dir+'|'+p.partner+'|'+p.year,+p.v||0));
    }
    PY_CACHE={key,map:m};
  }
  const m=PY_CACHE.map, pts=[];
  for(let y=YEAR_MIN;y<=YEAR_MAX;y++){
    const k=dir+'|'+partner+'|'+y;
    pts.push({y, v:m.has(k)?m.get(k):null});
  }
  return pts;
}

function renderStats(){
  // two independently collapsible panels now: #stats (Trade Flows) and #partners (Top Partners)
  const el=document.getElementById('stats'), pel=document.getElementById('partners');
  SPK_JOBS=[];                       // dropped on an early return too — never carried into the next call
  if(!el||!pel||!D) return;
  // ── headline: filtered by the Supply Chain Selector where the data allows it ──────────────
  // With a stage and/or role picked, exports/imports (and therefore net, %GDP and the growth
  // arrows) are re-summed from D.timeline, which is keyed year × stage × role × flow.
  // With NO stage/role filter we deliberately keep reading the precomputed D.yearly series
  // instead of re-summing the whole of D.timeline: the two agree, but the builder rounds each
  // stage·role row independently, so a full re-sum can land ±2 KUSD off D.yearly. Falling back
  // keeps the unfiltered panel byte-identical to what it printed before the drums were wired in.
  // This `scope` picks the SERIES ONLY — it is read for .on and nothing else, and is called with
  // no product argument on purpose. The captions get their own scopes further down, after `pf` has
  // settled whether the product reached the headline. Do not reuse this one for labelling.
  const scope=flowScope();
  const yrRow=y=>((D.yearly||[]).find(r=>r.year===y))||null;
  let exp,imp,expN,impN;
  if(scope.on){
    const c=tlYear(selYear), n=tlYear(selYear+1);
    exp=c?c.exp:0; imp=c?c.imp:0;
    expN=n?n.exp:null; impN=n?n.imp:null;
  } else {
    const cur=yrRow(selYear), next=yrRow(selYear+1);
    const EK=muKey('exports_kusd'), IK=muKey('imports_kusd');
    exp=cur?cur[EK]:0; imp=cur?cur[IK]:0;
    expN=next?next[EK]:null; impN=next?next[IK]:null;
  }
  // ── the selected product's OWN headline ─────────────────────────────────────────────────
  // In navigator.html a single product is a filter the trade series cannot honour: the timeline
  // is keyed year × stage × role × flow with no code dimension, so the panel keeps showing the
  // whole technology and updateScopeFlags() raises an amber "not applied" chip. On THIS page a
  // product is the primary selection, so a headline that silently reports the whole tech would
  // be the wrong number under the right label. products_flow (year × code × flow, added 2026-08-06)
  // does carry the code, so it answers exactly this and the panel switches to the product alone.
  // Falls through untouched when the code is outside products_flow's top-150 cut — better the
  // tech-level number, still chip-labelled, than a confident zero.
  const pf=productFlow(activeCode());
  if(pf){
    const at=y=>({e:pf.get(y+'|exp')||0, i:pf.get(y+'|imp')||0});
    const c=at(selYear), n=at(selYear+1);
    exp=c.e; imp=c.i;
    expN=pf.has((selYear+1)+'|exp')?n.e:null; impN=pf.has((selYear+1)+'|imp')?n.i:null;
  }
  const net=exp-imp;
  const gdp=GDP.get(D.iso+'|'+selYear);
  const expGDPpct=(exp>0&&gdp)?(exp/gdp/10):0, impGDPpct=(imp>0&&gdp)?(imp/gdp/10):0;

  const ranks=((TD&&TD.ranks)||[]).filter(r=>r.year===selYear);
  // Rank and share follow the toggle too. They sit beside the headline in this same panel, and a
  // corrected total next to a raw world rank is the kind of unlabelled mismatch this page exists
  // to avoid — the builder ranks all PC countries on both bases for exactly this reason.
  const wExp=rankShare(ranks,D.iso,muKey('exports_kusd')), wImp=rankShare(ranks,D.iso,muKey('imports_kusd'));
  const region=(ranks.find(r=>r.iso3===D.iso)||{}).region||'';
  const regAbbr=REGION_ABBR[region]||region||'Reg';
  const regRows=ranks.filter(r=>r.region===region);
  const rExp=rankShare(regRows,D.iso,muKey('exports_kusd')), rImp=rankShare(regRows,D.iso,muKey('imports_kusd'));
  const gExp=gdpRankShare(ranks,D.iso,muKey('exports_kusd'),selYear), gImp=gdpRankShare(ranks,D.iso,muKey('imports_kusd'),selYear);

  const fmt1=v=>v>0?v.toFixed(v<1?2:1)+'%':'—';
  const rk=r=>r&&r>0?`#${r}`:'—';
  // Top Partners: partnersAt() picks the whole-tech series or the stage/role-segmented one, so the
  // list, its sparklines and the map arrows all move together under the drums.
  // Top Partners must sit on the SAME series as the headline above it. Before this, the headline
  // read the selected product while this list still read the whole technology — so Solar/India
  // printed "$3.1B imports" over a China row of $5.3B, a partner larger than the total it sits
  // under. Two different questions answered in one box, with nothing saying so.
  const panelPartners=(dir,year)=>flowPartnersAt(activeCode(),dir,year)||partnersAt(dir,year);
  const top=(dir)=>panelPartners(dir,selYear).slice(0,5);
  const partnerRow=(p,dir)=>{
    const nextRow=panelPartners(dir,selYear+1).find(q=>q.partner===p.partner);
    const col=dir==='dest'?'#3cb54a':'#f97316';
    const spk=spkQueue('pt-'+dir+'-'+p.partner, [{pts:partnerSeries(dir,p.partner), color:col}]);
    // The sparkline replaces the "--" rather than sitting next to it: a row must not carry both a
    // shrug and a picture of the same thing. A real percentage is still worth its space, so rows
    // that have a next year keep the arrow AND gain the series.
    const gr=nextRow?growthArrow(p.v,nextRow.v):'';
    return `<div class="ov-row"><span class="ov-dot" style="background:${col}"></span>
      <span class="ov-cname">${p.partner}</span><span class="ov-cval">${VIZ.fmtV(p.v)}</span>
      ${spk}${gr}</div>`;
  };
  const dests=top('dest'), srcs=top('src');

  // ── scope notes ───────────────────────────────────────────────────────────────────────────
  // ▣ green: which drum dimensions the headline above actually applied.
  // ◌ amber: which ones it could not, and why — stated, never silently dropped.
  const filtered=anyFilter();
  // `pf` above decided the headline; ask the partner series its own question. Two scopes, because
  // the two panels can genuinely differ — see prodInFlows / prodInPartners.
  const fScope=flowScope(!!pf), pScope=flowScope(prodInPartners());
  const scopeOn = fScope.live
    ? `<div class="flt-note flt-on">▣ filtered · ${fScope.applied.join(' · ')}</div>` : '';
  const scopeOff = fScope.ignored.length
    ? `<div class="flt-note flt-off">◌ ${fScope.ignored.join(' and ')} not applied — ${scopeOffWhy(fScope,'the total above')}</div>` : '';
  const rankNote = filtered
    ? `<div class="flt-note flt-off">◌ whole technology — world &amp; regional totals are not split by stage · role</div>` : '';
  // Top Partners honours stage, role and — via the sidecar — the single HS code. What it still
  // cannot do is category, and a product whose flows never loaded; only those earn amber.
  const partnerOn = pScope.live
    ? `<div class="flt-note flt-on">▣ filtered · ${pScope.applied.join(' · ')}</div>` : '';
  const partnerOff = pScope.ignored.length
    ? `<div class="flt-note flt-off">◌ ${pScope.ignored.join(' and ')} not applied — ${scopeOffWhy(pScope,'the list below')}</div>` : '';
  // ── multi-use basis note ──────────────────────────────────────────────────────────────────
  // Shown only in corrected mode: raw is the basis every earlier build used, and labelling the
  // default would be noise. Amber when the active tech has no EXIOBASE mapping at all, because
  // then "corrected" is displaying raw numbers and that must not pass silently.
  const muNote = !muOn ? ''
    : muUnmapped()
      ? `<div class="flt-note flt-off">◌ ${TECH} is not in EXIOBASE — these figures are uncorrected raw trade</div>`
      : `<div class="flt-note flt-on">▣ multi-use corrected · raw × EXIOBASE direct use share${MU_YEAR?' ('+MU_YEAR+')':''} — ${MU_NOTE}</div>`;

  // Sparkline series for the three share rows. IMP is amber and EXP green on one shared y-scale,
  // matching the Imports/Exports labels above and keeping the pair directly comparable.
  const SS=shareSeries(), CI='#f97316', CE='#3cb54a';
  const pair=(id,a,b)=>spkQueue(id,[{pts:a,color:CI},{pts:b,color:CE}],0);   // 0 = elastic, see flushSparks
  const spkGDP=pair('st-gdp',SS.gdpImp,SS.gdpExp);
  const spkWorld=pair('st-world',SS.wImp,SS.wExp);
  const spkReg=pair('st-reg',SS.rImp,SS.rExp);

  el.innerHTML =
    muNote + scopeOn + scopeOff +
    `<div class="ov-cols">`+
      `<div class="ov-col"><span class="ov-col-label" style="color:#f97316">Imports</span><span class="ov-col-val">${VIZ.fmtV(imp)}</span>`+
        `<span class="ov-col-gdp">${impGDPpct>0?impGDPpct.toFixed(2)+'% GDP':''}</span>`+
        `<div style="margin-top:3px">${growthArrow(imp,impN)}</div></div>`+
      `<div class="ov-col-sep"></div>`+
      `<div class="ov-col"><span class="ov-col-label" style="color:#3cb54a">Exports</span><span class="ov-col-val">${VIZ.fmtV(exp)}</span>`+
        `<span class="ov-col-gdp">${expGDPpct>0?expGDPpct.toFixed(2)+'% GDP':''}</span>`+
        `<div style="margin-top:3px">${growthArrow(exp,expN)}</div></div>`+
    `</div>`+
    `<div class="ov-net" style="color:${net>=0?'#4ade80':'#f87171'}">${net>=0?'+':'−'}${VIZ.fmtV(Math.abs(net))} net</div>`+
    rankNote+
    `<div class="ov-stat-block${filtered?' flt-stale':''}">`+
      `<div class="ov-stat-row"><span class="ov-stat-key">% of GDP</span><span class="ov-stat-vals">${spkGDP}<span class="ov-stat-pct">${fmt1(gImp.pct)} / ${fmt1(gExp.pct)}</span><span class="ov-stat-rank">${rk(gImp.rank)} / ${rk(gExp.rank)}</span></span></div>`+
      `<div class="ov-stat-row"><span class="ov-stat-key">World share</span><span class="ov-stat-vals">${spkWorld}<span class="ov-stat-pct">${fmt1(wImp.share)} / ${fmt1(wExp.share)}</span><span class="ov-stat-rank">${rk(wImp.rank)} / ${rk(wExp.rank)}</span></span></div>`+
      `<div class="ov-stat-row"><span class="ov-stat-key">${regAbbr} share</span><span class="ov-stat-vals">${spkReg}<span class="ov-stat-pct">${fmt1(rImp.share)} / ${fmt1(rExp.share)}</span><span class="ov-stat-rank">${rk(rImp.rank)} / ${rk(rExp.rank)}</span></span></div>`+
      // Firm sites deliberately has NO sparkline: D.firms carries lat/lon/stage/role/n and no year
      // at all, so there is no series to draw. A flat line would be a fabrication.
      `<div class="ov-stat-row"><span class="ov-stat-key">Firm sites</span><span class="ov-stat-vals"><span class="ov-stat-pct">${(D.firms||[]).length||'—'}</span></span></div>`+
    `</div>`;

  // The partner panel is never hidden under a filter — a hidden panel is worse than a labelled
  // one. It is held back in contrast only when it is genuinely stale, i.e. when a filter is on and
  // NONE of it reached this list (a category alone, or a product whose flows never loaded). Under
  // a stage/role selection — or a product the sidecar answered — the list is live and reads at
  // full strength. Dimming it on pScope.on rather than pScope.live is what greyed out a list that
  // was in fact showing exactly the product asked for.
  pel.innerHTML = muNote + partnerOn + partnerOff +
    `<div class="${(!pScope.live&&filtered)?'flt-stale':''}">`+
    (dests.length?`<div class="ov-part-title">Top Export Destinations</div>${dests.map(p=>partnerRow(p,'dest')).join('')}`:'')+
    (srcs.length?`<div class="ov-part-title">Top Import Sources</div>${srcs.map(p=>partnerRow(p,'src')).join('')}`:'')+
    ((!dests.length&&!srcs.length)?`<div class="ov-part-title">no partner data for ${selYear}${pScope.live?' · '+pScope.applied.join(' · '):''}</div>`:'')+
    `</div>`;
  flushSparks();          // both panels are in the DOM now — draw into the queued placeholders
  updateScopeFlags();
}
function onYearChange(v){
  selYear=+v; document.getElementById('yr-val').textContent=selYear;
  syncBarTitle(); renderStats(); drawFusion(); drawNav();   // both nav-panel node sizes are year-specific now
}

/* ── year playback ─────────────────────────────────────────────────────────────
   NOTE (CLAUDE.md): every one of these is declared at top-level scope on purpose — a function
   declared inside an if-block is invisible globally and fails silently at call time. */
function setPlayIcon(){
  const b=document.getElementById('yr-play'); if(!b) return;
  b.textContent = playing ? '⏸' : '▶';
  b.classList.toggle('playing', playing);
  const lab = playing ? 'Pause the year playback' : 'Play the year forward';
  b.title=lab; b.setAttribute('aria-label',lab);
}
// pause: called by the button, by dragging the slider, and by loadCase (so switching tech,
// switching country or clicking a new focal country on the map all stop playback)
function stopPlay(){
  if(playTimer){ clearTimeout(playTimer); playTimer=null; }
  if(playing){ playing=false; setPlayIcon(); }
}
// onYearChange (and therefore drawFusion) is fully synchronous, so toggling animArrows around it
// is enough to scope the arrow tween to playback steps only
function setYear(y,anim){
  const ys=document.getElementById('year-slider'); if(ys) ys.value=y;
  animArrows=!!anim; onYearChange(y); animArrows=false;
}
function playStep(){
  playTimer=null;
  if(!playing) return;
  const y=Math.min(YEAR_MAX, selYear+1);
  setYear(y,true);
  if(y>=YEAR_MAX){ stopPlay(); return; }                 // stop at the last year, reset to ▶
  playTimer=setTimeout(playStep, PLAY_MS);               // chained, never overlapping
}
function togglePlay(){
  if(playing){ stopPlay(); return; }
  playing=true; setPlayIcon();
  if(selYear>=YEAR_MAX) setYear(YEAR_MIN,true);          // ▶ on the final year restarts from the first
  playTimer=setTimeout(playStep, PLAY_MS);
}

/* ── collapsible overlay panels ────────────────────────────────────────────────
   Every .pnl (except the fixed title panel) has a <button class="pnl-hd"> header. Clicking or
   pressing Enter/Space on it toggles .pnl-closed, which animates the body's max-height/opacity
   to 0 while LEAVING THE HEADER STUB VISIBLE — a shut panel is always recoverable. Open/closed
   state is persisted in localStorage under PNL_KEY.
   NOTE (CLAUDE.md): all of these are declared at top-level scope on purpose. A function declared
   inside an if-block is invisible globally and fails silently at call time. */
const PNL_KEY='navigator.panels.v1';
// Panels that no longer exist. 'p-sel' (the old "Selection" panel) was dissolved into p-drums —
// a returning user can still have {"p-sel":false} in storage. Nothing reads it any more (initPanels
// only walks live headers), but it is stripped on load so the stored layout stays a truthful
// description of the UI and can never resurrect a hidden readout.
const PNL_RETIRED=['p-sel'];
function pnlState(){
  try{
    const st=JSON.parse(localStorage.getItem(PNL_KEY)||'{}')||{};
    PNL_RETIRED.forEach(k=>{ delete st[k]; });
    return st;
  }catch(e){ return {}; }
}
function pnlSave(st){ try{ localStorage.setItem(PNL_KEY, JSON.stringify(st)); }catch(e){} }
// one-shot migration: rewrite storage without the retired keys, so the stale entry is gone for good
function pnlPrune(){ pnlSave(pnlState()); }
function pnlIsOpen(id){ const st=pnlState(); return st[id]!==false; }
// Panels holding an SVG must be redrawn on expand: while collapsed their box is 0-height, so
// anything drawn then would be laid out against VIZ.dims()'s fallback size.
function pnlAfterOpen(id){ if(id==='p-nav') drawNav(); }
function pnlApply(id,open,animate){
  const p=document.getElementById(id); if(!p) return;
  const hd=p.querySelector('.pnl-hd'); if(!hd) return;
  if(!animate) p.classList.add('pnl-noanim');          // restore persisted state without a slide
  p.classList.toggle('pnl-closed',!open);
  hd.setAttribute('aria-expanded', open?'true':'false');
  if(!animate) requestAnimationFrame(()=>p.classList.remove('pnl-noanim'));
  if(open) setTimeout(()=>pnlAfterOpen(id), animate?220:0);
}
function pnlToggle(id){
  const open=!pnlIsOpen(id);
  const st=pnlState(); st[id]=open; pnlSave(st);
  pnlApply(id,open,true);
}
function initPanels(){
  pnlPrune();   // drop retired panel keys before restoring the persisted layout
  document.querySelectorAll('.pnl-hd[data-pnl]').forEach(hd=>{
    const id=hd.dataset.pnl;
    // native <button> semantics: click fires for mouse AND for Enter/Space, so one listener
    // covers both pointer and keyboard activation (no extra keydown handler, which would
    // double-toggle on Space in some browsers).
    hd.addEventListener('click',()=>pnlToggle(id));
    pnlApply(id, pnlIsOpen(id), false);
  });
}

/* ── loading ───────────────────────────────────────────────────────────────── */
async function loadCase(tech,slug){
  stopPlay();   // a new tech/country/focal country always pauses the year playback
  TECH=tech; COUNTRY=slug;
  const id=tech.replace(/ /g,'_')+'_'+slug;
  try{ D=await (await fetch('data/'+id+'.json')).json(); D=Array.isArray(D)?D[0]:D; }
  catch(e){ msg(location.protocol==='file:'
      ? 'Open over HTTP, not file:// — browsers block fetch on file://. Run  python3 -m http.server  in the project root, then open the localhost URL.'
      : 'no data for '+id); return; }
  // Compact fields → row objects, once, before anything reads them. A failure here is fatal on
  // purpose: partnersAt() would otherwise compare a raw integer against 'Midstream' and just
  // return an empty partner list, which looks like "no trade in this segment" rather than a bug.
  try{ D.partners_yearly_sr=decodeBlk(D.partners_yearly_sr); }
  catch(err){ console.error(err); msg(err.message); D=null; return; }
  // HS code -> role, for the fields that carry a code but not a role (products_yearly). Rebuilt
  // per case because the role of a code is a property of the TECH, not of the code alone.
  PROD_ROLE=new Map(((D&&D.products)||[]).map(p=>[p.code,p.role]));
  try{ TD=await (await fetch('data/_tech_'+tech.replace(/ /g,'_')+'.json')).json(); TD=Array.isArray(TD)?TD[0]:TD; }
  catch(e){ TD=null; }
  selProduct=null; selStage='ALL'; selRole='ALL'; selCat='ALL';   // reset filters on new case
  // Per-product flows for the new case. NOT awaited: the stage draws immediately from the
  // bundle (chain + whole-tech arrows) and ensureFlows() calls drawFusion() again when it
  // resolves. Awaiting here would hold the whole page on a ~300 KB fetch to swap one series.
  FLOW_STATE='idle'; ensureFlows();
  zoomT=d3.zoomIdentity; if(zoomB) d3.select('#stage').call(zoomB.transform, d3.zoomIdentity);  // recenter on new focal
  globeRot=null; globeScale=1;   // globe recenters/​rezooms on the new focal country
  document.getElementById('tech-sel').value=tech;
  const cs=document.getElementById('country-sel'); if(cs) cs.value=slug;
  drawFusion(); drawNav(); updateReadout(); initDrums(); renderStats();
}

// grouped country picker: <optgroup> per bloc, focal countries sorted first within each bloc
function populateCountrySel(){
  const cs=document.getElementById('country-sel'); cs.innerHTML='';
  const byBloc=d3.groups(COUNTRIES,c=>c.bloc)
    .sort((a,b)=>(BLOC_ORDER.indexOf(a[0])+1||99)-(BLOC_ORDER.indexOf(b[0])+1||99));
  byBloc.forEach(([bloc,cs2])=>{
    const og=document.createElement('optgroup'); og.label=bloc;
    cs2.sort((a,b)=>(b.focal-a.focal)||a.name.localeCompare(b.name)).forEach(c=>{
      const o=document.createElement('option'); o.value=c.slug; o.textContent=c.name; og.appendChild(o); });
    cs.appendChild(og);
  });
  cs.value=COUNTRY;
  cs.onchange=e=>loadCase(TECH,e.target.value);
}

async function boot(){
  const q=new URLSearchParams(location.search);
  TECH=q.get('tech')||'Solar'; COUNTRY=q.get('country')||'India';
  VIZ.setTheme('dark');
  // tech dropdown
  const ts=document.getElementById('tech-sel');
  TECHS.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t.replace(/_/g,' ');ts.appendChild(o);});
  ts.value=TECH;
  ts.onchange=e=>loadCase(e.target.value,COUNTRY);
  const sc=document.getElementById('sel-clear');
  if(sc) sc.onclick=clearFilters;   // back to the default (largest) node
  // #mapmode is deliberately absent on this page — the stage is always chain + globe, so a
  // flat/globe toggle would be dead UI. Bind defensively rather than assuming: an unguarded
  // getElementById().onclick here throws during init and kills every binding after it.
  const mb=document.getElementById('mapmode');
  if(mb) mb.onclick=()=>setMapMode(mapMode==='globe'?'flat':'globe');
  const ft=document.getElementById('firmtoggle');
  if(ft) ft.onclick=()=>{ showFirms=!showFirms; ft.classList.toggle('off',!showFirms); ft.textContent=showFirms?'🏭 Firms':'🏭 Firms (hidden)'; drawFusion(); };
  document.getElementById('mutoggle').onclick=setMuMode;
  document.getElementById('nav-mode-product').onclick=()=>setNavMode('product');
  document.getElementById('nav-mode-sr').onclick=()=>setNavMode('sr');
  initPanels();    // collapsible overlay panels (restores the persisted open/closed layout)
  buildLegend();   // atlas-style SR legend (click an item to filter by stage+role)
  // country roster (bloc-grouped picker + click-to-refocus map) from the manifest
  try{ COUNTRIES=await (await fetch('data/_countries.json')).json();
       ISO2SLUG=Object.fromEntries(COUNTRIES.map(c=>[c.iso,c.slug])); populateCountrySel(); }
  catch(e){ console.warn('countries manifest',e); }
  // Phase D: year bounds (from _index.json) + shared GDP table, for the year slider + stats panel
  // ...and the decoder tables for the compact case fields (see decodeBlk). Fetched here, ahead of
  // the first loadCase() below, because a case cannot be decoded without them.
  try{ let idx=await (await fetch('data/_index.json')).json(); idx=Array.isArray(idx)?idx[0]:idx;
       if(idx.year_min) YEAR_MIN=idx.year_min; if(idx.year_max) YEAR_MAX=idx.year_max;
       if(idx.lookups) LOOK=idx.lookups;
       // Multi-use shares ride in the same index, for the same reason as the decoder tables: one
       // fetch at boot, not a copy in all 297 case files.
       if(idx.use_shares) USE_SHARES=idx.use_shares;
       MU_ROLES=idx.use_share_measured_roles||[];
       MU_NOTE=idx.use_share_note||''; MU_YEAR=idx.use_share_source_year||null; }
  catch(e){ console.warn('year index',e); }
  try{ const gdpRows=await (await fetch('data/_gdp.json')).json();
       gdpRows.forEach(r=>GDP.set(r.iso3+'|'+r.year, r.gdp_mil_usd)); }
  catch(e){ console.warn('gdp',e); }
  const ys=document.getElementById('year-slider');
  ys.min=YEAR_MIN; ys.max=YEAR_MAX;
  selYear=Math.min(Math.max(+(q.get('year')||2023), YEAR_MIN), YEAR_MAX);
  ys.value=selYear; document.getElementById('yr-val').textContent=selYear;
  ys.oninput=e=>{ stopPlay(); onYearChange(e.target.value); };   // dragging the slider pauses playback
  const pb=document.getElementById('yr-play'); if(pb){ pb.onclick=togglePlay; setPlayIcon(); }
  // geo (inline for file://, fetch fallback)
  try{ VIZ.initGeo(window.__WORLD110 || await (await fetch('../lib/countries-110m.json')).json()); }
  catch(e){ console.warn('geo',e); }
  // pan/zoom: scroll to zoom out and reach any country, drag to pan — then click to focus
  zoomB=d3.zoom().scaleExtent([0.6,8]).on('zoom',ev=>{ zoomT=ev.transform; if(root) root.attr('transform',zoomT); });
  d3.select('#stage').call(zoomB).on('dblclick.zoom',null);
  await loadCase(TECH,COUNTRY);
  const pp=q.get('product'); if(pp){ selProduct=pp; redrawAll(); }
  if(q.get('map')!=='flat') setMapMode('globe');   // default to 3D globe (use ?map=flat for the flat map)
  let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{drawFusion();drawNav();fitBarTitle();fitSelTitle();},150);});
}
boot();
</script>
</body>
</html>
