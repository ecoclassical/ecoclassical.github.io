<script>
/* ── engine country roster ─────────────────────────────────────────────────── */
// COUNTRIES is loaded from data/_countries.json (generated from case_registry.csv),
// so the picker + click-to-refocus map auto-expand as the engine's roster grows.
let COUNTRIES = [];               // [{iso, slug, name, bloc, focal}]
let ISO2SLUG = {};                // iso3 → slug (rebuilt from COUNTRIES)
const BLOC_ORDER = ["Factory North America","Factory Asia","Factory Europe",
                    "Supplier South America","Supplier Africa","Supplier Oceania",
                    "Supplier Eurasia","Other"];
const TECHS = ["Solar","Wind","Batteries","Biofuel","Electrolyzers","Geothermal",
  "Heat_Pumps","Magnets","Nuclear","Transmission","EVs"];
// canonical tech palette (CLAUDE.md) — drives the #bar-title reference readout
const TECH_COLORS = {Solar:'#eab308',Nuclear:'#0ea5e9',Batteries:'#f59e0b',Transmission:'#06b6d4',
  Wind:'#3b82f6',Biofuel:'#84cc16',Electrolyzers:'#a855f7',Geothermal:'#ef4444',
  Heat_Pumps:'#f97316',Magnets:'#ec4899',EVs:'#14b8a6'};

/* ── state ─────────────────────────────────────────────────────────────────── */
let TECH="Solar", COUNTRY="India";
let D=null, TD=null;           // case json, tech json (dendrite tree)
let selProduct=null;           // selected HS code (solar-system navigation)
// The chain node the globe currently occupies. Written by drawFusion(), read by the overview
// panel's position marker — one variable rather than each view picking its own node, because
// several process steps can share one HS code and two independent picks would disagree.
let STAGE_SEL_CN=null, STAGE_SEL_CODE=null, STAGE_L=null;
/* Declared with the rest of the state, not down beside drawNav(), because chainLayout()
   reads it and is defined earlier in the file — a `let` further down would sit in the
   temporal dead zone for any caller that ran before it. */
let navMode='product';   // 'product' (per-HS-code dendrite) | 'sr' (7-node stage/role network)
/* Remembers the HS code picked in By Product across a trip through By Stage/Role, so
   coming back restores the same product rather than the largest node. */
let navModeMemoCode=null;
/* The HS code the page is currently ABOUT. Not the same thing as selProduct: the globe always
   occupies some node (the largest, before anything is clicked), so on first load selProduct is
   null while the stage is unmistakably showing one product. Reading the panel off selProduct
   there printed whole-technology totals beside a globe labelled with a single product — the
   right label over the wrong number. Both sides read this instead, so they cannot disagree,
   and clearFilters() still means something because it resets the drums rather than this. */
/* ── THE selection, in one place ───────────────────────────────────────────────
   Four control surfaces can write it — a node in the stage map, a node in the overview
   map, the drums, the SR legend — and every panel must read the same answer from all
   four. Before this the answer was inferred separately at each call site from
   `selProduct || STAGE_SEL_CODE`, which is how the headline and Top Partners once came
   to answer different questions in the same box (a $5.3B China row under a $3.1B
   imports total — B-21).

   `code` is an HS code or null, NEVER a "Stage|Role" key: `STAGE_SEL_CODE` is already
   null in sr mode for that reason (see drawFusion). `stage`/`role` are 'ALL' unless
   narrowed. `mode` says which of the two data paths a panel should read:
     · product  → productFlow() / flowPartnersAt(), the code-grained series + sidecar
     · sr       → tlYear() / partnersAt(), the srPass()-filtered series
   Both already exist and both already work. This is a router, not new arithmetic. */
function selection(){
  return {mode: navMode, code: (navMode==='sr' ? null : (selProduct || STAGE_SEL_CODE)),
          stage: selStage, role: selRole,
          /* true when the user picked the code, false when it is the auto-selected
             largest node the globe defaults to. The panels read the same series either
             way; the captions must not claim a pick that never happened. */
          picked: !!selProduct};
}
function activeCode(){ return selection().code; }
let selStage='ALL', selRole='ALL', selCat='ALL';   // drum filters (top-bar drumwheels)
let root=null, zoomB=null, zoomT=d3.zoomIdentity;   // pan/zoom container + behavior + transform
let mapMode='flat', globeRot=null, globeScale=1;    // flat map ⇄ 3D orthographic globe
let showFirms=true;   // toggle for the S&P firm-activity dots layer
// Phase D: stats-panel focal year. Growth is FORWARD-looking (selYear → selYear+1) — picking the
// latest available year shows "--" for every growth field, since there's no next year to compare.
let selYear=2023, YEAR_MIN=2003, YEAR_MAX=2024;
/* year playback (the ▶ button next to the slider). A CHAINED setTimeout, not setInterval: every
   redraw is synchronous, so the next step is scheduled only once the current one has painted and
   rapid stepping can never queue overlapping redraws. animArrows/prevArrows let drawFusion tween
   each trade arrow from last year's width to this year's instead of hard-cutting. */
let playing=false, playTimer=null;
const PLAY_MS=820;                 // one year per ~0.8s
const ARROW_MS=420;                // arrow tween — kept well under PLAY_MS so it always lands
let animArrows=false;              // true only for a playback-driven drawFusion
let prevArrows=new Map();          // "dir|partner" -> {w,o,r} as drawn for the previous year
let GDP=new Map();   // "iso3|year" -> gdp_mil_usd, shared across all techs (data/_gdp.json)
/* Decoder tables for the engine's compact fields, from data/_index.json (written by
   scripts/proto/build_datadriven_proto.R). Empty until boot() has fetched the index — decodeBlk()
   treats that as a hard error rather than a reason to improvise. */
let LOOK={};
const REGION_ABBR={"East Asia & Pacific":"EAP","Europe & Central Asia":"ECA","South Asia":"SAS",
  "North America":"NAC","Latin America & Caribbean":"LCN","Middle East & North Africa":"MEA","Sub-Saharan Africa":"SSA"};

/* ── multi-use correction (raw ⇄ corrected) ──────────────────────────────────────────────────
   Trade data counts a copper cathode as copper, whatever it ends up in. A country's "solar"
   upstream is therefore mostly trade that never reaches a panel. EXIOBASE direct_use_share is the
   fraction of a product's trade that plausibly serves THIS technology, so the corrected view is
   raw x share, per HS code, per tech.

   TWO MECHANISMS, because the engine's fields differ in what they still carry:
     · fields that keep a `code`  (products, products_yearly) → corrected HERE, muShare() x value.
     · fields that summed the product dimension away (yearly, timeline, partners_yearly,
       partners_yearly_sr, the per-tech ranks) → the builder ships the corrected value alongside
       the raw one and muV() picks the active side. No client-side multiply can recover a
       per-product correction from a total that no longer has products in it.
   Partner rankings are NOT stable under the correction — it re-ranks them, so partners_yearly_c
   is its own independently-ranked top-8 and partners_yearly_sr carries the UNION of both top-8s.
   Never scale a raw ranking and call it corrected.

   WHERE THE SHARE IS 1.0 IT IS A REASON, NOT A GAP. Only raw and processed materials carry a
   measurement; components, equipment and final products are assumed already tech-specific and
   keep their raw value. That is a modelling decision, and the UI says so rather than implying
   a measurement nobody made. Techs absent from EXIOBASE (EVs) are uncorrected throughout. */
let muOn=false;                  // false = raw (the default, and what every earlier build showed)
let USE_SHARES={}, MU_ROLES=[], MU_NOTE='', MU_YEAR=null;   // from data/_index.json
let PROD_ROLE=new Map();         // HS code -> role, rebuilt per case (products_yearly has no role)
/* Share for one HS code in the ACTIVE tech. Returns 1 in raw mode, for a tech with no EXIOBASE
   mapping, for a downstream role, and for a code the parquet never measured — four different
   reasons for the same number, all of them "leave this value alone". */
function muShare(code, role){
  if(!muOn) return 1;
  if(MU_ROLES.indexOf(role)<0) return 1;
  const t=USE_SHARES[TECH]; if(!t) return 1;
  const s=t[code];
  return (s===undefined) ? 1 : s;
}
/* Active-side value of a row the builder gave a corrected twin. */
const muV = r => muOn ? (+r.v_c||0) : (+r.v||0);
/* Column name for the same choice on the per-tech ranks table. */
const muKey = k => muOn ? k+'_c' : k;
/* True when the active tech has no EXIOBASE shares at all, so "corrected" is showing raw
   numbers under a corrected label — the one case the toggle must actively disclose. */
function muUnmapped(){ return muOn && !USE_SHARES[TECH]; }
/* Flip the basis and redraw everything that carries a value. PY_CACHE is invalidated through its
   key (see partnerSeries), so the only thing to reset here is the label. */
function setMuMode(){
  muOn=!muOn;
  const b=document.getElementById('mutoggle');
  if(b){ b.classList.toggle('mu-on',muOn);
         b.textContent = muOn ? '⚖️ Corrected' : '⚖️ Raw';
         b.title = muOn
           ? 'Showing multi-use corrected trade — raw x EXIOBASE direct use share'+(MU_YEAR?' ('+MU_YEAR+')':'')+'. Click for raw.'
           : 'Showing raw trade, as reported. Click to correct for multi-use.'; }
  drawFusion(); drawNav(); renderStats(); updateReadout();
}

/* ── tiny helpers ──────────────────────────────────────────────────────────── */
const tipEl=()=>document.getElementById('tip');
function tip(e,h){ const t=tipEl(); t.style.opacity=1; t.style.left=(e.clientX+13)+'px'; t.style.top=(e.clientY+13)+'px'; t.innerHTML=h; }
function tipOut(){ tipEl().style.opacity=0; }
function msg(t){ d3.select('#stage').selectAll('*').remove();
  d3.select('#stage').append('text').attr('x','50%').attr('y','50%').attr('text-anchor','middle')
    .attr('fill','rgba(148,163,184,.7)').attr('font-size',13).text(t); }

function hashCode(s){ let h=0; s=String(s); for(let i=0;i<s.length;i++){ h=(h*31+s.charCodeAt(i))|0; } return Math.abs(h); }

/* ── compact wire format → row objects ────────────────────────────────────────────────────────
   NOTE (CLAUDE.md): declared at top-level scope on purpose.

   D.partners_yearly_sr ships as {cols, rows} with rows as bare arrays and the stage/role/dir
   columns as 0-based integer indices into LOOK — the same blk()/i0() encoding the Data Explorer
   slices use (scripts/proto/build_data_explorer_slices.R). It is 598,775 rows across the 297
   cases, so spelling out "Midstream"/"Product Component" and six key names on every one of them
   was 59 MB of the engine's 94 MB.

   Decoding happens HERE, once, at the point the case JSON lands — not at each of the four places
   that read the field. Every consumer downstream (partnersAt, partnerSeries, and through them the
   partner list, the sparklines and the map arrows) therefore sees exactly the row objects it saw
   before, and cannot disagree with another consumer about how a code maps. It also costs less
   memory than the strings did: all 598k decoded values are references to the same handful of
   strings in the lookup array, where JSON parsing minted a fresh string per row.

   An index with no entry in the lookup THROWS. Silently yielding `undefined` would file one
   segment's trade under a segment that does not exist — invisible in the UI, which is the one
   failure mode this encoding must not have. So does a coded column whose lookup never arrived:
   CODED_COLS is what says a column is coded, deliberately NOT the presence of a key in LOOK —
   keying off LOOK would mean a failed _index.json fetch quietly passes the raw integer through as
   if it were the label, which is the same silent mislabel by a longer route. */
const CODED_COLS={stage:1, role:1, dir:1};
function decodeBlk(b){
  if(!b) return [];
  if(Array.isArray(b)) return b;            // already row objects (data built before the encoding)
  const cols=b.cols||[], rows=b.rows||[];
  if(!cols.length) return [];
  const luk=cols.map(c=>CODED_COLS[c]?(LOOK[c]||null):null);   // null = carried verbatim (year, partner, v)
  cols.forEach((c,i)=>{ if(CODED_COLS[c]&&!(luk[i]&&luk[i].length))
    throw new Error('decodeBlk: no lookup for coded column "'+c+'" — data/_index.json missing or stale'); });
  return rows.map(r=>{
    const o={};
    for(let i=0;i<cols.length;i++){
      const L=luk[i];
      if(!L){ o[cols[i]]=r[i]; continue; }
      const s=L[r[i]];
      if(s===undefined) throw new Error('decodeBlk: code '+r[i]+' out of range for "'+cols[i]+'"');
      o[cols[i]]=s;
    }
    return o;
  });
}
function selSR(){
  if(!selProduct) return null;
  const p=(D.products||[]).find(x=>x.code===selProduct);
  if(p) return p.stage+'|'+p.role;
  const e=((TD&&TD.tree)||[]).find(x=>x.from_code===selProduct||x.to_code===selProduct);
  if(e) return e.from_code===selProduct?(e.from_stage+'|'+e.from_role):(e.to_stage+'|'+e.to_role);
  return null;
}
function selName(){
  const code=activeCode();
  if(!code) return null;
  const e=((TD&&TD.tree)||[]).find(x=>x.from_code===code||x.to_code===code);
  if(e) return e.from_code===code?(e.from_full||e.from_name):(e.to_full||e.to_name);
  const p=((D&&D.products)||[]).find(x=>x.code===code); return p?(p.desc_full||p.product_name):code;
}

/* ── Supply Chain Selector → what each series can actually honour ─────────────────────────────
   NOTE (CLAUDE.md): every function below is declared at top-level scope on purpose — a function
   declared inside an if-block is invisible globally and fails silently at call time.

   D.timeline is year × stage × role × flow × value, so STAGE and ROLE are real, exact filters on
   the headline trade numbers (its rows re-sum to D.yearly). D.partners_yearly_sr is the same story
   one grain finer — year × dir × stage × role × partner — so the partner list and the map arrows
   now honour stage and role too (see partnersAt()). Neither series carries an HS-code dimension,
   so CATEGORY (defined per HS code via D.scatter) cannot be resolved against either; and the
   world/regional rank+share rows are precomputed across all countries at the whole-technology
   level. Those are reported as NOT APPLIED — never silently passed off as filtered.

   A single PRODUCT is the exception, and only on THIS page. navigator.html has no code-grained
   series at all, so there a picked HS code is always NOT APPLIED — that is where this wording
   comes from. Here two code-grained series exist (products_flow in the bundle, feeding the
   headline; the FLOWS sidecar, feeding Top Partners and the arrows), so the code usually IS
   applied and must be labelled as such. They are asked SEPARATELY and are allowed to disagree:
   they are different files with different cuts, so the headline can be per-product while the
   partner list falls back, or the reverse. Reporting one panel's disposition on the other is how
   this went wrong the first time — the panels showed HS 381800 while both captions said "not
   applied", correct numbers under a caption that denied them. ──────────────────────────────── */
function srPass(stage,role){
  return (selStage==='ALL'||stage===selStage)&&(selRole==='ALL'||role===selRole);
}
function srOn(){ return selStage!=='ALL'||selRole!=='ALL'; }
/* Did the picked product actually reach each surface? Each predicate makes the SAME call the
   panel itself makes, so a caption cannot drift from the number above it.
   · headline  → productFlow(): null when the code is outside products_flow's top-150 cut.
   · partners  → flowPartnersAt(): null when the sidecar is missing or still loading. It returns
     [] (truthy) for a code with no rows, which is "applied, and the answer is nothing" — the
     panel treats that as per-product too, so the caption must agree. The map arrows read the
     same call at the same code, so this predicate covers them as well. */
function prodInFlows(){    return !!(selProduct && productFlow(activeCode())); }
function prodInPartners(){ return !!(selProduct && flowPartnersAt(activeCode(),'src',selYear)); }
/* `on` = stage/role are filtering the SERIES CHOICE — it selects which data source is read and
   must stay exactly srOn(). `live` = something in the selection reached this panel, which is what
   the chips and captions speak to. The two are different questions and were one field before. */
function flowScope(prodApplied){
  const applied=[], ignored=[];
  if(selStage!=='ALL') applied.push(selStage);
  if(selRole!=='ALL')  applied.push(selRole);
  if(selCat!=='ALL')   ignored.push(selCat.toLowerCase()+' category');
  if(selProduct)       (prodApplied?applied:ignored).push('HS '+selProduct);
  return {applied, ignored, on:srOn(), live:srOn()||!!prodApplied};
}
/* The reason an amber note gives has to match what was actually dropped. A category is dropped
   because no series carries it; a product is dropped only when its code-grained series could not
   answer — which is a different sentence, and saying "carries no HS-code dimension" about a page
   that clearly does filter by HS code is the mislabel one level down. */
function scopeOffWhy(sc,where){
  return sc.ignored.some(s=>s.indexOf('HS ')===0)
    ? `no per-product series for this code — ${where} is the whole technology`
    : `this series is split by stage · role only, it carries no HS-code dimension`;
}
/* Exports/imports for one year under the ACTIVE stage/role filter, summed straight from
   D.timeline. Returns null when the year is absent from the series, so growthArrow() prints "--"
   past the last year exactly as it does on the unfiltered path. */
function tlYear(y){
  if(!D||!D.timeline) return null;
  let exp=0, imp=0, has=false;
  D.timeline.forEach(t=>{
    if(t.year!==y) return;
    has=true;                                   // the YEAR exists even if this stage/role has no trade in it
    if(!srPass(t.stage,t.role)) return;
    if(t.flow==='exp') exp+=muV(t); else if(t.flow==='imp') imp+=muV(t);
  });
  return has?{exp,imp}:null;
}
/* Partners for one direction in one year, descending by value, under the ACTIVE stage/role filter.
   Feeds BOTH the Top Partners list and the map arrows, so the two can never disagree.

   Two sources, and they are never mixed nor derived from one another:
     · no stage/role filter → D.partners_yearly, read verbatim. It is the builder's top-8 per
       (year, dir) at the whole-technology level.
     · stage and/or role    → D.partners_yearly_sr, summed across the matching segments only.
   (D.partners_yearly_sr is compact-encoded on disk and expanded back into these row objects once,
   in loadCase — see decodeBlk. Nothing below this line sees the encoded form.)
   Summing ALL of partners_yearly_sr back up does NOT reproduce partners_yearly: the _sr series
   keeps a top-8 PER (year, dir, stage, role), so a partner that makes the overall top-8 while
   falling short inside each individual segment loses most of its value on the way up (measured
   across 104,297 rows: the re-sum lands at or below the whole-tech figure 74.5% of the time —
   EVs/Germany 2011 AUT is 1,331,751 re-summed against 4,784,312 whole-tech). Hence the unfiltered
   path stays on the unfiltered series, byte-for-byte what this panel printed before.
   Zero-value rows are dropped so a partner with no trade in the selected segments draws no arrow
   rather than a hairline one. */
function partnersAt(dir,year){
  if(!D) return [];
  if(!srOn()){
    // Corrected mode reads its OWN top-8, ranked on corrected value by the builder. Scaling the
    // raw eight would keep whichever partners raw trade favoured: for Solar/Brazil 2023 the
    // corrected list drops CHN, POL, SWE and BGR and gains CHE, ARG, PRY and MEX.
    const src=(muOn ? D.partners_yearly_c : D.partners_yearly)||[];
    return src.filter(p=>p.dir===dir&&p.year===year)
      .map(p=>({dir,partner:p.partner,v:+p.v||0})).sort((a,b)=>b.v-a.v);
  }
  // The segmented series carries the union of the raw and corrected top-8s, so taking the active
  // side and sorting yields an exact ranking either way — no second block, no approximation.
  const m=new Map();
  (D.partners_yearly_sr||[]).forEach(p=>{
    if(p.dir!==dir||p.year!==year||!srPass(p.stage,p.role)) return;
    m.set(p.partner,(m.get(p.partner)||0)+muV(p));
  });
  return [...m].map(([partner,v])=>({dir,partner,v})).filter(p=>p.v>0).sort((a,b)=>b.v-a.v);
}
/* Panel-header chips + the map's corner note. Green = responds to the selection, amber = does
   not. Kept out of the innerHTML rebuilds so the chips survive a collapsed panel.
   Top Partners and the arrows sit on the same stage/role-aware series as Trade Flows now, so they
   carry the same chip; only the dimensions nothing can honour (category, single HS code) still
   raise an amber flag. */
function updateScopeFlags(){
  // One scope per surface. The two panels read different code-grained files, so a single shared
  // scope object cannot describe both without lying about one of them.
  const f=flowScope(prodInFlows()), p=flowScope(prodInPartners()), filtered=anyFilter();
  const chip=(el,sc)=>{ if(!el) return;
    el.className='pnl-flag'+(sc.live?' f-on':(filtered?' f-off':''));
    el.textContent = sc.live ? 'filtered' : (filtered ? 'whole tech' : '');
  };
  chip(document.getElementById('flag-flows'),f);
  chip(document.getElementById('flag-partners'),p);
  const ph=document.getElementById('phase');
  if(ph){
    // The arrows read flowPartnersAt() at the selected node's code — the same call prodInPartners()
    // makes — so they honour stage, role AND the single product. The amber warning is tied to what
    // is left over after that, NOT to "any filter at all", which would cry wolf over a selection
    // the arrows do apply.
    ph.classList.toggle('phase-warn',p.ignored.length>0);
    ph.textContent = p.ignored.length
      ? (p.live ? `arrows filtered · ${p.applied.join(' · ')} — ${p.ignored.join(' and ')} not applied`
                : 'filter active · map arrows stay whole-technology')
      : (p.live ? `arrows filtered · ${p.applied.join(' · ')}`
                : 'Phase 1 shell · arrows are tech-level');
  }
}

/* ── the cockpit render ────────────────────────────────────────────────────── */
/* ══ THE STAGE — the value chain IS the map ════════════════════════════════════════
   navigator.html draws the globe on #stage and the dendrite in a 280px side panel.
   Here those two roles are swapped: the dendrite occupies the stage, and the globe is
   drawn INSIDE the selected node at that node's own dendrite position, with translucent
   bands running out to its chain neighbours. The value chain as the solar system, one
   product as the Earth.

   The function keeps the name drawFusion() deliberately. Ten call sites across the year
   slider, the drums, the zoom handler, the resize handler and loadCase() already call
   it; renaming would mean touching all ten for no gain, and the contract ("redraw the
   stage from current state") is unchanged. */

/* Per-product partner flows, fetched lazily from the sidecar built by
   build_datadriven_proto.R --flows. NOT in the case bundle: at top-8 it is ~7x
   partners_yearly_sr, so it would land in every cold case fetch to serve this one page.

   THE DIRECTORY IS GITIGNORED (register B-20), so "absent" is the NORMAL state on a
   fresh clone, not an error. That is why FLOW_STATE has a 'missing' value distinct from
   'error' and why the stage draws a visible note and falls back to the whole-tech
   partner series rather than showing an empty globe with no explanation. */
let FLOWS=null, FLOWS_KEY=null, FLOW_STATE='idle';   // idle | loading | ready | missing
function flowsKey(){ return TECH.replace(/ /g,'_')+'_'+COUNTRY; }
async function ensureFlows(){
  const k=flowsKey();
  if(FLOWS_KEY===k && FLOW_STATE!=='idle') return;   // already resolved (or resolving) for this case
  FLOWS_KEY=k; FLOW_STATE='loading'; FLOWS=null;
  let d=null;
  try{ const r=await fetch('data/flows/'+k+'.json'); if(r.ok) d=await r.json(); }
  catch(e){ /* file:// or offline — same user-visible outcome as a missing file */ }
  if(!d){ FLOW_STATE='missing'; redrawAll(); return; }
  /* VIZ.dec() resolves any column named in its lookup table: `dir` is there and decodes to
     "dest"/"src". `partner` deliberately is NOT — its dictionary is per file, not global —
     so it stays an integer index and is resolved here against this file's own array.
     Adding `partner` to the shared lookup would silently decode it against the wrong table. */
  const rows=VIZ.dec(d.flows), pl=d.partners||[];
  const by=new Map();                       // code → dir → year → [{partner, v}]
  rows.forEach(r=>{
    const code=r.code, dir=r.dir, yr=+r.year;
    let a=by.get(code); if(!a){ a=new Map(); by.set(code,a); }
    let b=a.get(dir);   if(!b){ b=new Map(); a.set(dir,b); }
    let c=b.get(yr);    if(!c){ c=[];        b.set(yr,c); }
    c.push({partner:pl[r.partner]||String(r.partner), v:+r.v||0});
  });
  FLOWS={by, topN:d.top_n, withYear:d.with_year!==false};
  FLOW_STATE='ready';
  // redrawAll, NOT drawFusion. The sidecar arrives after the first paint, and it feeds the
  // stats panel (Top Partners, its sparklines) as well as the stage. Redrawing only the stage
  // left the panel showing whole-technology partners under a product headline until something
  // else happened to trigger a re-render — the incoherence looked like a data bug, not a
  // missing refresh, because every number in it was individually correct.
  redrawAll();
}
/* Partners for ONE product at one year. Falls back to the whole-tech series when the
   sidecar is absent, so the page stays usable without it — degraded, and labelled. */
function flowPartnersAt(code,dir,year){
  if(FLOW_STATE!=='ready'||!code) return null;
  const a=FLOWS.by.get(code); if(!a) return [];
  const b=a.get(dir);         if(!b) return [];
  const rows=(FLOWS.withYear ? (b.get(year)||[]) : [...b.values()].flat());
  // muShare is per (code, role) and this series still HAS its code, so the multi-use
  // correction is applied here rather than by the builder — same rule as By-Product sizing.
  const sh=muShare(code, PROD_ROLE.get(code));
  return rows.map(p=>({dir,partner:p.partner,v:p.v*sh})).filter(p=>p.v>0).sort((a,b)=>b.v-a.v);
}

/* Shared dendrite layout. Identical topology to drawNavProduct() — same cnOf() node keying
   and same longest-path-to-sink step map — but parameterised on width/height so the stage
   and the small overview panel lay out the SAME graph at two scales. Extracted rather than
   duplicated: two copies of a layout would drift, and the overview's position marker has to
   land on the same node the stage has selected or it is worse than no marker at all. */
/* padR defaults to padX, so the small overview panel keeps calling this with three arguments
   and a symmetric inset while the stage passes an asymmetric one. */
/* ── the stage·role network, defined ONCE ──────────────────────────────────────
   Hoisted out of drawNavSR() (2026-08-07) so the big stage map can lay out the same
   7-node graph the small overview map draws. Two copies of a 7-node topology is how
   the two views come to disagree about what the chain is. */
const LANE_SR=['Upstream|Raw Material','Midstream|Processed Material','Midstream|Process Equipment',
  'Midstream|Product Component','Downstream|Product Component','Downstream|Process Equipment',
  'Final Product|Final Product'];
const LANE_LABEL=['Raw Material','Processed Material','Process Equipment','Product Component',
  'Product Component','Process Equipment','Final Product'];
const EDGES_SR=[[0,1],[1,2],[1,3],[2,5],[3,4],[5,6],[4,6]];

/* The stage·role graph rewritten in chainLayout()'s edge shape, so ONE layout engine
   serves both modes. `from` is the upstream end: chainLayout's relaxation puts `from`
   one step deeper than `to`, and stepToX maps the deepest step to the LEFT — which is
   the same direction EDGES_SR already runs (0 = Raw Material). */
function srChainEdges(){
  const mk=i=>({cn:LANE_SR[i], code:LANE_SR[i], name:LANE_LABEL[i],
                full:LANE_SR[i].replace('|',' · '),
                stage:LANE_SR[i].split('|')[0], role:LANE_SR[i].split('|')[1]});
  return EDGES_SR.map(([a,b])=>{
    const F=mk(a), T=mk(b);
    return {from_code:F.code, from_cn:F.cn, from_name:F.name, from_full:F.full,
            from_stage:F.stage, from_role:F.role,
            to_code:T.code, to_cn:T.cn, to_name:T.name, to_full:T.full,
            to_stage:T.stage, to_role:T.role};
  });
}

/* Which stage·role is selected right now, however it was picked — drums, legend or a
   node in either map. Null when nothing narrows it. */
function srSelKey(){
  if(selStage!=='ALL'&&selRole!=='ALL') return selStage+'|'+selRole;
  return selSR();
}

function chainLayout(W,H,padX,padY,padR,edgeSrc){
  // Second node-set source, not a second layout engine (2026-08-07). Everything below
  // — the longest-path step, the bucketing, the undirected adjacency — is topology, and
  // is identical for both graphs.
  const edges=edgeSrc||(navMode==='sr'?srChainEdges():((TD&&TD.tree)||[]));
  if(!edges.length) return null;
  const cnOf=(code,cn)=>cn||code;
  const nm=new Map(); const reg=(cn,c,nn,ff,st,ro)=>{ if(!nm.has(cn)) nm.set(cn,{cn,code:c,name:nn,full:ff,stage:st,role:ro}); return nm.get(cn); };
  edges.forEach(e=>{
    reg(cnOf(e.from_code,e.from_cn),e.from_code,e.from_name,e.from_full,e.from_stage,e.from_role);
    reg(cnOf(e.to_code,e.to_cn),e.to_code,e.to_name,e.to_full,e.to_stage,e.to_role);
  });
  const nodes=[...nm.values()];
  const stepMap=new Map(nodes.map(n=>[n.cn,0]));
  let changed=true;
  for(let i=0;i<25&&changed;i++){ changed=false;
    edges.forEach(e=>{ const f=cnOf(e.from_code,e.from_cn), t=cnOf(e.to_code,e.to_cn);
      const ts=stepMap.get(t)||0, fs=stepMap.get(f)||0;
      if(fs<ts+1){ stepMap.set(f,ts+1); changed=true; } }); }
  const maxStep=Math.max(0,...stepMap.values());
  const pr=(padR==null?padX:padR);
  const stepToX=s=>padX+Math.max(40,W-padX-pr)*(maxStep-s)/(maxStep||1);
  const buckets={};
  nodes.forEach(n=>{ const s=stepMap.get(n.cn)||0; (buckets[s]=buckets[s]||[]).push(n); });
  Object.values(buckets).forEach(ns=>ns.sort((a,b)=>(a.name||'').localeCompare(b.name||'')));
  const nodeY=new Map();
  Object.values(buckets).forEach(ns=>{ const avail=H-2*padY, stp=avail/ns.length;
    ns.forEach((n,i)=>nodeY.set(n.cn,padY+stp*(i+0.5))); });
  const pos=cn=>[stepToX(stepMap.get(cn)||0), nodeY.get(cn)||H/2];
  // undirected adjacency — the bands run to whatever the node is connected to, upstream or
  // down. A band that only went downstream would make an upstream node look like a dead end.
  const nbr=new Map(nodes.map(n=>[n.cn,new Set()]));
  edges.forEach(e=>{ const f=cnOf(e.from_code,e.from_cn), t=cnOf(e.to_code,e.to_cn);
    if(f===t) return; nbr.get(f)&&nbr.get(f).add(t); nbr.get(t)&&nbr.get(t).add(f); });
  return {edges,nodes,stepMap,pos,nbr,cnOf,byCn:nm,maxStep};
}
/* The node the globe currently sits in. selProduct is an HS CODE and several process steps
   can share one (Solar's 848620 covers 15), so the code alone does not identify a node —
   the largest-valued node carrying that code is chosen, and that choice has to be the same
   one the overview marker uses, which is why this is a function and not an inline pick. */
function selectedCn(L,sval){
  if(!L) return null;
  /* In stage·role mode the selection is a lane, not an HS code, so match on the node's
     own stage|role key. Falls through to "largest node" exactly as before when nothing
     is picked, which is what puts the globe somewhere sensible on first paint. */
  if(navMode==='sr'){
    const k=srSelKey();
    if(k){ const hit=L.nodes.find(n=>(n.stage+'|'+n.role)===k); if(hit) return hit.cn; }
  }else if(selProduct){
    const cand=L.nodes.filter(n=>n.code===selProduct);
    if(cand.length) return cand.sort((a,b)=>sval(b)-sval(a))[0].cn;
  }
  return L.nodes.slice().sort((a,b)=>sval(b)-sval(a))[0]?.cn || null;
}

/* One product's exports/imports by year, from the bundle's products_flow block.
   Memoised per (case, code): renderStats runs on every year step, drum change and redraw, and
   decoding a ~2,000-row block each time would make the year slider stutter for no new data. */
let PF_CACHE=new Map(), PF_KEY=null;
function productFlow(code){
  if(!code||!D||!D.products_flow) return null;
  const k=TECH+'|'+COUNTRY;
  if(PF_KEY!==k){ PF_CACHE=new Map(); PF_KEY=k; }
  if(PF_CACHE.has(code)) return PF_CACHE.get(code);
  const rows=VIZ.dec(D.products_flow).filter(r=>r.code===code);
  // muShare is per (code, role) and this series keeps its code, so the correction belongs here
  const sh=muShare(code, PROD_ROLE.get(code));
  const m=rows.length?new Map(rows.map(r=>[r.year+'|'+r.flow,(+r.v||0)*sh])):null;
  PF_CACHE.set(code,m);
  return m;
}

function drawFusion(){
  if(!D) return;
  const svg=d3.select('#stage');
  const {W,H}=VIZ.dims('#stage');
  svg.selectAll('*').remove();
  // ── lay the chain out in the VISIBLE canvas, not the whole one ────────────────────────
  // #stage spans the full window and the two panel stacks float ON TOP of it. Laying out
  // across the full width therefore pushes the right-hand columns — where the final products
  // and the biggest nodes are — underneath #rstack, and since the globe follows the selected
  // node, the globe goes under the panel with it. Measured from the live elements rather than
  // hardcoded from --stack-w/--stack-r-w so a collapsed or resized panel stays honest.
  const bx=id=>{ const e=document.getElementById(id); return e?e.getBoundingClientRect():null; };
  const lb=bx('lstack'), rb=bx('rstack');
  const padL=(lb?lb.right:16)+34, padR=W-(rb?rb.left:W-16)+34;
  const L=chainLayout(W,H,padL,26,padR);
  if(!L){ msg('no value-chain data for this tech'); return; }
  root=svg.append('g').attr('class','zoom-root').attr('transform',zoomT);
  // Auto-pan lives on its OWN group inside the zoom root, not folded into the node coordinates.
  // Two reasons: the user's d3.zoom transform keeps sole ownership of `root`, so panning by hand
  // still composes cleanly; and every child stays in chain coordinates, so L.pos() means the same
  // thing to the globe, the bands and anything measuring them. Baking the offset into the
  // positions instead would make the globe's true position and its laid-out position differ by
  // exactly the pan — invisible on screen and impossible to assert against.
  const panG=root.append('g').attr('class','auto-pan');

  // node size ∝ focal trade value at the selected year (same fallback ladder and sqrt scale
  // as the panel dendrite, so a node is the same size in both views)
  const tvY=new Map(((D&&D.products_yearly)||[]).filter(p=>p.year===selYear)
    .map(p=>[p.code,(+p.v||0)*muShare(p.code,PROD_ROLE.get(p.code))]));
  const tvAll=new Map(((D&&D.products)||[]).map(p=>[p.code,(+p.v||0)*muShare(p.code,p.role)]));
  const deg=new Map(L.nodes.map(n=>[n.cn,0]));
  L.edges.forEach(e=>{ const f=L.cnOf(e.from_code,e.from_cn), t=L.cnOf(e.to_code,e.to_cn);
    deg.set(f,(deg.get(f)||0)+1); deg.set(t,(deg.get(t)||0)+1); });
  const useYear=!!tvY.size, useAll=!useYear&&!!tvAll.size;
  /* In stage·role mode a node's `code` is a "Stage|Role" key, which is not in
     products_yearly — so the product ladder above would size every node 0 and the whole
     chain would collapse to the 4px floor. Sized instead from D.timeline, the same
     year × stage × role × flow series drawNavSR() sizes the overview map from, so a lane
     is the same size in both views. */
  const srV=new Map();
  if(navMode==='sr') ((D&&D.timeline)||[]).filter(t=>t.year===selYear)
    .forEach(t=>{ const k=t.stage+'|'+t.role; srV.set(k,(srV.get(k)||0)+muV(t)); });
  const sval=navMode==='sr'
    ? (n=>srV.get(n.cn)||0)
    : (n=>useYear?(tvY.get(n.code)||0):useAll?(tvAll.get(n.code)||0):(deg.get(n.cn)||0));
  const rSc=d3.scaleSqrt().domain([0,d3.max(L.nodes,sval)||1]).range([4,15]);

  const selCn=selectedCn(L,sval);
  STAGE_SEL_CN=selCn;                              // published for the overview marker
  /* HS code ONLY. In stage·role mode a node's `code` is a "Stage|Role" key, and publishing
     that here would feed activeCode() a string that looks like an HS code and is not —
     productFlow()/flowPartnersAt() would look it up, miss, and the panels would quietly
     report the whole technology while the readout named a lane. Null in sr mode, so the
     panels fall through to the srPass()-filtered series, which is the right answer. */
  STAGE_SEL_CODE=(navMode==='sr'||!selCn)?null:L.byCn.get(selCn).code;
  // The layout THIS DRAW used, published for anything that needs to reason about positions
  // (check_chain_nav.js). A consumer that recomputed it from chainLayout() would have to
  // reproduce the panel-inset arithmetic exactly, and would silently measure a different graph
  // the moment the insets changed — which is precisely what happened on 2026-08-06.
  STAGE_L=L;
  const gpos=selCn?L.pos(selCn):[W/2,H/2];
  const selNode=selCn?L.byCn.get(selCn):null;
  const cm=catMap();
  const drumOn=srOn()||selCat!=='ALL';
  const passDrum=n=>srPass(n.stage,n.role)&&(selCat==='ALL'||(cm[n.code]||'Other')===selCat);
  const nbrs=selCn?[...(L.nbr.get(selCn)||[])]:[];
  const nbrSet=new Set(nbrs);

  // ── ① the chain, drawn first so the globe and its bands sit on top ──────────────
  panG.append('g').selectAll('line').data(L.edges).join('line')
    .attr('x1',e=>L.pos(L.cnOf(e.from_code,e.from_cn))[0]).attr('y1',e=>L.pos(L.cnOf(e.from_code,e.from_cn))[1])
    .attr('x2',e=>L.pos(L.cnOf(e.to_code,e.to_cn))[0]).attr('y2',e=>L.pos(L.cnOf(e.to_code,e.to_cn))[1])
    .attr('stroke','rgba(255,255,255,.10)').attr('stroke-width',.7);

  const ng=panG.append('g').attr('class','chain-nodes');
  ng.selectAll('circle').data(L.nodes).join('circle')
    .attr('cx',n=>L.pos(n.cn)[0]).attr('cy',n=>L.pos(n.cn)[1])
    .attr('r',n=>Math.max(4,rSc(sval(n))))
    .attr('fill',n=>VIZ.SR[n.stage+'|'+n.role]||'#888')
    .attr('stroke',n=>nbrSet.has(n.cn)?'#fff':'rgba(0,0,0,.35)')
    .attr('stroke-width',n=>nbrSet.has(n.cn)?1.6:.6)
    .attr('opacity',n=>n.cn===selCn?0:(nbrSet.has(n.cn)?1:(drumOn?(passDrum(n)?.85:.10):.5)))
    .attr('cursor','pointer')
    // Clicking a node means the same thing in both modes — "make this the selection" —
    // but the selection itself is a different kind of thing, so it goes through the same
    // setter each mode's other control surfaces use (pickSR is what the legend and the
    // overview map's nodes already call).
    .on('click',(e,n)=>{ if(navMode==='sr'){ pickSR(n.stage,n.role); } else { selProduct=n.code; redrawAll(); } })
    .on('mousemove',(e,n)=>tip(e, navMode==='sr'
      ? '<b>'+n.stage+' · '+n.role+'</b>'+(sval(n)?'<br>'+VIZ.fmtV(sval(n))+' · '+selYear:'')
        +'<br><span style="opacity:.6">click to filter by this stage · role</span>'
      : 'HS '+n.code+'<br><b>'+(n.full||n.name||n.code)+'</b><br>'+n.stage+' · '+n.role
        +(sval(n)?'<br>'+VIZ.fmtV(sval(n))+' · '+selYear:'')+(nbrSet.has(n.cn)?'<br><i>click to walk the chain</i>':'')))
    .on('mouseout',tipOut);

  // ── ② translucent bands from the globe out to the selected node's chain neighbours ──
  // Drawn from the globe's EDGE rather than its centre, so a band reads as leaving the
  // sphere instead of being overdrawn by it.
  // Sized against the CLEAR band between the panels, not against W: the stage spans the whole
  // window but roughly 640px of it is under the two stacks, so a radius scaled off W puts the
  // sphere's edge behind a panel however well the auto-pan centres it.
  const clearW=Math.max(160,(rb?rb.left:W-16)-(lb?lb.right:16)-32);
  const R=Math.max(46,Math.min(Math.min(clearW,H)*0.20*globeScale, clearW*0.34, H*0.34));
  if(selCn){
    const bg=panG.append('g').attr('class','bands');
    nbrs.forEach(cn=>{
      const p=L.pos(cn), dx=p[0]-gpos[0], dy=p[1]-gpos[1], len=Math.hypot(dx,dy)||1;
      const ux=dx/len, uy=dy/len;
      const a=[gpos[0]+ux*(R*0.96), gpos[1]+uy*(R*0.96)];
      const nd=L.byCn.get(cn);
      const w=Math.max(3,Math.min(14,rSc(sval(nd))*1.1));
      bg.append('line').attr('x1',a[0]).attr('y1',a[1]).attr('x2',p[0]).attr('y2',p[1])
        .attr('stroke','rgba(255,255,255,.20)').attr('stroke-width',w)
        .attr('stroke-linecap','round').attr('cursor','pointer')
        .on('mouseover',function(){ d3.select(this).attr('stroke','rgba(255,255,255,.52)'); })
        .on('mouseout',function(){ d3.select(this).attr('stroke','rgba(255,255,255,.20)'); tipOut(); })
        .on('mousemove',e=>tip(e,'<b>'+(nd.full||nd.name||nd.code)+'</b><br>HS '+nd.code+' · '+nd.stage+' · '+nd.role+'<br><i>click to move the globe here</i>'))
        .on('click',()=>{ selProduct=nd.code; redrawAll(); });
    });
  }

  // ── ③ the globe, drawn AT THE SELECTED NODE rather than at W/2,H/2 ──────────────
  const CENT=VIZ.centroids(), FEATS=VIZ.feats(), ISO3N=VIZ.ISO3N;
  const iso4id=id=>{ const s=String(id).padStart(3,'0'); return Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(s)); };
  const c0=CENT[D.iso]||[0,0];
  const rot=globeRot||[-c0[0],-c0[1],0];
  const proj=d3.geoOrthographic().rotate(rot).translate(gpos).scale(R).clipAngle(90);
  const gp=d3.geoPath(proj), centerLL=[-rot[0],-rot[1]];
  const front=ll=>d3.geoDistance(ll,centerLL)<=Math.PI/2+0.02;
  const gg=panG.append('g').attr('class','globe');
  // Rotate/zoom bound to the GLOBE GROUP, not to #stage. navigator.html binds them in
  // setMapMode('globe'), which this page never calls — the stage is always chain + globe, so
  // there is no mode to switch into and an unbound globe would silently refuse to turn.
  // Binding here also resolves the conflict with the dendrite's own pan/zoom on #stage: a drag
  // that starts on the sphere spins it, a drag anywhere else pans the chain under it, and
  // stopPropagation is what keeps one gesture from doing both.
  gg.call(globeDrag)
    .on('wheel.globe',ev=>{ ev.stopPropagation(); globeWheel(ev); })
    .on('mousedown.stop',ev=>ev.stopPropagation());
  gg.append('circle').attr('cx',gpos[0]).attr('cy',gpos[1]).attr('r',R+7)   // halo, so the sphere
    .attr('fill','none').attr('stroke','rgba(96,165,250,.16)').attr('stroke-width',7);  // lifts off the chain
  gg.append('path').datum({type:'Sphere'}).attr('d',gp)
    .attr('fill','#0a1a12').attr('stroke','rgba(96,165,250,.32)').attr('stroke-width',1);
  gg.append('path').datum(d3.geoGraticule10()).attr('d',gp)
    .attr('fill','none').attr('stroke','rgba(255,255,255,.06)').attr('stroke-width',0.5);
  gg.append('g').selectAll('path').data(FEATS).join('path').attr('d',gp)
    .attr('fill',d=>iso4id(d.id)===D.iso?'#1c3d2c':'#12281c')
    .attr('stroke',d=>iso4id(d.id)===D.iso?'rgba(60,181,74,.85)':'rgba(255,255,255,.08)')
    .attr('stroke-width',d=>iso4id(d.id)===D.iso?1.1:0.4);
  // click-to-refocus, same as the retired Atlas Navigator's hit layer
  gg.append('g').selectAll('path').data(FEATS).join('path').attr('d',gp)
    .attr('fill','transparent').attr('stroke','none')
    .attr('cursor',d=>{const iso=iso4id(d.id);return (iso&&ISO2SLUG[iso]&&iso!==D.iso)?'pointer':'default';})
    .on('click',(e,d)=>{const iso=iso4id(d.id); if(iso&&ISO2SLUG[iso]&&iso!==D.iso) loadCase(TECH,ISO2SLUG[iso]);})
    .on('mousemove',(e,d)=>{const iso=iso4id(d.id); if(iso&&ISO2SLUG[iso]) tip(e,'<b>'+ISO2SLUG[iso].replace(/_/g,' ')+'</b>'+(iso===D.iso?'<br>focal country':'<br>click to refocus')); else tipOut();})
    .on('mouseout',tipOut);

  // ── ④ trade arrows for THIS PRODUCT ALONE, from the sidecar ─────────────────────
  const code=selNode?selNode.code:null;
  let dests=flowPartnersAt(code,'dest',selYear), srcs=flowPartnersAt(code,'src',selYear);
  const perProduct = dests!==null;
  if(!perProduct){ dests=partnersAt('dest',selYear); srcs=partnersAt('src',selYear); }  // whole-tech fallback
  const arr=[...(dests||[]).filter(p=>CENT[p.partner]).slice(0,8),
             ...(srcs ||[]).filter(p=>CENT[p.partner]).slice(0,8)];
  const maxV=d3.max(arr,p=>p.v)||1, minV=Math.max(1,d3.min(arr,p=>p.v)||1);
  const wsc=d3.scaleSqrt().domain([minV,Math.max(maxV,minV+1)]).range([2,Math.max(4,R*0.085)]).clamp(true);
  const rsc=d3.scaleSqrt().domain([0,maxV]).range([2,Math.max(3,R*0.055)]);
  const defs=panG.append('defs');
  [['dest','#3cb54a'],['src','#f97316']].forEach(([k,c])=>{
    defs.append('marker').attr('id','ah2-'+k).attr('viewBox','0 0 10 10').attr('refX',8).attr('refY',5)
      .attr('markerWidth',11).attr('markerHeight',11).attr('markerUnits','userSpaceOnUse')
      .attr('orient','auto-start-reverse')
      .append('path').attr('d','M0,0 L10,5 L0,10 z').attr('fill',c);
  });
  const fc=proj(c0)||gpos;
  const ag=panG.append('g').attr('class','arrows');
  arr.forEach(p=>{
    const cll=CENT[p.partner]; if(!cll||!front(cll)) return;      // far side of the sphere
    const tgt=proj(cll); if(!tgt) return;
    const col=p.dir==='dest'?'#3cb54a':'#f97316', w=wsc(Math.max(1,p.v));
    const A=p.dir==='dest'?fc:tgt, B=p.dir==='dest'?tgt:fc;
    const mx=(A[0]+B[0])/2, my=(A[1]+B[1])/2;
    const dx=B[0]-A[0], dy=B[1]-A[1], len=Math.hypot(dx,dy)||1;
    const bow=len*0.26+5;
    ag.append('path').attr('d',`M${A[0]},${A[1]} Q${mx+(-dy/len)*bow},${my+(dx/len)*bow} ${B[0]},${B[1]}`)
      .attr('fill','none').attr('stroke',col).attr('stroke-opacity',.72)
      .attr('stroke-width',w).attr('stroke-linecap','round').attr('marker-end','url(#ah2-'+p.dir+')');
    ag.append('circle').attr('cx',tgt[0]).attr('cy',tgt[1]).attr('r',rsc(p.v))
      .attr('fill',col).attr('fill-opacity',.5).attr('stroke',col).attr('stroke-width',1).attr('cursor','pointer')
      .on('mousemove',e=>tip(e,'<b>'+p.partner+'</b><br>'+(p.dir==='dest'?'export destination':'import source')
        +' · '+VIZ.fmtV(p.v)+'<br>'+(perProduct?('HS '+code+' · '+selYear):'whole technology · '+selYear)))
      .on('mouseout',tipOut);
  });

  // ── ⑤ the readout, and the missing-sidecar note ────────────────────────────────
  // A silent empty globe is the one failure mode this page must not have: the sidecar is
  // gitignored, so on a fresh clone "absent" is normal and has to SAY so (register B-20).
  const lbl=panG.append('g').attr('class','globe-label').attr('pointer-events','none');
  if(selNode){
    lbl.append('text').attr('x',gpos[0]).attr('y',gpos[1]-R-16).attr('text-anchor','middle')
      .attr('font-size','12px').attr('font-weight','800').attr('fill','#fff')
      .text((selNode.name||selNode.code).slice(0,54));
    lbl.append('text').attr('x',gpos[0]).attr('y',gpos[1]-R-4).attr('text-anchor','middle')
      .attr('font-size','9.5px').attr('fill','rgba(255,255,255,.62)')
      .text(navMode==='sr' ? selNode.stage+' · '+selNode.role
                           : 'HS '+selNode.code+' · '+selNode.stage+' · '+selNode.role);
  }
  // ── ⑥ pan the chain so the globe sits in the clear ──────────────────────────────
  // Set last, once R and gpos are both known. The globe is drawn AT its node — that does not
  // change — and the chain slides underneath so the node in question is somewhere the sphere,
  // its label and its bands are all actually visible. Without this the globe is correctly
  // positioned and mostly hidden under #rstack, which looks identical to a broken page.
  if(selCn){
    const visL=(lb?lb.right:16)+8, visR=(rb?rb.left:W-16)-8;
    const dx=(visL+visR)/2-gpos[0];       // slide the node to the middle of the clear band
    const dy=H/2-gpos[1];
    panG.attr('transform',`translate(${dx.toFixed(1)},${dy.toFixed(1)})`);
  }

  const note=FLOW_STATE==='missing'
    ? 'per-product flows unavailable — arrows show the whole technology. Build with:  Rscript scripts/proto/build_datadriven_proto.R --flows-only'
    : FLOW_STATE==='loading' ? 'loading per-product flows…'
    : (!perProduct&&FLOW_STATE==='ready') ? 'no recorded trade for this product at '+selYear+' — arrows show the whole technology'
    : '';
  if(note){
    const t=lbl.append('text').attr('x',gpos[0]).attr('y',gpos[1]+R+18).attr('text-anchor','middle')
      .attr('font-size','10px').attr('fill',FLOW_STATE==='missing'?'#fbbf24':'rgba(255,255,255,.55)');
    t.text(note.length>96?note.slice(0,94)+'…':note);
    if(FLOW_STATE==='missing') t.append('title').text(note);
  }
}

/* ── Supply Chain Map — two view modes, toggled via #nav-mode-* buttons ───────── */
// navMode is declared up with the rest of the state — chainLayout() reads it and is
// defined earlier in this file.
function drawNav(){ navMode==='sr' ? drawNavSR() : drawNavProduct(); }
function setNavMode(m){
  if(navMode===m) return;
  /* Carry the selection across the switch rather than dropping it. Going in, a picked
     HS code lights the lane it sits in; coming out, the SAME code is restored — not the
     largest node, which is what a bare mode flip would land on and would read as the
     page quietly changing the subject. */
  if(m==='sr'){
    navModeMemoCode=selProduct;
    const k=selSR();                       // computed BEFORE selProduct is cleared
    if(k){ const [st,ro]=k.split('|'); selStage=st; selRole=ro; }
    selProduct=null;
  }else if(navModeMemoCode){
    selProduct=navModeMemoCode; navModeMemoCode=null;
    selStage='ALL'; selRole='ALL';
  }
  navMode=m;
  document.getElementById('nav-mode-product').classList.toggle('active',m==='product');
  document.getElementById('nav-mode-sr').classList.toggle('active',m==='sr');
  document.getElementById('nav-hd-sub').textContent = m==='sr'
    ? 'value chain by stage · role — node size = this country’s trade value · click to filter'
    : 'zoomed-out reference · the ring marks where the globe is';
  initDrums();
  /* redrawAll, NOT drawNav. drawNav() redraws #nav — the small overview map — and nothing
     else, so before this the toggle moved one panel of five. #stage (the chain the globe
     sits in), the readout and the stats all follow the mode now. */
  redrawAll();
}

/* Process of Production (atlas-style linear step layout, ported from build_country_atlas.R
   drawDendrite() — replaces the earlier orrery/solar-system design, which read as confusing
   once de-crowded) — the "By Product" mode ───────────────────────────────────────────────── */
function drawNavProduct(){
  const svg=d3.select('#nav'); svg.selectAll('*').remove();
  const {W,H}=VIZ.dims('#nav');
  const edges=(TD&&TD.tree)||[];
  if(!edges.length){ svg.append('text').attr('x',W/2).attr('y',H/2).attr('text-anchor','middle')
    .attr('fill','rgba(255,255,255,.3)').attr('font-size',11).text('no value-chain data for this tech'); return; }
  // node identity = from_cn/to_cn ("HS code | process-step name"), NOT the bare HS code — many
  // distinct process-of-production steps share one HS6 (e.g. Solar's 848620 covers 15 separate
  // module/cell-line steps). Keying by code alone collapses them and fabricates cycles. Falls
  // back to the bare code only for stale cached JSON predating this fix.
  const cnOf=(code,cn)=>cn||code;
  const nm=new Map(); const reg=(cn,c,nn,ff,st,ro)=>{ if(!nm.has(cn)) nm.set(cn,{cn,code:c,name:nn,full:ff,stage:st,role:ro}); return nm.get(cn); };
  edges.forEach(e=>{
    reg(cnOf(e.from_code,e.from_cn),e.from_code,e.from_name,e.from_full,e.from_stage,e.from_role);
    reg(cnOf(e.to_code,e.to_cn),e.to_code,e.to_name,e.to_full,e.to_stage,e.to_role);
  });
  const nodes=[...nm.values()];

  // step = longest distance to a sink (a final product with no further downstream edge) —
  // same topological-layering algorithm as the atlas dendrite: raw materials end up with the
  // biggest step, final products at step 0.
  const stepMap=new Map(nodes.map(n=>[n.cn,0]));
  let changed=true;
  for(let i=0;i<25&&changed;i++){ changed=false;
    edges.forEach(e=>{ const fcn=cnOf(e.from_code,e.from_cn), tcn=cnOf(e.to_code,e.to_cn);
      const ts=stepMap.get(tcn)||0, fs=stepMap.get(fcn)||0;
      if(fs<ts+1){ stepMap.set(fcn,ts+1); changed=true; } }); }
  const maxStep=Math.max(0,...stepMap.values());
  const displayLv=s=>maxStep-s;                          // flip: raw material (left) → final product (right)
  const stepToX=s=>W*0.08+(W*0.82)*displayLv(s)/(maxStep||1);

  const buckets={};
  nodes.forEach(n=>{ const s=stepMap.get(n.cn)||0; (buckets[s]=buckets[s]||[]).push(n); });
  Object.values(buckets).forEach(ns=>ns.sort((a,b)=>(a.name||'').localeCompare(b.name||'')));
  const pad={top:16,bottom:16};
  const nodeY=new Map();
  Object.values(buckets).forEach(ns=>{ const avail=H-pad.top-pad.bottom, stp=avail/ns.length;
    ns.forEach((n,i)=>nodeY.set(n.cn,pad.top+stp*(i+0.5))); });
  const pos=cn=>[stepToX(stepMap.get(cn)||0), nodeY.get(cn)||H/2];

  // node size ∝ focal-country export+import trade value AT THE SELECTED YEAR (fallback: all-time
  // total, then connectivity) — same sqrt-scale transformation as the map's trade-flow arrows/dots
  // (VIZ arrows use d3.scaleSqrt so visual AREA, not radius, is linear in value — the standard fix
  // for circles/line-widths, since eyes compare areas). Trade value is per HS code, so sibling
  // steps sharing one code also share its size — that's expected, not a bug.
  // By-Product sizing is the one surface that still has an HS code in hand, so it is corrected
  // here rather than by the builder: raw value x muShare(). products_yearly carries no role, so
  // the role comes from PROD_ROLE (built off D.products in loadCase) — the share only applies to
  // raw and processed materials.
  const tvY=new Map(((D&&D.products_yearly)||[]).filter(p=>p.year===selYear)
    .map(p=>[p.code,(+p.v||0)*muShare(p.code,PROD_ROLE.get(p.code))]));
  const tvAll=new Map(((D&&D.products)||[]).map(p=>[p.code,(+p.v||0)*muShare(p.code,p.role)]));
  const deg=new Map(nodes.map(n=>[n.cn,0]));
  edges.forEach(e=>{ const fcn=cnOf(e.from_code,e.from_cn), tcn=cnOf(e.to_code,e.to_cn);
    deg.set(fcn,(deg.get(fcn)||0)+1); deg.set(tcn,(deg.get(tcn)||0)+1); });
  const useYear=!!tvY.size, useAll=!useYear&&!!tvAll.size;
  const sval=n=>useYear?(tvY.get(n.code)||0):useAll?(tvAll.get(n.code)||0):(deg.get(n.cn)||0);
  const rSc=d3.scaleSqrt().domain([0,d3.max(nodes,sval)||1]).range([3,11]);

  const cm=catMap();
  const drumOn = srOn()||selCat!=='ALL';
  const passDrum=n=>srPass(n.stage,n.role)&&(selCat==='ALL'||(cm[n.code]||'Other')===selCat);
  const isProd=n=>!!selProduct&&n.code===selProduct;
  // By Product and By Stage/Role are EQUAL-STATUS selections: picking a stage and/or role gives
  // its nodes the same emphasis the by-product path gets — size bump, white stroke, full opacity —
  // rather than only dimming everything else.
  const emph=n=>selProduct?isProd(n):(drumOn&&passDrum(n));
  const isSel=e=>selProduct&&(e.from_code===selProduct||e.to_code===selProduct);
  // an edge is "in the selection" when BOTH of its endpoints are — so a stage/role pick traces the
  // sub-chain, not a spray of half-connected stubs
  const srEdge=e=>!selProduct&&drumOn
    &&passDrum({stage:e.from_stage,role:e.from_role,code:e.from_code})
    &&passDrum({stage:e.to_stage,role:e.to_role,code:e.to_code});

  svg.append('g').selectAll('line').data(edges).join('line')
    .attr('x1',e=>pos(cnOf(e.from_code,e.from_cn))[0]).attr('y1',e=>pos(cnOf(e.from_code,e.from_cn))[1])
    .attr('x2',e=>pos(cnOf(e.to_code,e.to_cn))[0]).attr('y2',e=>pos(cnOf(e.to_code,e.to_cn))[1])
    .attr('stroke',e=>isSel(e)?'rgba(255,255,255,.85)':srEdge(e)?'rgba(255,255,255,.6)'
      :(drumOn||selProduct)?'rgba(255,255,255,.07)':'rgba(255,255,255,.14)')
    .attr('stroke-width',e=>isSel(e)?1.6:srEdge(e)?1.3:.6);

  // no text labels, no dashed connectors — nodes speak for themselves (atlas convention)
  svg.append('g').selectAll('circle').data(nodes).join('circle')
    .attr('cx',n=>pos(n.cn)[0]).attr('cy',n=>pos(n.cn)[1])
    .attr('r',n=>{ const r=Math.max(3,rSc(sval(n))); return emph(n)?r+2:r; })
    .attr('fill',n=>VIZ.SR[n.stage+'|'+n.role]||'#888')
    .attr('stroke',n=>emph(n)?'#fff':'rgba(0,0,0,.35)')
    .attr('stroke-width',n=>emph(n)?(isProd(n)?2.2:1.8):.6)
    .attr('opacity',n=>{ if(selProduct) return isProd(n)?1:.3; if(drumOn) return passDrum(n)?1:.12; return .92; })
    .attr('cursor','pointer')
    // redrawAll (not the bare draw trio) so the Trade Flows panel re-states its scope: a product
    // is a filter the trade series cannot honour, and the panel has to say so
    .on('click',(e,n)=>{ selProduct=(selProduct===n.code)?null:n.code; redrawAll(); })
    .on('mousemove',(e,n)=>tip(e,'HS '+n.code+'<br><b>'+(n.full||n.name||n.code)+'</b><br>'+n.stage+' · '+n.role+' · step '+stepMap.get(n.cn)+(sval(n)?'<br>'+VIZ.fmtV(sval(n))+' · '+selYear:'')))
    .on('mouseout',tipOut);

  // ── "you are here" marker ────────────────────────────────────────────────────────
  // POSITION ONLY. This panel keeps its own layout untouched — it is the zoomed-out
  // reference, and a reference that re-arranges itself when the selection moves is not a
  // reference. The marker is a ring drawn over the node the stage's globe currently
  // occupies, read from STAGE_SEL_CN so the two views can never disagree about which of
  // several same-code process steps is selected.
  if(STAGE_SEL_CN && nodeY.has(STAGE_SEL_CN)){
    const [mx,my]=pos(STAGE_SEL_CN);
    const g=svg.append('g').attr('pointer-events','none');
    g.append('circle').attr('cx',mx).attr('cy',my).attr('r',9)
      .attr('fill','none').attr('stroke','rgba(96,165,250,.9)').attr('stroke-width',1.6);
    g.append('circle').attr('cx',mx).attr('cy',my).attr('r',13)
      .attr('fill','none').attr('stroke','rgba(96,165,250,.35)').attr('stroke-width',1);
  }
}

/* Country-level value-chain flows, ported from build_country_atlas.R drawAtlasSankey() — the
   same 7-lane (5-column) structure as the atlas's Trade Flows sankey. "By Stage/Role" mode. */
/* "By Stage/Role" mode: the value chain as a 7-NODE network (one node per stage·role, not per
   country and not per HS code) — same left-to-right topology the old country-ribbon sankey used
   (raw material → processed material → {process equipment, product component} at midstream →
   same split carried into downstream → final product), but drawn as a plain node-link diagram
   like the By-Product view above, so the two modes read as parallel "network" views of the same
   value chain at two different levels of granularity. */
function drawNavSR(){
  const svg=d3.select('#nav'); svg.selectAll('*').remove();
  const {W,H}=VIZ.dims('#nav');
  // LANE_SR / LANE_LABEL / EDGES_SR now live at module scope — the big stage map lays out
  // the same graph, and two copies of a 7-node topology is how two views come to disagree.
  const COLX=[0.09,0.30,0.51,0.51,0.72,0.72,0.91];        // x-fraction per lane (2&3 share a column; 5&4 share a column)
  const VSLOT=['full','full','top','bottom','bottom','top','full'];  // vertical half within that shared column

  // Node size ∝ the FOCAL COUNTRY's own export+import trade value for that stage·role AT THE
  // SELECTED YEAR (from D.timeline: already year × stage × role × flow) — same sqrt-scale
  // transformation the map's trade-flow arrows/dots use: encoding value as radius ∝ √value makes
  // the visual AREA (what the eye actually compares) linear in value, not the radius itself.
  const tlY=((D&&D.timeline)||[]).filter(t=>t.year===selYear);
  const srVal=new Map();
  tlY.forEach(t=>{ const k=t.stage+'|'+t.role; srVal.set(k,(srVal.get(k)||0)+muV(t)); });
  const vals=LANE_SR.map(k=>srVal.get(k)||0);
  const rSc=d3.scaleSqrt().domain([0,d3.max(vals)||1]).range([5,26]);

  const P={t:14,b:16,l:10,r:10};
  const iw=W-P.l-P.r, ih=H-P.t-P.b, yT=P.t, yB=P.t+ih, yMid=(yT+yB)/2;
  const yFor=slot=>slot==='full'?yMid:slot==='top'?(yT+yMid)/2:(yMid+yB)/2;
  const pos=LANE_SR.map((k,i)=>({key:k,lane:i,x:P.l+COLX[i]*iw,y:yFor(VSLOT[i]),r:rSc(vals[i]),v:vals[i]}));

  const defs=svg.append('defs');
  defs.append('marker').attr('id','sr-ah').attr('viewBox','0 0 10 10').attr('refX',8).attr('refY',5)
    .attr('markerWidth',9).attr('markerHeight',9).attr('markerUnits','userSpaceOnUse').attr('orient','auto')
    .append('path').attr('d','M0,0 L10,5 L0,10 z').attr('fill','rgba(255,255,255,.45)');

  const eg=svg.append('g');
  EDGES_SR.forEach(([a,b])=>{
    const A=pos[a], B=pos[b];
    const dx=B.x-A.x, dy=B.y-A.y, len=Math.hypot(dx,dy)||1, ux=dx/len, uy=dy/len;
    eg.append('line').attr('x1',A.x+ux*(A.r+2)).attr('y1',A.y+uy*(A.r+2))
      .attr('x2',B.x-ux*(B.r+6)).attr('y2',B.y-uy*(B.r+6))
      .attr('stroke','rgba(255,255,255,.4)').attr('stroke-width',1.8).attr('marker-end','url(#sr-ah)');
  });

  // Highlighting is symmetric with the By-Product view. A stage-ONLY or role-only pick lights every
  // lane it covers (srPass), not just an exact stage+role pair — so scrolling the Stage drum to
  // "Midstream" emphasises all three midstream lanes. A selected PRODUCT lights the lane it sits
  // in (selSR()), so the By-Product selection is legible in this mode too.
  const psr=selSR(), lit=srOn()||!!psr;
  const isLit=key=>psr?(key===psr):srPass(key.split('|')[0],key.split('|')[1]);
  const ng=svg.append('g');
  pos.forEach(n=>{
    const [nSt,nRo]=n.key.split('|'), active=lit&&isLit(n.key);
    const col=VIZ.SR[n.key]||'#9ca3af';
    ng.append('circle').attr('cx',n.x).attr('cy',n.y).attr('r',active?n.r+2:n.r)
      .attr('fill',col).attr('opacity',lit?(active?1:0.14):0.82)
      .attr('stroke',active?'#fff':'rgba(255,255,255,.25)').attr('stroke-width',active?2.2:.8)
      // clicking a node here SELECTS that stage+role, mirroring how clicking a node in Product
      // mode selects the product (a second click on the same node clears it — see pickSR)
      .attr('cursor','pointer').on('click',()=>pickSR(nSt,nRo))
      .on('mousemove',ev=>tip(ev,'<b>'+n.key.replace('|',' · ')+'</b><br>'+VIZ.fmtV(n.v)+' · '+selYear
        +'<br><span style="opacity:.6">click to filter by this stage · role</span>'))
      .on('mouseout',tipOut);
    svg.append('text').attr('x',n.x).attr('y',n.y+(active?n.r+2:n.r)+11).attr('text-anchor','middle')
      .attr('font-size',7).attr('fill',active?'rgba(255,255,255,.95)':'rgba(255,255,255,.55)')
      .attr('font-weight',active?700:400)
      .attr('opacity',lit?(active?1:0.3):1).attr('pointer-events','none')
      .text(LANE_LABEL[n.lane]);
  });
}

/* ── drum-wheel selectors (Stage → Role → Category → Product) ─────────────────── */
function catMap(){ const m={}; ((D&&D.scatter)||[]).forEach(s=>{ if(s.code) m[s.code]=s.category||'Other'; }); return m; }
// v is corrected here too: the product drum orders by it, so under the corrected basis the drum
// leads with the products that actually serve this tech rather than the biggest commodity flows.
function allProducts(){ const cm=catMap(); return ((D&&D.products)||[]).map(p=>({code:p.code,name:p.product_name||p.code,stage:p.stage,role:p.role,cat:cm[p.code]||'Other',v:(p.v||0)*muShare(p.code,p.role)})); }
// renderStats() is part of every filter-driven redraw now: the Trade Flows headline is computed
// from the drum selection, so leaving it out here is exactly what made the panel show
// whole-technology totals under an active filter.
function redrawAll(){ drawFusion(); drawNav(); updateReadout(); renderStats(); }
function clearFilters(){ selStage='ALL'; selRole='ALL'; selCat='ALL'; selProduct=null; initDrums(); redrawAll(); }
function anyFilter(){ return selProduct||selStage!=='ALL'||selRole!=='ALL'||selCat!=='ALL'; }

/* ── atlas-style SR legend (ported from build_country_atlas.R buildFixedLegend/hleg-*), plus a
   3rd column for the export/import direction colors Oriol asked for. Clicking an item sets the
   SAME selStage+selRole filter as the Stage/Role drums (richer than the old stage-only swatches). */
function pickSR(stage,role){
  if(selStage===stage&&selRole===role){ selStage='ALL'; selRole='ALL'; }
  else { selStage=stage; selRole=role; }
  selCat='ALL'; selProduct=null; initDrums(); redrawAll();
}
function buildLegend(){
  const el=document.getElementById('legend'); if(!el) return;
  const mkItem=([srKey,rn])=>
    `<div class="hleg-item" data-sr="${srKey}"><div class="hleg-dot" style="background:${VIZ.SR[srKey]||'#9ca3af'}"></div>${rn}</div>`;
  const mkGrp=(stage,items)=>`<div class="hleg-group"><div class="hleg-stage">${stage}</div>${items.map(mkItem).join('')}</div>`;
  const mkCol=(groups)=>`<div class="hleg-col">${groups}</div>`;
  // export/import colors live in the stats panel's Imports/Exports labels now — no separate
  // Trade Flow legend column needed here.
  el.innerHTML=
    mkCol(mkGrp('UPSTREAM',[['Upstream|Raw Material','Raw Material']])+
          mkGrp('MIDSTREAM',[['Midstream|Processed Material','Processed Material'],['Midstream|Process Equipment','Process Equipment'],['Midstream|Product Component','Product Component']]))+
    mkCol(mkGrp('DOWNSTREAM',[['Downstream|Product Component','Product Component'],['Downstream|Process Equipment','Process Equipment']])+
          mkGrp('FINAL',[['Final Product|Final Product','Final Product']]));
  el.querySelectorAll('.hleg-item[data-sr]').forEach(item=>{
    item.addEventListener('click',()=>{ const [st,ro]=item.dataset.sr.split('|'); pickSR(st,ro); });
  });
}
function updateLegend(){
  const hasFilter=selStage!=='ALL'||selRole!=='ALL';
  document.querySelectorAll('#legend .hleg-item[data-sr]').forEach(item=>{
    if(!hasFilter){ item.classList.remove('hleg-active','hleg-dim'); return; }
    const [st,ro]=item.dataset.sr.split('|');
    const active=(selStage==='ALL'||selStage===st)&&(selRole==='ALL'||selRole===ro);
    item.classList.toggle('hleg-active',active); item.classList.toggle('hleg-dim',!active);
  });
}
function fillDrum(innerId, options, currentVal, onChange){
  // Absent by design on this page — see the note on #p-drums. Returning quietly keeps every
  // caller (initDrums, updateDrumRole/Cat/Product, clearFilters) working unmodified.
  if(!document.getElementById(innerId)) return;
  const inner=document.getElementById(innerId); if(!inner) return;
  inner.innerHTML='<div class=drum-spacer></div><div class=drum-spacer></div>'+
    options.map(o=>`<div class="drum-opt${o.value===currentVal?' drum-active':''}" data-val="${o.value}">${o.label}</div>`).join('')+
    '<div class=drum-spacer></div><div class=drum-spacer></div>';
  const idx=Math.max(0,options.findIndex(o=>o.value===currentVal));
  inner.scrollTop=19+idx*22;                                  // atlas scroll geometry (spacer=22)
  let t; inner.onscroll=()=>{ clearTimeout(t); t=setTimeout(()=>{
    const cIdx=Math.max(0,Math.min(options.length-1,Math.round((inner.scrollTop-19)/22)));
    inner.querySelectorAll('.drum-opt').forEach((el,i)=>el.classList.toggle('drum-active',i===cIdx));
    const nv=options[cIdx].value; if(nv!==inner._cur){ inner._cur=nv; onChange(nv); }
  },80); };
  inner._cur=currentVal;
}
function initDrums(){
  const stageOpts=[{value:'ALL',label:'All'},{value:'Upstream',label:'Upstream'},{value:'Midstream',label:'Midstream'},{value:'Downstream',label:'Downstream'},{value:'Final Product',label:'Final'}];
  fillDrum('drum-stage-inner',stageOpts,selStage,v=>{ selStage=v; selRole='ALL'; selCat='ALL'; selProduct=null; updateDrumRole(); updateDrumCat(); updateDrumProduct(); redrawAll(); });
  updateDrumRole(); updateDrumCat(); updateDrumProduct();
}
function updateDrumRole(){
  const roles=['ALL',...new Set(allProducts().filter(p=>selStage==='ALL'||p.stage===selStage).map(p=>p.role).filter(Boolean))];
  fillDrum('drum-role-inner',roles.map(r=>({value:r,label:r==='ALL'?'All':r.replace(' Material','').replace(' Product','Prod.')})),selRole,
    v=>{ selRole=v; selCat='ALL'; selProduct=null; updateDrumCat(); updateDrumProduct(); redrawAll(); });
}
function updateDrumCat(){
  const base=allProducts().filter(p=>(selStage==='ALL'||p.stage===selStage)&&(selRole==='ALL'||p.role===selRole));
  const cats=['ALL',...[...new Set(base.map(p=>p.cat||'Other'))].sort()];
  fillDrum('drum-cat-inner',cats.map(ct=>({value:ct,label:ct==='ALL'?'All':ct.replace(' Materials','Mat.')})),selCat,
    v=>{ selCat=v; selProduct=null; updateDrumProduct(); redrawAll(); });
}
function updateDrumProduct(){
  const prods=allProducts().filter(p=>(selStage==='ALL'||p.stage===selStage)&&(selRole==='ALL'||p.role===selRole)&&(selCat==='ALL'||p.cat===selCat)).sort((a,b)=>b.v-a.v);
  const opts=[{value:'ALL',label:'All'},...prods.map(p=>({value:p.code,label:`${p.code} — ${(p.name||'').substring(0,24)}`}))];
  fillDrum('drum-product-inner',opts,selProduct||'ALL',v=>{ selProduct=(v==='ALL')?null:v; redrawAll(); });
}
