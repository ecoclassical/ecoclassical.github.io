<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NZIPL — Orrery layout prototypes</title>
<!--
  SCRATCH prototype (not linked anywhere) to compare 3 orrery/solar-system layouts
  for the fusion cockpit's supply-chain-as-orbits idea. ?layout=a|b|c  ?tech= ?country=
    a = final product = Sun at centre; Earth rides the selected product's orbit
    b = focal-country globe = Sun at centre; supply chain orbits it (final = innermost)
    c = split: globe panel + orrery panel
  Orbits: radius ∝ step-distance from the final product; same step ⇒ same ring.
-->
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<script src="geo.js"></script>
<script src="viz.js"></script>
<style>
  html,body{margin:0;height:100%;background:#070d12;color:#e2e8f0;overflow:hidden;
    font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;}
  #stage{display:block;width:100vw;height:100vh;}
  #hd{position:fixed;top:0;left:0;right:0;height:40px;display:flex;align-items:center;gap:14px;padding:0 16px;z-index:5;
    background:linear-gradient(180deg,rgba(7,13,18,.95),transparent);}
  #hd b{font-weight:800;font-size:.85rem;} #hd b span{color:#3cb54a;}
  #hd .tag{font-size:.72rem;color:rgba(226,232,240,.6);}
  #hd .layouts{margin-left:auto;display:flex;gap:6px;}
  #hd a{font-size:.72rem;color:#cbd5e1;text-decoration:none;border:1px solid rgba(255,255,255,.15);
    border-radius:6px;padding:4px 10px;} #hd a.on{background:#3cb54a;color:#04110a;border-color:#3cb54a;font-weight:700;}
  #tip{position:fixed;pointer-events:none;opacity:0;transition:opacity .1s;z-index:9;
    background:rgba(10,18,15,.96);border:1px solid rgba(60,181,74,.35);border-radius:6px;
    padding:6px 9px;font-size:.72rem;max-width:240px;}
  .cap{font-size:.72rem;fill:rgba(226,232,240,.55);}
</style>
</head>
<body>
<div id="hd">
  <b>ORRERY <span>PROTOTYPE</span></b>
  <span class="tag" id="tag">—</span>
  <div class="layouts">
    <a href="?layout=a" id="la">A · Final=Sun</a>
    <a href="?layout=b" id="lb">B · Earth=Sun</a>
    <a href="?layout=c" id="lc">C · Split</a>
  </div>
</div>
<svg id="stage"></svg>
<div id="tip"></div>
<script>
const q=new URLSearchParams(location.search);
const TECH=q.get('tech')||'Solar', COUNTRY=q.get('country')||'India', LAYOUT=(q.get('layout')||'a').toLowerCase();
const SIZEBY=(q.get('sizeby')||'trade').toLowerCase();   // 'trade' (country) | 'degree' (tech-level)
const tipEl=()=>document.getElementById('tip');
function tip(e,h){const t=tipEl();t.style.opacity=1;t.style.left=(e.clientX+13)+'px';t.style.top=(e.clientY+13)+'px';t.innerHTML=h;}
function tipOut(){tipEl().style.opacity=0;}
const ISO3N=VIZ.ISO3N;
const iso4id=id=>{const s=String(id).padStart(3,'0');return Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(s));};

let D=null, TD=null, SEL=null;   // case, tech tree, selected product code

function dims(){const n=document.getElementById('stage');const r=n.getBoundingClientRect();return {W:r.width,H:r.height};}

// ── shared: build supply-chain nodes + step (distance to final) + angle on ring ──
function chain(){
  const edges=(TD&&TD.tree)||[];
  const nmap=new Map();
  const reg=(c,nm,st,ro)=>{ if(!nmap.has(c)) nmap.set(c,{code:c,name:nm,stage:st,role:ro}); return nmap.get(c); };
  edges.forEach(e=>{ reg(e.from_code,e.from_name,e.from_stage,e.from_role); reg(e.to_code,e.to_name,e.to_stage,e.to_role); });
  const nodes=[...nmap.values()];
  // step = SHORTEST distance to a final product (sink = node with no outgoing edge).
  // Shortest-path relaxation is cycle-safe (bounded), unlike longest-path.
  const hasOut=new Set(edges.map(e=>e.from_code));
  const step=new Map(nodes.map(n=>[n.code, hasOut.has(n.code)?Infinity:0]));
  for(let i=0;i<nodes.length;i++){let ch=false;
    edges.forEach(e=>{const d=step.get(e.to_code); if(d!==Infinity && step.get(e.from_code)>d+1){step.set(e.from_code,d+1);ch=true;}});
    if(!ch)break;}
  let finiteMax=0; step.forEach(v=>{if(v!==Infinity&&v>finiteMax)finiteMax=v;});
  step.forEach((v,k)=>{ if(v===Infinity) step.set(k,finiteMax+1); });   // unreachable → outermost
  const maxStep=d3.max([...step.values()])||1;
  const tv=new Map(((D&&D.products)||[]).map(p=>[p.code,p.v]));
  const deg=new Map(nodes.map(n=>[n.code,0]));
  edges.forEach(e=>{ deg.set(e.from_code,(deg.get(e.from_code)||0)+1); deg.set(e.to_code,(deg.get(e.to_code)||0)+1); });
  const useDeg = SIZEBY==='degree' || !tv.size;
  const sval = c => useDeg ? (deg.get(c)||0) : (tv.get(c)||0);
  const rScale = d3.scaleSqrt().domain([0, d3.max(nodes,n=>sval(n.code))||1]).range([4.5, useDeg?16:13]);
  const size = c => Math.max(3.5, rScale(sval(c)));
  const ringsBy=d3.groups(nodes,n=>step.get(n.code)).sort((a,b)=>a[0]-b[0]);

  // ── angle: minimise dendrite edge length via barycentric relaxation ──
  // neighbours in both directions; each node relaxes toward the circular mean of its
  // neighbours' angles, then de-overlap within its ring so planets don't collide.
  const nbr=new Map(nodes.map(n=>[n.code,[]]));
  edges.forEach(e=>{ if(nbr.has(e.from_code))nbr.get(e.from_code).push(e.to_code);
                     if(nbr.has(e.to_code))nbr.get(e.to_code).push(e.from_code); });
  const ang=new Map();
  ringsBy.forEach(([s,ns])=>{ ns.sort((a,b)=>(tv.get(b.code)||0)-(tv.get(a.code)||0));
    ns.forEach((n,i)=>ang.set(n.code,(i/ns.length)*2*Math.PI)); });
  for(let it=0;it<60;it++){ const na=new Map();
    nodes.forEach(n=>{ const nb=nbr.get(n.code).filter(c=>ang.has(c));
      if(!nb.length){na.set(n.code,ang.get(n.code));return;}
      let sx=0,sy=0; nb.forEach(c=>{sx+=Math.cos(ang.get(c));sy+=Math.sin(ang.get(c));});
      na.set(n.code, (sx||sy)?Math.atan2(sy,sx):ang.get(n.code)); });
    na.forEach((v,k)=>ang.set(k,v)); }
  ringsBy.forEach(([s,ns])=>{ ns.sort((a,b)=>ang.get(a.code)-ang.get(b.code));
    const minGap=(2*Math.PI)/Math.max(ns.length,1)*0.72;
    for(let i=1;i<ns.length;i++){ if(ang.get(ns[i].code)-ang.get(ns[i-1].code)<minGap) ang.set(ns[i].code,ang.get(ns[i-1].code)+minGap); } });

  // ── ring radius grows with the PRODUCT SPACE on each ring (clear concentric bands) ──
  const rAbs=[]; let acc=0;
  for(let s=0;s<=maxStep;s++){ const c=(ringsBy.find(g=>g[0]===s)||[0,[]])[1].length;
    acc += 1 + 0.16*c; rAbs[s]=acc; }                 // more products on a ring → pushed further out
  const rMax=rAbs[maxStep]||1;
  const rNorm=s=>(rAbs[s]||0)/rMax;                    // 0 (final) … 1 (outermost)
  return {edges,nodes,step,maxStep,tv,ang,rNorm,size,useDeg};
}
const nodeR=(tv,v)=>Math.max(3, d3.scaleSqrt().domain([0,d3.max([...tv.values()])||1]).range([3,13])(v||0));

// ── a small orthographic globe centred on the focal country ──
function globe(g,cx,cy,R,withGrid){
  const c=VIZ.centroids()[D.iso]||[0,0];
  const proj=d3.geoOrthographic().rotate([-c[0],-c[1],0]).translate([cx,cy]).scale(R).clipAngle(90);
  const gp=d3.geoPath(proj);
  g.append('path').datum({type:'Sphere'}).attr('d',gp).attr('fill','#0a1a12').attr('stroke','rgba(96,165,250,.3)').attr('stroke-width',1);
  if(withGrid) g.append('path').datum(d3.geoGraticule10()).attr('d',gp).attr('fill','none').attr('stroke','rgba(255,255,255,.06)').attr('stroke-width',.4);
  g.append('g').selectAll('path').data(VIZ.feats()).join('path').attr('d',gp)
    .attr('fill',d=>iso4id(d.id)===D.iso?'#1c3d2c':'#12281c')
    .attr('stroke',d=>iso4id(d.id)===D.iso?'rgba(60,181,74,.85)':'rgba(255,255,255,.07)')
    .attr('stroke-width',d=>iso4id(d.id)===D.iso?1:.35);
  return proj;
}
function sun(g,cx,cy,r,label){
  const grd=g.append('radialGradient').attr('id','sung');
  grd.append('stop').attr('offset','0%').attr('stop-color','#fde68a');
  grd.append('stop').attr('offset','100%').attr('stop-color','#f97316');
  g.append('circle').attr('cx',cx).attr('cy',cy).attr('r',r*2.2).attr('fill','#f97316').attr('opacity',.12);
  g.append('circle').attr('cx',cx).attr('cy',cy).attr('r',r).attr('fill','url(#sung)').attr('stroke','#fbbf24').attr('stroke-width',1.5);
  if(label) g.append('text').attr('x',cx).attr('y',cy+r+13).attr('text-anchor','middle').attr('class','cap').text(label);
}
function orbits(g,cx,cy,R0,gap,maxStep){
  for(let s=0;s<=maxStep;s++){ g.append('circle').attr('cx',cx).attr('cy',cy).attr('r',R0+s*gap)
    .attr('fill','none').attr('stroke','rgba(255,255,255,.10)').attr('stroke-width',s===0?0:.8).attr('stroke-dasharray','2 4'); }
}
function drawEdges(g,posFn,edges){
  g.append('g').selectAll('path').data(edges).join('path')
    .attr('d',e=>{const a=posFn(e.from_code),b=posFn(e.to_code);if(!a||!b)return null;return `M${a[0]},${a[1]}L${b[0]},${b[1]}`;})
    .attr('fill','none').attr('stroke',e=>(SEL&&(e.from_code===SEL||e.to_code===SEL))?'rgba(255,255,255,.8)':'rgba(255,255,255,.16)')
    .attr('stroke-width',e=>(SEL&&(e.from_code===SEL||e.to_code===SEL))?1.6:.6);
}
function drawPlanets(g,posFn,C){
  const {nodes}=C;
  g.append('g').selectAll('circle').data(nodes).join('circle')
    .attr('cx',n=>{const p=posFn(n.code);return p?p[0]:-99;}).attr('cy',n=>{const p=posFn(n.code);return p?p[1]:-99;})
    .attr('r',n=>{const r=C.size(n.code);return n.code===SEL?r+2:r;})
    .attr('fill',n=>VIZ.SR[n.stage+'|'+n.role]||'#888')
    .attr('stroke',n=>n.code===SEL?'#fff':'rgba(255,255,255,.5)').attr('stroke-width',n=>n.code===SEL?2.2:.8)
    .attr('opacity',n=>!SEL?.96:(n.code===SEL?1:.55)).attr('cursor','pointer')
    .on('mousemove',(e,n)=>tip(e,`<b>${n.name||n.code}</b><br>HS ${n.code}<br>${n.stage} · ${n.role}`+(C.tv.get(n.code)?`<br>${VIZ.fmtV(C.tv.get(n.code))}`:'')))
    .on('mouseout',tipOut).on('click',(e,n)=>{SEL=(SEL===n.code)?null:n.code;render();});
}

function render(){
  const svg=d3.select('#stage'); svg.selectAll('*').remove();
  const {W,H}=dims(); svg.attr('viewBox',`0 0 ${W} ${H}`);
  const defs=svg.append('defs');
  if(!TD){svg.append('text').attr('x',W/2).attr('y',H/2).attr('text-anchor','middle').attr('fill','#889').text('loading…');return;}
  const C=chain();
  if(!C.nodes.length){svg.append('text').attr('x',W/2).attr('y',H/2).attr('text-anchor','middle').attr('fill','#889').text('no supply-chain (dendrite) data for '+TECH);return;}
  const earthCode = SEL || [...C.tv.entries()].sort((a,b)=>b[1]-a[1])[0]?.[0] || C.nodes[0].code;

  document.getElementById('tag').textContent = C.useDeg
    ? `${TECH.replace(/_/g,' ')}  ·  ${C.nodes.length} products · ${C.maxStep+1} orbits (step 0 = final) · size ∝ links`
    : `${TECH} · ${COUNTRY}  ·  ${C.nodes.length} products · ${C.maxStep+1} orbits (step 0 = final)`;

  if(LAYOUT==='b'){
    // ── B: focal globe = Sun at centre; chain orbits it (final=innermost) ──
    const cx=W/2, cy=H/2+8, globeR=Math.min(W,H)*0.14;
    const R0=globeR+34, gap=(Math.min(W,H)*0.42-R0)/(C.maxStep||1);
    const g=svg.append('g');
    orbits(g,cx,cy,R0,gap,C.maxStep);
    const pos=code=>{const s=C.step.get(code)||0,a=C.ang.get(code)||0,r=R0+s*gap;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
    drawEdges(g,pos,C.edges);
    drawPlanets(g,pos,C);
    globe(g,cx,cy,globeR,true);
    g.append('text').attr('x',cx).attr('y',cy+globeR+15).attr('text-anchor','middle').attr('class','cap').text(COUNTRY+' (hub)');
    g.append('text').attr('x',cx).attr('y',24).attr('text-anchor','middle').attr('class','cap').text('inner ring = final product · outer = upstream');
  } else if(LAYOUT==='c'){
    // ── C: split — globe panel (left) + orrery panel (right) ──
    const gx=W*0.26, gy=H/2+8, gR=Math.min(W*0.42,H)*0.34;
    const gg=svg.append('g'); globe(gg,gx,gy,gR,true);
    gg.append('text').attr('x',gx).attr('y',gy+gR+16).attr('text-anchor','middle').attr('class','cap').text(COUNTRY+' — geographic view');
    svg.append('line').attr('x1',W*0.52).attr('y1',54).attr('x2',W*0.52).attr('y2',H-20).attr('stroke','rgba(255,255,255,.08)');
    const cx=W*0.76, cy=H/2+8, R0=46, gap=(Math.min(W*0.42,H)*0.40-R0)/(C.maxStep||1);
    const og=svg.append('g');
    orbits(og,cx,cy,R0,gap,C.maxStep);
    const pos=code=>{const s=C.step.get(code)||0,a=C.ang.get(code)||0,r=R0+s*gap;return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
    drawEdges(og,pos,C.edges);
    sun(og,cx,cy,16,'final product');
    drawPlanets(og,pos,C);
    // Earth marker on the selected product's orbit
    const ep=pos(earthCode); if(ep){ globe(og,ep[0],ep[1],17,false);
      og.append('circle').attr('cx',ep[0]).attr('cy',ep[1]).attr('r',22).attr('fill','none').attr('stroke','#3cb54a').attr('stroke-width',1.5); }
    og.append('text').attr('x',cx).attr('y',24).attr('text-anchor','middle').attr('class','cap').text('supply chain as orbits · ◉ = Earth on selected orbit');
  } else {
    // ── A: clean "product solar system" draft — final product = Sun at the centre ──
    const cx=W/2, cy=H/2+10, R0=58, maxR=Math.min(W,H)*0.44;
    const R=s=>R0 + C.rNorm(s)*(maxR-R0);                 // product-space ring radius
    const g=svg.append('g');
    for(let s=1;s<=C.maxStep;s++){                        // concentric rings + faint step labels
      g.append('circle').attr('cx',cx).attr('cy',cy).attr('r',R(s))
        .attr('fill','none').attr('stroke','rgba(200,215,235,.15)').attr('stroke-width',1.2);
      g.append('text').attr('x',cx).attr('y',cy-R(s)-3).attr('text-anchor','middle').attr('class','cap').attr('font-size','8').text('step '+s);
    }
    const pos=code=>{const s=C.step.get(code)||0,a=C.ang.get(code)||0,r=R(s);return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
    drawEdges(g,pos,C.edges);
    sun(g,cx,cy,20,'final product');
    drawPlanets(g,pos,C);
    g.append('text').attr('x',cx).attr('y',26).attr('text-anchor','middle').attr('class','cap')
      .text('☀ final product at centre · each ring = one step upstream · radius ∝ product space · planet size ∝ '+(C.useDeg?'links':'trade value'));
    // self-labelling title (for the per-tech panel PNGs)
    g.append('text').attr('x',26).attr('y',52).attr('fill','#e2e8f0').attr('font-size',22).attr('font-weight',800).text(TECH.replace(/_/g,' '));
    g.append('text').attr('x',26).attr('y',72).attr('fill','#3cb54a').attr('font-size',12).attr('font-weight',700).attr('letter-spacing','.08em').text('VALUE-CHAIN SOLAR SYSTEM');
    g.append('text').attr('x',26).attr('y',90).attr('class','cap').text(C.nodes.length+' products · '+(C.maxStep+1)+' steps to final');
  }
}

async function boot(){
  if(q.get('bare')) document.getElementById('hd').style.display='none';   // clean render for panel PNGs
  ['la','lb','lc'].forEach(id=>{ if(id==='l'+LAYOUT) document.getElementById(id).classList.add('on'); });
  VIZ.setTheme('dark');
  try{ VIZ.initGeo(window.__WORLD110 || await (await fetch('../lib/countries-110m.json')).json()); }catch(e){console.warn('geo',e);}
  try{ D=await (await fetch('data/'+TECH.replace(/ /g,'_')+'_'+COUNTRY+'.json')).json(); D=Array.isArray(D)?D[0]:D; }catch(e){}
  try{ TD=await (await fetch('data/_tech_'+TECH.replace(/ /g,'_')+'.json')).json(); TD=Array.isArray(TD)?TD[0]:TD; }catch(e){}
  render();
  let rt; window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(render,150);});
}
boot();
</script>
</body>
</html>
