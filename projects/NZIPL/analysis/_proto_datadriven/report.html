<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Intelligence Report · Option A slides</title>
<script src="https://d3js.org/d3.v7.min.js"></script>
<script src="https://unpkg.com/topojson-client@3"></script>
<script src="geo.js"></script>
<script src="viz.js"></script>
<style>
  :root{ --ink:#0b1a12; --muted:#5c6b60; --line:#e3e8e3; --rail:#0a1410; --green:#3cb54a; --accent:#eab308; }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#cbd3cb;color:var(--ink);font-family:"Archivo",system-ui,sans-serif;}
  /* toolbar (screen only) */
  .bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;background:#0a1410;color:#dde8dd;
    padding:9px 18px;border-bottom:1px solid rgba(255,255,255,.1);}
  .bar .eyebrow{font-size:9px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--green);}
  select{background:#0b1a0d;color:#dde8dd;border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:5px 9px;font-family:inherit;font-size:12px;cursor:pointer;}
  .btn{margin-left:auto;background:var(--green);color:#04210a;border:none;border-radius:6px;padding:7px 16px;font-weight:800;font-size:12px;letter-spacing:.05em;cursor:pointer;}
  .deck{display:flex;flex-direction:column;align-items:center;gap:20px;padding:22px 0 60px;}
  /* one landscape slide */
  .slide{width:1000px;height:680px;background:#fff;border-radius:8px;overflow:hidden;display:grid;
    grid-template-columns:208px 1fr;box-shadow:0 6px 26px rgba(0,0,0,.22);}
  .toc{background:var(--rail);color:#cfe0d0;padding:20px 16px;display:flex;flex-direction:column;gap:2px;}
  .toc .brand{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--green);line-height:1.4;margin-bottom:4px;}
  .toc .sub{font-size:11px;color:#8aa48d;margin-bottom:16px;}
  .toc a{display:flex;gap:8px;align-items:baseline;font-size:11px;color:#9fb3a2;text-decoration:none;padding:4px 6px;border-radius:5px;line-height:1.25;}
  .toc a .n{font-size:9px;color:#5d7560;font-weight:700;min-width:16px;}
  .toc a.active{background:rgba(60,181,74,.14);color:#fff;}
  .toc a.active .n{color:var(--green);}
  .main{display:flex;flex-direction:column;padding:22px 26px 20px;min-width:0;}
  .shead{display:flex;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px;}
  .shead .num{font-size:13px;font-weight:800;color:var(--green);}
  .shead .stitle{font-size:17px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);}
  .shead .sfam{margin-left:auto;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  .vis{flex:1;min-height:0;background:#0a0f14;border-radius:8px;padding:10px;}
  .vis svg{display:block;width:100%;height:100%;}
  .bullets{margin-top:12px;padding-left:2px;list-style:none;display:flex;flex-direction:column;gap:5px;}
  .bullets li{font-size:12.5px;line-height:1.35;color:#23332a;padding-left:16px;position:relative;}
  .bullets li:before{content:"";position:absolute;left:2px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--green);}
  .bullets li b{color:var(--ink);}
  /* cover slide */
  .cover{display:flex;flex-direction:column;justify-content:center;padding:0 8px;}
  .cover .eg{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--green);}
  .cover h1{font-size:40px;font-weight:800;line-height:1.05;margin:8px 0 4px;}
  .cover h1 .tk{color:var(--accent);}
  .cover .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px;}
  .cover .stat{border-top:2px solid var(--green);padding-top:8px;}
  .cover .stat .v{font-size:22px;font-weight:800;}
  .cover .stat .k{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-top:2px;}
  .tip{position:fixed;background:rgba(6,13,8,.95);color:#dde8dd;border:1px solid rgba(60,181,74,.3);border-radius:5px;padding:5px 9px;font-size:11px;pointer-events:none;opacity:0;transition:opacity .12s;z-index:99;}
  /* LIGHT theme (toggled by body.light: print path + ?theme=light preview) */
  body.light .vis{background:#f6f8f6;border:1px solid #e3e8e3;}
  body.light .toc{background:#f1f4f1;color:#3a463f;}
  body.light .toc .sub{color:#6b766e;}
  body.light .toc a{color:#5a665d;} body.light .toc a .n{color:#9aa69d;}
  body.light .toc a.active{background:rgba(60,181,74,.16);color:#1d2a22;}
  body.light .bullets li{color:#23332a;} body.light .bullets li b{color:#0b1a12;}
  /* print: one landscape page per slide, no chrome (forced light via beforeprint) */
  @page{ size:Letter landscape; margin:7mm; }
  @media print{
    *{ -webkit-print-color-adjust:exact!important; print-color-adjust:exact!important; }
    body{background:#fff;}
    .bar,.tip{display:none!important;}
    .deck{gap:0;padding:0;}
    .slide{box-shadow:none;border-radius:0;page-break-after:always;width:100%;height:186mm;}
    .slide:last-child{page-break-after:auto;}
  }
</style>
</head>
<body>
<div class="bar">
  <span class="eyebrow">NZIPL · Intelligence Report</span>
  <select id="sel-tech"></select>
  <select id="sel-country"></select>
  <button class="btn" id="print">⤓ Save as PDF</button>
</div>
<div class="deck" id="deck"></div>
<div class="tip" id="tip"></div>

<script>
const VISUALS=[
  {id:'radar',    label:'Capability Radar',    fam:'Capability',     draw:(d,td)=>VIZ.radar('#v-radar',d.radar)},
  {id:'scatter',  label:'PC Scatter',          fam:'Competitiveness',draw:(d,td)=>VIZ.scatter('#v-scatter',d.scatter)},
  {id:'timeline', label:'Trade Timeline',      fam:'Trade',          draw:(d,td)=>VIZ.timeline('#v-timeline',(d.timeline||[]).filter(r=>r.flow==='exp'))},
  {id:'treemap',  label:'Trade Composition',   fam:'Trade',          draw:(d,td)=>VIZ.treemap('#v-treemap',d.products)},
  {id:'map',      label:'Trade Map',           fam:'Trade',          draw:(d,td)=>VIZ.map('#v-map',d.partners,d.iso)},
  {id:'sankey',   label:'Value-Chain Sankey',  fam:'Structure',      draw:(d,td)=>VIZ.sankey('#v-sankey',td&&td.sankey)},
  {id:'tree',     label:'Tech Tree',           fam:'Structure',      draw:(d,td)=>VIZ.tree('#v-tree',td&&td.tree)},
  {id:'firms',    label:'Activity Map',        fam:'Firms',          draw:(d,td)=>VIZ.firms('#v-firms',d.firms,d.iso)},
];
let IDX=null, CUR={tech:'Solar',country:'India',vis:VISUALS.map(v=>v.id)};

async function boot(){
  IDX=await (await fetch('data/_index.json')).json(); IDX=Array.isArray(IDX)?IDX[0]:IDX;
  // geo is inlined (geo.js) so the world map renders even under file:// — fall back to fetch
  try{ VIZ.initGeo(window.__WORLD110 || await (await fetch('../lib/countries-110m.json')).json()); }catch(e){ console.warn('geo',e); }
  const p=new URLSearchParams(location.search);
  CUR.tech=p.get('tech')||CUR.tech; CUR.country=p.get('country')||CUR.country;
  CUR.theme=p.get('theme')==='light'?'light':'dark';
  if(p.get('vis')) CUR.vis=p.get('vis').split(',').filter(x=>VISUALS.find(v=>v.id===x));
  const st=d3.select('#sel-tech'); st.selectAll('option').data(IDX.techs).join('option').attr('value',d=>d).text(d=>d); st.property('value',CUR.tech);
  const sc=d3.select('#sel-country'); sc.selectAll('option').data(IDX.countries).join('option').attr('value',d=>d.slug).text(d=>d.name.replace(/_/g,' ')); sc.property('value',CUR.country);
  st.on('change',function(){CUR.tech=this.value;render();});
  sc.on('change',function(){CUR.country=this.value;render();});
  // Save-as-PDF: force LIGHT, redraw, print, then restore the chosen screen theme.
  document.getElementById('print').onclick=()=>{ applyTheme('light'); setTimeout(()=>window.print(),60); };
  // also covers Cmd/Ctrl-P: switch to light before the browser paints the print view
  window.addEventListener('beforeprint',()=>applyTheme('light'));
  window.addEventListener('afterprint',()=>applyTheme(CUR.theme));
  render();
}

let LAST={d:null,td:null,chosen:[]};
function drawAll(){ LAST.chosen.forEach(s=>{ try{ s.draw(LAST.d,LAST.td); }catch(e){ console.warn('draw',s.id,e); } }); }
// flip CSS chrome + chart ink together, then redraw the SVGs
function applyTheme(mode){ document.body.classList.toggle('light',mode==='light'); VIZ.setTheme(mode); drawAll(); }

function tocHTML(slides,activeIdx){
  const cn=(IDX.countries.find(c=>c.slug===CUR.country)||{}).name||CUR.country;
  let h=`<div class="brand">Atlas of the Clean<br>Industrial Base</div><div class="sub">${CUR.tech} · ${cn.replace(/_/g,' ')}</div>`;
  slides.forEach((s,i)=>{ h+=`<a href="#slide-${i}" class="${i===activeIdx?'active':''}"><span class="n">${String(i).padStart(2,'0')}</span><span>${s.label}</span></a>`; });
  return h;
}

async function render(){
  const id=CUR.tech.replace(/ /g,'_')+'_'+CUR.country;
  let d; try{ d=await (await fetch('data/'+id+'.json')).json(); }catch(e){ document.getElementById('deck').innerHTML='<p style="padding:40px;color:#333">No data for '+id+'</p>'; return; }
  d=Array.isArray(d)?d[0]:d;
  let td=null; try{ td=await (await fetch('data/_tech_'+CUR.tech.replace(/ /g,'_')+'.json')).json(); td=Array.isArray(td)?td[0]:td; }catch(e){}
  const cn=(d.country||CUR.country).replace(/_/g,' ');
  const chosen=CUR.vis.map(v=>VISUALS.find(x=>x.id===v)).filter(Boolean);
  const slides=[{cover:true,label:'Overview'},...chosen];

  const deck=document.getElementById('deck'); deck.innerHTML='';
  slides.forEach((s,i)=>{
    const sec=document.createElement('section'); sec.className='slide'; sec.id='slide-'+i;
    const main = s.cover ? coverMain(d,td,cn) :
      `<div class="shead"><span class="num">${String(i).padStart(2,'0')}</span><span class="stitle">${s.label}</span><span class="sfam">${CUR.tech} · ${cn} · ${s.fam}</span></div>
       <div class="vis"><svg id="v-${s.id}"></svg></div>
       <ul class="bullets">${VIZ.highlights(s.id,d,td).map(b=>'<li>'+b+'</li>').join('')||'<li>—</li>'}</ul>`;
    sec.innerHTML=`<aside class="toc">${tocHTML(slides,i)}</aside><div class="main ${s.cover?'cover':''}">${main}</div>`;
    deck.appendChild(sec);
  });
  // draw all visuals now (synchronous, no lazy iframes → prints clean)
  LAST={d,td,chosen}; applyTheme(CUR.theme);
}

function coverMain(d,td,cn){
  const exp=(d.timeline||[]).filter(r=>r.flow==='exp'), imp=(d.timeline||[]).filter(r=>r.flow==='imp');
  const totE=d3.sum(exp,r=>r.v), totI=d3.sum(imp,r=>r.v);
  const dest=(d.partners||[]).filter(r=>r.dir==='dest').sort((a,b)=>b.v-a.v)[0];
  const nprod=(d.products||[]).length;
  return `<div class="eg">Trade-based intelligence brief</div>
    <h1><span class="tk">${CUR.tech}</span><br>${cn}</h1>
    <div class="stats">
      <div class="stat"><div class="v">${VIZ.fmtV(totE)}</div><div class="k">Total exports</div></div>
      <div class="stat"><div class="v">${VIZ.fmtV(totI)}</div><div class="k">Total imports</div></div>
      <div class="stat"><div class="v">${nprod}</div><div class="k">Traded products</div></div>
      <div class="stat"><div class="v">${dest?dest.partner:'—'}</div><div class="k">Top destination</div></div>
    </div>`;
}
boot();
</script>
</body>
</html>
