<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:#0a0f14;color:#e2e8f0;min-height:100vh;overflow-x:hidden}
/* ── Header ── */
.header{background:#060d08;border-bottom:1px solid rgba(255,255,255,.08);padding:12px 24px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.header-logo{font-size:.95rem;font-weight:800;color:#3cb54a;letter-spacing:.04em;white-space:nowrap}
.header-sep{color:rgba(255,255,255,.25);margin:0 6px;font-weight:300}
.header-sub{font-size:.78rem;font-weight:600;color:rgba(255,255,255,.82);margin-left:2px;letter-spacing:.01em;border-bottom:1px solid rgba(60,181,74,.5);padding-bottom:1px}
.nav-scroll{flex:1;overflow-x:auto;display:flex;gap:6px;padding:2px 0;scrollbar-width:none}
.nav-scroll::-webkit-scrollbar{display:none}
.nav-btn{padding:5px 13px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:transparent;cursor:pointer;font-size:.75rem;font-weight:600;color:rgba(255,255,255,.55);white-space:nowrap;transition:all .18s}
.nav-btn:hover{color:#fff;border-color:rgba(255,255,255,.3)}
.nav-btn.active{background:rgba(60,181,74,.15);border-color:#3cb54a;color:#3cb54a}
/* ── Dashboard grid ── */
.dashboard{display:grid;grid-template-columns:65fr 35fr;grid-template-rows:40fr 30fr 30fr;gap:1px;height:calc(100vh - 52px);background:#1a2030}
.pane{background:#0d1520;position:relative;overflow:hidden;display:flex;flex-direction:column}
.pane-header{padding:10px 16px 6px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:baseline;gap:10px;flex-shrink:0}
.pane-title{font-size:.78rem;font-weight:700;color:rgba(255,255,255,.8);text-transform:uppercase;letter-spacing:.07em}
.pane-meta{font-size:.68rem;color:rgba(255,255,255,.35)}
.pane-body{flex:1;min-height:0;position:relative}
/* ── Map pane ── */
#pane-map{grid-row:span 3}
#pane-map .pane-header{flex-direction:column;align-items:flex-start;gap:4px;padding:8px 16px 6px}
.map-title-col{display:flex;flex-direction:column;line-height:1.05;margin-bottom:2px}
.map-tech-label{font-size:1.65rem;font-weight:800;letter-spacing:.01em;line-height:1.0}
.map-country-label{font-size:1.65rem;font-weight:800;color:#e2e8f0;letter-spacing:.01em;line-height:1.0}
.prod-scroll{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 0;width:100%;align-items:flex-start}
.prod-scroll::-webkit-scrollbar{display:none}
.prod-btn{padding:5px 11px 5px 9px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:transparent;cursor:pointer;display:flex;flex-direction:column;gap:2px;white-space:nowrap;transition:all .15s;flex-shrink:0}
.prod-btn:hover{border-color:rgba(255,255,255,.3)}
.prod-btn-top{display:flex;align-items:center;gap:5px}
.prod-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.prod-name{font-size:.7rem;font-weight:700;color:rgba(255,255,255,.7);max-width:140px;overflow:hidden;text-overflow:ellipsis}
.prod-btn.active .prod-name{color:#fff}
.prod-btn-sub{display:flex;align-items:center;gap:5px;padding-left:12px}
.prod-role-badge{font-size:.58rem;font-weight:600;padding:1px 5px;border-radius:4px}
.prod-hs{font-size:.58rem;color:rgba(255,255,255,.3)}
.map-svg{width:100%;height:100%}
.country{fill:#1a2535;stroke:#0d1520;stroke-width:.4}
.country.focal{fill:#073309;stroke:#3cb54a;stroke-width:1.5}
.country.supplier{fill:rgba(217,119,6,.18)}
.country.buyer{fill:rgba(3,105,161,.18)}
.map-overlay{position:absolute;top:12px;left:16px;background:rgba(6,13,8,.92);border:1px solid rgba(60,181,74,.2);border-radius:8px;padding:12px 16px;min-width:185px;max-width:220px}
.ov-label{font-size:.62rem;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.09em;margin-bottom:3px}
.ov-imp-row{display:flex;align-items:baseline;gap:7px;margin-bottom:2px}
.ov-val{font-size:1.32rem;font-weight:800;color:#e2e8f0;line-height:1;white-space:nowrap}
.ov-gdp-inline{font-size:.67rem;color:rgba(255,255,255,.38);font-weight:400;white-space:nowrap}
.ov-net{font-size:.74rem;margin-top:4px;font-weight:600}
.ov-list{margin-top:9px}
.ov-row{display:flex;align-items:center;gap:7px;padding:3px 0;border-top:1px solid rgba(255,255,255,.06);font-size:.7rem}
.ov-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ov-cname{color:rgba(255,255,255,.75);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ov-cval{color:rgba(255,255,255,.45);font-size:.66rem;white-space:nowrap}
.ov-cgdp{color:rgba(255,255,255,.25);font-size:.6rem;white-space:nowrap}
.map-legend{position:absolute;bottom:12px;left:16px;display:flex;gap:12px;font-size:.69rem;color:rgba(255,255,255,.45)}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-circle{width:10px;height:10px;border-radius:50%;border:1.5px solid}
/* ── Timeline pane ── */
#pane-tl .pane-body{padding:6px 10px 4px}
#pane-tl .pane-header{flex-wrap:wrap;gap:5px;padding:7px 16px 6px}
.tl-controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.tl-toggle{display:flex;gap:3px;background:rgba(255,255,255,.07);padding:2px;border-radius:6px}
.tl-btn{padding:3px 10px;border:none;border-radius:4px;background:transparent;cursor:pointer;font-size:.72rem;font-weight:600;color:rgba(255,255,255,.45);transition:all .15s}
.tl-btn.active{background:rgba(255,255,255,.12);color:#e2e8f0}
#tl-svg{width:100%;height:calc(100% - 4px)}
/* ── Dendrite pane ── */
#pane-den .pane-body{padding:8px 12px 4px}
#den-svg{width:100%;height:100%}
/* ── Scatter pane ── */
#pane-sc .pane-body{padding:6px 10px 4px}
.sc-toggle{display:flex;gap:3px;background:rgba(255,255,255,.07);padding:2px;border-radius:6px}
.sc-btn{padding:3px 10px;border:none;border-radius:4px;background:transparent;cursor:pointer;font-size:.72rem;font-weight:600;color:rgba(255,255,255,.45);transition:all .15s}
.sc-btn.active{background:rgba(255,255,255,.12);color:#e2e8f0}
#sc-svg{width:100%;height:calc(100% - 28px)}
/* ── Tooltip ── */
.tooltip{position:fixed;background:rgba(10,15,20,.95);border:1px solid rgba(255,255,255,.12);color:#e2e8f0;padding:7px 11px;border-radius:7px;font-size:.74rem;pointer-events:none;opacity:0;transition:opacity .12s;z-index:9999;max-width:220px;line-height:1.45}
.tooltip strong{display:block;margin-bottom:2px;font-size:.8rem}
/* ── Responsive ── */
@media(max-width:900px){.dashboard{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;height:auto}#pane-map{grid-row:span 1;height:60vw}.pane{height:55vw}}
</style>
</head>

// ═══ NAV ══════════════════════════════════════════════════════════════════════
document.querySelectorAll(".nav-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".nav-btn").forEach(b => {
      b.classList.remove("active");
      b.style.borderColor = "";
      b.style.color = "";
      b.style.background = "";
    });
    btn.classList.add("active");
    currentIdx = +btn.dataset.idx;
    updateAll();
  });
});

// ═══ TIMELINE CONTROLS ═══════════════════════════════════════════════════════
["tl-imp","tl-exp","tl-bal"].forEach((id,k) => {
  document.getElementById(id).addEventListener("click", () => {
    tlMode = ["imports","exports","balance"][k];
    // Only deactivate the mode buttons (first toggle group)
    ["tl-imp","tl-exp","tl-bal"].forEach(bid => document.getElementById(bid).classList.remove("active"));
    document.getElementById(id).classList.add("active");
    drawTimeline(ALL_CASES[currentIdx]);
  });
});
["tl-levels","tl-growth"].forEach((id,k) => {
  document.getElementById(id).addEventListener("click", () => {
    tlScale = k===0 ? "levels" : "growth";
    ["tl-levels","tl-growth"].forEach(bid => document.getElementById(bid).classList.remove("active"));
    document.getElementById(id).classList.add("active");
    drawTimeline(ALL_CASES[currentIdx]);
  });
});

// ═══ SCATTER CONTROLS ════════════════════════════════════════════════════════
["sc-abs","sc-pct"].forEach((id,k) => {
  document.getElementById(id).addEventListener("click", () => {
    scMode = k===0?"abs":"pct";
    document.querySelectorAll(".sc-btn").forEach(b=>b.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    drawScatter(ALL_CASES[currentIdx]);
  });
});

// ═══ WORLD MAP INIT ══════════════════════════════════════════════════════════
function initMap() {
  const el  = document.getElementById("map-svg");
  const W   = el.clientWidth  || 600;
  const H   = el.clientHeight || 500;
  const svg = d3.select("#map-svg");

  // Scale to fill both dimensions: Natural Earth aspect ~1.92:1, so height fills at H/3.3
  const mapScale = Math.max(W / 5.0, H / 3.3);
  mapProjection = d3.geoNaturalEarth1()
    .scale(mapScale)
    .translate([W * 0.55, H * 0.44]);
  mapPath = d3.geoPath().projection(mapProjection);

  const sphere = svg.append("path")
    .datum({type:"Sphere"})
    .attr("d", mapPath)
    .attr("fill","#0a1525")
    .attr("stroke","#1a2a3a")
    .attr("stroke-width",.5);

  d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world => {
    worldTopo = world;
    const countries = topojson.feature(world, world.objects.countries);

    // Build iso3 → centroid pixel lookup
    countries.features.forEach(f => {
      const numId = +f.id;
      const iso3 = Object.keys(ISO3N).find(k => ISO3N[k] === numId);
      if (iso3) {
        const c = d3.geoCentroid(f);
        centroids[iso3] = mapProjection(c);
      }
    });

    svg.append("g").attr("class","country-layer")
      .selectAll("path")
      .data(countries.features)
      .enter().append("path")
      .attr("class","country")
      .attr("id", d => {
        const numId = +d.id;
        const iso3 = Object.keys(ISO3N).find(k => ISO3N[k] === numId);
        return iso3 ? "c-"+iso3 : null;
      })
      .attr("d", mapPath);

    // Graticule
    svg.insert("path","g").datum(d3.geoGraticule()())
      .attr("fill","none").attr("stroke","rgba(255,255,255,.04)").attr("stroke-width",.4)
      .attr("d", mapPath);

    // Layers for arcs and bubbles (above countries)
    svg.append("g").attr("class","arc-layer");
    svg.append("g").attr("class","bubble-layer");

    updateAll();
  }).catch(err => {
    console.warn("topojson load failed:", err);
    updateAll();
  });
}

// ═══ PRODUCT SELECTOR ════════════════════════════════════════════════════════
function renderProductButtons(c) {
  const container = document.getElementById("prod-scroll");
  container.innerHTML = "";
  if (!c.product_views || !c.product_views.length) return;
  c.product_views.forEach((pv, i) => {
    // Color: tech color for ALL, PROD_COLORS for key products
    const col = i === 0 ? c.color : PROD_COLORS[(i-1) % PROD_COLORS.length];
    const isActive = i === currentProduct;
    const btn = document.createElement("button");
    btn.className = "prod-btn" + (isActive ? " active" : "");
    if (isActive) { btn.style.borderColor = col; btn.style.background = col+"22"; }

    // Top line: colored dot + product name
    const top = document.createElement("div");
    top.className = "prod-btn-top";
    const dot = document.createElement("span");
    dot.className = "prod-dot";
    dot.style.background = col;
    dot.style.opacity = isActive ? "1" : "0.55";
    const nm = document.createElement("span");
    nm.className = "prod-name";
    if (i === 0) {
      const l1 = document.createElement("span");
      l1.style.display = "block"; l1.style.lineHeight = "1.1"; l1.textContent = "All";
      const l2 = document.createElement("span");
      l2.style.display = "block"; l2.style.lineHeight = "1.1"; l2.textContent = c.tech;
      nm.appendChild(l1); nm.appendChild(l2);
    } else {
      nm.textContent = pv.label;
    }
    top.appendChild(dot); top.appendChild(nm);
    btn.appendChild(top);

    // Sub line: role badge + HS code (key products only, not ALL)
    if (i > 0) {
      const sub = document.createElement("div");
      sub.className = "prod-btn-sub";
      const badge = document.createElement("span");
      badge.className = "prod-role-badge";
      badge.textContent = pv.role || "";
      badge.style.background = col + (isActive ? "33" : "20");
      badge.style.color = isActive ? col : "rgba(255,255,255,.4)";
      const hs = document.createElement("span");
      hs.className = "prod-hs";
      hs.textContent = "HS " + pv.code;
      sub.appendChild(badge); sub.appendChild(hs);
      btn.appendChild(sub);
    }

    btn.addEventListener("click", () => {
      document.querySelectorAll(".prod-btn").forEach(b => {
        b.classList.remove("active");
        b.style.borderColor = ""; b.style.background = "";
      });
      btn.classList.add("active");
      btn.style.borderColor = col; btn.style.background = col+"22";
      // Update dot opacity + badge colors
      container.querySelectorAll(".prod-dot").forEach((d,j) => {
        d.style.opacity = j === i ? "1" : "0.55";
      });
      currentProduct = i;
      updateMap(c); drawTimeline(c); drawDendrite(c);
    });
    container.appendChild(btn);
  });
}

// ═══ UPDATE ALL PANES ════════════════════════════════════════════════════════
function updateAll() {
  currentProduct = 0;  // reset to ALL when switching case
  const c = ALL_CASES[currentIdx];
  if (!c) return;
  // Header colour tint on active nav
  document.querySelectorAll(".nav-btn.active").forEach(b => {
    b.style.borderColor = c.color;
    b.style.color = c.color;
    b.style.background = `${c.color}22`;
  });
  renderProductButtons(c);
  updateMap(c);
  drawTimeline(c);
  drawDendrite(c);
  drawScatter(c);
}

// ═══ MAP UPDATE ═══════════════════════════════════════════════════════════════
function updateMap(c) {
  // Resolve active product view (0 = ALL)
  const pv = (c.product_views && c.product_views[currentProduct]) || c.product_views[0];

  const techEl    = document.getElementById("map-tech");
  const countryEl = document.getElementById("map-country");
  techEl.textContent    = c.tech;
  techEl.style.color    = c.color;
  countryEl.textContent = c.name;

  // Reset country colours
  d3.selectAll(".country").attr("class","country");
  // Focal
  d3.select(`#c-${c.focal}`).attr("class","country focal");
  // Suppliers
  pv.suppliers.forEach(s => d3.select(`#c-${s.iso3}`).attr("class","country supplier"));
  // Buyers
  pv.buyers.forEach(b => d3.select(`#c-${b.iso3}`).attr("class","country buyer"));

  const focalPt = centroids[c.focal];

  // Arcs
  const arcLayer = d3.select(".arc-layer");
  arcLayer.selectAll("*").remove();
  if (focalPt) {
    const allPartners = [
      ...pv.suppliers.map(s=>({...s,type:"sup"})),
      ...pv.buyers.map(b=>({...b,type:"buy"}))
    ];
    const maxV = d3.max(allPartners, d=>d.value)||1;
    const wSc  = d3.scaleLinear().domain([0,maxV]).range([.4,3.5]);
    allPartners.forEach(p => {
      const pt = centroids[p.iso3];
      if (!pt) return;
      const col   = p.type==="sup" ? "#d97706" : "#0369a1";
      const geoArc = {type:"LineString", coordinates:[
        mapProjection.invert(focalPt),
        mapProjection.invert(pt)
      ]};
      arcLayer.append("path")
        .attr("d", mapPath(geoArc))
        .attr("fill","none")
        .attr("stroke", col)
        .attr("stroke-width", wSc(p.value))
        .attr("stroke-opacity",.45)
        .attr("stroke-dasharray", p.type==="sup"?"none":"none");
    });
  }

  // Bubbles
  const bubLayer = d3.select(".bubble-layer");
  bubLayer.selectAll("*").remove();
  const allPartners = [
    ...pv.suppliers.slice(0,10).map(s=>({...s,type:"sup"})),
    ...pv.buyers.slice(0,10).map(b=>({...b,type:"buy"}))
  ];
  const maxV = d3.max(allPartners, d=>d.value)||1;
  const rSc  = d3.scaleSqrt().domain([0,maxV]).range([4,28]);

  allPartners.forEach(p => {
    const pt = centroids[p.iso3];
    if (!pt) return;
    const col  = p.type==="sup" ? "#d97706" : "#0369a1";
    const fill = p.type==="sup" ? "rgba(217,119,6,.35)" : "rgba(3,105,161,.35)";
    const g    = bubLayer.append("g").attr("transform",`translate(${pt[0]},${pt[1]})`);
    g.append("circle").attr("r",rSc(p.value)).attr("fill",fill).attr("stroke",col).attr("stroke-width",1.2);
    if (rSc(p.value) > 10) {
      g.append("text").attr("text-anchor","middle").attr("dy",".35em")
        .attr("font-size",Math.min(9,rSc(p.value)*.55)).attr("font-weight","700")
        .attr("fill","#e2e8f0").text(p.iso3);
    }
    g.on("mousemove",(ev)=>showTip(
      `<strong>${p.name}</strong>${p.type==="sup"?"Exports to":"Imports from"} ${c.name}<br>${fmtV(p.value)}`,ev
    )).on("mouseleave",hideTip);
  });

  // Focal bubble
  if (focalPt) {
    const g = bubLayer.append("g").attr("transform",`translate(${focalPt[0]},${focalPt[1]})`);
    g.append("circle").attr("r",18).attr("fill","#073309").attr("stroke","#3cb54a").attr("stroke-width",1.8);
    g.append("text").attr("text-anchor","middle").attr("dy",".35em").attr("font-size","9")
      .attr("font-weight","800").attr("fill","#fff").text(c.focal);
  }

  // Overlay stats (use active product view)
  document.getElementById("ov-imp").textContent = fmtV(pv.total_imp);
  // Inline GDP% next to import value
  const gdpInlineEl = document.getElementById("ov-gdp-inline");
  const hasGdp = c.focal_gdp && c.focal_gdp > 0;
  if (hasGdp && pv.total_imp > 0) {
    const pctGdp = (pv.total_imp / 1000 / c.focal_gdp * 100).toFixed(2);
    gdpInlineEl.textContent = `${pctGdp}% GDP`;
    gdpInlineEl.style.display = "";
  } else {
    gdpInlineEl.style.display = "none";
  }
  const net = pv.total_exp - pv.total_imp;
  const netEl = document.getElementById("ov-net");
  const netPct = (c.focal_gdp && c.focal_gdp > 0)
    ? ` · ${(Math.abs(net)/1000/c.focal_gdp*100).toFixed(2)}% GDP` : "";
  netEl.innerHTML = `Net: ${net>=0?"+":""}${fmtV(Math.abs(net))}${netPct}<br><span style="font-size:.68rem;font-weight:500;opacity:.8">${net>=0?"exporter":"importer"}</span>`;
  netEl.style.color = net>=0 ? "#3cb54a" : "#f97316";

  const listEl = document.getElementById("ov-sup-list");
  listEl.innerHTML = "";
  const top5sup = pv.suppliers.slice(0,5);
  if (top5sup.length > 0) {
    const lbl = document.createElement("div");
    lbl.className = "ov-label";
    lbl.style.marginTop = "8px";
    lbl.textContent = "Top Suppliers";
    listEl.appendChild(lbl);
    top5sup.forEach(s => {
      const row = document.createElement("div");
      row.className = "ov-row";
      row.innerHTML = `<div class="ov-dot" style="background:#d97706"></div><span class="ov-cname">${s.name}</span><span class="ov-cval">${fmtV(s.value)}</span>`;
      listEl.appendChild(row);
    });
  }
}

// ═══ TIMELINE ════════════════════════════════════════════════════════════════
function drawTimeline(c) {
  const svg = d3.select("#tl-svg");
  svg.selectAll("*").remove();
  const el = document.getElementById("tl-svg");
  const W = el.clientWidth||460, H = el.clientHeight||220;
  const m = {top:18, right:14, bottom:32, left:54};
  const w = W-m.left-m.right, h = H-m.top-m.bottom;
  const s = svg.attr("viewBox",`0 0 ${W} ${H}`);
  s.append("rect").attr("width",W).attr("height",H).attr("fill","transparent");
  const g = s.append("g").attr("transform",`translate(${m.left},${m.top})`);
  if (currentProduct === 0) {
    drawTLAll(c, g, w, h);
  } else {
    drawTLProduct(c, g, w, h);
  }
}

// ALL products: stacked area by stage|role (NZIPL SR_COLORS palette)
function drawTLAll(c, g, w, h) {
  if (!c.timeline || !c.timeline.length) {
    g.append("text").attr("x",w/2).attr("y",h/2).attr("text-anchor","middle")
      .attr("fill","rgba(255,255,255,.3)").text("No timeline data");
    return;
  }
  const years = [...new Set(c.timeline.map(d=>d.year))].sort();
  const isBalance = tlMode === "balance";
  const isGrowth  = tlScale === "growth";
  const srKeys = SR_ORDER.filter(sr => c.timeline.some(d=>d.sr===sr));
  if (!srKeys.length) return;

  // Build year → sr → value
  const lookup = {};
  c.timeline.forEach(d => {
    if (!lookup[d.year]) lookup[d.year] = {};
    const v = isBalance ? d.exp-d.imp : (tlMode==="imports" ? d.imp : d.exp);
    lookup[d.year][d.sr] = (lookup[d.year][d.sr]||0) + v;
  });

  const xSc = d3.scaleBand().domain(years).range([0,w]).paddingInner(.08);
  const xC  = yr => xSc(yr)+xSc.bandwidth()/2;

  function axisHelpers(ySc) {
    g.append("g").attr("transform",`translate(0,${h})`).call(
      d3.axisBottom(xSc).tickValues(years.filter((_,i)=>i%4===0)).tickFormat(d3.format("d")).tickSize(0)
    ).selectAll("text").attr("font-size","9").attr("fill","rgba(255,255,255,.4)");
    g.select(".domain").remove();
    g.append("g").call(d3.axisLeft(ySc).ticks(4).tickFormat(d=>
      Math.abs(d)>=1000?`${(d/1000).toFixed(0)}B`:`${d}M`
    )).selectAll("text").attr("font-size","9").attr("fill","rgba(255,255,255,.4)");
    g.select(".domain").remove();
    g.selectAll(".tick line").remove();
    ySc.ticks(4).forEach(v=>{
      g.append("line").attr("x1",0).attr("x2",w).attr("y1",ySc(v)).attr("y2",ySc(v))
        .attr("stroke","rgba(255,255,255,.05)");
    });
  }

  if (isGrowth) {
    // Index lines: one per SR key, first non-zero year = 100
    const lines = srKeys.map(sr => ({
      sr, color: SR_COLORS[sr]||"#9ca3af",
      values: years.map(yr => ({year:yr, raw:(lookup[yr]||{})[sr]||0}))
    }));
    lines.forEach(ln => {
      const firstNZ = ln.values.find(d=>d.raw>0);
      const base = firstNZ ? firstNZ.raw : 1;
      ln.values.forEach(d => { d.idx = d.raw>0 ? d.raw/base*100 : null; });
    });
    const allIdx = lines.flatMap(ln=>ln.values.map(d=>d.idx).filter(v=>v!=null));
    const maxIdx = (d3.max(allIdx)||200)*1.1;
    const ySc = d3.scaleLinear().domain([0,maxIdx]).range([h,0]).nice();
    axisHelpers(ySc);
    g.append("line").attr("x1",0).attr("x2",w).attr("y1",ySc(100)).attr("y2",ySc(100))
      .attr("stroke","rgba(255,255,255,.2)").attr("stroke-dasharray","4,3");
    const lineGen = d3.line().x(d=>xC(d.year)).y(d=>d.idx!=null?ySc(d.idx):null)
      .defined(d=>d.idx!=null).curve(d3.curveCatmullRom);
    lines.forEach(ln => {
      if (!ln.values.some(d=>d.idx!=null)) return;
      g.append("path").datum(ln.values).attr("fill","none")
        .attr("stroke",ln.color).attr("stroke-width",1.8).attr("opacity",.85)
        .attr("d",lineGen)
        .on("mousemove",ev=>showTip(`<strong>${ln.sr}</strong>Index (first yr=100)`,ev))
        .on("mouseleave",hideTip);
    });
    g.append("text").attr("x",w/2).attr("y",-4).attr("text-anchor","middle")
      .attr("font-size","8").attr("fill","rgba(255,255,255,.28)").text("Index: first year = 100");
  } else if (isBalance) {
    // Grouped diverging bars
    const data = years.map(yr=>{
      const row={year:yr};
      srKeys.forEach(sr=>{ row[sr]=(lookup[yr]||{})[sr]||0; });
      return row;
    });
    const allV = data.flatMap(d=>srKeys.map(sr=>d[sr]));
    const absMax = (d3.max(allV.map(v=>Math.abs(v)))||1)*1.15;
    const ySc = d3.scaleLinear().domain([-absMax,absMax]).range([h,0]).nice();
    axisHelpers(ySc);
    g.append("line").attr("x1",0).attr("x2",w).attr("y1",ySc(0)).attr("y2",ySc(0))
      .attr("stroke","rgba(255,255,255,.2)").attr("stroke-dasharray","4,3");
    const perW = xSc.bandwidth()/srKeys.length;
    srKeys.forEach((sr,si)=>{
      g.selectAll(`.br-${si}`).data(data).enter().append("rect").attr("class",`br-${si}`)
        .attr("x",d=>xSc(d.year)+si*perW).attr("width",Math.max(1,perW*.88))
        .attr("y",d=>d[sr]>=0?ySc(d[sr]):ySc(0)).attr("height",d=>Math.abs(ySc(d[sr])-ySc(0)))
        .attr("fill",SR_COLORS[sr]||"#9ca3af").attr("opacity",.8)
        .on("mousemove",(ev,d)=>showTip(`<strong>${d.year} · ${sr}</strong>Balance: ${d3.format(",.0f")(d[sr])}M`,ev))
        .on("mouseleave",hideTip);
    });
  } else {
    // Stacked area (imports or exports)
    const data = years.map(yr=>{
      const row={year:yr};
      srKeys.forEach(sr=>{ row[sr]=Math.max(0,(lookup[yr]||{})[sr]||0); });
      return row;
    });
    const allV = data.flatMap(d=>srKeys.map(sr=>d[sr]));
    const maxV = (d3.max(allV)||1)*1.12;
    const ySc = d3.scaleLinear().domain([0,maxV]).range([h,0]).nice();
    axisHelpers(ySc);
    const stack = d3.stack().keys(srKeys)(data);
    const area = d3.area().x(d=>xC(d.data.year)).y0(d=>ySc(d[0])).y1(d=>ySc(d[1]))
      .curve(d3.curveCatmullRom);
    g.selectAll(".al").data(stack).enter().append("path").attr("class","al")
      .attr("d",area).attr("fill",(d,i)=>SR_COLORS[srKeys[i]]||"#9ca3af").attr("opacity",.82)
      .on("mousemove",(ev,d)=>showTip(`<strong>${d.key}</strong>`,ev))
      .on("mouseleave",hideTip);
  }
}

// Specific product: multi-line, all 5 key products, selected emphasized
function drawTLProduct(c, g, w, h) {
  const pvs = c.product_views ? c.product_views.slice(1) : [];
  if (!pvs.length || !pvs.some(pv=>pv.timeline&&pv.timeline.length)) {
    g.append("text").attr("x",w/2).attr("y",h/2).attr("text-anchor","middle")
      .attr("fill","rgba(255,255,255,.3)").text("No product timeline data");
    return;
  }
  const isBalance = tlMode === "balance";
  const isGrowth  = tlScale === "growth";
  const selIdx    = currentProduct - 1;  // 0-based within pvs

  const allYears = new Set();
  pvs.forEach(pv=>{ if(pv.timeline) pv.timeline.forEach(d=>allYears.add(d.year)); });
  const years = [...allYears].sort();
  if (!years.length) return;

  const lines = pvs.map((pv,i) => {
    const tlMap={};
    if(pv.timeline) pv.timeline.forEach(d=>{ tlMap[d.year]={exp:d.exp,imp:d.imp}; });
    const values = years.map(yr=>{
      const row = tlMap[yr]||{exp:0,imp:0};
      const v = isBalance ? row.exp-row.imp : (tlMode==="imports" ? row.imp : row.exp);
      return {year:yr, v};
    });
    return {label:pv.label, color:PROD_COLORS[i%PROD_COLORS.length], values, selected:i===selIdx};
  });

  if (isGrowth) {
    lines.forEach(ln=>{
      const firstNZ = ln.values.find(d=>d.v>0);
      const base = firstNZ ? firstNZ.v : 1;
      ln.values.forEach(d=>{ d.vi = d.v>0 ? d.v/base*100 : null; });
    });
  }
  const valKey = isGrowth ? "vi" : "v";

  const xSc = d3.scaleBand().domain(years).range([0,w]).paddingInner(.08);
  const xC  = yr => xSc(yr)+xSc.bandwidth()/2;
  const allVals = lines.flatMap(ln=>ln.values.map(d=>d[valKey]).filter(v=>v!=null&&!isNaN(v)));
  if (!allVals.length) return;
  const yMin = isBalance ? Math.min(0,(d3.min(allVals)||0)*1.1) : 0;
  const yMax = (d3.max(allVals)||1)*1.15;
  const ySc = d3.scaleLinear().domain([yMin,yMax]).range([h,0]).nice();

  g.append("g").attr("transform",`translate(0,${h})`).call(
    d3.axisBottom(xSc).tickValues(years.filter((_,i)=>i%4===0)).tickFormat(d3.format("d")).tickSize(0)
  ).selectAll("text").attr("font-size","9").attr("fill","rgba(255,255,255,.4)");
  g.select(".domain").remove();
  const yFmt = isGrowth ? (d=>`${d.toFixed(0)}`) :
               (d=>Math.abs(d)>=1000?`${(d/1000).toFixed(0)}B`:`${d}M`);
  g.append("g").call(d3.axisLeft(ySc).ticks(4).tickFormat(yFmt))
    .selectAll("text").attr("font-size","9").attr("fill","rgba(255,255,255,.4)");
  g.select(".domain").remove();
  g.selectAll(".tick line").remove();
  ySc.ticks(4).forEach(v=>{
    g.append("line").attr("x1",0).attr("x2",w).attr("y1",ySc(v)).attr("y2",ySc(v))
      .attr("stroke","rgba(255,255,255,.05)");
  });
  if (isBalance) g.append("line").attr("x1",0).attr("x2",w).attr("y1",ySc(0)).attr("y2",ySc(0))
    .attr("stroke","rgba(255,255,255,.2)").attr("stroke-dasharray","4,3");
  if (isGrowth)  g.append("line").attr("x1",0).attr("x2",w).attr("y1",ySc(100)).attr("y2",ySc(100))
    .attr("stroke","rgba(255,255,255,.2)").attr("stroke-dasharray","4,3");

  const lineGen = d3.line().x(d=>xC(d.year)).y(d=>d[valKey]!=null?ySc(d[valKey]):null)
    .defined(d=>d[valKey]!=null&&!isNaN(d[valKey])).curve(d3.curveCatmullRom);

  // Draw non-selected lines first (thin, muted)
  lines.filter(ln=>!ln.selected).forEach(ln=>{
    g.append("path").datum(ln.values).attr("fill","none")
      .attr("stroke",ln.color).attr("stroke-width",1.2).attr("opacity",.35).attr("d",lineGen);
  });
  // Draw selected line on top (thick, bright) + label
  lines.filter(ln=>ln.selected).forEach(ln=>{
    g.append("path").datum(ln.values).attr("fill","none")
      .attr("stroke",ln.color).attr("stroke-width",2.8).attr("opacity",1).attr("d",lineGen);
    const lastV = [...ln.values].reverse().find(d=>d[valKey]!=null&&!isNaN(d[valKey]));
    if (lastV) {
      g.append("text").attr("x",xC(lastV.year)+5).attr("y",ySc(lastV[valKey]))
        .attr("dy",".35em").attr("font-size","9").attr("font-weight","700")
        .attr("fill",ln.color).text(ln.label.substring(0,16));
    }
  });
  if (isGrowth) g.append("text").attr("x",w/2).attr("y",-4).attr("text-anchor","middle")
    .attr("font-size","8").attr("fill","rgba(255,255,255,.28)").text("Index: first year = 100");
}

// ═══ DENDRITE / VALUE CHAIN POSITION ════════════════════════════════════════
function drawDendrite(c) {
  const svg = d3.select("#den-svg");
  svg.selectAll("*").remove();
  const el  = document.getElementById("den-svg");
  const W   = el.clientWidth||460, H=el.clientHeight||180;
  svg.attr("viewBox",`0 0 ${W} ${H}`);
  svg.append("rect").attr("width",W).attr("height",H).attr("fill","transparent");

  const edges = c.den_edges || [];
  // Key products for highlighting
  const keyPvs   = c.product_views ? c.product_views.slice(1) : [];
  const keyCodes  = new Set(keyPvs.map(pv=>pv.code));
  const selCode   = currentProduct > 0 ? c.product_views[currentProduct].code : null;

  if (!edges.length) {
    svg.append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle")
      .attr("fill","rgba(255,255,255,.25)").attr("font-size","11").text("No dendrite data");
    return;
  }

  const stageOrder = ["Upstream","Midstream","Downstream","Final Product"];
  // X positions: leave room for labels on far right
  const stageX = {
    "Upstream":      W * 0.09,
    "Midstream":     W * 0.34,
    "Downstream":    W * 0.60,
    "Final Product": W * 0.88
  };
  const pad = {top: 10, bottom: 16};

  // ── Build node map from edges ─────────────────────────────────────────────
  const nodeMap = new Map();
  edges.forEach(e => {
    if (!nodeMap.has(e.fcn)) nodeMap.set(e.fcn, {cn:e.fcn, code:e.fc, name:e.fn, stage:e.fs, role:e.fr});
    if (!nodeMap.has(e.tcn)) nodeMap.set(e.tcn, {cn:e.tcn, code:e.tc, name:e.tn, stage:e.ts, role:e.tr});
  });
  const allNodes = [...nodeMap.values()];

  // Group by stage; sort key products to top
  const stageNodes = {};
  stageOrder.forEach(s => stageNodes[s] = []);
  allNodes.forEach(n => {
    const st = stageOrder.includes(n.stage) ? n.stage : "Downstream";
    stageNodes[st].push(n);
  });
  stageOrder.forEach(st => {
    stageNodes[st].sort((a,b) => {
      const ak = (selCode&&a.code===selCode)?-2 : (keyCodes.has(a.code)?-1:0);
      const bk = (selCode&&b.code===selCode)?-2 : (keyCodes.has(b.code)?-1:0);
      return ak-bk || a.name.localeCompare(b.name);
    });
  });

  // Assign Y: evenly spaced, node radius already accounted for by padding
  const nodeY = new Map();
  stageOrder.forEach(st => {
    const ns = stageNodes[st];
    if (!ns.length) return;
    const avail = H - pad.top - pad.bottom;
    const step  = avail / ns.length;
    ns.forEach((n,i) => nodeY.set(n.cn, pad.top + step*(i+0.5)));
  });

  // Trade lookup for sizing
  const tradeMap = new Map((c.den_products||[]).map(p=>[p.code, (p.exp||0)+(p.imp||0)]));
  const maxTV = d3.max([...tradeMap.values()])||1;
  const rBase = d3.scaleSqrt().domain([0,maxTV]).range([3,11]);

  // ── Stage labels at bottom ────────────────────────────────────────────────
  stageOrder.forEach(st => {
    const x = stageX[st];
    if (!x) return;
    svg.append("text").attr("x",x).attr("y",H-2)
      .attr("text-anchor","middle").attr("font-size","6.5")
      .attr("fill","rgba(255,255,255,.22)").attr("font-weight","600")
      .attr("letter-spacing",".05em").text(st.toUpperCase());
  });

  // ── Edges ─────────────────────────────────────────────────────────────────
  const edgeG = svg.append("g");
  edges.forEach(e => {
    const fn = nodeMap.get(e.fcn), tn = nodeMap.get(e.tcn);
    if (!fn || !tn) return;
    const x1 = stageX[fn.stage]||W*.5, y1 = nodeY.get(fn.cn)||H/2;
    const x2 = stageX[tn.stage]||W*.5, y2 = nodeY.get(tn.cn)||H/2;
    const isSelEdge = selCode && (e.fc===selCode || e.tc===selCode);
    const isKeyEdge = !isSelEdge && (keyCodes.has(e.fc) || keyCodes.has(e.tc));
    const col = isSelEdge ? "rgba(255,255,255,.70)"
              : isKeyEdge ? "rgba(255,255,255,.30)"
              :              "rgba(255,255,255,.08)";
    const sw  = isSelEdge ? 1.4 : isKeyEdge ? 0.8 : 0.45;
    const mx  = (x1+x2)/2;
    edgeG.append("path")
      .attr("d",`M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`)
      .attr("fill","none").attr("stroke",col).attr("stroke-width",sw);
  });

  // ── Nodes ─────────────────────────────────────────────────────────────────
  const nodeG = svg.append("g");
  allNodes.forEach(n => {
    const x   = stageX[stageOrder.includes(n.stage)?n.stage:"Downstream"]||W*.5;
    const y   = nodeY.get(n.cn)||H/2;
    const isSel = selCode && n.code===selCode;
    const isKey = keyCodes.has(n.code);
    const keyIdx = keyPvs.findIndex(pv=>pv.code===n.code);
    const tv  = tradeMap.get(n.code)||0;
    const col = (isSel||isKey)
      ? PROD_COLORS[keyIdx>=0?keyIdx:0]
      : (SR_COLORS[`${n.stage}|${n.role}`]||"#9ca3af");
    const r   = isSel ? Math.max(rBase(tv),13) : (isKey ? Math.max(rBase(tv),7) : Math.max(rBase(tv),3));
    const op  = isSel ? 1 : (isKey ? (selCode?0.7:0.88) : (selCode?0.2:0.5));
    const sw  = isSel ? 2 : (isKey ? 1.3 : 0.6);
    const pv  = (c.den_products||[]).find(p=>p.code===n.code);

    const grp = nodeG.append("g");
    grp.append("circle")
      .attr("cx",x).attr("cy",y).attr("r",r)
      .attr("fill",`${col}${isSel?"55":"18"}`)
      .attr("stroke",col).attr("stroke-width",sw).attr("opacity",op)
      .on("mousemove",ev=>showTip(
        `<strong>${n.name}</strong>HS ${n.code}<br>${n.stage} · ${n.role}`+
        (pv?`<br>Imp: ${fmtV(pv.imp)} | Exp: ${fmtV(pv.exp)}`:""),ev))
      .on("mouseleave",hideTip);

    // Code label inside (key/sel only — min size)
    if ((isKey||isSel) && r>=7) {
      grp.append("text").attr("x",x).attr("y",y)
        .attr("text-anchor","middle").attr("dy",".35em")
        .attr("font-size",isSel?"7.5":"6").attr("font-weight","700")
        .attr("fill","#fff").attr("opacity",op).attr("pointer-events","none")
        .text(n.code);
    }
    // Name label to the right of node (key/sel only)
    if ((isKey||isSel) && r>=5) {
      grp.append("text")
        .attr("x",x+r+3).attr("y",y)
        .attr("text-anchor","start").attr("dy",".35em")
        .attr("font-size",isSel?"8":"6.5")
        .attr("font-weight",isSel?"700":"400")
        .attr("fill",isSel?col:"rgba(255,255,255,.5)")
        .attr("opacity",op).attr("pointer-events","none")
        .text(n.name.substring(0,22));
    }
  });
}

// ═══ SCATTERPLOT ═════════════════════════════════════════════════════════════
function drawScatter(c) {
  const svg = d3.select("#sc-svg");
  svg.selectAll("*").remove();
  const el  = document.getElementById("sc-svg");
  const W   = el.clientWidth||460, H=el.clientHeight||200;
  const m   = {top:16,right:14,bottom:34,left:50};
  const w   = W-m.left-m.right, h=H-m.top-m.bottom;
  const s   = svg.attr("viewBox",`0 0 ${W} ${H}`);
  s.append("rect").attr("width",W).attr("height",H).attr("fill","transparent");
  if (!c.scatter.length) return;
  const g   = s.append("g").attr("transform",`translate(${m.left},${m.top})`);
  const xk  = scMode==="abs"?"exp":"pct";
  const valid = c.scatter.filter(d=>d[xk]!=null&&!isNaN(d[xk]));
  if (!valid.length) return;
  const xMax = (d3.max(valid,d=>d[xk])||1)*1.08;
  const xSc  = d3.scaleLinear().domain([0,xMax]).range([0,w]).nice();
  const ySc  = d3.scaleLinear().domain([0,1.05]).range([h,0]);
  g.append("g").attr("transform",`translate(0,${h})`).call(
    d3.axisBottom(xSc).ticks(4).tickFormat(d=>scMode==="abs"?`$${d}B`:`${d}%`)
  ).selectAll("text").attr("font-size","9").attr("fill","rgba(255,255,255,.4)");
  g.select(".domain").remove();
  g.append("g").call(d3.axisLeft(ySc).ticks(4).tickFormat(d3.format(".1f")))
    .selectAll("text").attr("font-size","9").attr("fill","rgba(255,255,255,.4)");
  g.select(".domain").remove();
  g.selectAll(".tick line").remove();
  ySc.ticks(4).forEach(v=>{
    g.append("line").attr("x1",0).attr("x2",w).attr("y1",ySc(v)).attr("y2",ySc(v))
      .attr("stroke","rgba(255,255,255,.05)");
  });
  g.append("line").attr("x1",0).attr("x2",w).attr("y1",ySc(.5)).attr("y2",ySc(.5))
    .attr("stroke","rgba(255,255,255,.15)").attr("stroke-dasharray","4,3");
  const rSc = d3.scaleSqrt().domain([0,d3.max(valid,d=>d.exp)||1]).range([3,16]);
  g.selectAll(".dot").data(valid).enter().append("circle").attr("class","dot")
    .attr("cx",d=>xSc(d[xk])).attr("cy",d=>ySc(d.pc))
    .attr("r",d=>d.iso3===c.focal?10:rSc(d.exp))
    .attr("fill",d=>d.iso3===c.focal?"#073309":REGION_COLOR[d.region]||"#9ca3af")
    .attr("stroke",d=>d.iso3===c.focal?"#3cb54a":"rgba(255,255,255,.2)")
    .attr("stroke-width",d=>d.iso3===c.focal?2:1)
    .attr("opacity",d=>d.iso3===c.focal?1:.65)
    .on("mousemove",(ev,d)=>showTip(`<strong>${d.name}</strong>PC: ${d.pc.toFixed(3)}<br>Exports: $${d.exp.toFixed(1)}B`,ev))
    .on("mouseleave",hideTip);
  // Labels for focal + major
  const LABEL_SET = new Set([c.focal,"CHN","USA","DEU","JPN","KOR","IND","VNM","KHM","MYS","THA"]);
  g.selectAll(".dl").data(valid.filter(d=>LABEL_SET.has(d.iso3))).enter().append("text").attr("class","dl")
    .attr("x",d=>xSc(d[xk])+(d.iso3===c.focal?12:rSc(d.exp)+3))
    .attr("y",d=>ySc(d.pc)+3.5)
    .attr("font-size",d=>d.iso3===c.focal?"10":"8")
    .attr("font-weight",d=>d.iso3===c.focal?"700":"500")
    .attr("fill",d=>d.iso3===c.focal?"#3cb54a":"rgba(255,255,255,.45)")
    .text(d=>d.iso3===c.focal?d.iso3+" ★":d.iso3);
  g.append("text").attr("x",w/2).attr("y",h+30).attr("text-anchor","middle")
    .attr("font-size","9").attr("fill","rgba(255,255,255,.35)")
    .text(scMode==="abs"?"Exports 2023 ($B)":"Exports 2023 (% GDP)");
  g.append("text").attr("transform","rotate(-90)").attr("x",-h/2).attr("y",-38)
    .attr("text-anchor","middle").attr("font-size","9").attr("fill","rgba(255,255,255,.35)").text("PC Score");
}

// ═══ INIT ═════════════════════════════════════════════════════════════════════
// Wait for layout to settle before reading element sizes
requestAnimationFrame(() => {
  initMap();  // loads topojson then calls updateAll()
  // Also draw the non-map panes immediately with first case
  drawTimeline(ALL_CASES[0]);
  drawDendrite(ALL_CASES[0]);
  drawScatter(ALL_CASES[0]);
});

window.addEventListener("resize", () => {
  // Re-init map projection on resize
  const el = document.getElementById("map-svg");
  const W  = el.clientWidth, H=el.clientHeight;
  if (!W || !H) return;
  mapProjection.scale(Math.max(W/5.0,H/3.3)).translate([W*.55,H*.44]);
  mapPath = d3.geoPath().projection(mapProjection);
  // Recompute centroids
  if (worldTopo) {
    const countries = topojson.feature(worldTopo, worldTopo.objects.countries);
    countries.features.forEach(f=>{
      const numId=+f.id;
      const iso3=Object.keys(ISO3N).find(k=>ISO3N[k]===numId);
      if(iso3) centroids[iso3]=mapProjection(d3.geoCentroid(f));
    });
  }
  updateAll();
  drawTimeline(ALL_CASES[currentIdx]);
  drawDendrite(ALL_CASES[currentIdx]);
  drawScatter(ALL_CASES[currentIdx]);
});
</script>
