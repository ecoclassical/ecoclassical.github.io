<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Deep Dives · NZIPL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#060d08; --surface:#0b1a0d; --surface2:#0f2312;
  --border:rgba(255,255,255,.07); --border-hi:rgba(255,255,255,.13);
  --text:#dde8dd; --muted:#7a9b7d; --accent:#3cb54a;
  --font:"Archivo",-apple-system,"Segoe UI",sans-serif;
}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6;}

/* ══ REPORT SCREEN (intelligence-report layout) ══ */
#screen-report{display:none;}
body.report-mode{height:100vh;overflow:hidden;}
body.report-mode #screen-selector{display:none;}
body.report-mode #screen-report{display:flex;flex-direction:column;height:100vh;}
#ir-top{display:flex;height:66.66vh;min-height:0;}
#ir-analysis{height:33.34vh;border-top:1px solid var(--border);background:var(--bg);overflow-y:auto;padding:18px 24px;}
.ir-analysis-ph{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.18);}
#ir-sidebar{width:230px;min-width:230px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;height:100%;flex-shrink:0;}
.ir-topbar{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;}
.ir-tb-btn{font-size:11px;font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.55);background:rgba(255,255,255,.05);border:1px solid var(--border-hi);border-radius:5px;padding:5px 10px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block;transition:all .15s;}
.ir-tb-btn:hover{color:#fff;border-color:var(--accent);}
.ir-brand{padding:16px 14px 12px;border-bottom:1px solid var(--border);}
.ir-brand-eyebrow{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:5px;}
.ir-brand-country{font-size:20px;font-weight:800;color:#fff;line-height:1.1;}
.ir-brand-tech{font-size:10px;font-weight:600;color:rgba(255,255,255,.35);letter-spacing:.07em;text-transform:uppercase;margin-top:3px;}
.ir-nav{padding:8px 7px 20px;}
.ir-nav-link{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:5px;font-size:12.5px;font-weight:500;color:rgba(255,255,255,.5);cursor:pointer;text-decoration:none;transition:color .15s,background .15s;margin-bottom:2px;border:none;background:transparent;text-align:left;font-family:inherit;}
.ir-nav-link:hover{color:#fff;background:rgba(255,255,255,.06);}
.ir-nav-link.active{color:var(--accent)!important;background:rgba(60,181,74,.1);font-weight:600;}
.ir-nav-link .ndot{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:currentColor;opacity:.7;}
.ir-nav-num{font-size:9px;color:rgba(255,255,255,.25);margin-left:auto;font-weight:700;}
.ir-nav-group{margin-bottom:2px;}
.ir-nav-ghd{display:flex;align-items:center;gap:7px;padding:7px 10px;border-radius:5px;font-size:12px;font-weight:700;color:rgba(255,255,255,.7);cursor:pointer;user-select:none;transition:color .15s,background .15s;}
.ir-nav-ghd:hover{color:#fff;background:rgba(255,255,255,.04);}
.ir-nav-ghd .ndot{width:8px;height:8px;border-radius:50%;flex-shrink:0;opacity:1;}
.ir-nav-chevron{font-size:12px;color:rgba(255,255,255,.35);transition:transform .18s;display:inline-block;}
.ir-nav-sub{display:none;}
.ir-nav-sub.open{display:block;}
.ir-nav-link.sub{padding-left:20px;font-size:12px;}
#ir-main{flex:1;min-height:0;height:100%;overflow:hidden;padding:0;background:#0a0f14;}
#rep-main{height:100%;}
.ir-pane{display:none;height:100%;flex-direction:column;}
.ir-pane.active{display:flex;}
.ir-pane-head{padding:16px 24px;border-bottom:1px solid var(--border);flex-shrink:0;}
.ir-pane-title{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:10px;}
.ir-pane-title .accent{color:var(--accent);}
.ir-pane-sub{font-size:11.5px;color:rgba(255,255,255,.3);margin-top:4px;}
.ir-frame-wrap{flex:1;position:relative;background:#0a1218;}
.ir-pane iframe{width:100%;height:100%;border:none;display:block;background:#0a1218;}
.ir-pane .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.2);font-size:12px;font-weight:600;}

/* On-screen pre-print state (added by printReport / beforeprint): make every
   pane visible and sized so all iframes load at the right dimensions. */
body.printing #ir-sidebar, body.printing .ir-topbar{display:none!important;}
body.printing #screen-report, body.printing #ir-top{display:block;height:auto;}
body.printing #ir-main{height:auto;overflow:visible;}
body.printing #ir-analysis{height:auto;}
body.printing .ir-pane{display:block!important;height:auto;border-bottom:1px solid var(--border);}
body.printing .ir-frame-wrap{height:620px;}
body.printing .ir-pane iframe{height:620px;}

@media print{
  body.report-mode{height:auto;overflow:visible;}
  #ir-sidebar,.ir-topbar{display:none!important;}
  body.report-mode #screen-report{display:block;height:auto;}
  #ir-top{display:block;height:auto;}
  #ir-main{height:auto;overflow:visible;}
  #ir-analysis{height:auto;}
  .ir-pane{display:block!important;height:auto;page-break-after:always;border-bottom:2px solid #000;}
  .ir-frame-wrap{height:620px;}
  .ir-pane iframe{height:620px;}
}

/* ══ DEEP DIVES ══ */
#dd-main{height:100%;}
.dd-picks{display:flex;flex-direction:column;gap:6px;margin-top:9px;}
.dd-pick{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:6px;
  background:var(--surface);border:1px solid var(--border-hi);color:#fff;font-family:inherit;
  font-size:13px;font-weight:700;cursor:pointer;text-align:left;transition:border-color .15s;}
.dd-pick:hover{border-color:var(--accent);}
.dd-pick .swatch{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.dd-pick .cap{font-size:8.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  color:rgba(255,255,255,.3);display:block;margin-bottom:1px;}
.dd-pick .val{display:block;line-height:1.15;}
.dd-pick .chev{margin-left:auto;font-size:10px;color:rgba(255,255,255,.35);}
.dd-pop{display:none;position:fixed;z-index:60;width:238px;max-height:60vh;overflow-y:auto;
  background:var(--surface2);border:1px solid var(--border-hi);border-radius:8px;padding:6px;
  box-shadow:0 12px 34px rgba(0,0,0,.55);}
.dd-pop.open{display:block;}
.dd-grp{font-size:8.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  color:rgba(255,255,255,.32);padding:8px 8px 4px;border-bottom:1px solid var(--border);margin-bottom:3px;}
.dd-grp:first-child{padding-top:2px;}
.dd-opt{display:flex;align-items:center;gap:8px;width:100%;padding:6px 9px;border-radius:5px;
  background:transparent;border:none;color:rgba(255,255,255,.66);font-family:inherit;font-size:12.5px;
  font-weight:600;cursor:pointer;text-align:left;transition:background .12s,color .12s;}
.dd-opt:hover{background:rgba(255,255,255,.06);color:#fff;}
.dd-opt.on{background:rgba(60,181,74,.13);color:#fff;}
.dd-opt .swatch{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.dd-opt .sub{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;color:rgba(255,255,255,.24);}
.ir-nav-link.unavail{opacity:.34;cursor:not-allowed;}
.ir-nav-link.unavail:hover{background:transparent;color:rgba(255,255,255,.5);}
.ir-nav-why{font-size:9.5px;color:rgba(255,255,255,.28);padding:0 10px 6px 25px;line-height:1.35;}
.dd-tag{font-size:8.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
  padding:1px 5px;border-radius:3px;background:rgba(255,255,255,.07);color:rgba(255,255,255,.4);}

/* ── the case stats strip ──
   CSS_IR splits the page 66.66 / 33.34. Deep Dives gives the band back to the
   panels: the strip is a row of tiles, not prose, and needs about two thirds of
   what the intelligence report reserves for its narrative. This is an OVERRIDE —
   CSS_IR is shared with report_builder.html and is not edited here.
   Because CSS_DD is emitted after CSS_IR, these same-specificity rules would also
   beat CSS_IR's print rules, so the print heights are restated below. */
#ir-top{height:78vh;}
#ir-analysis{height:22vh;padding:12px 20px 15px;}
body.printing #ir-top,body.printing #ir-analysis{height:auto;}
@media print{#ir-top,#ir-analysis{height:auto;}}

.dd-stats-hd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:9px;}
.dd-stats-note{font-size:9.5px;color:rgba(255,255,255,.3);line-height:1.4;}
.dd-basis{font-size:8.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:2px 7px;border-radius:3px;border:1px solid var(--border-hi);background:var(--surface);
  color:rgba(255,255,255,.62);font-family:inherit;cursor:pointer;transition:all .15s;}
.dd-basis:hover{border-color:var(--accent);color:#fff;}
.dd-basis.corr{background:rgba(60,181,74,.14);border-color:var(--accent);color:var(--accent);}
.dd-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(146px,1fr));gap:7px;}
.dd-tile{background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:8px 11px 9px;}
.dd-tile .k{font-size:8px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.32);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.dd-tile .v{font-size:17px;font-weight:800;color:#fff;margin-top:2px;line-height:1.15;}
.dd-tile .s{font-size:9.5px;color:rgba(255,255,255,.4);margin-top:2px;line-height:1.4;}
.dd-tile.pos .v{color:#3cb54a;}
.dd-tile.neg .v{color:#f97316;}
.dd-stats-msg{font-size:11px;color:rgba(255,255,255,.3);margin-top:6px;}
</style>
</head>

// ── helpers ──────────────────────────────────────────────────────────────────
function bySlugTech(s){ return TECHS.find(t=>t.slug===s); }
function bySlugCountry(s){ return COUNTRIES.find(c=>c.slug===s); }
function modById(id){ return MODULES.find(m=>m.id===id); }

function resolvePath(mod, techSlug, countrySlug){
  return mod.tpl.replace(/\{module\}/g, mod.id)
               .replace(/\{tech\}/g, techSlug)
               .replace(/\{country\}/g, countrySlug);
}
function available(mod, techSlug, countrySlug){
  return PATHS.has(resolvePath(mod, techSlug, countrySlug));
}

// ── Data delivery: read the data-driven engine's per-case JSON ────────────────
// Each module maps to one slice of a case bundle (or a country-independent
// _tech_<Tech>.json for tree/sankey). The CSV download mints files in-browser
// from that JSON — no sidecar files on disk (single source of truth = the engine).
const CASE_SLICE = { radar:'radar', pc_scatter:'scatter', trade_timeline:'timeline',
                     // trade_map read 'partners' until 2026-08-06. No bundle has that key —
                     // the engine replaced it with the per-year top-8 series — so the slice
                     // named here was one no case could satisfy. See VIZ.partnersLatest().
                     trade_composition:'products', trade_map:'partners_yearly', activity_map:'firms',
                     // diagnostic modules (2026-08-06)
                     benchmark:'bench', deficit_widening:'timeline',
                     persistent_deficits:'deficits', hhi:'hhi',
                     top_exporters:'partners_yearly_sr', top_importers:'partners_yearly_sr',
                     net_balance:'products_flow' };
const TECH_SLICE = { sankey:'sankey', tech_tree:'tree', solar_system:'tree' };   // from _tech_<Tech>.json
const DATA_DIR   = '../navigator/data/';

function dataAvailable(modId, techSlug, countrySlug){
  if(TECH_SLICE[modId]) return DATATECHS.has(techSlug);
  if(CASE_SLICE[modId]) return DATACASES.has(techSlug + '_' + countrySlug);
  return false;
}
// ── Visual delivery via the data-driven engine ───────────────────────────────
// Engine-covered modules render through the shared viz.js (embed.html) instead
// of a pre-rendered standalone panel — one renderer, all engine countries, no
// per-file HTML. Non-engine modules fall back to the pre-rendered path.
function engineCovers(modId){ return !!(CASE_SLICE[modId] || TECH_SLICE[modId]); }
function embedPath(modId, techSlug, countrySlug){
  return '../navigator/embed.html?tech=' + encodeURIComponent(techSlug)
       + '&country=' + encodeURIComponent(countrySlug) + '&panel=' + modId;
}
function visPath(mod, techSlug, countrySlug){
  return engineCovers(mod.id) ? embedPath(mod.id, techSlug, countrySlug)
                              : resolvePath(mod, techSlug, countrySlug);
}
function visAvailable(mod, techSlug, countrySlug){
  return engineCovers(mod.id) ? dataAvailable(mod.id, techSlug, countrySlug)
                              : available(mod, techSlug, countrySlug);
}

// ── Deep Dives ───────────────────────────────────────────────────────────────
// State is the pair plus the open panel. Everything else is derived: the rail
// from MODULES, availability from visAvailable(), the pane src from visPath().
let ddTech = 'Solar', ddCountry = 'India', ddPanel = null;

const FAMILY_ORDER = ['Structure','Trade','Capability','Competitiveness','Firms','Narrative','Reference'];
const famRank = f => { const i = FAMILY_ORDER.indexOf(f); return i < 0 ? 99 : i; };

function ddTechObj(){ return bySlugTech(ddTech); }
function ddCountryObj(){ return bySlugCountry(ddCountry); }

// Country grouping for the picker: focal first, then blocs in registry order.
function countryGroups(){
  const groups = [];
  const focal = COUNTRIES.filter(c => (c.sets||'').split('|').includes('Focal'));
  if(focal.length) groups.push({label:'Focal', items: focal});
  SETS.filter(s => s !== 'Focal').forEach(s => {
    const items = COUNTRIES.filter(c => (c.sets||'').split('|').includes(s) &&
                                        !(c.sets||'').split('|').includes('Focal'));
    if(items.length) groups.push({label:s, items:items});
  });
  const seen = new Set(groups.flatMap(g => g.items.map(c => c.slug)));
  const rest = COUNTRIES.filter(c => !seen.has(c.slug));
  if(rest.length) groups.push({label:'Other', items: rest});
  return groups;
}

// ── pickers ──────────────────────────────────────────────────────────────────
function closePops(){ document.querySelectorAll('.dd-pop').forEach(p => p.classList.remove('open')); }

function openPop(popId, btnId, groups, current, onPick){
  const pop = document.getElementById(popId), btn = document.getElementById(btnId);
  const wasOpen = pop.classList.contains('open');
  closePops();
  if(wasOpen) return;
  pop.innerHTML = groups.map(g =>
    '<div class="dd-grp">' + g.label + '</div>' +
    g.items.map(it =>
      '<button class="dd-opt' + (it.slug === current ? ' on' : '') + '" data-slug="' + it.slug + '">' +
        '<span class="swatch" style="background:' + (it.color || '#6b7280') + '"></span>' +
        '<span>' + it.name + '</span>' +
        (it.note ? '<span class="sub">' + it.note + '</span>' : '') +
      '</button>').join('')
  ).join('');
  const r = btn.getBoundingClientRect();
  pop.style.left = r.left + 'px';
  pop.style.top  = (r.bottom + 5) + 'px';
  pop.classList.add('open');
  pop.querySelectorAll('.dd-opt').forEach(b =>
    b.addEventListener('click', () => { closePops(); onPick(b.dataset.slug); }));
}

function renderPicks(){
  const t = ddTechObj(), c = ddCountryObj();
  document.getElementById('val-tech').textContent = t ? t.name : ddTech;
  document.getElementById('val-country').textContent = c ? c.name : ddCountry;
  document.getElementById('sw-tech').style.background = t ? t.color : '#6b7280';
  document.getElementById('sw-country').style.background = c ? c.color : '#6b7280';
}

// ── rail + panes ─────────────────────────────────────────────────────────────
function ddModules(){
  return MODULES.slice().sort((a,b) =>
    famRank(a.family) - famRank(b.family) || a.label.localeCompare(b.label));
}

// A module is country-independent when it reads the per-tech bundle: the same
// picture for all 27 countries. Saying so matters — a panel that does not change
// when the country does otherwise reads as a broken selector.
function techLevel(m){ return !!TECH_SLICE[m.id]; }

// Does the slice this module reads actually have rows in this case? SLICE_OK
// carries only the slices that are empty somewhere; anything absent from it is
// populated everywhere and needs no check.
function sliceOk(m, techSlug, countrySlug){
  const s = SLICE_OF[m.id];
  if(!s || !SLICE_OK[s]) return true;
  return SLICE_OK[s].indexOf(techSlug + '_' + countrySlug) !== -1;
}

// Why a module is not offered, in the reader's terms. Never "unavailable" on its
// own: an unexplained gap is indistinguishable from a bug.
const SLICE_WHY = {
  firms: 'S&P firm locations cover the 7 focal countries only'
};
function ddReason(m){
  if(techLevel(m) && !DATATECHS.has(ddTech)) return 'no ' + ddTech + ' tech bundle yet';
  if(!techLevel(m) && CASE_SLICE[m.id] && !DATACASES.has(ddTech + '_' + ddCountry))
    return 'no engine case for this pair';
  if(!sliceOk(m, ddTech, ddCountry))
    return SLICE_WHY[SLICE_OF[m.id]] || 'no ' + SLICE_OF[m.id] + ' data for this pair';
  if(!visAvailable(m, ddTech, ddCountry)) return 'no panel built for this pair';
  return null;
}
function ddOffered(m){ return ddReason(m) === null; }

function buildNav(){
  const nav = document.getElementById('dd-nav');
  let html = '', lastFam = null, n = 0;
  ddModules().forEach(m => {
    if(m.family !== lastFam){ html += '<div class="dd-grp">' + m.family + '</div>'; lastFam = m.family; }
    const why = ddReason(m), ok = why === null;
    n += ok ? 1 : 0;
    html += '<button class="ir-nav-link' + (ok ? '' : ' unavail') + '" data-mod="' + m.id + '"' +
            (ok ? '' : ' disabled') + '>' +
              '<span class="ndot" style="background:' + (ddTechObj() ? ddTechObj().color : '#3cb54a') + '"></span>' +
              '<span>' + m.label + '</span>' +
              (techLevel(m) ? '<span class="dd-tag" title="country-independent">TECH</span>' : '') +
            '</button>' +
            (ok ? '' : '<div class="ir-nav-why">' + why + '</div>');
  });
  nav.innerHTML = html;
  nav.querySelectorAll('.ir-nav-link:not(.unavail)').forEach(b =>
    b.addEventListener('click', () => showPanel(b.dataset.mod)));
  return n;
}

function buildPanes(){
  const main = document.getElementById('dd-main');
  main.innerHTML = ddModules().map(m => {
    if(!ddOffered(m)) return '';
    const tech = ddTechObj(), country = ddCountryObj();
    // A tech-level panel names the tech and says so, rather than naming a country
    // it does not vary with.
    const sub = techLevel(m)
      ? (tech ? tech.name : ddTech) + ' · all countries — this panel is country-independent'
      : (tech ? tech.name : ddTech) + ' · ' + (country ? country.name : ddCountry);
    return '<div class="ir-pane" data-mod="' + m.id + '">' +
      '<div class="ir-pane-head">' +
        '<div class="ir-pane-title"><span class="accent">' + m.label + '</span>' +
          '<span class="dd-tag">' + m.family + '</span>' +
          (techLevel(m) ? '<span class="dd-tag">TECH-LEVEL</span>' : '') + '</div>' +
        '<div class="ir-pane-sub">' + sub + '</div>' +
      '</div>' +
      '<div class="ir-frame-wrap"><div class="ph">Loading…</div>' +
        '<iframe data-src="' + visPath(m, ddTech, ddCountry) + '" ' +
        'sandbox="allow-scripts allow-same-origin allow-popups allow-downloads"></iframe></div>' +
    '</div>';
  }).join('');
}

// Idempotent: an iframe whose src is already set is left alone, so re-showing a
// pane does not reload it.
function loadFrame(fr){
  if(!fr || fr.getAttribute('src')) return;
  const ph = fr.parentElement.querySelector('.ph');
  fr.addEventListener('load', () => { if(ph) ph.style.display = 'none'; }, {once:true});
  fr.setAttribute('src', fr.dataset.src);
}

function showPanel(id){
  const panes = [...document.querySelectorAll('#dd-main .ir-pane')];
  if(!panes.length) return;
  let target = panes.find(p => p.dataset.mod === id) || panes[0];
  ddPanel = target.dataset.mod;
  panes.forEach(p => p.classList.toggle('active', p === target));
  document.querySelectorAll('#dd-nav .ir-nav-link').forEach(b =>
    b.classList.toggle('active', b.dataset.mod === ddPanel));
  loadFrame(target.querySelector('iframe'));
  syncURL();
}

// A pair change rebuilds the rail and the panes (availability differs per pair),
// then restores the panel that was open if it survived the change.
function setPair(tech, country){
  const keep = ddPanel;
  if(tech) ddTech = tech;
  if(country) ddCountry = country;
  renderPicks();
  buildNav();
  buildPanes();
  showPanel(keep);
  renderStats();
}

function syncURL(){
  const q = '?tech=' + encodeURIComponent(ddTech) +
            '&country=' + encodeURIComponent(ddCountry) +
            '&panel=' + encodeURIComponent(ddPanel || '');
  history.replaceState(null, '', location.pathname + q);
}

// ── boot ─────────────────────────────────────────────────────────────────────
function ddBoot(){
  const p = new URLSearchParams(location.search);
  if(p.get('tech')    && bySlugTech(p.get('tech')))       ddTech    = p.get('tech');
  if(p.get('country') && bySlugCountry(p.get('country'))) ddCountry = p.get('country');
  const wanted = p.get('panel');

  document.body.classList.add('report-mode');

  document.getElementById('pick-tech').addEventListener('click', e => {
    e.stopPropagation();
    openPop('pop-tech', 'pick-tech', [{label:'Technology', items: TECHS}], ddTech,
            s => setPair(s, null));
  });
  document.getElementById('pick-country').addEventListener('click', e => {
    e.stopPropagation();
    openPop('pop-country', 'pick-country', countryGroups(), ddCountry,
            s => setPair(null, s));
  });
  document.addEventListener('click', closePops);
  window.addEventListener('resize', closePops);

  renderPicks();
  buildNav();
  buildPanes();
  showPanel(wanted);
  renderStats();
}

// ── the case stats strip ─────────────────────────────────────────────────────
// Read from the same case bundle the panels draw from, so the strip and the
// panes cannot disagree about the pair they are both describing. Nothing here
// is precomputed: no new slice, no sidecar file.
//
// renderStats() is called from ddBoot() and setPair() and must never throw — a
// ReferenceError here would stop boot and blank every pane, the failure shape
// this project has hit five times.

let ddBasis = 'raw';          // 'raw' | 'corr' — stated on the chip, never implied
let statsToken = 0;           // a newer pair must win a race with an older fetch
let gdpPromise = null, gdpIndex = null;
const bundleCache = {};

const DASH = '—';

// _gdp.json is 277 KB, 36x _index.json. Fetched once, on the first strip render,
// never at boot.
function loadGDP(){
  if(gdpPromise) return gdpPromise;
  gdpPromise = fetch(DATA_DIR + '_gdp.json')
    .then(r => r.ok ? r.json() : null)
    .then(rows => {
      gdpIndex = {};
      (rows || []).forEach(r => { gdpIndex[r.iso3 + '|' + r.year] = r.gdp_mil_usd; });
      return gdpIndex;
    })
    .catch(() => { gdpIndex = {}; return gdpIndex; });
  return gdpPromise;
}

function loadBundle(key){
  if(!(key in bundleCache)){
    bundleCache[key] = fetch(DATA_DIR + key + '.json')
      .then(r => r.ok ? r.json() : null).catch(() => null);
  }
  return bundleCache[key];
}

// A missing figure is an em-dash. Never NaN, never undefined, never a field that
// quietly disappears — the reader cannot tell a dropped field from a zero.
function num(v){ return (typeof v === 'number' && isFinite(v)) ? v : null; }
function fmtKUSD(v){
  if(v === null) return DASH;
  const sign = v < 0 ? '−' : '', a = Math.abs(v);
  if(a >= 1e6) return sign + '$' + (a/1e6).toFixed(1) + 'B';
  if(a >= 1e3) return sign + '$' + (a/1e3).toFixed(1) + 'M';
  return sign + '$' + a.toFixed(0) + 'K';
}
// Already in percent units (0.134 means 0.134 %), so no x100 here.
function fmtPctUnits(v){
  if(v === null) return DASH;
  return (Math.abs(v) >= 0.1 ? v.toFixed(2) : v.toFixed(3)) + ' %';
}
// A fraction (0.3587) rendered as a percentage.
function fmtFrac(v, dp){ return v === null ? DASH : (v*100).toFixed(dp == null ? 1 : dp) + ' %'; }
function fmtSigned(v){ return v === null ? DASH : (v >= 0 ? '+' : '−') + Math.abs(v*100).toFixed(1) + ' %'; }
function fmtNum(v, dp){ return v === null ? DASH : v.toFixed(dp); }

// Every figure the strip shows, derived in one place so the tiles cannot drift
// from each other on basis or on year.
function statFields(d){
  const corr = ddBasis === 'corr';
  const kx = corr ? 'exports_kusd_c' : 'exports_kusd';
  const km = corr ? 'imports_kusd_c' : 'imports_kusd';
  const pk = corr ? 'partners_yearly_c' : 'partners_yearly';

  const yr = (d.yearly || []).slice().sort((a,b) => a.year - b.year);
  if(!yr.length) return null;
  const last = yr[yr.length-1], Y = last.year;
  const exp = num(last[kx]), imp = num(last[km]);
  const f = { year: Y, exports: exp, imports: imp,
              balance: (exp === null || imp === null) ? null : exp - imp };

  // ⚠ UNITS. Bundle values are KUSD, _gdp.json is millions USD:
  // pct = val_kusd / gdp_mil_usd / 10. See CLAUDE.md, "Units".
  const g = num(gdpIndex ? gdpIndex[d.iso + '|' + Y] : null);
  f.gdpYear = g;
  f.pctExp = (g && exp !== null) ? exp / g / 10 : null;
  f.pctImp = (g && imp !== null) ? imp / g / 10 : null;

  // 10-year CAGR, only where both endpoints are strictly positive — a CAGR off a
  // zero or negative base is not a growth rate, it is a division artefact.
  const base = yr.find(r => r.year === Y - 10);
  f.cagrFrom = base ? base.year : null;
  const bx = base ? num(base[kx]) : null, bm = base ? num(base[km]) : null;
  f.cagrExp = (bx !== null && bx > 0 && exp !== null && exp > 0) ? Math.pow(exp/bx, 0.1) - 1 : null;
  f.cagrImp = (bm !== null && bm > 0 && imp !== null && imp > 0) ? Math.pow(imp/bm, 0.1) - 1 : null;

  // Partner shares are taken against the flow total from `yearly`, NOT against
  // the sum of the partner rows: partners_yearly is the top 8 per year and
  // direction, so its own sum is not the trade total. For Solar - India 2024 the
  // partner sum would report the USA at 58 % of exports where it is 36 %.
  const part = (dir, total) => {
    const rows = (d[pk] || []).filter(r => r.year === Y && r.dir === dir)
                              .sort((a,b) => b.v - a.v);
    if(!rows.length) return null;
    const v = num(rows[0].v);
    return { partner: rows[0].partner, share: (v !== null && total) ? v/total : null };
  };
  f.topDest = part('dest', exp);
  f.topSrc  = part('src',  imp);

  // The bundle ships four HHI series; the partner-concentration one is imports.
  const h = (d.hhi || []).filter(r => r.series === 'Imports: partner HHI')
                         .sort((a,b) => a.year - b.year);
  f.hhi = h.length ? h[h.length-1] : null;

  const defs = d.deficits || [];
  f.defPersistent = defs.filter(r => r.persistent).length;
  f.defTotal = defs.length;
  f.codes = (d.products || []).length;

  const pc = (d.pc || []).slice().sort((a,b) => a.year - b.year);
  f.pc = pc.length ? pc[pc.length-1] : null;
  f.meta = d.bench_meta || null;
  return f;
}

function tile(k, v, s, cls){
  return '<div class="dd-tile' + (cls ? ' ' + cls : '') + '">' +
    '<div class="k">' + k + '</div><div class="v">' + v + '</div>' +
    '<div class="s">' + (s || '&nbsp;') + '</div></div>';
}

function statsHead(note){
  const chip = '<button class="dd-basis' + (ddBasis === 'corr' ? ' corr' : '') + '" id="dd-basis" ' +
    'title="Raw counts a shared HS code in full under every technology that claims it. ' +
    'Corrected splits it. Click to switch.">' +
    (ddBasis === 'corr' ? 'Corrected basis' : 'Raw basis') + '</button>';
  return '<div class="dd-stats-hd"><span class="ir-analysis-ph">Case statistics</span>' +
         chip + '<span class="dd-stats-note">' + note + '</span></div>';
}

function wireBasis(){
  const b = document.getElementById('dd-basis');
  if(b) b.addEventListener('click', () => { ddBasis = ddBasis === 'raw' ? 'corr' : 'raw'; renderStats(); });
}

function renderStats(){
  const el = document.getElementById('dd-stats');
  if(!el) return;
  const key = ddTech + '_' + ddCountry;
  const my = ++statsToken;

  if(!DATACASES.has(key)){
    el.innerHTML = statsHead('No engine case bundle for this pair, so there are no figures to show.') +
                   '<div class="dd-stats-msg">' + ddTech + ' · ' + ddCountry + ' is not one of the 297 built cases.</div>';
    wireBasis();
    return;
  }

  el.innerHTML = statsHead('Reading the case bundle…');
  wireBasis();

  Promise.all([loadBundle(key), loadGDP()]).then(([d]) => {
    if(my !== statsToken) return;                   // a newer pair has taken over
    const f = d ? statFields(d) : null;
    if(!f){
      el.innerHTML = statsHead('The case bundle could not be read.') +
        '<div class="dd-stats-msg">If you opened this over file://, use a local server or the deployed site.</div>';
      wireBasis();
      return;
    }

    const basisWord = ddBasis === 'corr' ? 'multi-use corrected' : 'raw';
    const cagrNote = f.cagrFrom ? f.cagrFrom + '–' + f.year + ' CAGR' : '10-yr CAGR';
    const note = 'All figures for <b>' + f.year + '</b>, on the ' + basisWord +
                 ' basis, from ' + key + '.json.';

    const bal = f.balance;
    const tiles = [
      tile('Exports ' + f.year, fmtKUSD(f.exports),
           fmtPctUnits(f.pctExp) + ' of GDP · ' + fmtSigned(f.cagrExp) + ' ' + cagrNote),
      tile('Imports ' + f.year, fmtKUSD(f.imports),
           fmtPctUnits(f.pctImp) + ' of GDP · ' + fmtSigned(f.cagrImp) + ' ' + cagrNote),
      tile('Trade balance', fmtKUSD(bal),
           bal === null ? DASH : (bal < 0 ? 'net importer' : 'net exporter'),
           bal === null ? '' : (bal < 0 ? 'neg' : 'pos')),
      tile('Top destination', f.topDest ? f.topDest.partner : DASH,
           f.topDest ? fmtFrac(f.topDest.share) + ' of exports' : 'no partner rows'),
      tile('Top source', f.topSrc ? f.topSrc.partner : DASH,
           f.topSrc ? fmtFrac(f.topSrc.share) + ' of imports' : 'no partner rows'),
      tile('Import partner HHI', f.hhi ? fmtNum(num(f.hhi.hhi), 3) : DASH,
           f.hhi ? 'concentration, ' + f.hhi.year : 'no HHI series'),
      tile('Persistent deficits', String(f.defPersistent),
           'of ' + f.defTotal + ' deficit products'),
      tile('HS codes', String(f.codes), 'traded in this chain'),
      tile('Predicted competitiveness', f.pc ? fmtNum(num(f.pc.pc), 3) : DASH,
           f.pc ? 'PC score, ' + f.pc.year : 'no PC score for this pair'),
      tile('Region', f.meta && f.meta.wb_region ? f.meta.wb_region : DASH,
           f.meta && f.meta.n_world ? 'ranked among ' + f.meta.n_world + ' countries' : '')
    ].join('');

    el.innerHTML = statsHead(note) + '<div class="dd-tiles">' + tiles + '</div>';
    wireBasis();
  });
}

ddBoot();
</script>
</body>
</html>
