function dlPNG(){
  const svg=document.querySelector("svg[id]");
  if(!svg)return;
  const bb=svg.getBoundingClientRect();
  const W=Math.round(bb.width)||800,H=Math.round(bb.height)||600;
  const xml=new XMLSerializer().serializeToString(svg);
  const blob=new Blob([xml],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    const cvs=document.createElement("canvas");
    cvs.width=W*2;cvs.height=H*2;
    const ctx=cvs.getContext("2d");
    ctx.scale(2,2);ctx.fillStyle="#0d1520";ctx.fillRect(0,0,W,H);
    ctx.drawImage(img,0,0,W,H);
    URL.revokeObjectURL(url);
    const a=document.createElement("a");
    a.download=(document.title||"panel").replace(/[^a-z0-9_-]/gi,"_")+".png";
    a.href=cvs.toDataURL("image/png");a.click();
  };
  img.src=url;
}

    xRefVal=d3.median(pctsPos)||maxPct*0.5;
    xRefLabel="median";
    xTipFn=d=>"Exp % GDP: <b>"+(d.pct>0?d.pct.toFixed(4)+"%%":"0")+"</b>";
  } else {
    const maxRCA=Math.max(d3.max(data,d=>d.rca)||2, 2);
    xSc=d3.scaleLog().domain([0.02,maxRCA]).range([0,iw]).clamp(true);
    xFn=d=>xSc(Math.max(d.rca,0.02));
    xLabel="Product RCA (log scale)";
    xRefVal=1; xRefLabel="RCA=1";
    xTipFn=d=>"RCA: <b>"+d.rca.toFixed(2)+"</b>";
  }
  // ── Y scale ──────────────────────────────────────────────────────────────
  const maxShap=d3.max(data,d=>d.shap)||1;
  const ySc=d3.scaleLinear().domain([0,maxShap*1.05]).range([ih,0]);
  const g=svg.append("g").attr("transform","translate("+M.l+","+M.t+")");
  const qLabels=[];
  // ── Classification grid ───────────────────────────────────────────────────
  // SHAP thresholds: % of total weight (High≥25%, Medium 10-25%, Low<10%)
  const totalShap=d3.sum(data,d=>d.shap)||1;
  const shapHiThr=totalShap*0.25, shapLoThr=totalShap*0.10;
  const yHi=ySc(Math.min(shapHiThr,maxShap)), yLo=ySc(Math.min(shapLoThr,maxShap));
  if(scXMode==="rca"){
    // X: Weak RCA<0.5 | Partial 0.5≤RCA<1 | Strength RCA≥1
    const xW=xSc(0.5), xP=xSc(1);
    [
      {x:0,  y:0,   w:xW,    h:yHi,    f:"rgba(220,38,38,0.12)",  lbl:"critical gap"},
      {x:xW, y:0,   w:xP-xW, h:yHi,    f:"rgba(249,115,22,0.11)", lbl:"build up"},
      {x:xP, y:0,   w:iw-xP, h:yHi,    f:"rgba(34,197,94,0.12)",  lbl:"leverage"},
      {x:0,  y:yHi, w:xW,    h:yLo-yHi,f:"rgba(220,38,38,0.08)",  lbl:"gap"},
      {x:xW, y:yHi, w:xP-xW, h:yLo-yHi,f:"rgba(249,115,22,0.09)", lbl:"build up"},
      {x:xP, y:yHi, w:iw-xP, h:yLo-yHi,f:"rgba(234,179,8,0.11)",  lbl:"mature strength"},
      {x:0,  y:yLo, w:xW,    h:ih-yLo, f:"rgba(107,114,128,0.04)", lbl:"not priority"},
      {x:xW, y:yLo, w:xP-xW, h:ih-yLo, f:"rgba(107,114,128,0.04)", lbl:"not priority"},
      {x:xP, y:yLo, w:iw-xP, h:ih-yLo, f:"rgba(59,130,246,0.10)",  lbl:"bonus strength"}
    ].forEach(q=>{
      if(q.w<=0||q.h<=0) return;
      g.append("rect").attr("x",q.x).attr("y",q.y).attr("width",q.w).attr("height",q.h).attr("fill",q.f);
      qLabels.push(q);
    });
    [[xW,"RCA=0.5"],[xP,"RCA=1"]].forEach(([x,lbl])=>{
      g.append("line").attr("x1",x).attr("y1",0).attr("x2",x).attr("y2",ih)
        .attr("stroke","rgba(255,255,255,.2)").attr("stroke-dasharray","4,3").attr("stroke-width",1);
      g.append("text").attr("x",x+4).attr("y",10).attr("fill","rgba(255,255,255,.28)").attr("font-size",11).text(lbl);
    });
    [yHi,yLo].forEach((y,i)=>{
      g.append("line").attr("x1",0).attr("y1",y).attr("x2",iw).attr("y2",y)
        .attr("stroke","rgba(255,255,255,.13)").attr("stroke-dasharray","3,4").attr("stroke-width",1);
      g.append("text").attr("x",4).attr("y",y-3).attr("fill","rgba(255,255,255,.22)").attr("font-size",11)
        .text(i===0?"SHAP ≥25%":"SHAP ≥10%");
    });
  } else {
    // % GDP mode: 4-quadrant (median split)
    const xDiv=xSc(xRefVal), yMed=(yHi+yLo)/2;
    [{x:0,y:0,w:xDiv,h:yMed,f:"rgba(239,68,68,0.09)",lbl:"LOW EXPORT"},
     {x:xDiv,y:0,w:iw-xDiv,h:yMed,f:"rgba(34,197,94,0.09)",lbl:"HIGH EXPORT"},
     {x:0,y:yMed,w:xDiv,h:ih-yMed,f:"rgba(107,114,128,0.04)",lbl:"NOT PRIORITY"},
     {x:xDiv,y:yMed,w:iw-xDiv,h:ih-yMed,f:"rgba(59,130,246,0.07)",lbl:"BONUS"}
    ].forEach(q=>{
      if(q.w<=0||q.h<=0) return;
      g.append("rect").attr("x",q.x).attr("y",q.y).attr("width",q.w).attr("height",q.h).attr("fill",q.f);
      qLabels.push(q);
    });
    g.append("line").attr("x1",0).attr("y1",yMed).attr("x2",iw).attr("y2",yMed)
      .attr("stroke","rgba(255,255,255,.12)").attr("stroke-dasharray","3,4").attr("stroke-width",1);
    g.append("line").attr("x1",xDiv).attr("y1",0).attr("x2",xDiv).attr("y2",ih)
      .attr("stroke","rgba(255,255,255,.22)").attr("stroke-dasharray","4,3").attr("stroke-width",1);
    g.append("text").attr("x",xDiv+4).attr("y",10).attr("fill","rgba(255,255,255,.28)").attr("font-size",10).text(xRefLabel);
  }
  // ── Axes ─────────────────────────────────────────────────────────────────
  g.append("g").attr("transform","translate(0,"+ih+")")
    .call(d3.axisBottom(xSc).ticks(6,"~g").tickSize(3))
    .call(gg=>gg.select(".domain").attr("stroke","rgba(255,255,255,.2)"))
    .call(gg=>gg.selectAll("text").attr("fill","rgba(255,255,255,.45)").attr("font-size",12));
  g.append("g").call(d3.axisLeft(ySc).ticks(5).tickSize(3))
    .call(gg=>gg.select(".domain").attr("stroke","rgba(255,255,255,.2)"))
    .call(gg=>gg.selectAll("text").attr("fill","rgba(255,255,255,.45)").attr("font-size",12));
  g.append("text").attr("x",iw/2).attr("y",ih+38).attr("text-anchor","middle")
    .attr("fill","rgba(255,255,255,.4)").attr("font-size",14).text(xLabel);
  g.append("text").attr("transform","rotate(-90)").attr("x",-ih/2).attr("y",-44)
    .attr("text-anchor","middle").attr("fill","rgba(255,255,255,.4)").attr("font-size",14)
    .text("SHAP Importance (mean |z|)");
  // ── Bubbles ──────────────────────────────────────────────────────────────
  [...data].sort((a,b)=>sizeFn(b)-sizeFn(a)).forEach(d=>{
    const col=SR_COLORS[d.stage+"|"+d.role]||"#9ca3af";
    const r=Math.max(rScale(sizeFn(d)),6);
    const x=xFn(d), y=ySc(d.shap);
    g.append("circle").attr("cx",x).attr("cy",y).attr("r",r)
      .attr("fill",col).attr("fill-opacity",0.72)
      .attr("stroke",col).attr("stroke-width",0.5).attr("stroke-opacity",0.9)
      .on("mousemove",ev=>showTip(
        "<b>"+d.name+"</b><br>HS "+d.code+"<br>"+d.stage+" · "+d.role+
        "<br>"+xTipFn(d)+" | SHAP: <b>"+d.shap.toFixed(3)+"</b>"+
        "<br>Exp: "+fmtV(d.exp)+" | Imp: "+fmtV(d.imp),ev))
      .on("mouseleave",hideTip);
  });
  // ── Quadrant labels (rendered above bubbles) ─────────────────────────────
  qLabels.forEach(q=>{
    g.append("text").attr("x",q.x+q.w/2).attr("y",q.y+q.h/2).attr("text-anchor","middle")
      .attr("fill","rgba(255,255,255,.4)").attr("font-size",14).attr("font-weight",700).text(q.lbl);
  });
  // Legend
  const legItems=[["Upstream|Raw Material","#b45309","Raw Mat."],["Upstream|Processed Material","#c17a2e","Proc. Mat."],
    ["Midstream|Product Component","#16a34a","Comp."],["Downstream|Final Product","#f97316","Final"]];
  legItems.forEach(([k,col,lbl],i)=>{
    const lx=8+i*90;
    g.append("circle").attr("cx",lx).attr("cy",-8).attr("r",4).attr("fill",col).attr("opacity",0.8);
    g.append("text").attr("x",lx+7).attr("y",-4).attr("fill","rgba(255,255,255,.4)").attr("font-size",11).text(lbl);
  });
  }catch(err){
    const svg2=d3.select("#sr-scatter-svg");
    const W2=window.innerWidth||800, H2=(window.innerHeight||500)-52;
    svg2.selectAll("*").remove();
    svg2.attr("viewBox","0 0 "+W2+" "+H2);
    svg2.append("text").attr("x",W2/2).attr("y",H2/2).attr("text-anchor","middle")
      .attr("fill","#ef4444").attr("font-size",13).text("Error: "+err.message);
    console.error("drawShapRcaScatter error:",err);
  }
}

function precomputeCentroids(topo){
  const proj=d3.geoNaturalEarth1().scale(153).translate([480,250]);
  topojson.feature(topo,topo.objects.countries).features.forEach(f=>{
    const id=String(f.id).padStart(3,"0");
    const iso=Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(id));
    if(iso){
      try{const c=d3.geoCentroid(f); centroids[iso]=c;}catch(e){}
    }
  });
}

let worldTopo=WORLD_TOPO_INLINE,centroids={},savedMapProj=null;
// worldTopo inlined — precompute centroids immediately
precomputeCentroids(worldTopo);

function drawMap(){
  if(!worldTopo) return;
  const c0=c();
  const pv=getPV();
  const w=document.getElementById("pane-map").clientWidth||800;
  const h=document.getElementById("pane-map").clientHeight-80||350;
  const sc=Math.min(w/MAP_W, h/MAP_H);
  const tx=(w-MAP_W*sc)/2, ty=(h-MAP_H*sc)/2;

  const svg=d3.select("#map-svg");
  svg.selectAll("*").remove();
  svg.attr("viewBox",`0 0 ${w} ${h}`);

  const proj=d3.geoNaturalEarth1().rotate([30,0,0]).scale(153*sc).translate([w*0.57,h/2+12*sc]);
  savedMapProj=proj;
  const path=d3.geoPath().projection(proj);
  const feat=topojson.feature(worldTopo, worldTopo.objects.countries).features;

  // build supplier/buyer lookup
  const supMap={}, buyMap={};
  const maxSup=pv.suppliers.length>0?d3.max(pv.suppliers,d=>d.value):1;
  const maxBuy=pv.buyers.length>0?d3.max(pv.buyers,d=>d.value):1;
  pv.suppliers.forEach(s=>supMap[s.iso3]=s);
  pv.buyers.forEach(b=>buyMap[b.iso3]=b);

  const g=svg.append("g");
  g.selectAll("path").data(feat).join("path")
    .attr("d",path)
    .attr("fill",d=>{
      const id=String(d.id).padStart(3,"0");
      const iso=Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(id));
      if(iso===c0.focal) return "#073309";
      if(supMap[iso]) return `rgba(217,119,6,${0.15+0.55*(supMap[iso].value/maxSup)})`;
      if(buyMap[iso]) return `rgba(3,105,161,${0.15+0.55*(buyMap[iso].value/maxBuy)})`;
      return "#1a2535";
    })
    .attr("stroke","#0d1520").attr("stroke-width",0.3)
    .on("mousemove",(ev,d)=>{
      const id=String(d.id).padStart(3,"0");
      const iso=Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(id));
      if(!iso) return hideTip();
      const s=supMap[iso],b=buyMap[iso];
      if(iso===c0.focal){ showTip(`<b>${c0.name}</b><br>Focal Country`,ev); return; }
      if(s) showTip(`<b>${s.name}</b><br>Supplier: ${fmtV(s.value)}`,ev);
      else if(b) showTip(`<b>${b.name}</b><br>Buyer: ${fmtV(b.value)}`,ev);
      else hideTip();
    })
    .on("mouseleave",hideTip);

  // Focal country border — use c0.focal (generic for any country)
  const braFeat=feat.find(d=>{const fid=String(d.id).padStart(3,"0");return Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(fid))===c0.focal;});
  if(braFeat) g.append("path").attr("d",path(braFeat)).attr("fill","none").attr("stroke","#3cb54a").attr("stroke-width",1.8).attr("pointer-events","none");

  // Flow lines to top suppliers/buyers
  const allLines=[
    ...pv.suppliers.slice(0,8).map(s=>({...s,type:"sup"})),
    ...pv.buyers.slice(0,8).map(b=>({...b,type:"buy"}))
  ];
  allLines.forEach(d=>{
    const ct=centroids[d.iso3];
    const br=centroids[c0.focal];
    if(!ct||!br) return;
    const [x1,y1]=proj(ct), [x2,y2]=proj(br);
    g.append("line").attr("x1",x1).attr("y1",y1).attr("x2",x2).attr("y2",y2)
      .attr("stroke",d.type==="sup"?"rgba(217,119,6,.4)":"rgba(3,105,161,.4)")
      .attr("stroke-width",0.8);
    g.append("circle").attr("cx",x1).attr("cy",y1).attr("r",3.5+3*d.value/((d.type==="sup"?maxSup:maxBuy)||1))
      .attr("fill",d.type==="sup"?"rgba(217,119,6,.6)":"rgba(3,105,161,.6)")
      .attr("stroke","none");
  });

  // Overlay stats
  const imp=pv.total_imp, exp=pv.total_exp, net=exp-imp;
  document.getElementById("ov-imp").textContent=fmtV(imp);
  document.getElementById("ov-exp").textContent=fmtV(exp);
  const netEl=document.getElementById("ov-net");
  netEl.textContent=(net>=0?"+":"")+fmtV(Math.abs(net))+" net";
  netEl.style.color=net>=0?"#4ade80":"#f87171";
  const gdp=c().focal_gdp;
  const impGDPpct=imp>0&&gdp?(imp/gdp/10):0;
  const expGDPpct=exp>0&&gdp?(exp/gdp/10):0;
  document.getElementById("ov-imp-gdp").textContent=impGDPpct>0?impGDPpct.toFixed(2)+"% GDP":"";
  document.getElementById("ov-exp-gdp").textContent=expGDPpct>0?expGDPpct.toFixed(2)+"% GDP":"";
  // ── Dynamic ranking stats ──────────────────────────────────────────────────
  const scat=c().scatter||[];
  const bra=scat.find(d=>d.iso3===c().focal)||null;
  const RABB={"East Asia & Pacific":"EAP","Europe & Central Asia":"ECA","South Asia":"SAS","North America":"NAC","Latin America & Caribbean":"LCN","Middle East & North Africa":"MEA","Sub-Saharan Africa":"SSA"};
  const braReg=bra?bra.region:"";
  const regAbbr=RABB[braReg]||braReg||"Reg";
  // GDP share rank (use current pv absolute values scaled against scatter)
  const impPct=impGDPpct, expPct=expGDPpct;
  const expGDPranked=[...scat].filter(d=>d.ep>0).sort((a,b)=>b.ep-a.ep);
  const impGDPranked=[...scat].filter(d=>d.ip>0).sort((a,b)=>b.ip-a.ip);
  const braExpGDPrank=expPct>0?expGDPranked.filter(d=>+d.ep>expPct).length+1:null;
  const braImpGDPrank=impPct>0?impGDPranked.filter(d=>+d.ip>impPct).length+1:null;
  // World market share (from scatter totals — tech-level context)
  const worldExpB=d3.sum(scat,d=>+d.eb||0)||1;
  const worldImpB=d3.sum(scat,d=>+d.ib||0)||1;
  const braEB=bra?+bra.eb||0:0; const braIB=bra?+bra.ib||0:0;
  const wldExpSh=(braEB/worldExpB*100), wldImpSh=(braIB/worldImpB*100);
  const expEBranked=[...scat].filter(d=>d.eb>0).sort((a,b)=>b.eb-a.eb);
  const impIBranked=[...scat].filter(d=>d.ib>0).sort((a,b)=>b.ib-a.ib);
  const braEBrank=braEB>0?expEBranked.findIndex(d=>d.iso3===c().focal)+1:null;
  const braIBrank=braIB>0?impIBranked.findIndex(d=>d.iso3===c().focal)+1:null;
  // Regional share
  const regExp=scat.filter(d=>d.region===braReg&&d.eb>0).sort((a,b)=>b.eb-a.eb);
  const regImp=scat.filter(d=>d.region===braReg&&d.ib>0).sort((a,b)=>b.ib-a.ib);
  const regExpB=d3.sum(regExp,d=>+d.eb||0)||1;
  const regImpB=d3.sum(regImp,d=>+d.ib||0)||1;
  const regExpSh=(braEB/regExpB*100), regImpSh=(braIB/regImpB*100);
  const braRegExpRank=braEB>0?regExp.findIndex(d=>d.iso3===c().focal)+1:null;
  const braRegImpRank=braIB>0?regImp.findIndex(d=>d.iso3===c().focal)+1:null;
  const fmt1=(v,pfx="")=>v>0?pfx+v.toFixed(v<1?2:1)+"%":"—";
  const rk=(r)=>r&&r>0?`#${r}`:"—";
  const statsEl=document.getElementById("ov-stats");
  if(statsEl){statsEl.innerHTML=
    `<div class="ov-stat-row"><span class="ov-stat-key">% of GDP</span><span class="ov-stat-vals"><span class="ov-stat-pct">${fmt1(impPct)} / ${fmt1(expPct)}</span><span class="ov-stat-rank">${rk(braImpGDPrank)} / ${rk(braExpGDPrank)}</span></span></div>`+
    `<div class="ov-stat-row"><span class="ov-stat-key">World share</span><span class="ov-stat-vals"><span class="ov-stat-pct">${fmt1(wldImpSh)} / ${fmt1(wldExpSh)}</span><span class="ov-stat-rank">${rk(braIBrank)} / ${rk(braEBrank)}</span></span></div>`+
    `<div class="ov-stat-row"><span class="ov-stat-key">${regAbbr} share</span><span class="ov-stat-vals"><span class="ov-stat-pct">${fmt1(regImpSh)} / ${fmt1(regExpSh)}</span><span class="ov-stat-rank">${rk(braRegImpRank)} / ${rk(braRegExpRank)}</span></span></div>`;
  }

  // Supplier list (top 5)
  const buyersEl=document.getElementById("ov-buyers");
  const suppliersEl=document.getElementById("ov-suppliers");
  if(buyersEl) buyersEl.innerHTML=pv.buyers.slice(0,5).map(b=>
    `<div class="ov-row"><div class="ov-dot" style="background:rgba(3,105,161,.75)"></div><span class="ov-cname">${b.name}</span><span class="ov-cval">${fmtV(b.value)}</span></div>`
  ).join("");
  if(suppliersEl) suppliersEl.innerHTML=pv.suppliers.slice(0,4).map(s=>
    `<div class="ov-row"><div class="ov-dot" style="background:rgba(217,119,6,.75)"></div><span class="ov-cname">${s.name}</span><span class="ov-cval">${fmtV(s.value)}</span></div>`
  ).join("");
}

      mapViewMode=m;
      modes.forEach(([mm])=>{
        document.getElementById("tmv-"+mm).setAttribute("style", mm===m ? "padding:3px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:.99rem;font-weight:700;letter-spacing:.06em;border:1px solid rgba(60,181,74,.4);background:rgba(60,181,74,.12);color:#3cb54a;transition:all .15s" : "padding:3px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:.99rem;font-weight:700;letter-spacing:.06em;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);transition:all .15s");
      });
      // Override getPV temporarily to filter suppliers/buyers by mode
      const origPV=window._basePV||getPV();
      window._basePV=origPV;
      window.getPV=function(){
        const pv=window._basePV;
        if(!pv) return {suppliers:[],buyers:[],timeline:[]};
        if(mapViewMode==="imports")  return Object.assign({},pv,{buyers:[]});
        if(mapViewMode==="exports")  return Object.assign({},pv,{suppliers:[]});
        return pv;
      };
      drawMap();
    };
    wrap.appendChild(b);
  });
  // Init basePV on first draw
  const _orig=window.getPV;
  window.getPV=function(){
    const pv=_orig();
    window._basePV=pv;
    window.getPV=_orig;
    return pv;
  };
  hdr.appendChild(wrap);
})();

});
</script></body></html>
