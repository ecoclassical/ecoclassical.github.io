<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0d1520;

#module-wrap{width:100%;height:100%;display:flex;flex-direction:column}

<script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
<script>
const ALL_CASES=[{tech:"Nuclear",color:"#0ea5e9",focal:"VNM",focal_gdp:434592,total_imp:6775411,total_exp:1403745,all_products:[{"code":"681099","name":"Hafnium; Control Rods","stage":"Midstream","role":"Processed Material","exp":538994,"imp":66249},{"code":"841780","name":"UF6 Conversion; Industrial Furnace","stage":"Midstream","role":"Process Equipment","exp":8666,"imp":52734},{"code":"260400","name":"Nickel Ore","stage":"Upstream","role":"Raw Material","exp":66071,"imp":636},{"code":"260300","name":"Copper Ore","stage":"Upstream","role":"Raw Material","exp":10417,"imp":537},{"code":"260700","name":"Lead Ore","stage":"Upstream","role":"Raw Material","exp":54657,"imp":2054},{"code":"261510","name":"Zirconium Ore","stage":"Upstream","role":"Raw Material","exp":44127,"imp":13999},{"code":"720260","name":"Steel Input; Ferro-nickel","stage":"Midstream","role":"Processed Material","exp":1812,"imp":0},{"code":"720270","name":"Steel Input; Ferro-molybdenum","stage":"Midstream","role":"Processed Material","exp":366,"imp":5671},{"code":"721922","name":"Reactor Core; Structural Steel","stage":"Downstream","role":"Product Component","exp":659,"imp":12354},{"code":"840681","name":"Steam Turbine >40MW","stage":"Downstream","role":"Product Component","exp":20356,"imp":3889},{"code":"841940","name":"UF6 Conversion; Atmospheric Distillation","stage":"Midstream","role":"Process Equipment","exp":189,"imp":8157},{"code":"380110","name":"Neutron Moderator; Artificial Graphite","stage":"Midstream","role":"Processed Material","exp":213,"imp":20988},{"code":"722790","name":"Control Rods; Boron Steel","stage":"Midstream","role":"Processed Material","exp":13670,"imp":110386},{"code":"840110","name":"Nuclear Reactors","stage":"Final Product","role":"Final Product","exp":122,"imp":0},{"code":"261390","name":"Molybdenum Ore","stage":"Upstream","role":"Raw Material","exp":1433,"imp":23826},{"code":"840690","name":"Parts of Steam Turbines","stage":"Downstream","role":"Product Component","exp":206,"imp":48691},{"code":"260111","name":"Iron Ore (Non- Agglomerated)","stage":"Upstream","role":"Raw Material","exp":0,"imp":1424821},{"code":"260112","name":"Iron Ore (Agglomerated)","stage":"Upstream","role":"Raw Material","exp":0,"imp":50856},{"code":"281290","name":"Sulfur Hexafluoride","stage":"Midstream","role":"Processed Material","exp":0,"imp":375},{"code":"721921","name":"Reactor Core; Structural Steel","stage":"Downstream","role":"Product Component","exp":0,"imp":18272},{"code":"281000","name":"Boric Acid","stage":"Upstream","role":"Processed Material","exp":0,"imp":4956},{"code":"250410","name":"Natural Graphite","stage":"Upstream","role":"Raw Material","exp":0,"imp":1654},{"code":"260200","name":"Manganese Ore","stage":"Upstream","role":"Raw Material","exp":0,"imp":23885},{"code":"282520","name":"Coolant; Lithium Hydroxide","stage":"Midstream","role":"Processed Material","exp":0,"imp":281},{"code":"840420","name":"Condenser","stage":"Downstream","role":"Product Component","exp":0,"imp":2111},{"code":"845430","name":"Structural Steel; Steel Casting Machines","stage":"Downstream","role":"Process Equipment","exp":0,"imp":67871}],selected_pv:{"code":"ROLE:Final Product","label":"Final Product","stage":"Final Product","role":"Final Product","total_imp":0,"total_exp":122,"suppliers":[],"buyers":[{"iso3":"MYS","name":"121.636","value":NA}],"timeline":[]}}];
let currentIdx=0;
const c=()=>ALL_CASES[currentIdx];
let selStage="Final Product", selRole="Final Product", selProduct="ALL";
let tlMode="exports", scMode="pct", sankeyFocus=null;

const SR_COLORS={
  "Upstream|Raw Material":"#b45309","Upstream|Processed Material":"#c17a2e",
  "Midstream|Processed Material":"#22c55e","Midstream|Process Equipment":"#65a30d",
  "Midstream|Product Component":"#16a34a","Downstream|Product Component":"#4ade80",
  "Downstream|Process Equipment":"#6b7280","Downstream|Final Product":"#f97316",
  "Final Product|Final Product":"#f97316","Other|Product Component":"#9ca3af",
  "Other|Process Equipment":"#9ca3af"
};
const SR_ORDER=["Upstream|Raw Material","Upstream|Processed Material","Midstream|Processed Material","Midstream|Process Equipment","Midstream|Product Component","Downstream|Product Component","Downstream|Process Equipment","Downstream|Final Product","Final Product|Final Product"];
const STAGE_COLORS={"Upstream":"#b45309","Midstream":"#22c55e","Downstream":"#4ade80","Final Product":"#f97316"};
const STAGES_ORDER=["Upstream","Midstream","Downstream","Final Product"];
const REGION_COLOR={EAP:"#0369a1",ECA:"#6366f1",SAS:"#10b981",NAC:"#f59e0b",LCN:"#ef4444",MEA:"#8b5cf6",SSF:"#84cc16"};
const PROD_COLORS=["#f59e0b","#38bdf8","#4ade80","#f87171","#c084fc","#fb923c","#a78bfa","#34d399","#f472b6","#60a5fa"];
const tip={_el:null,_get(){return this._el||(this._el=document.getElementById("tooltip"));},style(k,v){const e=this._get();if(e)e.style[k]=v;return this;},html(h){const e=this._get();if(e)e.innerHTML=h;return this;}};
function showTip(html,ev){const vw=window.innerWidth;const tx=ev.clientX+14;const offset=tx+260>vw?ev.clientX-270:tx;tip.style("opacity","1").html(html).style("left",offset+"px").style("top",(ev.clientY-10)+"px")}
function hideTip(){tip.style("opacity","0")}
const fmtV=v=>v>=1e6?`$${(v/1e6).toFixed(1)}B`:v>=1e3?`$${(v/1e3).toFixed(1)}M`:`$${v.toFixed(0)}K`;
function srColor(sr){return SR_COLORS[sr]||"#9ca3af"}
function srColorSR(stage,role){return SR_COLORS[stage+"|"+role]||"#9ca3af"}


function getPV() {
  const c0 = c();
  const pv = c0.selected_pv;
  if (pv) return pv;
  return c0.selected_pv || {code:"ALL",label:"All",stage:"ALL",role:"ALL",
    suppliers:[],buyers:[],timeline:[],total_imp:0,total_exp:0};
}

function drawMap(){
  if(!worldTopo) return;
  const pv=getPV();
  const w=document.getElementById("pane-map").clientWidth||800;
  const h=document.getElementById("pane-map").clientHeight-80||350;
  const sc=Math.min(w/MAP_W, h/MAP_H);
  const tx=(w-MAP_W*sc)/2, ty=(h-MAP_H*sc)/2;

  const svg=d3.select("#map-svg");
  svg.selectAll("*").remove();
  svg.attr("viewBox",`0 0 ${w} ${h}`);

  const proj=d3.geoNaturalEarth1().rotate([30,0,0]).scale(153*sc).translate([w*0.57,h/2+12*sc]);
  savedMapProj=proj;
  const path=d3.geoPath().projection(proj);
  const feat=topojson.feature(worldTopo, worldTopo.objects.countries).features;

  // build supplier/buyer lookup
  const supMap={}, buyMap={};
  const maxSup=pv.suppliers.length>0?d3.max(pv.suppliers,d=>d.value):1;
  const maxBuy=pv.buyers.length>0?d3.max(pv.buyers,d=>d.value):1;
  pv.suppliers.forEach(s=>supMap[s.iso3]=s);
  pv.buyers.forEach(b=>buyMap[b.iso3]=b);

  const g=svg.append("g");
  g.selectAll("path").data(feat).join("path")
    .attr("d",path)
    .attr("fill",d=>{
      const id=String(d.id).padStart(3,"0");
      const iso=Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(id));
      if(iso==="BRA") return "#073309";
      if(supMap[iso]) return `rgba(217,119,6,${0.15+0.55*(supMap[iso].value/maxSup)})`;
      if(buyMap[iso]) return `rgba(3,105,161,${0.15+0.55*(buyMap[iso].value/maxBuy)})`;
      return "#1a2535";
    })
    .attr("stroke","#0d1520").attr("stroke-width",0.3)
    .on("mousemove",(ev,d)=>{
      const id=String(d.id).padStart(3,"0");
      const iso=Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(id));
      if(!iso) return hideTip();
      const s=supMap[iso],b=buyMap[iso];
      if(iso==="BRA"){ showTip(`<b>Brazil</b><br>FLAG_BRA Focal Country`,ev); return; }
      if(s) showTip(`<b>${s.name}</b><br>Supplier: ${fmtV(s.value)}`,ev);
      else if(b) showTip(`<b>${b.name}</b><br>Buyer: ${fmtV(b.value)}`,ev);
      else hideTip();
    })
    .on("mouseleave",hideTip);

  // Brazil border: bright green outline rendered on top of all country fills
  const braFeat=feat.find(d=>{const fid=String(d.id).padStart(3,"0");return Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(fid))==="BRA";});
  if(braFeat) g.append("path").attr("d",path(braFeat)).attr("fill","none").attr("stroke","#3cb54a").attr("stroke-width",1.8).attr("pointer-events","none");

  // Flow lines to top suppliers/buyers
  const allLines=[
    ...pv.suppliers.slice(0,8).map(s=>({...s,type:"sup"})),
    ...pv.buyers.slice(0,8).map(b=>({...b,type:"buy"}))
  ];
  allLines.forEach(d=>{
    const ct=centroids[d.iso3];
    const br=centroids["BRA"];
    if(!ct||!br) return;
    const [x1,y1]=proj(ct), [x2,y2]=proj(br);
    g.append("line").attr("x1",x1).attr("y1",y1).attr("x2",x2).attr("y2",y2)
      .attr("stroke",d.type==="sup"?"rgba(217,119,6,.4)":"rgba(3,105,161,.4)")
      .attr("stroke-width",0.8);
    g.append("circle").attr("cx",x1).attr("cy",y1).attr("r",3.5+3*d.value/((d.type==="sup"?maxSup:maxBuy)||1))
      .attr("fill",d.type==="sup"?"rgba(217,119,6,.6)":"rgba(3,105,161,.6)")
      .attr("stroke","none");
  });

  // Overlay stats
  const imp=pv.total_imp, exp=pv.total_exp, net=exp-imp;
  document.getElementById("ov-imp").textContent=fmtV(imp);
  document.getElementById("ov-exp").textContent=fmtV(exp);
  const netEl=document.getElementById("ov-net");
  netEl.textContent=(net>=0?"+":"")+fmtV(Math.abs(net))+" net";
  netEl.style.color=net>=0?"#4ade80":"#f87171";
  const gdp=c().focal_gdp;
  const impGDPpct=imp>0&&gdp?(imp/gdp/10):0;
  const expGDPpct=exp>0&&gdp?(exp/gdp/10):0;
  document.getElementById("ov-imp-gdp").textContent=impGDPpct>0?impGDPpct.toFixed(2)+"% GDP":"";
  document.getElementById("ov-exp-gdp").textContent=expGDPpct>0?expGDPpct.toFixed(2)+"% GDP":"";
  // ── Dynamic ranking stats ──────────────────────────────────────────────────
  const scat=c().scatter||[];
  const bra=scat.find(d=>d.iso3===c().focal)||null;
  const RABB={"East Asia & Pacific":"EAP","Europe & Central Asia":"ECA","South Asia":"SAS","North America":"NAC","Latin America & Caribbean":"LCN","Middle East & North Africa":"MEA","Sub-Saharan Africa":"SSA"};
  const braReg=bra?bra.region:"";
  const regAbbr=RABB[braReg]||braReg||"Reg";
  // GDP share rank (use current pv absolute values scaled against scatter)
  const impPct=impGDPpct, expPct=expGDPpct;
  const expGDPranked=[...scat].filter(d=>d.ep>0).sort((a,b)=>b.ep-a.ep);
  const impGDPranked=[...scat].filter(d=>d.ip>0).sort((a,b)=>b.ip-a.ip);
  const braExpGDPrank=expPct>0?expGDPranked.filter(d=>+d.ep>expPct).length+1:null;
  const braImpGDPrank=impPct>0?impGDPranked.filter(d=>+d.ip>impPct).length+1:null;
  // World market share (from scatter totals — tech-level context)
  const worldExpB=d3.sum(scat,d=>+d.eb||0)||1;
  const worldImpB=d3.sum(scat,d=>+d.ib||0)||1;
  const braEB=bra?+bra.eb||0:0; const braIB=bra?+bra.ib||0:0;
  const wldExpSh=(braEB/worldExpB*100), wldImpSh=(braIB/worldImpB*100);
  const expEBranked=[...scat].filter(d=>d.eb>0).sort((a,b)=>b.eb-a.eb);
  const impIBranked=[...scat].filter(d=>d.ib>0).sort((a,b)=>b.ib-a.ib);
  const braEBrank=braEB>0?expEBranked.findIndex(d=>d.iso3===c().focal)+1:null;
  const braIBrank=braIB>0?impIBranked.findIndex(d=>d.iso3===c().focal)+1:null;
  // Regional share
  const regExp=scat.filter(d=>d.region===braReg&&d.eb>0).sort((a,b)=>b.eb-a.eb);
  const regImp=scat.filter(d=>d.region===braReg&&d.ib>0).sort((a,b)=>b.ib-a.ib);
  const regExpB=d3.sum(regExp,d=>+d.eb||0)||1;
  const regImpB=d3.sum(regImp,d=>+d.ib||0)||1;
  const regExpSh=(braEB/regExpB*100), regImpSh=(braIB/regImpB*100);
  const braRegExpRank=braEB>0?regExp.findIndex(d=>d.iso3===c().focal)+1:null;
  const braRegImpRank=braIB>0?regImp.findIndex(d=>d.iso3===c().focal)+1:null;
  const fmt1=(v,pfx="")=>v>0?pfx+v.toFixed(v<1?2:1)+"%":"—";
  const rk=(r)=>r&&r>0?`#${r}`:"—";
  const statsEl=document.getElementById("ov-stats");
  if(statsEl){statsEl.innerHTML=
    `<div class="ov-stat-row"><span class="ov-stat-key">% of GDP</span><span class="ov-stat-vals"><span class="ov-stat-pct">${fmt1(impPct)} / ${fmt1(expPct)}</span><span class="ov-stat-rank">${rk(braImpGDPrank)} / ${rk(braExpGDPrank)}</span></span></div>`+
    `<div class="ov-stat-row"><span class="ov-stat-key">World share</span><span class="ov-stat-vals"><span class="ov-stat-pct">${fmt1(wldImpSh)} / ${fmt1(wldExpSh)}</span><span class="ov-stat-rank">${rk(braIBrank)} / ${rk(braEBrank)}</span></span></div>`+
    `<div class="ov-stat-row"><span class="ov-stat-key">${regAbbr} share</span><span class="ov-stat-vals"><span class="ov-stat-pct">${fmt1(regImpSh)} / ${fmt1(regExpSh)}</span><span class="ov-stat-rank">${rk(braRegImpRank)} / ${rk(braRegExpRank)}</span></span></div>`;
  }

  // Supplier list (top 5)
  const buyersEl=document.getElementById("ov-buyers");
  const suppliersEl=document.getElementById("ov-suppliers");
  if(buyersEl) buyersEl.innerHTML=pv.buyers.slice(0,5).map(b=>
    `<div class="ov-row"><div class="ov-dot" style="background:rgba(3,105,161,.75)"></div><span class="ov-cname">${b.name}</span><span class="ov-cval">${fmtV(b.value)}</span></div>`
  ).join("");
  if(suppliersEl) suppliersEl.innerHTML=pv.suppliers.slice(0,4).map(s=>
    `<div class="ov-row"><div class="ov-dot" style="background:rgba(217,119,6,.75)"></div><span class="ov-cname">${s.name}</span><span class="ov-cval">${fmtV(s.value)}</span></div>`
  ).join("");
}

const ISO3N={
  AFG:4,ALB:8,DZA:12,AGO:24,ARG:32,ARM:51,AUS:36,AUT:40,AZE:31,
  BGD:50,BLR:112,BEL:56,BFA:854,BDI:108,KHM:116,CMR:120,CAN:124,
  TCD:148,CHL:152,CHN:156,COL:170,COD:180,COG:178,HRV:191,CUB:192,
  CYP:196,CZE:203,DNK:208,DOM:214,ECU:218,EGY:818,ETH:231,
  FJI:242,FIN:246,FRA:250,DEU:276,GHA:288,GRC:300,GTM:320,
  HND:340,HKG:344,HUN:348,IND:356,IDN:360,IRN:364,IRQ:368,
  IRL:372,ISR:376,ITA:380,JPN:392,JOR:400,KAZ:398,KEN:404,
  PRK:408,KOR:410,KWT:414,LAO:418,LVA:428,LBN:422,LBY:434,
  LTU:440,LUX:442,MDG:450,MWI:454,MYS:458,MLI:466,MLT:470,
  MRT:478,MEX:484,MDA:498,MNG:496,MAR:504,MOZ:508,MMR:104,
  NAM:516,NPL:524,NLD:528,NZL:554,NGA:566,NOR:578,OMN:512,
  PAK:586,PAN:591,PER:604,PHL:608,POL:616,PRT:620,QAT:634,
  ROU:642,RUS:643,SAU:682,SEN:686,SGP:702,SVK:703,ZAF:710,
  ESP:724,LKA:144,SWE:752,CHE:756,SYR:760,TWN:158,TJK:762,
  TZA:834,THA:764,TTO:780,TUN:788,TUR:792,TKM:795,UGA:800,
  UKR:804,ARE:784,GBR:826,USA:840,URY:858,UZB:860,VNM:704,
  YEM:887,ZMB:894,ZWE:716,BOL:68,BRA:76,BHR:48,DJI:262,
  SWZ:748,GEO:268,SLV:222,GNQ:226,EST:233,GUY:328,HTI:332,
  RWA:646,SLE:694,SDN:729,SUR:740,NER:562,CAF:140,ERI:232
};
function precomputeCentroids(topo){
  const proj=d3.geoNaturalEarth1().scale(153).translate([480,250]);
  topojson.feature(topo,topo.objects.countries).features.forEach(f=>{
    const id=String(f.id).padStart(3,"0");
    const iso=Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(id));
    if(iso){
      try{const c=d3.geoCentroid(f); centroids[iso]=c;}catch(e){}
    }
  });
}
let worldTopo=null, centroids={}, savedMapProj=null;
function restoreTradeMap(){
  document.getElementById("map-overlay").style.display="";
  document.getElementById("firm-overlay").style.display="none";
  document.getElementById("trade-legend").style.display="";
  document.getElementById("firm-legend").style.display="none";
  drawMap();
}
const WORLD_TOPO_URL="https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json";
const TOPOJSON_CDN="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js";
function boot(){
  fetch(WORLD_TOPO_URL).then(r=>r.json()).then(topo=>{
    worldTopo=topo; precomputeCentroids(topo); drawMap();
  }).catch(()=>{ /* map unavailable */ });
}
const s=document.createElement("script");
s.src=TOPOJSON_CDN; s.onload=boot; s.onerror=()=>{}; document.head.appendChild(s);


</script>
