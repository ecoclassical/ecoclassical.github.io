function dlPNG(){
  const svg=document.querySelector("svg[id]");
  if(!svg)return;
  const bb=svg.getBoundingClientRect();
  const W=Math.round(bb.width)||800,H=Math.round(bb.height)||600;
  const xml=new XMLSerializer().serializeToString(svg);
  const blob=new Blob([xml],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    const cvs=document.createElement("canvas");
    cvs.width=W*2;cvs.height=H*2;
    const ctx=cvs.getContext("2d");
    ctx.scale(2,2);ctx.fillStyle="#0d1520";ctx.fillRect(0,0,W,H);
    ctx.drawImage(img,0,0,W,H);
    URL.revokeObjectURL(url);
    const a=document.createElement("a");
    a.download=(document.title||"panel").replace(/[^a-z0-9_-]/gi,"_")+".png";
    a.href=cvs.toDataURL("image/png");a.click();
  };
  img.src=url;
}
function dlCSV(){

  if(!src.length){alert("No data to export");return;}
  const keys=Object.keys(src[0]);
  const rows=[keys.join(","),...src.map(d=>keys.map(k=>{const v=d[k];return typeof v==="string"?`"${v.replace(/"/g,"\"")}"`:(v==null?"":v);}).join(","))];
  const blob=new Blob([rows.join("\n")],{type:"text/csv"});
  const a=document.createElement("a");
  a.download=(document.title||"panel").replace(/[^a-z0-9_-]/gi,"_")+".csv";
  a.href=URL.createObjectURL(blob);a.click();
}

function drawShapRcaScatter(){
  try{
  const c0=c();

  const raw=(c0.shap_rca||[]).map(d=>({...d, pct:gdp>0?d.exp/(gdp*10):0}));
  const data=raw.filter(d=>d.rca>0||d.shap>0);
  const svg=d3.select("#sr-scatter-svg"); svg.selectAll("*").remove();
  const pane=document.getElementById("pane-sr-scatter");
  const W=(pane&&pane.clientWidth>0?pane.clientWidth:null)||window.innerWidth||600;
  const H=Math.max((pane&&pane.clientHeight>0?pane.clientHeight:window.innerHeight||436)-36,200);
  svg.attr("viewBox","0 0 "+W+" "+H);
  if(!data.length){
    svg.append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle")
      .attr("fill","rgba(255,255,255,.3)").attr("font-size",12).text("No SHAP-RCA data");
    return;
  }
  const M={t:24,r:28,b:48,l:58};
  const iw=W-M.l-M.r, ih=H-M.t-M.b;
  // bubble size follows tlMode
  const sizeFn=d=>tlMode==="imports"?(d.imp||0):tlMode==="balance"?Math.abs((d.exp||0)-(d.imp||0)):(d.exp||0);
  const maxSize=d3.max(data,sizeFn)||1;
  const rScale=d3.scaleSqrt().domain([0,maxSize]).range([8,40]);
  // ── X scale — mode-dependent ─────────────────────────────────────────────
  let xSc, xFn, xLabel, xRefVal, xRefLabel, xTipFn;
  if(scXMode==="pct"){
    const pctsPos=data.filter(d=>d.pct>0).map(d=>d.pct);
    const minPct=pctsPos.length?d3.min(pctsPos)*0.5:0.001;
    const maxPct=Math.max(d3.max(pctsPos)||0.01, 0.01);
    xSc=d3.scaleLog().domain([Math.max(minPct,1e-4), maxPct*1.2]).range([0,iw]).clamp(true);
    xFn=d=>xSc(Math.max(d.pct, Math.max(minPct,1e-4)));
    xLabel="Exports % of GDP (log scale)";
    // x divider at median non-zero pct
    xRefVal=d3.median(pctsPos)||maxPct*0.5;
    xRefLabel="median";
    xTipFn=d=>"Exp % GDP: <b>"+(d.pct>0?d.pct.toFixed(4)+"%%":"0")+"</b>";
  } else {
    const maxRCA=Math.max(d3.max(data,d=>d.rca)||2, 2);
    xSc=d3.scaleLog().domain([0.02,maxRCA]).range([0,iw]).clamp(true);
    xFn=d=>xSc(Math.max(d.rca,0.02));
    xLabel="Product RCA (log scale)";
    xRefVal=1; xRefLabel="RCA=1";
    xTipFn=d=>"RCA: <b>"+d.rca.toFixed(2)+"</b>";
  }
  // ── Y scale ──────────────────────────────────────────────────────────────
  const maxShap=d3.max(data,d=>d.shap)||1;
  const ySc=d3.scaleLinear().domain([0,maxShap*1.05]).range([ih,0]);
  const g=svg.append("g").attr("transform","translate("+M.l+","+M.t+")");

  const shapHiThr=totalShap*0.25, shapLoThr=totalShap*0.10;

      {x:0,  y:yHi, w:xW,    h:yLo-yHi,f:"rgba(220,38,38,0.08)",  lbl:"gap"},
      {x:xW, y:yHi, w:xP-xW, h:yLo-yHi,f:"rgba(249,115,22,0.09)", lbl:"build up"},

      {x:xW, y:yLo, w:xP-xW, h:ih-yLo, f:"rgba(107,114,128,0.04)", lbl:"not priority"},
      {x:xP, y:yLo, w:iw-xP, h:ih-yLo, f:"rgba(59,130,246,0.10)",  lbl:"bonus strength"}
    ].forEach(q=>{
      if(q.w<=0||q.h<=0) return;

     {x:xDiv,y:0,w:iw-xDiv,h:yMed,f:"rgba(34,197,94,0.09)",lbl:"HIGH EXPORT"},
     {x:0,y:yMed,w:xDiv,h:ih-yMed,f:"rgba(107,114,128,0.04)",lbl:"NOT PRIORITY"},
     {x:xDiv,y:yMed,w:iw-xDiv,h:ih-yMed,f:"rgba(59,130,246,0.07)",lbl:"BONUS"}
    ].forEach(q=>{
      if(q.w<=0||q.h<=0) return;
      g.append("rect").attr("x",q.x).attr("y",q.y).attr("width",q.w).attr("height",q.h).attr("fill",q.f);
      qLabels.push(q);
    });
    g.append("line").attr("x1",0).attr("y1",yMed).attr("x2",iw).attr("y2",yMed)
      .attr("stroke","rgba(255,255,255,.12)").attr("stroke-dasharray","3,4").attr("stroke-width",1);
    g.append("line").attr("x1",xDiv).attr("y1",0).attr("x2",xDiv).attr("y2",ih)
      .attr("stroke","rgba(255,255,255,.22)").attr("stroke-dasharray","4,3").attr("stroke-width",1);
    g.append("text").attr("x",xDiv+4).attr("y",10).attr("fill","rgba(255,255,255,.28)").attr("font-size",10).text(xRefLabel);
  }
  // ── Axes ─────────────────────────────────────────────────────────────────
  g.append("g").attr("transform","translate(0,"+ih+")")
    .call(d3.axisBottom(xSc).ticks(6,"~g").tickSize(3))
    .call(gg=>gg.select(".domain").attr("stroke","rgba(255,255,255,.2)"))
    .call(gg=>gg.selectAll("text").attr("fill","rgba(255,255,255,.45)").attr("font-size",12));
  g.append("g").call(d3.axisLeft(ySc).ticks(5).tickSize(3))
    .call(gg=>gg.select(".domain").attr("stroke","rgba(255,255,255,.2)"))
    .call(gg=>gg.selectAll("text").attr("fill","rgba(255,255,255,.45)").attr("font-size",12));
  g.append("text").attr("x",iw/2).attr("y",ih+38).attr("text-anchor","middle")
    .attr("fill","rgba(255,255,255,.4)").attr("font-size",14).text(xLabel);
  g.append("text").attr("transform","rotate(-90)").attr("x",-ih/2).attr("y",-44)
    .attr("text-anchor","middle").attr("fill","rgba(255,255,255,.4)").attr("font-size",14)
    .text("SHAP Importance (mean |z|)");
  // ── Bubbles ──────────────────────────────────────────────────────────────
  [...data].sort((a,b)=>sizeFn(b)-sizeFn(a)).forEach(d=>{
    const col=SR_COLORS[d.stage+"|"+d.role]||"#9ca3af";
    const r=Math.max(rScale(sizeFn(d)),6);
    const x=xFn(d), y=ySc(d.shap);
    g.append("circle").attr("cx",x).attr("cy",y).attr("r",r)
      .attr("fill",col).attr("fill-opacity",0.72)
      .attr("stroke",col).attr("stroke-width",0.5).attr("stroke-opacity",0.9)
      .on("mousemove",ev=>showTip(
        "<b>"+d.name+"</b><br>HS "+d.code+"<br>"+d.stage+" · "+d.role+
        "<br>"+xTipFn(d)+" | SHAP: <b>"+d.shap.toFixed(3)+"</b>"+
        "<br>Exp: "+fmtV(d.exp)+" | Imp: "+fmtV(d.imp),ev))
      .on("mouseleave",hideTip);
  });
  // ── Quadrant labels (rendered above bubbles) ─────────────────────────────
  qLabels.forEach(q=>{
    g.append("text").attr("x",q.x+q.w/2).attr("y",q.y+q.h/2).attr("text-anchor","middle")
      .attr("fill","rgba(255,255,255,.4)").attr("font-size",14).attr("font-weight",700).text(q.lbl);
  });
  // Legend
  const legItems=[["Upstream|Raw Material","#b45309","Raw Mat."],["Upstream|Processed Material","#c17a2e","Proc. Mat."],
    ["Midstream|Product Component","#16a34a","Comp."],["Downstream|Final Product","#f97316","Final"]];
  legItems.forEach(([k,col,lbl],i)=>{
    const lx=8+i*90;
    g.append("circle").attr("cx",lx).attr("cy",-8).attr("r",4).attr("fill",col).attr("opacity",0.8);
    g.append("text").attr("x",lx+7).attr("y",-4).attr("fill","rgba(255,255,255,.4)").attr("font-size",11).text(lbl);
  });
  }catch(err){
    const svg2=d3.select("#sr-scatter-svg");
    const W2=window.innerWidth||800, H2=(window.innerHeight||500)-52;
    svg2.selectAll("*").remove();
    svg2.attr("viewBox","0 0 "+W2+" "+H2);
    svg2.append("text").attr("x",W2/2).attr("y",H2/2).attr("text-anchor","middle")
      .attr("fill","#ef4444").attr("font-size",13).text("Error: "+err.message);
    console.error("drawShapRcaScatter error:",err);
  }
}


function drawTimeline(){
  const c0=c();
  const w=document.getElementById("pane-tl").clientWidth||400;
  const h=document.getElementById("pane-tl").clientHeight-66||160;
  const tl=c0.timeline;
  if(!tl||tl.length===0) return;

  const svg=d3.select("#tl-svg").attr("viewBox",`0 0 ${w} ${h}`);
  svg.selectAll("*").remove();

  const M={t:8,r:12,b:28,l:44};
  const iw=w-M.l-M.r, ih=h-M.t-M.b;
  const tlg=svg.append("g").attr("transform",`translate(${M.l},${M.t})`);

  const key=tlMode==="imports"?"imp":"exp";
  const years=[...new Set(tl.map(d=>+d.year))].sort();
  const xSc=d3.scaleLinear().domain(d3.extent(years)).range([0,iw]);
  const hasFilterTL=selStage!=="ALL"||selRole!=="ALL"||selProduct!=="ALL"||selCat!=="ALL";
  function srActiveTL(srKey){
    const[st,ro]=srKey.split("|");
    if(selProduct!=="ALL"){const pd=(c0.den_products||[]).find(p=>p.code===selProduct);return pd?pd.stage===st&&pd.role===ro:false;}
    if(selCat!=="ALL"){
      const hasCat=(c0.all_products||[]).some(p=>p.stage+"|"+p.role===srKey&&(p.cat||"Other")===selCat);
      if(!hasCat) return false;
    }
    if(selStage!=="ALL"&&selRole!=="ALL") return st===selStage&&ro===selRole;
    if(selRole!=="ALL") return ro===selRole;
    if(selStage!=="ALL") return st===selStage;
    return true;
  }

  let stackKeys, stackValFn, colorFn, activeKeyFn;
  if(colorMode==="cat"){
    const catMap=srToCatMap();
    stackKeys=[...new Set(tl.map(d=>catMap[d.sr]||"Other"))].sort();
    stackValFn=(yr,k)=>tl.filter(r=>+r.year===yr&&(catMap[r.sr]||"Other")===k).reduce((s,r)=>s+(r[key]||0),0);
    colorFn=k=>CAT_COLORS[k]||"#6b7280";
    activeKeyFn=k=>{if(selCat!=="ALL")return k===selCat;if(!hasFilterTL)return true;
      return tl.filter(r=>+r.year===years[0]&&(catMap[r.sr]||"Other")===k).map(r=>r.sr).some(sr=>srActiveTL(sr));};
  } else {
    stackKeys=[...new Set(tl.map(d=>d.sr))];
    stackValFn=(yr,k)=>(tl.find(r=>+r.year===yr&&r.sr===k)||{})[key]||0;
    colorFn=k=>SR_COLORS[k]||"#4b5563";
    activeKeyFn=k=>srActiveTL(k);
  }
  const stacked=d3.stack().keys(stackKeys).value((d,k)=>stackValFn(d,k))(years);
  const maxV=d3.max(stacked[stacked.length-1],d=>d[1])||1;
  const ySc=d3.scaleLinear().domain([0,maxV]).range([ih,0]);
  const area=d3.area().x(d=>xSc(d.data)).y0(d=>ySc(d[0])).y1(d=>ySc(d[1])).curve(d3.curveMonotoneX);

  stacked.forEach(stk=>{
    const alpha=hasFilterTL?(activeKeyFn(stk.key)?0.85:0.12):0.52;
    tlg.append("path").datum(stk).attr("fill",colorFn(stk.key)).attr("opacity",alpha).attr("d",area);
  });

  tlg.append("g").attr("transform",`translate(0,${ih})`).call(d3.axisBottom(xSc).ticks(6).tickFormat(d3.format("d")))
    .selectAll("text").attr("fill","rgba(255,255,255,.4)").attr("font-size",9);
  tlg.append("g").call(d3.axisLeft(ySc).ticks(4).tickFormat(d=>`${d.toFixed(0)}`))
    .selectAll("text").attr("fill","rgba(255,255,255,.4)").attr("font-size",9);

  // ── Bold product line when a specific product is selected ──────────────────
  if(selProduct!=="ALL"){
    const pvs=c0.product_views||[];
    const pv=pvs.find(p=>p.code===selProduct);
    if(pv&&pv.timeline&&pv.timeline.length>0){
      const lineKey=tlMode==="imports"?"imp":"exp";
      const prod=(c0.den_products||[]).find(p=>p.code===selProduct);
      const srKey=prod?`${prod.stage}|${prod.role}`:"";
      const lineCol=nodeColor(srKey,prod?.cat)||c0.color||"#3cb54a";
      const pvYears=new Map(pv.timeline.map(d=>[+d.year,+d[lineKey]||0]));
      const lineData=years.map(yr=>[yr,pvYears.get(yr)||0]);
      const boldLine=d3.line().x(d=>xSc(d[0])).y(d=>ySc(d[1])).curve(d3.curveMonotoneX);
      // Glow/halo
      tlg.append("path").datum(lineData).attr("fill","none")
        .attr("stroke",lineCol).attr("stroke-width",5).attr("opacity",0.25).attr("d",boldLine);
      // Main line
      tlg.append("path").datum(lineData).attr("fill","none")
        .attr("stroke",lineCol).attr("stroke-width",2.5).attr("opacity",0.95).attr("d",boldLine);
      // End dot
      const lastVal=lineData[lineData.length-1];
      if(lastVal[1]>0){
        tlg.append("circle").attr("cx",xSc(lastVal[0])).attr("cy",ySc(lastVal[1])).attr("r",4)
          .attr("fill",lineCol).attr("stroke","white").attr("stroke-width",1.5);
        tlg.append("text").attr("x",xSc(lastVal[0])+6).attr("y",ySc(lastVal[1])+3)
          .attr("fill",lineCol).attr("font-size",8).attr("font-weight",700)
          .text(prod?prod.name.substring(0,18):selProduct);
      }
    }
  }
}
function getPV(){const pvs=c().product_views||[];return pvs.find(p=>p.code==="ALL")||pvs[0]||{suppliers:[],buyers:[],timeline:[]}}
// Update focal legend label on load

  const el=document.getElementById("leg-focal"); if(el) el.textContent=c().name||c().focal;
});
function safeDraw(){
  requestAnimationFrame(()=>{
    const el=document.getElementById("pane-tl");
    if(el&&el.clientHeight<=0){
      const hdr=document.getElementById("hdr");
      el.style.height=(window.innerHeight-(hdr?hdr.offsetHeight:36))+"px";
    }
    drawTimeline();
  });
}
// D3 is embedded inline above — call safeDraw directly
document.addEventListener("DOMContentLoaded", function(){
  safeDraw();;
  window.addEventListener("resize", function(){ requestAnimationFrame(drawTimeline); });
  
});
