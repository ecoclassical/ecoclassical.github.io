function dlPNG(){
  const svg=document.querySelector("svg[id]");
  if(!svg)return;
  const bb=svg.getBoundingClientRect();
  const W=Math.round(bb.width)||800,H=Math.round(bb.height)||600;
  const xml=new XMLSerializer().serializeToString(svg);
  const blob=new Blob([xml],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    const cvs=document.createElement("canvas");
    cvs.width=W*2;cvs.height=H*2;
    const ctx=cvs.getContext("2d");
    ctx.scale(2,2);ctx.fillStyle="#0d1520";ctx.fillRect(0,0,W,H);
    ctx.drawImage(img,0,0,W,H);
    URL.revokeObjectURL(url);
    const a=document.createElement("a");
    a.download=(document.title||"panel").replace(/[^a-z0-9_-]/gi,"_")+".png";
    a.href=cvs.toDataURL("image/png");a.click();
  };
  img.src=url;
}
function dlCSV(){

  const blob=new Blob([rows.join("\n")],{type:"text/csv"});
  const a=document.createElement("a");

  a.href=URL.createObjectURL(blob);a.click();
}

function drawShapRcaScatter(){
  try{
  const c0=c();
  const gdp=c0.focal_gdp||0;
  // enrich data with pct_gdp; keep point if rca>0 OR shap>0
  const raw=(c0.shap_rca||[]).map(d=>({...d, pct:gdp>0?d.exp/(gdp*10):0}));
  const data=raw.filter(d=>d.rca>0||d.shap>0);
  const svg=d3.select("#sr-scatter-svg"); svg.selectAll("*").remove();
  const pane=document.getElementById("pane-sr-scatter");
  const W=(pane&&pane.clientWidth>0?pane.clientWidth:null)||window.innerWidth||600;
  const H=Math.max((pane&&pane.clientHeight>0?pane.clientHeight:window.innerHeight||436)-36,200);
  svg.attr("viewBox","0 0 "+W+" "+H);
  if(!data.length){
    svg.append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle")
      .attr("fill","rgba(255,255,255,.3)").attr("font-size",12).text("No SHAP-RCA data");
    return;
  }
  const M={t:24,r:28,b:48,l:58};
  const iw=W-M.l-M.r, ih=H-M.t-M.b;
  // bubble size follows tlMode
  const sizeFn=d=>tlMode==="imports"?(d.imp||0):tlMode==="balance"?Math.abs((d.exp||0)-(d.imp||0)):(d.exp||0);
  const maxSize=d3.max(data,sizeFn)||1;
  const rScale=d3.scaleSqrt().domain([0,maxSize]).range([8,40]);
  // ── X scale — mode-dependent ─────────────────────────────────────────────
  let xSc, xFn, xLabel, xRefVal, xRefLabel, xTipFn;
  if(scXMode==="pct"){
    const pctsPos=data.filter(d=>d.pct>0).map(d=>d.pct);
    const minPct=pctsPos.length?d3.min(pctsPos)*0.5:0.001;
    const maxPct=Math.max(d3.max(pctsPos)||0.01, 0.01);
    xSc=d3.scaleLog().domain([Math.max(minPct,1e-4), maxPct*1.2]).range([0,iw]).clamp(true);
    xFn=d=>xSc(Math.max(d.pct, Math.max(minPct,1e-4)));
    xLabel="Exports % of GDP (log scale)";
    // x divider at median non-zero pct
    xRefVal=d3.median(pctsPos)||maxPct*0.5;
    xRefLabel="median";
    xTipFn=d=>"Exp % GDP: <b>"+(d.pct>0?d.pct.toFixed(4)+"%%":"0")+"</b>";
  } else {
    const maxRCA=Math.max(d3.max(data,d=>d.rca)||2, 2);
    xSc=d3.scaleLog().domain([0.02,maxRCA]).range([0,iw]).clamp(true);
    xFn=d=>xSc(Math.max(d.rca,0.02));
    xLabel="Product RCA (log scale)";
    xRefVal=1; xRefLabel="RCA=1";
    xTipFn=d=>"RCA: <b>"+d.rca.toFixed(2)+"</b>";
  }
  // ── Y scale ──────────────────────────────────────────────────────────────
  const maxShap=d3.max(data,d=>d.shap)||1;
  const ySc=d3.scaleLinear().domain([0,maxShap*1.05]).range([ih,0]);
  const g=svg.append("g").attr("transform","translate("+M.l+","+M.t+")");
  const qLabels=[];
  // ── Classification grid ───────────────────────────────────────────────────
  // SHAP thresholds: % of total weight (High≥25%, Medium 10-25%, Low<10%)
  const totalShap=d3.sum(data,d=>d.shap)||1;
  const shapHiThr=totalShap*0.25, shapLoThr=totalShap*0.10;
  const yHi=ySc(Math.min(shapHiThr,maxShap)), yLo=ySc(Math.min(shapLoThr,maxShap));
  if(scXMode==="rca"){
    // X: Weak RCA<0.5 | Partial 0.5≤RCA<1 | Strength RCA≥1
    const xW=xSc(0.5), xP=xSc(1);
    [
      {x:0,  y:0,   w:xW,    h:yHi,    f:"rgba(220,38,38,0.12)",  lbl:"critical gap"},
      {x:xW, y:0,   w:xP-xW, h:yHi,    f:"rgba(249,115,22,0.11)", lbl:"build up"},
      {x:xP, y:0,   w:iw-xP, h:yHi,    f:"rgba(34,197,94,0.12)",  lbl:"leverage"},
      {x:0,  y:yHi, w:xW,    h:yLo-yHi,f:"rgba(220,38,38,0.08)",  lbl:"gap"},
      {x:xW, y:yHi, w:xP-xW, h:yLo-yHi,f:"rgba(249,115,22,0.09)", lbl:"build up"},
      {x:xP, y:yHi, w:iw-xP, h:yLo-yHi,f:"rgba(234,179,8,0.11)",  lbl:"mature strength"},
      {x:0,  y:yLo, w:xW,    h:ih-yLo, f:"rgba(107,114,128,0.04)", lbl:"not priority"},
      {x:xW, y:yLo, w:xP-xW, h:ih-yLo, f:"rgba(107,114,128,0.04)", lbl:"not priority"},
      {x:xP, y:yLo, w:iw-xP, h:ih-yLo, f:"rgba(59,130,246,0.10)",  lbl:"bonus strength"}
    ].forEach(q=>{
      if(q.w<=0||q.h<=0) return;
      g.append("rect").attr("x",q.x).attr("y",q.y).attr("width",q.w).attr("height",q.h).attr("fill",q.f);
      qLabels.push(q);
    });
    [[xW,"RCA=0.5"],[xP,"RCA=1"]].forEach(([x,lbl])=>{
      g.append("line").attr("x1",x).attr("y1",0).attr("x2",x).attr("y2",ih)
        .attr("stroke","rgba(255,255,255,.2)").attr("stroke-dasharray","4,3").attr("stroke-width",1);
      g.append("text").attr("x",x+4).attr("y",10).attr("fill","rgba(255,255,255,.28)").attr("font-size",11).text(lbl);
    });
    [yHi,yLo].forEach((y,i)=>{
      g.append("line").attr("x1",0).attr("y1",y).attr("x2",iw).attr("y2",y)
        .attr("stroke","rgba(255,255,255,.13)").attr("stroke-dasharray","3,4").attr("stroke-width",1);
      g.append("text").attr("x",4).attr("y",y-3).attr("fill","rgba(255,255,255,.22)").attr("font-size",11)
        .text(i===0?"SHAP ≥25%":"SHAP ≥10%");
    });
  } else {
    // % GDP mode: 4-quadrant (median split)
    const xDiv=xSc(xRefVal), yMed=(yHi+yLo)/2;
    [{x:0,y:0,w:xDiv,h:yMed,f:"rgba(239,68,68,0.09)",lbl:"LOW EXPORT"},
     {x:xDiv,y:0,w:iw-xDiv,h:yMed,f:"rgba(34,197,94,0.09)",lbl:"HIGH EXPORT"},
     {x:0,y:yMed,w:xDiv,h:ih-yMed,f:"rgba(107,114,128,0.04)",lbl:"NOT PRIORITY"},
     {x:xDiv,y:yMed,w:iw-xDiv,h:ih-yMed,f:"rgba(59,130,246,0.07)",lbl:"BONUS"}
    ].forEach(q=>{
      if(q.w<=0||q.h<=0) return;
      g.append("rect").attr("x",q.x).attr("y",q.y).attr("width",q.w).attr("height",q.h).attr("fill",q.f);
      qLabels.push(q);
    });
    g.append("line").attr("x1",0).attr("y1",yMed).attr("x2",iw).attr("y2",yMed)
      .attr("stroke","rgba(255,255,255,.12)").attr("stroke-dasharray","3,4").attr("stroke-width",1);
    g.append("line").attr("x1",xDiv).attr("y1",0).attr("x2",xDiv).attr("y2",ih)
      .attr("stroke","rgba(255,255,255,.22)").attr("stroke-dasharray","4,3").attr("stroke-width",1);
    g.append("text").attr("x",xDiv+4).attr("y",10).attr("fill","rgba(255,255,255,.28)").attr("font-size",10).text(xRefLabel);
  }
  // ── Axes ─────────────────────────────────────────────────────────────────
  g.append("g").attr("transform","translate(0,"+ih+")")
    .call(d3.axisBottom(xSc).ticks(6,"~g").tickSize(3))
    .call(gg=>gg.select(".domain").attr("stroke","rgba(255,255,255,.2)"))
    .call(gg=>gg.selectAll("text").attr("fill","rgba(255,255,255,.45)").attr("font-size",12));
  g.append("g").call(d3.axisLeft(ySc).ticks(5).tickSize(3))
    .call(gg=>gg.select(".domain").attr("stroke","rgba(255,255,255,.2)"))
    .call(gg=>gg.selectAll("text").attr("fill","rgba(255,255,255,.45)").attr("font-size",12));
  g.append("text").attr("x",iw/2).attr("y",ih+38).attr("text-anchor","middle")
    .attr("fill","rgba(255,255,255,.4)").attr("font-size",14).text(xLabel);
  g.append("text").attr("transform","rotate(-90)").attr("x",-ih/2).attr("y",-44)
    .attr("text-anchor","middle").attr("fill","rgba(255,255,255,.4)").attr("font-size",14)
    .text("SHAP Importance (mean |z|)");
  // ── Bubbles ──────────────────────────────────────────────────────────────
  [...data].sort((a,b)=>sizeFn(b)-sizeFn(a)).forEach(d=>{
    const col=SR_COLORS[d.stage+"|"+d.role]||"#9ca3af";
    const r=Math.max(rScale(sizeFn(d)),6);
    const x=xFn(d), y=ySc(d.shap);
    g.append("circle").attr("cx",x).attr("cy",y).attr("r",r)
      .attr("fill",col).attr("fill-opacity",0.72)
      .attr("stroke",col).attr("stroke-width",0.5).attr("stroke-opacity",0.9)
      .on("mousemove",ev=>showTip(
        "<b>"+d.name+"</b><br>HS "+d.code+"<br>"+d.stage+" · "+d.role+
        "<br>"+xTipFn(d)+" | SHAP: <b>"+d.shap.toFixed(3)+"</b>"+
        "<br>Exp: "+fmtV(d.exp)+" | Imp: "+fmtV(d.imp),ev))
      .on("mouseleave",hideTip);
  });
  // ── Quadrant labels (rendered above bubbles) ─────────────────────────────
  qLabels.forEach(q=>{
    g.append("text").attr("x",q.x+q.w/2).attr("y",q.y+q.h/2).attr("text-anchor","middle")
      .attr("fill","rgba(255,255,255,.4)").attr("font-size",14).attr("font-weight",700).text(q.lbl);
  });
  // Legend
  const legItems=[["Upstream|Raw Material","#b45309","Raw Mat."],["Upstream|Processed Material","#c17a2e","Proc. Mat."],
    ["Midstream|Product Component","#16a34a","Comp."],["Downstream|Final Product","#f97316","Final"]];
  legItems.forEach(([k,col,lbl],i)=>{
    const lx=8+i*90;
    g.append("circle").attr("cx",lx).attr("cy",-8).attr("r",4).attr("fill",col).attr("opacity",0.8);
    g.append("text").attr("x",lx+7).attr("y",-4).attr("fill","rgba(255,255,255,.4)").attr("font-size",11).text(lbl);
  });
  }catch(err){
    const svg2=d3.select("#sr-scatter-svg");
    const W2=window.innerWidth||800, H2=(window.innerHeight||500)-52;

    svg2.attr("viewBox","0 0 "+W2+" "+H2);
    svg2.append("text").attr("x",W2/2).attr("y",H2/2).attr("text-anchor","middle")
      .attr("fill","#ef4444").attr("font-size",13).text("Error: "+err.message);
    console.error("drawShapRcaScatter error:",err);
  }
}

    return;
  }
  const CNAMES={CHN:"China",USA:"USA",DEU:"Germany",JPN:"Japan",KOR:"S.Korea",IND:"India",VNM:"Vietnam",MYS:"Malaysia",FRA:"France",GBR:"UK",ITA:"Italy",ESP:"Spain",AUS:"Australia",CAN:"Canada",NLD:"Neth.",BRA:"Brazil",TWN:"Taiwan",SGP:"Singapore",THA:"Thailand",IDN:"Indonesia",NOR:"Norway",POL:"Poland",SWE:"Sweden",ZAF:"S.Africa",ARE:"UAE",BHR:"Bahrain",AUT:"Austria",KHM:"Cambodia",MEX:"Mexico",HUN:"Hungary",TUR:"Turkey",HKG:"HK",S19:"Other"};
  const cn=iso=>CNAMES[iso]||iso;
  // 5-column layout: lane0 | lane1 | lanes2+3(stacked) | lanes5+4(stacked) | lane6
  const laneCol={0:0,1:1,2:2,3:2,4:3,5:3,6:4};
  const COL_X=[0.062,0.238,0.46,0.695,0.932];
  const LC={0:"#b45309",1:"#22c55e",2:"#65a30d",3:"#16a34a",4:"#4ade80",5:"#6b7280",6:"#f97316"};
  const P={t:18,b:6,l:4,r:4};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  // Dashed vertical boundary lines between sections (UPSTREAM|MIDSTREAM and MIDSTREAM|DOWNSTREAM)
  [0.150,0.578].forEach(xf=>{
    svg.append("line")
      .attr("x1",P.l+xf*iw).attr("x2",P.l+xf*iw)
      .attr("y1",P.t).attr("y2",P.t+ih)
      .attr("stroke","rgba(255,255,255,.12)").attr("stroke-width",0.8)
      .attr("stroke-dasharray","4,4");
  });
  // Column role labels
  [[0,"Raw Material",LC[0]],[1,"Proc. Material",LC[1]],
   [2,"Proc. Equip. / Prod. Comp.",LC[2]],
   [3,"Proc. Equip. / Prod. Comp.",LC[5]],
   [4,"Final Product",LC[6]]].forEach(([ci,lbl,col])=>{
    svg.append("text").attr("x",P.l+COL_X[ci]*iw).attr("y",12).attr("text-anchor","middle")
      .attr("fill",col).attr("font-size",5).attr("opacity",0.65).text(lbl);
  });
  // Build node weight maps per lane
  const laneM={};
  flows.forEach(f=>{
    [[f.fl,+f.fl7],[f.tl,+f.tl7]].forEach(([id,lane])=>{
      if(!laneM[lane]) laneM[lane]=new Map();
      laneM[lane].set(id,(laneM[lane].get(id)||0)+(+f.w||0));
    });
  });
  // Ensure focal country (Brazil) appears in every lane, even if not in top flows
  const braLabel=c0.focal;
  [0,1,2,3,4,5,6].forEach(lane=>{
    if(!laneM[lane]) laneM[lane]=new Map();
    const hasBra=[...laneM[lane].keys()].some(k=>k.split(" | ")[0]===braLabel);
    if(!hasBra) laneM[lane].set(braLabel,d3.min([...laneM[lane].values()])||1);
  });
  // Log-proportional node height layout within a vertical band
  const NW=10, GAP_NODE=2, GAP_ROLE=10;
  const nPos=new Map();
  function layoutLane(lane,yStart,yEnd){
    const nm=laneM[lane]; if(!nm||!nm.size) return;
    const ci=laneCol[lane];
    const sorted=[...nm.entries()].sort((a,b)=>b[1]-a[1]);
    const n=sorted.length;
    const logWts=sorted.map(([,wt])=>Math.log1p(wt));
    const sumLog=logWts.reduce((s,v)=>s+v,0)||1;
    const availH=yEnd-yStart-GAP_NODE;
    let y=yStart+GAP_NODE/2;
    sorted.forEach(([id,wt],i)=>{
      const h=Math.max(3,(availH-n*GAP_NODE)*(logWts[i]/sumLog));
      nPos.set(id,{x:P.l+COL_X[ci]*iw-NW/2,y,h,w:NW,lane,ci,name:cn(id.split(" | ")[0]),wt});
      y+=h+GAP_NODE;
    });
  }
  const yT=P.t+4, yB=P.t+4+ih-8, yMid=(yT+yB)/2;
  layoutLane(0,yT,yB);
  layoutLane(1,yT,yB);
  layoutLane(2,yT,yMid-GAP_ROLE/2);
  layoutLane(3,yMid+GAP_ROLE/2,yB);
  layoutLane(5,yT,yMid-GAP_ROLE/2);
  layoutLane(4,yMid+GAP_ROLE/2,yB);
  layoutLane(6,yT,yB);
  // Role divider tick in shared columns (col 2 and col 3)
  [2,3].forEach(ci=>{
    const x=P.l+COL_X[ci]*iw;
    svg.append("line").attr("x1",x-NW).attr("x2",x+NW).attr("y1",yMid).attr("y2",yMid)
      .attr("stroke","rgba(255,255,255,0.12)").attr("stroke-width",0.5);
  });
  // Focus state: default to focal country (Brazil), click node to switch
  if(sankeyFocus===null) sankeyFocus=c0.focal;
  const foc=sankeyFocus;
  // Click on SVG background resets to focal country
  svg.on("click",()=>{ sankeyFocus=c0.focal; drawAtlasSankey(); });
  // Links — log-scaled widths, dimmed unless involving focused country
  const wVals=flows.map(f=>+f.w).filter(v=>v>0);
  const minW=d3.min(wVals)||1, maxW=d3.max(wVals)||1;
  const swSc=d3.scaleLog().domain([minW,maxW]).range([0.3,3.5]).clamp(true);
  flows.forEach(f=>{
    const src=nPos.get(f.fl),tgt=nPos.get(f.tl); if(!src||!tgt) return;
    const active=f.fc===foc||f.tc===foc;
    const col=LC[+f.fl7]||"#9ca3af";
    const x1=src.x+src.w,y1=src.y+src.h/2,x2=tgt.x,y2=tgt.y+tgt.h/2,cx=(x1+x2)/2;
    svg.append("path").attr("d",`M${x1},${y1}C${cx},${y1} ${cx},${y2} ${x2},${y2}`)
      .attr("fill","none").attr("stroke",col).attr("stroke-width",active?swSc(+f.w||minW)*1.4:swSc(+f.w||minW))
      .attr("opacity",active?0.75:0.25)
      .on("mousemove",ev=>showTip(`${cn(f.fc)} → ${cn(f.tc)}<br><b>${fmtV(+f.w)}</b>`,ev))
      .on("mouseleave",hideTip);
  });
  // Nodes + labels — highlight focused country, dim others
  nPos.forEach((n,id)=>{
    const iso=id.split(" | ")[0];
    const active=iso===foc;
    const col=LC[n.lane]||"#9ca3af";
    svg.append("rect").attr("x",n.x).attr("y",n.y).attr("width",n.w).attr("height",n.h)
      .attr("fill",col).attr("rx",1.5).attr("opacity",active?0.96:0.45)
      .style("cursor","pointer")
      .on("click",(ev)=>{ ev.stopPropagation(); sankeyFocus=iso; drawAtlasSankey(); })
      .on("mousemove",ev=>showTip(`<b>${n.name}</b><br>${fmtV(n.wt)}`,ev))
      .on("mouseleave",hideTip);
    // Active node (Brazil default): bold white border
    if(active) svg.append("rect").attr("x",n.x-1).attr("y",n.y-1).attr("width",n.w+2).attr("height",n.h+2)
      .attr("fill","none").attr("stroke","#fff").attr("stroke-width",1.5).attr("rx",2).attr("opacity",0.9);
    if(n.h>=6){
      const iso3=id.split(" | ")[0];
      svg.append("text").attr("x",n.x+n.w/2).attr("y",n.y+n.h/2+1.8).attr("text-anchor","middle")
        .attr("font-size",4.5).attr("fill",active?"#fff":"rgba(255,255,255,.8)")
        .attr("font-weight",active?"700":"400")
        .text(iso3);
    }
  });
}
function getPV(){const pvs=c().product_views||[];return pvs.find(p=>p.code==="ALL")||pvs[0]||{suppliers:[],buyers:[],timeline:[]}}
// Update focal legend label on load
document.addEventListener("DOMContentLoaded",function(){
  const el=document.getElementById("leg-focal"); if(el) el.textContent=c().name||c().focal;
});
function safeDraw(){
  requestAnimationFrame(()=>{
    const el=document.getElementById("pane-sankey");
    if(el&&el.clientHeight<=0){
      const hdr=document.getElementById("hdr");
      el.style.height=(window.innerHeight-(hdr?hdr.offsetHeight:36))+"px";
    }
    drawAtlasSankey();
  });
}
// D3 is embedded inline above — call safeDraw directly
document.addEventListener("DOMContentLoaded", function(){
  safeDraw();;
  window.addEventListener("resize", function(){ requestAnimationFrame(drawAtlasSankey); });
  
});
</script></body></html>
