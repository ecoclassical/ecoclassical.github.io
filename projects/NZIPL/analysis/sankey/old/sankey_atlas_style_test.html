","country":"HUN","lane":6,"name":"HUN"},{"id":"VNM | Final Product · Final Product","country":"VNM","lane":6,"name":"Vietnam"},{"id":"CAN | Final Product · Final Product","country":"CAN","lane":6,"name":"Canada"},{"id":"IND | Final Product · Final Product","country":"IND","lane":6,"name":"India"},{"id":"HKG | Product Component · Downstream","country":"HKG","lane":4,"name":"HKG"},{"id":"FRA | Final Product · Final Product","country":"FRA","lane":6,"name":"France"},{"id":"DEU | Final Product · Final Product","country":"DEU","lane":6,"name":"Germany"},{"id":"POL | Final Product · Final Product","country":"POL","lane":6,"name":"Poland"},{"id":"TUR | Final Product · Final Product","country":"TUR","lane":6,"name":"TUR"},{"id":"S19 | Product Component · Downstream","country":"S19","lane":4,"name":"S19"},{"id":"SGP | Product Component · Downstream","country":"SGP","lane":4,"name":"Singapore"},{"id":"DEU | Product Component · Downstream","country":"DEU","lane":4,"name":"Germany"},{"id":"USA | Product Component · Downstream","country":"USA","lane":4,"name":"United States"},{"id":"THA | Final Product · Final Product","country":"THA","lane":6,"name":"Thailand"},{"id":"KOR | Final Product · Final Product","country":"KOR","lane":6,"name":"South Korea"},{"id":"KHM | Final Product · Final Product","country":"KHM","lane":6,"name":"KHM"},{"id":"USA | Processed Material · Midstream","country":"USA","lane":1,"name":"United States"},{"id":"KOR | Processed Material · Midstream","country":"KOR","lane":1,"name":"South Korea"},{"id":"CHL | Final Product · Final Product","country":"CHL","lane":6,"name":"CHL"},{"id":"HKG | Processed Material · Midstream","country":"HKG","lane":1,"name":"HKG"},{"id":"BRA | Process Equipment · Downstream","country":"BRA","lane":5,"name":"Brazil"},{"id":"CHN | Processed Material · Midstream","country":"CHN","lane":1,"name":"China"},{"id":"JPN | Processed Material · Midstream","country":"JPN","lane":1,"name":"Japan"},{"id":"DEU | Processed Material · Midstream","country":"DEU","lane":1,"name":"Germany"},{"id":"SGP | Processed Material · Midstream","country":"SGP","lane":1,"name":"Singapore"},{"id":"GBR | Processed Material · Midstream","country":"GBR","lane":1,"name":"United Kingdom"},{"id":"S19 | Processed Material · Midstream","country":"S19","lane":1,"name":"S19"},{"id":"IDN | Process Equipment · Downstream","country":"IDN","lane":5,"name":"Indonesia"},{"id":"THA | Process Equipment · Downstream","country":"THA","lane":5,"name":"Thailand"},{"id":"RUS | Process Equipment · Downstream","country":"RUS","lane":5,"name":"RUS"},{"id":"IND | Process Equipment · Downstream","country":"IND","lane":5,"name":"India"},{"id":"TUR | Process Equipment · Downstream","country":"TUR","lane":5,"name":"TUR"},{"id":"AUS | Process Equipment · Downstream","country":"AUS","lane":5,"name":"Australia"},{"id":"FRA | Process Equipment · Downstream","country":"FRA","lane":5,"name":"France"},{"id":"SGP | Process Equipment · Downstream","country":"SGP","lane":5,"name":"Singapore"},{"id":"POL | Process Equipment · Downstream","country":"POL","lane":5,"name":"Poland"}];
const SR={0:"#b45309",1:"#22c55e",2:"#65a30d",3:"#16a34a",4:"#4ade80",5:"#6b7280",6:"#f97316"};
const X_COLS=[0.045,0.215,0.375,0.535,0.675,0.815,0.955];
const LANE_LBL=["Raw Material","Processed Mat.","Process Equip.","Product Comp.","Product Comp.","Process Equip.","Final Product"];
const STAGES=[["UPSTREAM","#b45309",[0]],["MIDSTREAM","#22c55e",[1,2,3]],["DOWNSTREAM","#4ade80",[4,5]],["FINAL","#f97316",[6]]];
const tip=document.getElementById("tip");
const fmtV=v=>v>=1e9?"$"+(v/1e9).toFixed(1)+"B":v>=1e6?"$"+(v/1e6).toFixed(1)+"M":"$"+(v/1e3).toFixed(0)+"K";
function showTip(h,ev){tip.style.opacity=1;tip.innerHTML=h;tip.style.left=(ev.clientX+14)+"px";tip.style.top=(ev.clientY-8)+"px";}
function hideTip(){tip.style.opacity=0;}
const el=document.getElementById("chart");
const W=el.clientWidth||1200,H=el.clientHeight||580;
const svg=d3.select("#chart").attr("viewBox","0 0 "+W+" "+H);
svg.append("rect").attr("width",W).attr("height",H).attr("fill","#060d08");
const P={t:50,b:16,l:8,r:8};
const iw=W-P.l-P.r,ih=H-P.t-P.b;
// Stage column bands
[[0,0.14,"#b45309"],[0.145,0.61,"#073309"],[0.615,0.88,"#0369a1"],[0.885,1.0,"#f97316"]].forEach(([x1,x2,c])=>{
  svg.append("rect").attr("x",P.l+x1*iw).attr("y",P.t-24).attr("width",(x2-x1)*iw).attr("height",ih+24)
    .attr("fill",c).attr("opacity",0.045);
});
// Stage headers
STAGES.forEach(([lbl,col,lanes])=>{
  const cx=d3.mean(lanes.map(i=>X_COLS[i]))*iw+P.l;
  svg.append("text").attr("x",cx).attr("y",16).attr("text-anchor","middle")
    .attr("fill",col).attr("font-size",8.5).attr("font-weight","700").attr("letter-spacing","0.1em").text(lbl);
});
// Lane sub-labels
X_COLS.forEach((x,i)=>{
  svg.append("text").attr("x",P.l+x*iw).attr("y",30).attr("text-anchor","middle")
    .attr("fill",SR[i]).attr("font-size",6.5).attr("opacity",0.7).text(LANE_LBL[i]);
});
// Build node positions
const laneMap={};
FLOWS.forEach(f=>{
  [f.from_lane,f.to_lane].forEach((l,idx)=>{
    const id=idx===0?f.from_label:f.to_label;
    if(!laneMap[l]) laneMap[l]=new Map();
    laneMap[l].set(id,(laneMap[l].get(id)||0)+f.weight);
  });
});
const NW=18;
const nodePos=new Map();
Object.entries(laneMap).forEach(([lane,nm])=>{
  const l=+lane;
  const sorted=[...nm.entries()].sort((a,b)=>b[1]-a[1]);
  const n=sorted.length;
  const availH=ih-8;
  const minH=3,maxH=28;
  const hPerNode=Math.max(minH,Math.min(maxH,(availH-n*2)/n));
  const totalUsed=n*(hPerNode+2);
  let y=P.t+8+(availH-totalUsed)/2;
  sorted.forEach(([id,wt])=>{
    const x=P.l+X_COLS[l]*iw-NW/2;
    const nd=NODES_RAW.find(n=>n.id===id)||{};
    nodePos.set(id,{x,y,h:hPerNode,w:NW,l,name:nd.name||id.split(" | ")[0],wt});
    y+=hPerNode+2;
  });
});
// Links
FLOWS.forEach(f=>{
  const s=nodePos.get(f.from_label),t=nodePos.get(f.to_label);
  if(!s||!t) return;
  const col=SR[f.from_lane]||"#9ca3af";
  const x1=s.x+s.w,y1=s.y+s.h/2,x2=t.x,y2=t.y+t.h/2,cx=(x1+x2)/2;
  const sw=Math.max(0.4,Math.log(f.weight/1000+1)*0.5);
  svg.append("path").attr("d","M"+x1+","+y1+"C"+cx+","+y1+" "+cx+","+y2+" "+x2+","+y2)
    .attr("fill","none").attr("stroke",col).attr("stroke-width",sw).attr("opacity",0.25)
    .on("mousemove",ev=>showTip((nodePos.get(f.from_label)||{}).name+" → "+(nodePos.get(f.to_label)||{}).name+"<br><b>"+fmtV(f.weight)+"</b>",ev))
    .on("mouseleave",hideTip);
});
// Nodes
nodePos.forEach((n,id)=>{
  const col=SR[n.l]||"#9ca3af";
  const g=svg.append("g");
  g.append("rect").attr("x",n.x).attr("y",n.y).attr("width",n.w).attr("height",n.h)
    .attr("fill",col).attr("rx",2).attr("opacity",0.88)
    .on("mousemove",ev=>showTip("<b>"+n.name+"</b><br>"+fmtV(n.wt),ev))
    .on("mouseleave",hideTip);
  if(n.h>=7){
    const tx=n.l<=3?n.x+n.w+4:n.x-4;
    const anc=n.l<=3?"start":"end";
    g.append("text").attr("x",tx).attr("y",n.y+n.h/2+3)
      .attr("text-anchor",anc).attr("font-size",7.5).attr("fill","rgba(255,255,255,.72)").text(n.name);
  }
});
