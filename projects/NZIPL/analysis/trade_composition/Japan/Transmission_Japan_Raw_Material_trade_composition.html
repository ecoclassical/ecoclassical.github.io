function drawTreemap(){
  const W=document.getElementById("pane-tm").clientWidth||400;
  const H=document.getElementById("pane-tm").clientHeight-36||200;
  const svg=d3.select("#tm-svg").attr("viewBox",`0 0 ${W} ${H}`);
  svg.selectAll("*").remove();

  const isImp=tlMode==="imports",isBal=tlMode==="balance";
  const dir=isImp?"Imports":isBal?"Balance":"Exports";
  document.getElementById("tm-title").textContent="Trade Composition · "+dir;
  const tmy2=document.getElementById("tm-year"); if(tmy2) tmy2.textContent=`${dir} ${c().ref_year}`;

  // Value function follows tlMode
  const valFn=p=>isImp?(p.imp||0):isBal?Math.abs((p.exp||0)-(p.imp||0)):(p.exp||0);

  // Show ALL products with opacity highlighting (no filtering)
  const show=(c().all_products||[]).filter(p=>p.exp+p.imp>0);
  if(!show.length){ svg.append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle").attr("fill","rgba(255,255,255,.3)").attr("font-size",12).text("No data"); return; }

  const hasFilter=selStage!=="ALL"||selRole!=="ALL"||selProduct!=="ALL";
  function tmSelected(p){
    if(!hasFilter) return true;
    if(selProduct!=="ALL") return p.code===selProduct;
    if(selStage!=="ALL"&&selRole!=="ALL") return p.stage===selStage&&p.role===selRole;
    if(selRole!=="ALL") return p.role===selRole;
    if(selStage!=="ALL") return p.stage===selStage;
    return true;
  }

  const total=d3.sum(show,valFn)||1;

  // SR group background overlays
  const byGroup=d3.group(show,d=>{let sr=d.stage+"|"+d.role;if(sr==="Upstream|Processed Material")sr="Midstream|Processed Material";return sr;});
  const rootGrp=d3.hierarchy({name:"root",children:[...byGroup.entries()].map(([sr,prods])=>({name:sr,children:prods}))}).sum(p=>Math.max(valFn(p),1)).sort((a,b)=>b.value-a.value);
  d3.treemap().size([W,H]).paddingOuter(1).paddingInner(0.5).tile(d3.treemapSquarify.ratio(1.6))(rootGrp);
  rootGrp.children.forEach(grp=>{
    const gx=grp.x0,gy=grp.y0,gw=grp.x1-grp.x0,gh=grp.y1-grp.y0;
    const col=SR_COLORS[grp.data.name]||"#9ca3af";
    const role=grp.data.name.split("|")[1]||grp.data.name;
    svg.append("rect").attr("x",gx).attr("y",gy).attr("width",gw).attr("height",gh).attr("fill",col).attr("opacity",0.08);
    const ghostSz=Math.min(gw/Math.max(role.length,4)*1.8,gh*0.46,40);
    if(ghostSz>9) svg.append("text").attr("x",gx+gw/2).attr("y",gy+gh/2).attr("dominant-baseline","middle").attr("text-anchor","middle").attr("font-size",ghostSz).attr("font-weight","900").attr("fill","rgba(0,0,0,.2)").attr("pointer-events","none").text(role);
  });
  // Leaf cells
  rootGrp.leaves().forEach(d=>{
    const col=SR_COLORS[d.parent.data.name]||"#9ca3af";
    const w=d.x1-d.x0,h=d.y1-d.y0;
    const v=valFn(d.data),share=v/total;
    const isSel=tmSelected(d.data);
    const op=!hasFilter?0.82:isSel?0.92:0.18;
    if(isSel&&hasFilter){svg.append("rect").attr("x",d.x0-1).attr("y",d.y0-1).attr("width",w+2).attr("height",h+2).attr("fill","none").attr("stroke","rgba(255,255,255,.5)").attr("stroke-width",1.5).attr("rx",1).attr("pointer-events","none");}
    svg.append("rect").attr("x",d.x0).attr("y",d.y0).attr("width",w).attr("height",h)
      .attr("fill",col).attr("opacity",op)
      .attr("stroke","#0d1520").attr("stroke-width",0.4)
      .on("mousemove",ev=>showTip(`<b>${d.data.name}</b><br>HS ${d.data.code}<br>${d.parent.data.name}<br>${dir}: ${fmtV(v)} (${(share*100).toFixed(1)}%)`,ev))
      .on("mouseleave",hideTip);
    if(w>28&&h>14){
      const textAlpha=isSel||!hasFilter?"rgba(255,255,255,.95)":"rgba(255,255,255,.45)";
      const subAlpha=isSel||!hasFilter?"rgba(255,255,255,.65)":"rgba(255,255,255,.3)";
      const fs=Math.min(15,Math.max(8,Math.sqrt(w*h)/9));
      const nfs=Math.max(6.5,fs*0.80);
      const maxCh=Math.max(5,Math.floor(w/(fs*0.62)));
      const nm=d.data.name.length>maxCh?d.data.name.substring(0,maxCh-2)+"...":d.data.name;
      svg.append("text").attr("x",d.x0+4).attr("y",d.y0+fs+2).attr("font-size",fs).attr("font-weight","700").attr("fill",textAlpha).attr("pointer-events","none").text(nm);
      let ny=d.y0+fs*2+3;
      if(h>fs*2.8&&w>36){svg.append("text").attr("x",d.x0+4).attr("y",ny).attr("font-size",nfs).attr("fill",subAlpha).attr("pointer-events","none").text("HS "+d.data.code);ny+=nfs+3;}
      if(h>ny-d.y0+4&&share>=0.01){svg.append("text").attr("x",d.x0+4).attr("y",ny).attr("font-size",nfs).attr("fill",subAlpha).attr("pointer-events","none").text((share*100).toFixed(1)+"%");}
    }
  });
}
document.addEventListener("DOMContentLoaded",()=>{ drawTreemap(); });
window.addEventListener("resize",()=>{ drawTreemap(); });

</script>
