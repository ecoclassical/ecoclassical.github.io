function showTip(html,ev){const vw=window.innerWidth;const tx=ev.clientX+14;const offset=tx+260>vw?ev.clientX-270:tx;tip.style("opacity","1").html(html).style("left",offset+"px").style("top",(ev.clientY-10)+"px")}

function drawFirms(){
  if(!worldTopo) return;
  const c0=c(), allFirms=c0.firms||[];
  const svg=d3.select("#map-svg");
  const W=document.getElementById("pane-map").clientWidth||800;
  const H=document.getElementById("pane-map").clientHeight-80||350;
  svg.selectAll("*").remove();
  svg.attr("viewBox",`0 0 ${W} ${H}`);

  // Swap overlays
  document.getElementById("map-overlay").style.display="none";
  document.getElementById("firm-overlay").style.display="";
  document.getElementById("trade-legend").style.display="none";
  document.getElementById("firm-legend").style.display="";

  // Determine which stage|role the selected product belongs to (for white-ring highlight)
  const selProd=c0.all_products||[];
  const prodMeta=selProduct!=="ALL"?selProd.find(p=>p.code===selProduct):null;
  const prodSR=prodMeta?`${prodMeta.stage}|${prodMeta.role}`:null;

  // Filter logic: which firms match the drum selection
  const hasFilter=selStage!=="ALL"||selRole!=="ALL"||selProduct!=="ALL";
  const isActive=f=>{
    if(selStage!=="ALL"&&f.stage!==selStage) return false;
    if(selRole!=="ALL"&&f.role!==selRole) return false;
    return true;
  };
  const isProdMatch=f=>prodSR&&`${f.stage}|${f.role}`===prodSR;

  // Country-centered projection
  const feat=topojson.feature(worldTopo, worldTopo.objects.countries).features;
  const numId=ISO3N[c0.focal];
  const focalFeat=feat.find(f=>+f.id===numId);
  const pad=28;
  const proj=d3.geoNaturalEarth1();
  if(focalFeat) proj.fitExtent([[pad,pad],[W-pad,H-pad]], focalFeat);
  const path=d3.geoPath().projection(proj);

  // Countries: focal very dark + semi-transparent, neighbours lighter
  const g=svg.append("g");
  g.selectAll("path").data(feat).join("path")
    .attr("d",path)
    .attr("fill",d=>{
      const id=String(d.id).padStart(3,"0");
      const iso=Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(id));
      return iso===c0.focal?"#071a0c":"#141e2a";
    })
    .attr("opacity",d=>{
      const id=String(d.id).padStart(3,"0");
      const iso=Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(id));
      return iso===c0.focal?0.55:0.35;
    })
    .attr("stroke","#0d1520").attr("stroke-width",0.3);

  if(focalFeat) g.append("path").attr("d",path(focalFeat))
    .attr("fill","none").attr("stroke","#3cb54a").attr("stroke-width",1.5)
    .attr("pointer-events","none");

  if(!allFirms.length){
    svg.append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle")
      .attr("fill","rgba(255,255,255,.3)").attr("font-size",12).text("No S&P firm data for this tech");
  } else {
    const activeFirms=hasFilter?allFirms.filter(isActive):allFirms;
    const maxN=d3.max(allFirms,f=>f.n)||1;
    const rScale=d3.scaleSqrt().domain([0,maxN]).range([3,16]);
    const seenSR=new Set();

    [...allFirms].sort((a,b)=>b.n-a.n).forEach(f=>{
      const px=proj([+f.lon,+f.lat]);
      if(!px) return;
      const [x,y]=px;
      if(x<-10||x>W+10||y<-10||y>H+10) return;
      const srKey=f.stage+"|"+f.role;
      const col=SR_COLORS[srKey]||"#9ca3af";
      const active=!hasFilter||isActive(f);
      const prodHit=isProdMatch(f);
      if(active) seenSR.add(srKey);
      const op=!hasFilter?0.8:active?(prodHit?1:0.75):0.12;
      const r=rScale(f.n);
      g.append("circle").attr("cx",x).attr("cy",y).attr("r",r)
        .attr("fill",col+(active?"cc":"30")).attr("stroke",active?col:"rgba(255,255,255,.1)")
        .attr("stroke-width",active?0.8:0.3).attr("opacity",op)
        .attr("cursor","pointer")
        .on("mousemove",ev=>showTip(`<b>${f.city}</b><br>${f.stage} · ${f.role}<br><b>${f.n}</b> firms`,ev))
        .on("mouseleave",hideTip);
      if(prodHit){
        g.append("circle").attr("cx",x).attr("cy",y).attr("r",r+4)
          .attr("fill","none").attr("stroke","#fff").attr("stroke-width",2).attr("opacity",1)
          .attr("pointer-events","none");
      }
    });

    // Legend: only show SR keys present in active firms
    const legEl=document.getElementById("firm-legend");
    legEl.innerHTML=SR_ORDER.filter(k=>seenSR.has(k)).map(k=>{
      const col=SR_COLORS[k]||"#9ca3af";
      return `<div class="leg-item"><div class="leg-circle" style="background:${col}cc;border-color:${col}"></div>${k.split("|")[1]}</div>`;
    }).join("");

    // Firm stats overlay
    const dispFirms=hasFilter?activeFirms:allFirms;
    const totalN=dispFirms.reduce((s,f)=>s+f.n,0);
    const nCities=new Set(dispFirms.map(f=>f.city)).size;
    document.getElementById("ov-firm-count").textContent=totalN.toLocaleString();
    document.getElementById("ov-firm-cities-n").textContent=nCities;
    const filterLbl=selProduct!=="ALL"?(prodMeta?`${prodMeta.stage} · ${prodMeta.role}`:selProduct):
                    selRole!=="ALL"?`${selStage!=="ALL"?selStage+" · ":""}${selRole}`:
                    selStage!=="ALL"?selStage:"All products";
    document.getElementById("ov-firm-filter").textContent=filterLbl;
    const topCities=[...dispFirms].sort((a,b)=>b.n-a.n).slice(0,6);
    const maxC=topCities[0]?.n||1;
    document.getElementById("ov-firm-cities").innerHTML=topCities.map(f=>{
      const col=SR_COLORS[`${f.stage}|${f.role}`]||"#9ca3af";
      const barW=Math.round(60*(f.n/maxC));
      return `<div class="ov-partner"><span class="ov-flag" style="color:${col}">●</span><span class="ov-name">${f.city}</span><span class="ov-val" style="background:rgba(255,255,255,.06);border-radius:2px;padding:0 4px">${f.n}</span></div>`;
    }).join("");
    const stageMap={};
    dispFirms.forEach(f=>{stageMap[f.stage]=(stageMap[f.stage]||0)+f.n;});
    const STAGE_ORDER=["Upstream","Midstream","Downstream","Final Product"];
    document.getElementById("ov-firm-stages").innerHTML=STAGE_ORDER.filter(s=>stageMap[s]).map(s=>{
      const col=STAGE_COLORS[s]||"#9ca3af";
      return `<div class="ov-partner"><span class="ov-flag" style="color:${col}">▪</span><span class="ov-name">${s}</span><span class="ov-val">${stageMap[s]}</span></div>`;
    }).join("");
  }
}
