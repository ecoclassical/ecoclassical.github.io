function dlPNG(){
  const svg=document.querySelector("svg[id]");
  if(!svg)return;
  const bb=svg.getBoundingClientRect();
  const W=Math.round(bb.width)||800,H=Math.round(bb.height)||600;
  const xml=new XMLSerializer().serializeToString(svg);
  const blob=new Blob([xml],{type:"image/svg+xml;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const img=new Image();
  img.onload=()=>{
    const cvs=document.createElement("canvas");
    cvs.width=W*2;cvs.height=H*2;
    const ctx=cvs.getContext("2d");
    ctx.scale(2,2);ctx.fillStyle="#0d1520";ctx.fillRect(0,0,W,H);
    ctx.drawImage(img,0,0,W,H);
    URL.revokeObjectURL(url);
    const a=document.createElement("a");
    a.download=(document.title||"panel").replace(/[^a-z0-9_-]/gi,"_")+".png";
    a.href=cvs.toDataURL("image/png");a.click();
  };
  img.src=url;
}
function dlCSV(){
  const c0=c();
  const src=c0.shap_rca||c0.scatter||c0.all_products||[];
  if(!src.length){alert("No data to export");return;}
  const keys=Object.keys(src[0]);
  const rows=[keys.join(","),...src.map(d=>keys.map(k=>{const v=d[k];return typeof v==="string"?`"${v.replace(/"/g,"\"")}"`:(v==null?"":v);}).join(","))];
  const blob=new Blob([rows.join("\n")],{type:"text/csv"});
  const a=document.createElement("a");

  a.href=URL.createObjectURL(blob);a.click();
}

function drawShapRcaScatter(){
  try{
  const c0=c();
  const gdp=c0.focal_gdp||0;
  // enrich data with pct_gdp; keep point if rca>0 OR shap>0
  const raw=(c0.shap_rca||[]).map(d=>({...d, pct:gdp>0?d.exp/(gdp*10):0}));
  const data=raw.filter(d=>d.rca>0||d.shap>0);
  const svg=d3.select("#sr-scatter-svg"); svg.selectAll("*").remove();
  const pane=document.getElementById("pane-sr-scatter");
  const W=(pane&&pane.clientWidth>0?pane.clientWidth:null)||window.innerWidth||600;
  const H=Math.max((pane&&pane.clientHeight>0?pane.clientHeight:window.innerHeight||436)-36,200);
  svg.attr("viewBox","0 0 "+W+" "+H);
  if(!data.length){
    svg.append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle")
      .attr("fill","rgba(255,255,255,.3)").attr("font-size",12).text("No SHAP-RCA data");
    return;
  }
  const M={t:24,r:28,b:48,l:58};
  const iw=W-M.l-M.r, ih=H-M.t-M.b;
  // bubble size follows tlMode
  const sizeFn=d=>tlMode==="imports"?(d.imp||0):tlMode==="balance"?Math.abs((d.exp||0)-(d.imp||0)):(d.exp||0);
  const maxSize=d3.max(data,sizeFn)||1;
  const rScale=d3.scaleSqrt().domain([0,maxSize]).range([8,40]);
  // ── X scale — mode-dependent ─────────────────────────────────────────────
  let xSc, xFn, xLabel, xRefVal, xRefLabel, xTipFn;
  if(scXMode==="pct"){
    const pctsPos=data.filter(d=>d.pct>0).map(d=>d.pct);
    const minPct=pctsPos.length?d3.min(pctsPos)*0.5:0.001;
    const maxPct=Math.max(d3.max(pctsPos)||0.01, 0.01);
    xSc=d3.scaleLog().domain([Math.max(minPct,1e-4), maxPct*1.2]).range([0,iw]).clamp(true);
    xFn=d=>xSc(Math.max(d.pct, Math.max(minPct,1e-4)));
    xLabel="Exports % of GDP (log scale)";
    // x divider at median non-zero pct
    xRefVal=d3.median(pctsPos)||maxPct*0.5;
    xRefLabel="median";
    xTipFn=d=>"Exp % GDP: <b>"+(d.pct>0?d.pct.toFixed(4)+"%%":"0")+"</b>";
  } else {
    const maxRCA=Math.max(d3.max(data,d=>d.rca)||2, 2);
    xSc=d3.scaleLog().domain([0.02,maxRCA]).range([0,iw]).clamp(true);
    xFn=d=>xSc(Math.max(d.rca,0.02));
    xLabel="Product RCA (log scale)";
    xRefVal=1; xRefLabel="RCA=1";
    xTipFn=d=>"RCA: <b>"+d.rca.toFixed(2)+"</b>";
  }
  // ── Y scale ──────────────────────────────────────────────────────────────
  const maxShap=d3.max(data,d=>d.shap)||1;
  const ySc=d3.scaleLinear().domain([0,maxShap*1.05]).range([ih,0]);
  const g=svg.append("g").attr("transform","translate("+M.l+","+M.t+")");
  const qLabels=[];
  // ── Classification grid ───────────────────────────────────────────────────
  // SHAP thresholds: % of total weight (High≥25%, Medium 10-25%, Low<10%)
  const totalShap=d3.sum(data,d=>d.shap)||1;
  const shapHiThr=totalShap*0.25, shapLoThr=totalShap*0.10;
  const yHi=ySc(Math.min(shapHiThr,maxShap)), yLo=ySc(Math.min(shapLoThr,maxShap));
  if(scXMode==="rca"){
    // X: Weak RCA<0.5 | Partial 0.5≤RCA<1 | Strength RCA≥1
    const xW=xSc(0.5), xP=xSc(1);

      {x:0,  y:0,   w:xW,    h:yHi,    f:"rgba(220,38,38,0.12)",  lbl:"critical gap"},
      {x:xW, y:0,   w:xP-xW, h:yHi,    f:"rgba(249,115,22,0.11)", lbl:"build up"},
      {x:xP, y:0,   w:iw-xP, h:yHi,    f:"rgba(34,197,94,0.12)",  lbl:"leverage"},

      {x:0,  y:yLo, w:xW,    h:ih-yLo, f:"rgba(107,114,128,0.04)", lbl:"not priority"},
      {x:xW, y:yLo, w:xP-xW, h:ih-yLo, f:"rgba(107,114,128,0.04)", lbl:"not priority"},

    ].forEach(q=>{
      if(q.w<=0||q.h<=0) return;

  // ── Quadrant labels (rendered above bubbles) ─────────────────────────────
  qLabels.forEach(q=>{
    g.append("text").attr("x",q.x+q.w/2).attr("y",q.y+q.h/2).attr("text-anchor","middle")
      .attr("fill","rgba(255,255,255,.4)").attr("font-size",14).attr("font-weight",700).text(q.lbl);
  });
  // Legend
  const legItems=[["Upstream|Raw Material","#b45309","Raw Mat."],["Upstream|Processed Material","#c17a2e","Proc. Mat."],
    ["Midstream|Product Component","#16a34a","Comp."],["Downstream|Final Product","#f97316","Final"]];
  legItems.forEach(([k,col,lbl],i)=>{
    const lx=8+i*90;
    g.append("circle").attr("cx",lx).attr("cy",-8).attr("r",4).attr("fill",col).attr("opacity",0.8);
    g.append("text").attr("x",lx+7).attr("y",-4).attr("fill","rgba(255,255,255,.4)").attr("font-size",11).text(lbl);
  });
  }catch(err){
    const svg2=d3.select("#sr-scatter-svg");
    const W2=window.innerWidth||800, H2=(window.innerHeight||500)-52;
    svg2.selectAll("*").remove();
    svg2.attr("viewBox","0 0 "+W2+" "+H2);
    svg2.append("text").attr("x",W2/2).attr("y",H2/2).attr("text-anchor","middle")
      .attr("fill","#ef4444").attr("font-size",13).text("Error: "+err.message);
    console.error("drawShapRcaScatter error:",err);
  }
}

function precomputeCentroids(topo){
  const proj=d3.geoNaturalEarth1().scale(153).translate([480,250]);
  topojson.feature(topo,topo.objects.countries).features.forEach(f=>{
    const id=String(f.id).padStart(3,"0");
    const iso=Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(id));
    if(iso){
      try{const c=d3.geoCentroid(f); centroids[iso]=c;}catch(e){}
    }
  });
}

function drawFirms(){
  if(!worldTopo) return;
  const c0=c(), allFirms=c0.firms||[];
  const svg=d3.select("#map-svg");
  const W=document.getElementById("pane-map").clientWidth||800;
  const H=document.getElementById("pane-map").clientHeight-80||350;
  svg.selectAll("*").remove();
  svg.attr("viewBox",`0 0 ${W} ${H}`);

  // Swap overlays
  document.getElementById("map-overlay").style.display="none";
  document.getElementById("firm-overlay").style.display="";
  document.getElementById("trade-legend").style.display="none";
  document.getElementById("firm-legend").style.display="";

  // Determine which stage|role the selected product belongs to (for white-ring highlight)
  const selProd=c0.all_products||[];
  const prodMeta=selProduct!=="ALL"?selProd.find(p=>p.code===selProduct):null;
  const prodSR=prodMeta?`${prodMeta.stage}|${prodMeta.role}`:null;

  // Filter logic: which firms match the drum selection
  const hasFilter=selStage!=="ALL"||selRole!=="ALL"||selProduct!=="ALL";
  const isActive=f=>{
    if(selStage!=="ALL"&&f.stage!==selStage) return false;
    if(selRole!=="ALL"&&f.role!==selRole) return false;
    return true;
  };
  const isProdMatch=f=>prodSR&&`${f.stage}|${f.role}`===prodSR;

  // Country-centered projection
  const feat=topojson.feature(worldTopo, worldTopo.objects.countries).features;
  const numId=ISO3N[c0.focal];
  const focalFeat=feat.find(f=>+f.id===numId);
  const pad=28;
  const proj=d3.geoNaturalEarth1();
  if(focalFeat) proj.fitExtent([[pad,pad],[W-pad,H-pad]], focalFeat);
  const path=d3.geoPath().projection(proj);

  // Countries: focal very dark + semi-transparent, neighbours lighter
  const g=svg.append("g");
  g.selectAll("path").data(feat).join("path")
    .attr("d",path)
    .attr("fill",d=>{
      const id=String(d.id).padStart(3,"0");
      const iso=Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(id));
      return iso===c0.focal?"#071a0c":"#141e2a";
    })
    .attr("opacity",d=>{
      const id=String(d.id).padStart(3,"0");
      const iso=Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(id));
      return iso===c0.focal?0.55:0.35;
    })
    .attr("stroke","#0d1520").attr("stroke-width",0.3);

  if(focalFeat) g.append("path").attr("d",path(focalFeat))
    .attr("fill","none").attr("stroke","#3cb54a").attr("stroke-width",1.5)
    .attr("pointer-events","none");

  if(!allFirms.length){
    svg.append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle")
      .attr("fill","rgba(255,255,255,.3)").attr("font-size",12).text("No S&P firm data for this tech");
  } else {
    const activeFirms=hasFilter?allFirms.filter(isActive):allFirms;
    const maxN=d3.max(allFirms,f=>f.n)||1;
    const rScale=d3.scaleSqrt().domain([0,maxN]).range([3,16]);
    const seenSR=new Set();

    [...allFirms].sort((a,b)=>b.n-a.n).forEach(f=>{
      const px=proj([+f.lon,+f.lat]);
      if(!px) return;
      const [x,y]=px;
      if(x<-10||x>W+10||y<-10||y>H+10) return;
      const srKey=f.stage+"|"+f.role;
      const col=nodeColor(srKey,f.cat);
      const active=!hasFilter||isActive(f);
      const prodHit=isProdMatch(f);
      if(active) seenSR.add(srKey);
      const op=!hasFilter?0.8:active?(prodHit?1:0.75):0.12;
      const r=rScale(f.n);
      g.append("circle").attr("cx",x).attr("cy",y).attr("r",r)
        .attr("fill",col+(active?"cc":"30")).attr("stroke",active?col:"rgba(255,255,255,.1)")
        .attr("stroke-width",active?0.8:0.3).attr("opacity",op)
        .attr("cursor","pointer")
        .on("mousemove",ev=>showTip(`<b>${f.city}</b><br>${f.stage} · ${f.role}<br><b>${f.n}</b> firms`,ev))
        .on("mouseleave",hideTip);
      if(prodHit){
        g.append("circle").attr("cx",x).attr("cy",y).attr("r",r+4)
          .attr("fill","none").attr("stroke","#fff").attr("stroke-width",2).attr("opacity",1)
          .attr("pointer-events","none");
      }
    });

    // Legend: only show SR keys present in active firms
    const legEl=document.getElementById("firm-legend");
    legEl.innerHTML=SR_ORDER.filter(k=>seenSR.has(k)).map(k=>{
      const col=nodeColor(k);
      return `<div class="leg-item"><div class="leg-circle" style="background:${col}cc;border-color:${col}"></div>${k.split("|")[1]}</div>`;
    }).join("");

    // Firm stats overlay
    const dispFirms=hasFilter?activeFirms:allFirms;
    const totalN=dispFirms.reduce((s,f)=>s+f.n,0);
    const nCities=new Set(dispFirms.map(f=>f.city)).size;
    document.getElementById("ov-firm-count").textContent=totalN.toLocaleString();
    document.getElementById("ov-firm-cities-n").textContent=nCities;
    const filterLbl=selProduct!=="ALL"?(prodMeta?`${prodMeta.stage} · ${prodMeta.role}`:selProduct):
                    selRole!=="ALL"?`${selStage!=="ALL"?selStage+" · ":""}${selRole}`:
                    selStage!=="ALL"?selStage:"All products";
    document.getElementById("ov-firm-filter").textContent=filterLbl;
    const topCities=[...dispFirms].sort((a,b)=>b.n-a.n).slice(0,6);
    const maxC=topCities[0]?.n||1;
    document.getElementById("ov-firm-cities").innerHTML=topCities.map(f=>{
      const col=nodeColor(`${f.stage}|${f.role}`,f.cat);
      const barW=Math.round(60*(f.n/maxC));
      return `<div class="ov-partner"><span class="ov-flag" style="color:${col}">●</span><span class="ov-name">${f.city}</span><span class="ov-val" style="background:rgba(255,255,255,.06);border-radius:2px;padding:0 4px">${f.n}</span></div>`;
    }).join("");
    const stageMap={};
    dispFirms.forEach(f=>{stageMap[f.stage]=(stageMap[f.stage]||0)+f.n;});
    const STAGE_ORDER=["Upstream","Midstream","Downstream","Final Product"];
    document.getElementById("ov-firm-stages").innerHTML=STAGE_ORDER.filter(s=>stageMap[s]).map(s=>{
      const col=STAGE_COLORS[s]||"#9ca3af";
      return `<div class="ov-partner"><span class="ov-flag" style="color:${col}">▪</span><span class="ov-name">${s}</span><span class="ov-val">${stageMap[s]}</span></div>`;
    }).join("");
  }
}

      });

  window.renderCityTable=function(){
    const firms=c().firms||[];
    const STAGE_COLORS={"Upstream":"#b45309","Midstream":"#22c55e","Downstream":"#4ade80","Final Product":"#f97316"};
    // Group by city
    const cities={};
    firms.forEach(f=>{
      const key=(f.city||"Unknown").replace(/[ ]+/g," ").trim();
      if(!cities[key]) cities[key]={name:key,total:0,stages:{}};
      const n=+(f.n||1);
      cities[key].total+=n;
      const s=f.stage||"Other";
      cities[key].stages[s]=(cities[key].stages[s]||0)+n;
    });
    const sorted=Object.values(cities).sort((a,b)=>b.total-a.total);
    const stageOrder=["Upstream","Midstream","Downstream","Final Product"];
    const allStages=[...new Set(sorted.flatMap(c=>Object.keys(c.stages)))].sort((a,b)=>stageOrder.indexOf(a)-stageOrder.indexOf(b));
    let html="<table style=\"width:100%;border-collapse:collapse;font-size:12px;\">";

        const n=city.stages[s]||0;
        const col=n>0?(STAGE_COLORS[s]||"#9ca3af"):"rgba(255,255,255,.2)";
        html+=`<td style="padding:5px 10px;text-align:right;color:${col};font-weight:${n>0?600:400}">${n>0?n:"—"}</td>`;

      `<div style="font-size:.72rem;font-weight:700;color:rgba(255,255,255,.45);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px">

       </div>`+html;
  };
})();
