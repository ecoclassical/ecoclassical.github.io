  const pad=28;
  const proj=d3.geoNaturalEarth1();
  if(focalFeat) proj.fitExtent([[pad,pad],[W-pad,H-pad]], focalFeat);
  const path=d3.geoPath().projection(proj);

  // Countries: focal very dark + semi-transparent, neighbours lighter
  const g=svg.append("g");
  g.selectAll("path").data(feat).join("path")
    .attr("d",path)
    .attr("fill",d=>{
      const id=String(d.id).padStart(3,"0");
      const iso=Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(id));
      return iso===c0.focal?"#071a0c":"#141e2a";
    })
    .attr("opacity",d=>{
      const id=String(d.id).padStart(3,"0");
      const iso=Object.keys(ISO3N).find(k=>ISO3N[k]===parseInt(id));
      return iso===c0.focal?0.55:0.35;
    })
    .attr("stroke","#0d1520").attr("stroke-width",0.3);

  if(focalFeat) g.append("path").attr("d",path(focalFeat))
    .attr("fill","none").attr("stroke","#3cb54a").attr("stroke-width",1.5)
    .attr("pointer-events","none");

  if(!allFirms.length){
    svg.append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle")
      .attr("fill","rgba(255,255,255,.3)").attr("font-size",12).text("No S&P firm data for this tech");
  } else {
    const activeFirms=hasFilter?allFirms.filter(isActive):allFirms;
    const maxN=d3.max(allFirms,f=>f.n)||1;
    const rScale=d3.scaleSqrt().domain([0,maxN]).range([3,16]);
    const seenSR=new Set();

    [...allFirms].sort((a,b)=>b.n-a.n).forEach(f=>{
      const px=proj([+f.lon,+f.lat]);
      if(!px) return;
      const [x,y]=px;
      if(x<-10||x>W+10||y<-10||y>H+10) return;
      const srKey=f.stage+"|"+f.role;
      const col=SR_COLORS[srKey]||"#9ca3af";
      const active=!hasFilter||isActive(f);
      const prodHit=isProdMatch(f);
      if(active) seenSR.add(srKey);
      const op=!hasFilter?0.8:active?(prodHit?1:0.75):0.12;
      const r=rScale(f.n);
      g.append("circle").attr("cx",x).attr("cy",y).attr("r",r)
        .attr("fill",col+(active?"cc":"30")).attr("stroke",active?col:"rgba(255,255,255,.1)")
        .attr("stroke-width",active?0.8:0.3).attr("opacity",op)
        .attr("cursor","pointer")
        .on("mousemove",ev=>showTip(`<b>${f.city}</b><br>${f.stage} · ${f.role}<br><b>${f.n}</b> firms`,ev))
        .on("mouseleave",hideTip);
      if(prodHit){
        g.append("circle").attr("cx",x).attr("cy",y).attr("r",r+4)
          .attr("fill","none").attr("stroke","#fff").attr("stroke-width",2).attr("opacity",1)
          .attr("pointer-events","none");
      }
    });

    // Legend: only show SR keys present in active firms
    const legEl=document.getElementById("firm-legend");
    legEl.innerHTML=SR_ORDER.filter(k=>seenSR.has(k)).map(k=>{
      const col=SR_COLORS[k]||"#9ca3af";
      return `<div class="leg-item"><div class="leg-circle" style="background:${col}cc;border-color:${col}"></div>${k.split("|")[1]}</div>`;
    }).join("");

    // Firm stats overlay
    const dispFirms=hasFilter?activeFirms:allFirms;
    const totalN=dispFirms.reduce((s,f)=>s+f.n,0);
    const nCities=new Set(dispFirms.map(f=>f.city)).size;
    document.getElementById("ov-firm-count").textContent=totalN.toLocaleString();
    document.getElementById("ov-firm-cities-n").textContent=nCities;
    const filterLbl=selProduct!=="ALL"?(prodMeta?`${prodMeta.stage} · ${prodMeta.role}`:selProduct):
                    selRole!=="ALL"?`${selStage!=="ALL"?selStage+" · ":""}${selRole}`:
                    selStage!=="ALL"?selStage:"All products";
    document.getElementById("ov-firm-filter").textContent=filterLbl;
    const topCities=[...dispFirms].sort((a,b)=>b.n-a.n).slice(0,6);
    const maxC=topCities[0]?.n||1;
    document.getElementById("ov-firm-cities").innerHTML=topCities.map(f=>{
      const col=SR_COLORS[`${f.stage}|${f.role}`]||"#9ca3af";
      const barW=Math.round(60*(f.n/maxC));
      return `<div class="ov-partner"><span class="ov-flag" style="color:${col}">●</span><span class="ov-name">${f.city}</span><span class="ov-val" style="background:rgba(255,255,255,.06);border-radius:2px;padding:0 4px">${f.n}</span></div>`;
    }).join("");
    const stageMap={};
    dispFirms.forEach(f=>{stageMap[f.stage]=(stageMap[f.stage]||0)+f.n;});
    const STAGE_ORDER=["Upstream","Midstream","Downstream","Final Product"];
    document.getElementById("ov-firm-stages").innerHTML=STAGE_ORDER.filter(s=>stageMap[s]).map(s=>{
      const col=STAGE_COLORS[s]||"#9ca3af";
      return `<div class="ov-partner"><span class="ov-flag" style="color:${col}">▪</span><span class="ov-name">${s}</span><span class="ov-val">${stageMap[s]}</span></div>`;
    }).join("");
  }
}
function getPV(){const pvs=c().product_views||[];return pvs.find(p=>p.code==="ALL")||pvs[0]||{suppliers:[],buyers:[],timeline:[]}}
// Update focal legend label on load
document.addEventListener("DOMContentLoaded",function(){
  const el=document.getElementById("leg-focal"); if(el) el.textContent=c().name||c().focal;
});
function safeDraw(){
  requestAnimationFrame(()=>{
    const el=document.getElementById("pane-map");
    if(el&&el.clientHeight<=0){
      const hdr=document.getElementById("hdr");
      el.style.height=(window.innerHeight-(hdr?hdr.offsetHeight:36))+"px";
    }
    drawFirms();
  });
}
// D3 is embedded inline above — call safeDraw directly
document.addEventListener("DOMContentLoaded", function(){
  safeDraw();;
  window.addEventListener("resize", function(){ requestAnimationFrame(drawFirms); });
  
(function(){
  const hdr=document.getElementById("hdr");
  const wrap=document.createElement("div");
  wrap.style="display:flex;gap:4px;margin-left:auto";
  [["map","Map"],["cities","Cities"]].forEach(([m,lbl])=>{
    const b=document.createElement("button");
    b.id="amv-"+m;
    b.textContent=lbl;
    b.setAttribute("style", m==="map" ? "padding:3px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:.99rem;font-weight:700;letter-spacing:.06em;border:1px solid rgba(60,181,74,.4);background:rgba(60,181,74,.12);color:#3cb54a;transition:all .15s" : "padding:3px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:.99rem;font-weight:700;letter-spacing:.06em;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);transition:all .15s");
    b.onclick=()=>{
      [["map","Map"],["cities","Cities"]].forEach(([mm])=>{
        document.getElementById("amv-"+mm).setAttribute("style", mm===m ? "padding:3px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:.99rem;font-weight:700;letter-spacing:.06em;border:1px solid rgba(60,181,74,.4);background:rgba(60,181,74,.12);color:#3cb54a;transition:all .15s" : "padding:3px 10px;border-radius:4px;cursor:pointer;font-family:inherit;font-size:.99rem;font-weight:700;letter-spacing:.06em;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:rgba(255,255,255,.5);transition:all .15s");
      });
      const mapPane=document.getElementById("pane-map");
      const cityPane=document.getElementById("city-table");
      if(m==="map"){
        mapPane.style.display=""; cityPane.style.display="none";
        drawFirms();
      } else {
        mapPane.style.display="none"; cityPane.style.display="";
        renderCityTable();
      }
    };
    wrap.appendChild(b);
  });
  hdr.appendChild(wrap);

  window.renderCityTable=function(){
    const firms=c().firms||[];
    const STAGE_COLORS={"Upstream":"#b45309","Midstream":"#22c55e","Downstream":"#4ade80","Final Product":"#f97316"};
    // Group by city
    const cities={};
    firms.forEach(f=>{
      const key=(f.city||"Unknown").replace(/[ ]+/g," ").trim();
      if(!cities[key]) cities[key]={name:key,total:0,stages:{}};
      const n=+(f.n||1);
      cities[key].total+=n;
      const s=f.stage||"Other";
      cities[key].stages[s]=(cities[key].stages[s]||0)+n;
    });
    const sorted=Object.values(cities).sort((a,b)=>b.total-a.total);
    const stageOrder=["Upstream","Midstream","Downstream","Final Product"];
    const allStages=[...new Set(sorted.flatMap(c=>Object.keys(c.stages)))].sort((a,b)=>stageOrder.indexOf(a)-stageOrder.indexOf(b));
    let html="<table style=\"width:100%;border-collapse:collapse;font-size:12px;\">";
    html+="<thead><tr style=\"border-bottom:1px solid rgba(255,255,255,.12);\"><th style=\"text-align:left;padding:6px 10px;color:rgba(255,255,255,.45);font-weight:700;letter-spacing:.06em;font-size:.65rem\">CITY</th><th style=\"padding:6px 10px;color:rgba(255,255,255,.45);font-weight:700;font-size:.65rem\">TOTAL</th>";
    allStages.forEach(s=>{
      const col=STAGE_COLORS[s]||"#9ca3af";
      html+=`<th style="padding:6px 10px;color:${col};font-weight:700;font-size:.65rem;text-align:right">${s}</th>`;
    });
    html+="</tr></thead><tbody>";
    sorted.forEach((city,i)=>{
      const bg=i%2===0?"rgba(255,255,255,.02)":"transparent";
      html+=`<tr style="border-bottom:1px solid rgba(255,255,255,.04);background:${bg}">`;
      html+=`<td style="padding:5px 10px;color:rgba(255,255,255,.8);font-weight:500">${city.name}</td>`;
      html+=`<td style="padding:5px 10px;text-align:center;color:#fff;font-weight:700">${city.total}</td>`;
      allStages.forEach(s=>{
        const n=city.stages[s]||0;
        const col=n>0?(STAGE_COLORS[s]||"#9ca3af"):"rgba(255,255,255,.2)";
        html+=`<td style="padding:5px 10px;text-align:right;color:${col};font-weight:${n>0?600:400}">${n>0?n:"—"}</td>`;
      });
      html+="</tr>";
    });
    html+="</tbody></table>";
    document.getElementById("city-table-content").innerHTML=
      `<div style="font-size:.72rem;font-weight:700;color:rgba(255,255,255,.45);letter-spacing:.1em;text-transform:uppercase;margin-bottom:12px">
        ${sorted.length} cities · ${firms.reduce((s,f)=>s+(+(f.n||1)),0)} firms total
       </div>`+html;
  };
})();

});
