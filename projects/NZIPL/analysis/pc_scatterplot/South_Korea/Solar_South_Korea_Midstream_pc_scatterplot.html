function getPV() {

function drawScatter(){
  const c0=c();
  const w=document.getElementById("pane-sc").clientWidth||300;
  const h=document.getElementById("pane-sc").clientHeight-36||200;
  const svg=d3.select("#sc-svg").attr("viewBox",`0 0 ${w} ${h}`);
  svg.selectAll("*").remove();

  // ── Product portfolio scatter (exports vs imports for each HS code) ────────
  const prods=(c0.all_products||[]).filter(p=>p.exp>0||p.imp>0);
  if(!prods.length) return;

  const hasFilter=selStage!=="ALL"||selRole!=="ALL"||selProduct!=="ALL";
  const selProd=selProduct!=="ALL"?prods.find(p=>p.code===selProduct):null;
  const isGroupActive=p=>{
    if(!hasFilter) return true;
    if(selProd) return p.stage===selProd.stage&&p.role===selProd.role;
    if(selStage!=="ALL"&&selRole!=="ALL") return p.stage===selStage&&p.role===selRole;
    if(selRole!=="ALL") return p.role===selRole;
    if(selStage!=="ALL") return p.stage===selStage;
    return true;
  };
  const isSel=p=>!!selProd&&p.code===selProduct;
  const getX=p=>tlMode==="imports"?(p.imp||0):tlMode==="balance"?Math.abs((p.exp||0)-(p.imp||0)):(p.exp||0);

  // Log scale (+1 to handle zeros)
  const M={t:8,r:12,b:30,l:48};
  const iw=w-M.l-M.r, ih=h-M.t-M.b;
  const g=svg.append("g").attr("transform",`translate(${M.l},${M.t})`);

  const xMax=d3.max(prods,p=>p.exp)||1;
  const yMax=d3.max(prods,p=>p.imp)||1;
  const xSc=d3.scaleLog().domain([1,xMax*1.3]).range([0,iw]).clamp(true);
  const ySc=d3.scaleLog().domain([1,yMax*1.3]).range([ih,0]).clamp(true);

  // Diagonal (balanced trade line)
  const diagMax=Math.min(xMax,yMax);
  if(diagMax>1){g.append("line").attr("x1",xSc(1)).attr("y1",ySc(1)).attr("x2",xSc(diagMax)).attr("y2",ySc(diagMax))
    .attr("stroke","rgba(255,255,255,.1)").attr("stroke-width",0.8).attr("stroke-dasharray","4,3");}

  g.append("g").attr("transform",`translate(0,${ih})`).call(d3.axisBottom(xSc).ticks(4).tickFormat(v=>fmtV(v)))
    .selectAll("text").attr("fill","rgba(255,255,255,.3)").attr("font-size",7);
  g.append("g").call(d3.axisLeft(ySc).ticks(4).tickFormat(v=>fmtV(v)))
    .selectAll("text").attr("fill","rgba(255,255,255,.3)").attr("font-size",7);

  // Size: sqrt of total trade
  const totalMax=d3.max(prods,p=>(p.exp||0)+(p.imp||0))||1;
  const rSc=d3.scaleSqrt().domain([0,totalMax]).range([2.5,10]);

  prods.forEach(p=>{
    const active=isGroupActive(p);
    const sel=isSel(p);
    const srKey=p.stage+"|"+p.role;
    const baseCol=SR_COLORS[srKey]||"#9ca3af";
    // Brighten for stage/role selection; keep SR color for product-group highlight
    const col=hasFilter&&!selProd&&active?d3.color(baseCol).brighter(0.55).formatHex():baseCol;
    const r=rSc((p.exp||0)+(p.imp||0));
    const op=!hasFilter?0.75:sel?0.97:active?0.88:0.13;
    const cx=xSc(Math.max(1,getX(p)||1));
    const cy=ySc(Math.max(1,tlMode==="imports"?(p.exp||1):((p.imp)||1)));
    g.append("circle").attr("cx",cx).attr("cy",cy).attr("r",r)
      .attr("fill",col).attr("opacity",op)
      .attr("stroke",sel?"white":"none").attr("stroke-width",sel?2.5:0)
      .on("mousemove",ev=>showTip(`<b>${p.name}</b><br>HS ${p.code}<br>${p.stage} · ${p.role}<br>Exp: ${fmtV(p.exp)} · Imp: ${fmtV(p.imp)}`,ev))
      .on("mouseleave",hideTip);
  });

  // Axis labels
  const xLab=tlMode==="imports"?"Imports":"Exports";
  const yLab=tlMode==="imports"?"Exports":"Imports";
  g.append("text").attr("x",iw/2).attr("y",ih+26).attr("text-anchor","middle")
    .attr("fill","rgba(255,255,255,.3)").attr("font-size",7.5).text(xLab+" (KUSD, log)");
  g.append("text").attr("transform","rotate(-90)").attr("x",-ih/2).attr("y",-36)
    .attr("text-anchor","middle").attr("fill","rgba(255,255,255,.3)").attr("font-size",7.5).text(yLab+" (KUSD, log)");

  // Title
  const scTitle=document.getElementById("sc-title");
  if(scTitle) scTitle.textContent="PC Scatterplot";
}
document.addEventListener("DOMContentLoaded",()=>{ drawScatter(); });
window.addEventListener("resize",()=>{ drawScatter(); });

</script>
</body>
</html>
