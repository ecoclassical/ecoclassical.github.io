.ov-cval{color:rgba(255,255,255,.45);font-size:.66rem;white-space:nowrap}
.ov-cgdp{color:rgba(255,255,255,.25);font-size:.6rem;white-space:nowrap}

.leg-circle{width:10px;height:10px;border-radius:50%;border:1.5px solid}

function initMap(){
  const el=document.getElementById("map-svg");
  const W=el.clientWidth||600,H=el.clientHeight||500;
  const svg=d3.select("#map-svg");
  const mapScale=Math.max(W/5.0,H/3.3)*0.75;
  mapProjection=d3.geoNaturalEarth1().scale(mapScale).translate([W*0.55,H*0.48]);
  mapPath=d3.geoPath().projection(mapProjection);
  svg.append("path").datum({type:"Sphere"}).attr("d",mapPath).attr("fill","#0a1525").attr("stroke","#1a2a3a").attr("stroke-width",.5);
  d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json").then(world=>{
    worldTopo=world;
    const countries=topojson.feature(world,world.objects.countries);
    svg.selectAll(".country").data(countries.features).enter().append("path")
      .attr("class","country").attr("d",mapPath).attr("data-id",f=>f.id);
    countries.features.forEach(f=>{
      const numId=+f.id;
      const iso3=Object.keys(ISO3N).find(k=>ISO3N[k]===numId);
      if(iso3) centroids[iso3]=mapProjection(d3.geoCentroid(f));
    });
    updateAll();
  });
}

function updateAll(){
  currentProduct=0;
  const c=ALL_CASES[currentIdx];
  if(!c) return;
  document.querySelectorAll(".nav-btn.active").forEach(b=>{
    b.style.borderColor=c.color;b.style.color=c.color;b.style.background=c.color+"22";
  });
  renderProductButtons(c);
  updateMap(c);drawTimeline(c);drawDendrite(c);drawScatter(c);drawTreemap(c);
}

function renderProductButtons(c){
  const container=document.getElementById("prod-scroll");
  container.innerHTML="";
  if(!c.product_views||!c.product_views.length) return;
  c.product_views.forEach((pv,i)=>{
    const col=i===0?c.color:PROD_COLORS[(i-1)%PROD_COLORS.length];
    const isActive=i===currentProduct;
    const btn=document.createElement("button");
    btn.className="prod-btn"+(isActive?" active":"");
    if(isActive){btn.style.borderColor=col;btn.style.background=col+"22";}
    const top=document.createElement("div");top.className="prod-btn-top";
    const dot=document.createElement("span");dot.className="prod-dot";
    dot.style.background=col;dot.style.opacity=isActive?"1":"0.55";
    const nm=document.createElement("span");nm.className="prod-name";
    if(i===0){
      const l1=document.createElement("span");l1.style.display="block";l1.style.lineHeight="1.1";l1.textContent="All";
      const l2=document.createElement("span");l2.style.display="block";l2.style.lineHeight="1.1";l2.textContent=c.tech;
      nm.appendChild(l1);nm.appendChild(l2);
    } else {nm.textContent=pv.label;}
    top.appendChild(dot);top.appendChild(nm);btn.appendChild(top);
    if(i>0){
      const sub=document.createElement("div");sub.className="prod-btn-sub";
      const badge=document.createElement("span");badge.className="prod-role-badge";
      badge.textContent=pv.role||"";
      badge.style.background=col+(isActive?"33":"20");
      badge.style.color=isActive?col:"rgba(255,255,255,.4)";
      sub.appendChild(badge);btn.appendChild(sub);
    }
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".prod-btn").forEach(b=>{b.classList.remove("active");b.style.borderColor="";b.style.background="";});
      btn.classList.add("active");btn.style.borderColor=col;btn.style.background=col+"22";
      container.querySelectorAll(".prod-dot").forEach((d,j)=>{d.style.opacity=j===i?"1":"0.55";});
      container.querySelectorAll(".prod-role-badge").forEach((d,j)=>{
        const jcol=j===0?c.color:PROD_COLORS[(j-1)%PROD_COLORS.length];
        d.style.background=jcol+(j===i?"33":"20");d.style.color=j===i?jcol:"rgba(255,255,255,.4)";
      });
      currentProduct=i;
      updateMap(c);drawTimeline(c);drawDendrite(c);drawScatter(c);drawTreemap(c);
    });
    container.appendChild(btn);
  });
}

function updateMap(c){
  const pv=(c.product_views&&c.product_views[currentProduct])||c.product_views[0];
  document.getElementById("map-tech").textContent=c.tech;
  document.getElementById("map-tech").style.color=c.color;
  document.getElementById("map-country").textContent=c.name;
  d3.selectAll(".country").attr("class","country");
  const focalNum=ISO3N[c.focal];
  if(focalNum) d3.selectAll(".country").filter(f=>+f.id===focalNum).attr("class","country focal");
  const suppliers=pv.suppliers||[];const buyers=pv.buyers||[];
  const supSet=new Set(suppliers.map(s=>s.iso3));const buySet=new Set(buyers.map(b=>b.iso3));
  d3.selectAll(".country").filter(f=>{const iso3=Object.keys(ISO3N).find(k=>ISO3N[k]===+f.id);return supSet.has(iso3);}).attr("class","country supplier");
  d3.selectAll(".country").filter(f=>{const iso3=Object.keys(ISO3N).find(k=>ISO3N[k]===+f.id);return buySet.has(iso3);}).attr("class","country buyer");
  const svg=d3.select("#map-svg");
  svg.selectAll(".map-arc,.map-bubble").remove();
  const allParties=[...suppliers.map(s=>({...s,dir:"sup"})),...buyers.map(b=>({...b,dir:"buy"}))];
  const maxV=d3.max(allParties,d=>d.value)||1;
  const rSc=d3.scaleSqrt().domain([0,maxV]).range([4,18]);
  const focalPt=centroids[c.focal];
  if(focalPt){
    allParties.forEach(p=>{
      const pt=centroids[p.iso3];if(!pt) return;
      const col=p.dir==="sup"?"rgba(217,119,6,.45)":"rgba(3,105,161,.45)";
      const mid=[(focalPt[0]+pt[0])/2-30,(focalPt[1]+pt[1])/2-40];
      svg.append("path").attr("class","map-arc")
        .attr("d",`M${pt[0]},${pt[1]} Q${mid[0]},${mid[1]} ${focalPt[0]},${focalPt[1]}`)
        .attr("fill","none").attr("stroke",col).attr("stroke-width",.8).attr("opacity",.55);
    });
    allParties.forEach(p=>{
      const pt=centroids[p.iso3];if(!pt) return;
      const col=p.dir==="sup"?"#d97706":"#0369a1";
      svg.append("circle").attr("class","map-bubble")
        .attr("cx",pt[0]).attr("cy",pt[1]).attr("r",rSc(p.value))
        .attr("fill",col).attr("opacity",.55).attr("stroke",col).attr("stroke-width",.8)
        .on("mousemove",ev=>showTip(`<strong>${p.name}</strong>${fmtV(p.value)}`,ev))
        .on("mouseleave",hideTip);
    });
  }
  const imp=pv.total_imp||0,exp=pv.total_exp||0,net=exp-imp;
  document.getElementById("ov-imp").textContent=fmtV(imp).replace(/"/g,"");
  document.getElementById("ov-exp").textContent=fmtV(exp).replace(/"/g,"");
  const netEl=document.getElementById("ov-net");
  netEl.textContent=(net>=0?"+":"")+fmtV(Math.abs(net)).replace(/"/g,"")+" net";
  netEl.style.color=net>=0?"#4ade80":"#f87171";
  const gdp=c.focal_gdp;
  if(gdp){
    document.getElementById("ov-imp-gdp").textContent=imp>0?(imp/gdp/10).toFixed(2)+"% GDP":"";
    document.getElementById("ov-exp-gdp").textContent=exp>0?(exp/gdp/10).toFixed(2)+"% GDP":"";
  }
  const listEl=document.getElementById("ov-sup-list");listEl.innerHTML="";
  const showParties=suppliers.length?suppliers:buyers;
  const listLabel=suppliers.length?"Top suppliers":"Top buyers";
  showParties.slice(0,5).forEach(p=>{
    const row=document.createElement("div");row.className="ov-row";
    const dot=document.createElement("div");dot.className="ov-dot";
    dot.style.background=suppliers.length?"#d97706":"#0369a1";
    const name=document.createElement("span");name.className="ov-cname";name.textContent=p.name;
    const val=document.createElement("span");val.className="ov-cval";val.textContent=fmtV(p.value).replace(/"/g,"");
    row.appendChild(dot);row.appendChild(name);row.appendChild(val);listEl.appendChild(row);
  });
}

function drawTimeline(c){
  const svg=d3.select("#tl-svg");svg.selectAll("*").remove();
  const el=document.getElementById("tl-svg");
  const W=el.clientWidth||460,H=el.clientHeight||160;
  const m={top:14,right:14,bottom:26,left:50};
  const w=W-m.left-m.right,h=H-m.top-m.bottom;
  const s=svg.attr("viewBox",`0 0 ${W} ${H}`);
  s.append("rect").attr("width",W).attr("height",H).attr("fill","transparent");
  const g=s.append("g").attr("transform",`translate(${m.left},${m.top})`);
  if(currentProduct===0){ drawTLAll(c,g,w,h); } else { drawTLProduct(c,g,w,h); }
}

function drawTLAll(c,g,w,h){
  const isImp=tlMode==="imports",isBal=tlMode==="balance";
  const raw=c.timeline||[];
  if(!raw.length){g.append("text").attr("x",w/2).attr("y",h/2).attr("text-anchor","middle").attr("fill","rgba(255,255,255,.3)").text("No timeline data");return;}
  const years=Array.from(new Set(raw.map(d=>d.year))).sort((a,b)=>a-b);
  const srs=SR_ORDER.filter(sr=>raw.some(d=>normSR(d.sr)===sr));
  let plotData;
  if(tlScale==="growth"){
    const byYr={};raw.forEach(d=>{const sr=normSR(d.sr);if(!byYr[d.year])byYr[d.year]={};byYr[d.year][sr]=(byYr[d.year][sr]||0)+(isImp?d.imp:isBal?Math.abs(d.exp-d.imp):d.exp);});
    const base={};Object.keys(byYr).sort()[0]&&srs.forEach(sr=>{base[sr]=byYr[Object.keys(byYr).sort()[0]][sr]||1;});
    plotData=years.map(y=>({year:y,...Object.fromEntries(srs.map(sr=>[sr,((byYr[y]&&byYr[y][sr])||0)/base[sr]-1]))}));
  } else {
    const byYr={};raw.forEach(d=>{const sr=normSR(d.sr);if(!byYr[d.year])byYr[d.year]={};byYr[d.year][sr]=(byYr[d.year][sr]||0)+(isImp?d.imp:isBal?Math.abs(d.exp-d.imp):d.exp);});
    const gdp=c.focal_gdp;
    plotData=years.map(y=>({year:y,...Object.fromEntries(srs.map(sr=>[sr,gdp&&gdp>0?((byYr[y]&&byYr[y][sr])||0)/(gdp*10):0]))}));
  }
  const stack=d3.stack().keys(srs).order(d3.stackOrderNone).offset(d3.stackOffsetNone);
  const series=stack(plotData);
  const yMax=d3.max(series,s=>d3.max(s,d=>d[1]))||1;
  const xSc=d3.scaleLinear().domain(d3.extent(years)).range([0,w]);
  const ySc=d3.scaleLinear().domain([0,yMax*1.08]).range([h,0]);
  const area=d3.area().x(d=>xSc(d.data.year)).y0(d=>ySc(d[0])).y1(d=>ySc(d[1])).curve(d3.curveCatmullRom.alpha(0.5));
  series.forEach(s=>{
    const col=SR_COLORS[s.key]||"#9ca3af";
    g.append("path").datum(s).attr("d",area).attr("fill",col).attr("opacity",.78)
      .on("mousemove",(ev,d)=>{
        const yr=Math.round(xSc.invert(d3.pointer(ev)[0]));
        const row=plotData.find(p=>p.year===yr);
        showTip(`${s.key.split("|")[1]}<br>${yr}: ${row?((row[s.key]||0)*100).toFixed(3)+"%":"n/a"}`,ev);
      }).on("mouseleave",hideTip);
  });
  const xAxis=d3.axisBottom(xSc).ticks(Math.min(years.length,8)).tickFormat(d3.format("d"));
  g.append("g").attr("transform",`translate(0,${h})`).call(xAxis)
    .selectAll("text").attr("font-size","9").attr("fill","rgba(255,255,255,.4)");
  g.select(".domain").remove();g.selectAll(".tick line").remove();
  const yFmt=tlScale==="growth"?d=>`${(d*100).toFixed(0)}%`:d=>`${(d*100).toFixed(2)}%`;
  g.append("g").call(d3.axisLeft(ySc).ticks(4).tickFormat(yFmt))
    .selectAll("text").attr("font-size","9").attr("fill","rgba(255,255,255,.4)");
  g.select(".domain").remove();
  ySc.ticks(4).forEach(v=>{
    g.append("line").attr("x1",0).attr("x2",w).attr("y1",ySc(v)).attr("y2",ySc(v))
      .attr("stroke","rgba(255,255,255,.05)");
  });
}

// Specific product: overlapping filled areas (same curveCatmullRom aesthetic as ALL mode).
// All raw material products shown semi-transparent; selected at full opacity.
// Growth mode keeps index lines for clarity.
function drawTLProduct(c, g, w, h) {
  const pvs = c.product_views ? c.product_views.slice(1) : [];
  if (!pvs.length || !pvs.some(pv=>pv.timeline&&pv.timeline.length)) {
    g.append("text").attr("x",w/2).attr("y",h/2).attr("text-anchor","middle")
      .attr("fill","rgba(255,255,255,.3)").text("No product timeline data");
    return;
  }
  const isBalance = tlMode === "balance";
  const isImports = tlMode === "imports";
  const isGrowth  = tlScale === "growth";
  const useShare  = !isBalance && !isImports;
  const selIdx    = currentProduct - 1;
  const gdpScale  = (c.focal_gdp && c.focal_gdp > 0) ? (100 / c.focal_gdp) : 1;

  const allYears = new Set();
  pvs.forEach(pv=>{ if(pv.timeline) pv.timeline.forEach(d=>allYears.add(d.year)); });
  const years = [...allYears].sort();
  if (!years.length) return;

  const xSc = d3.scaleBand().domain(years).range([0,w]).paddingInner(.08);
  const xC  = yr => xSc(yr)+xSc.bandwidth()/2;

  const series = pvs.map((pv,i) => {
    const tlMap={};
    if(pv.timeline) pv.timeline.forEach(d=>{ tlMap[d.year]={exp:d.exp,imp:d.imp,we:d.we||0}; });
    const values = years.map(yr=>{
      const row=tlMap[yr]||{exp:0,imp:0,we:0};
      const v = isBalance ? (row.exp-row.imp)*gdpScale :
                isImports ? row.imp*gdpScale :
                (row.we>0 ? row.exp/row.we*100 : null);
      return {year:yr, v};
    });
    return {label:pv.label, color:PROD_COLORS[i%PROD_COLORS.length], values, selected:i===selIdx};
  });

  const metricLabel = isGrowth ? "Index (first yr=100)" :
                      useShare ? "World market share (%)" :
                      isImports ? "Imports (% GDP)" : "Exports (% GDP)";

  if (isGrowth) {
    series.forEach(ln=>{
      const firstNZ=ln.values.find(d=>d.v!=null&&d.v>0);
      const base=firstNZ?firstNZ.v:1;
      ln.values.forEach(d=>{ d.vi=(d.v!=null&&d.v>0)?d.v/base*100:null; });
    });
    const vk="vi";
    const allVals=series.flatMap(ln=>ln.values.map(d=>d[vk]).filter(v=>v!=null&&!isNaN(v)));
    if(!allVals.length) return;
    const ySc=d3.scaleLinear().domain([0,(d3.max(allVals)||200)*1.1]).range([h,0]).nice();
    g.append("g").attr("transform",`translate(0,${h})`).call(d3.axisBottom(xSc).tickValues(years.filter((_,i)=>i%4===0)).tickFormat(d3.format("d")).tickSize(0)).selectAll("text").attr("font-size","9").attr("fill","rgba(255,255,255,.4)");
    g.select(".domain").remove();
    g.append("g").call(d3.axisLeft(ySc).ticks(4).tickFormat(d=>`${d.toFixed(0)}`)).selectAll("text").attr("font-size","9").attr("fill","rgba(255,255,255,.4)");
    g.select(".domain").remove();g.selectAll(".tick line").remove();
    ySc.ticks(4).forEach(v=>{g.append("line").attr("x1",0).attr("x2",w).attr("y1",ySc(v)).attr("y2",ySc(v)).attr("stroke","rgba(255,255,255,.05)");});
    g.append("line").attr("x1",0).attr("x2",w).attr("y1",ySc(100)).attr("y2",ySc(100)).attr("stroke","rgba(255,255,255,.2)").attr("stroke-dasharray","4,3");
    g.append("text").attr("x",w/2).attr("y",-4).attr("text-anchor","middle").attr("font-size","8").attr("fill","rgba(255,255,255,.28)").text(metricLabel);
    const lineGen=d3.line().x(d=>xC(d.year)).y(d=>d[vk]!=null?ySc(d[vk]):null).defined(d=>d[vk]!=null&&!isNaN(d[vk])).curve(d3.curveCatmullRom);
    series.filter(ln=>!ln.selected).forEach(ln=>{ g.append("path").datum(ln.values).attr("fill","none").attr("stroke",ln.color).attr("stroke-width",1.2).attr("opacity",.35).attr("d",lineGen); });
    series.filter(ln=>ln.selected).forEach(ln=>{
      g.append("path").datum(ln.values).attr("fill","none").attr("stroke",ln.color).attr("stroke-width",2.8).attr("opacity",1).attr("d",lineGen);
      const last=[...ln.values].reverse().find(d=>d[vk]!=null);
      if(last) g.append("text").attr("x",xC(last.year)+5).attr("y",ySc(last[vk])).attr("dy",".35em").attr("font-size","9").attr("font-weight","700").attr("fill",ln.color).text(ln.label.substring(0,16));
    });
    return;
  }

  // Levels mode: overlapping filled areas with curveCatmullRom
  const allVals = series.flatMap(ln=>ln.values.map(d=>d.v).filter(v=>v!=null&&!isNaN(v)));
  if (!allVals.length) return;
  const yMin = isBalance ? Math.min(0,(d3.min(allVals)||0)*1.15) : 0;
  const yMax = (d3.max(allVals)||1)*1.18;
  const ySc = d3.scaleLinear().domain([yMin,yMax]).range([h,0]).nice();

  g.append("g").attr("transform",`translate(0,${h})`).call(
    d3.axisBottom(xSc).tickValues(years.filter((_,i)=>i%4===0)).tickFormat(d3.format("d")).tickSize(0)
  ).selectAll("text").attr("font-size","9").attr("fill","rgba(255,255,255,.4)");
  g.select(".domain").remove();
  const yFmt = useShare ? (d=>`${d.toFixed(1)}%`) : (d=>`${d.toFixed(2)}%`);
  g.append("g").call(d3.axisLeft(ySc).ticks(4).tickFormat(yFmt))
    .selectAll("text").attr("font-size","9").attr("fill","rgba(255,255,255,.4)");
  g.select(".domain").remove();g.selectAll(".tick line").remove();
  ySc.ticks(4).forEach(v=>{
    g.append("line").attr("x1",0).attr("x2",w).attr("y1",ySc(v)).attr("y2",ySc(v))
      .attr("stroke","rgba(255,255,255,.05)");
  });
  if (isBalance) g.append("line").attr("x1",0).attr("x2",w).attr("y1",ySc(0)).attr("y2",ySc(0))
    .attr("stroke","rgba(255,255,255,.2)").attr("stroke-dasharray","4,3");
  g.append("text").attr("x",w/2).attr("y",-4).attr("text-anchor","middle")
    .attr("font-size","8").attr("fill","rgba(255,255,255,.28)").text(metricLabel);

  const areaGen = d3.area()
    .x(d=>xC(d.year))
    .y0(d=>ySc(Math.min(d.v??0, 0)))
    .y1(d=>ySc(d.v??0))
    .defined(d=>d.v!=null&&!isNaN(d.v))
    .curve(d3.curveCatmullRom);

  // Non-selected first (underneath, dimmed)
  series.filter(ln=>!ln.selected).forEach(ln=>{
    g.append("path").datum(ln.values)
      .attr("d", areaGen)
      .attr("fill", ln.color).attr("fill-opacity", 0.20)
      .attr("stroke", ln.color).attr("stroke-width", 0.9).attr("stroke-opacity", 0.45)
      .on("mousemove",(ev,d)=>showTip(`<strong>${ln.label}</strong>`,ev))
      .on("mouseleave",hideTip);
  });
  // Selected on top (bright)
  series.filter(ln=>ln.selected).forEach(ln=>{
    g.append("path").datum(ln.values)
      .attr("d", areaGen)
      .attr("fill", ln.color).attr("fill-opacity", 0.78)
      .attr("stroke", ln.color).attr("stroke-width", 2.0).attr("stroke-opacity", 1)
      .on("mousemove",(ev,d)=>showTip(`<strong>${ln.label}</strong>`,ev))
      .on("mouseleave",hideTip);
    const lastV = [...ln.values].reverse().find(d=>d.v!=null&&!isNaN(d.v)&&d.v>0);
    if (lastV) {
      g.append("text").attr("x",xC(lastV.year)+5).attr("y",ySc(lastV.v))
        .attr("dy",".35em").attr("font-size","9").attr("font-weight","700")
        .attr("fill",ln.color).text(ln.label.substring(0,16));
    }
  });
}

function drawDendrite(c){
  document.getElementById("den-title").textContent=c.tech+" Process of Production";
  const svg=d3.select("#den-svg");svg.selectAll("*").remove();
  const el=document.getElementById("den-svg");
  const W=el.clientWidth||460,H=el.clientHeight||180;
  svg.attr("viewBox",`0 0 ${W} ${H}`);
  svg.append("rect").attr("width",W).attr("height",H).attr("fill","transparent");

  const edges=c.den_edges||[];
  const keyPvs=c.product_views?c.product_views.slice(1):[];
  const keyCodes=new Set(keyPvs.map(pv=>pv.code));
  const selCode=currentProduct>0?c.product_views[currentProduct].code:null;

  if(!edges.length){svg.append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle").attr("fill","rgba(255,255,255,.25)").attr("font-size","11").text("No dendrite data");return;}

  const pad={top:30,bottom:30};

  // Build node map
  const nodeMap=new Map();
  edges.forEach(e=>{
    if(!nodeMap.has(e.fcn)) nodeMap.set(e.fcn,{cn:e.fcn,code:e.fc,name:e.fn,stage:e.fs,role:e.fr});
    if(!nodeMap.has(e.tcn)) nodeMap.set(e.tcn,{cn:e.tcn,code:e.tc,name:e.tn,stage:e.ts,role:e.tr});
  });
  const allNodes=[...nodeMap.values()];

  // Compute steps: root = final product (node never appearing as from_codename)
  // Relaxation: step[from] = max(step[from], step[to]+1) → upstream nodes get higher steps
  const fromSet=new Set(edges.map(e=>e.fcn));
  allNodes.forEach(n=>nodeMap.set(n.cn,{...n}));
  const stepMap=new Map();
  allNodes.forEach(n=>stepMap.set(n.cn,0));
  let changed=true;
  for(let i=0;i<25&&changed;i++){
    changed=false;
    edges.forEach(e=>{
      const ts=stepMap.get(e.tcn)||0,fs=stepMap.get(e.fcn)||0;
      if(fs<ts+1){stepMap.set(e.fcn,ts+1);changed=true;}
    });
  }
  const maxStep=Math.max(...stepMap.values());
  // Invert: most upstream → displayLv=0 (LEFT); final product → displayLv=maxStep (RIGHT)
  const displayLv=s=>maxStep-s;
  const stepToX=s=>W*0.08+(W*0.84)*displayLv(s)/(maxStep||1);

  // Group by step, assign Y — key/selected nodes sorted first
  const stepBuckets={};
  allNodes.forEach(n=>{
    const s=stepMap.get(n.cn)||0;
    if(!stepBuckets[s]) stepBuckets[s]=[];
    stepBuckets[s].push(n);
  });
  Object.values(stepBuckets).forEach(ns=>{
    ns.sort((a,b)=>{
      const ak=(selCode&&a.code===selCode)?-2:(keyCodes.has(a.code)?-1:0);
      const bk=(selCode&&b.code===selCode)?-2:(keyCodes.has(b.code)?-1:0);
      return ak-bk||a.name.localeCompare(b.name);
    });
  });
  const nodeY=new Map();
  Object.entries(stepBuckets).forEach(([s,ns])=>{
    const avail=H-pad.top-pad.bottom;
    const step=avail/ns.length;
    ns.forEach((n,i)=>nodeY.set(n.cn,pad.top+step*(i+0.5)));
  });

  // Step number labels at bottom
  for(let s=0;s<=maxStep;s++){
    const lv=displayLv(s);
    svg.append("text").attr("x",stepToX(s)).attr("y",H-3).attr("text-anchor","middle")
      .attr("font-size","6").attr("fill","rgba(255,255,255,.18)").attr("font-weight","600")
      .text(lv===maxStep?`${maxStep}`:lv===0?"0":`${lv}`);
  }

  // Edges
  const edgeG=svg.append("g");
  edges.forEach(e=>{
    const fn=nodeMap.get(e.fcn),tn=nodeMap.get(e.tcn);
    if(!fn||!tn) return;
    const x1=stepToX(stepMap.get(fn.cn)||0),y1=nodeY.get(fn.cn)||H/2;
    const x2=stepToX(stepMap.get(tn.cn)||0),y2=nodeY.get(tn.cn)||H/2;
    const isSelE=selCode&&(e.fc===selCode||e.tc===selCode);
    const isKeyE=!isSelE&&(keyCodes.has(e.fc)||keyCodes.has(e.tc));
    const col=isSelE?"rgba(255,255,255,.8)":isKeyE?"rgba(255,255,255,.45)":"rgba(255,255,255,.18)";
    const sw=isSelE?1.6:isKeyE?1.0:0.5;
    edgeG.append("line").attr("x1",x1).attr("y1",y1).attr("x2",x2).attr("y2",y2)
      .attr("stroke",col).attr("stroke-width",sw);
  });

  // Nodes
  const tradeMap=new Map((c.den_products||[]).map(p=>[p.code,(p.exp||0)+(p.imp||0)]));
  const maxTV=d3.max([...tradeMap.values()])||1;
  const rBase=d3.scaleSqrt().domain([0,maxTV]).range([5,14]);
  const nodeG=svg.append("g");
  const labelItems=[];
  allNodes.forEach(n=>{
    const x=stepToX(stepMap.get(n.cn)||0),y=nodeY.get(n.cn)||H/2;
    const isSel=selCode&&n.code===selCode;
    const isKey=keyCodes.has(n.code);
    const isFinal=stepMap.get(n.cn)===0;
    const keyIdx=keyPvs.findIndex(pv=>pv.code===n.code);
    const tv=tradeMap.get(n.code)||0;
    const col=(isSel||isKey)?PROD_COLORS[keyIdx>=0?keyIdx:0]:(SR_COLORS[n.stage+"|"+n.role]||"#9ca3af");
    const r=isSel?Math.max(rBase(tv),13):(isKey?Math.max(rBase(tv),12):Math.max(rBase(tv)*0.625,4.4));
    const op=isSel?1:(isKey?(selCode?0.7:0.88):(selCode?0.40:0.75));
    const pv=(c.den_products||[]).find(p=>p.code===n.code);
    nodeG.append("circle").attr("cx",x).attr("cy",y).attr("r",r)
      .attr("fill",col).attr("stroke",isSel?"#fff":"rgba(0,0,0,.35)")
      .attr("stroke-width",isSel?2:isKey?1.2:0.5).attr("opacity",op)
      .on("mousemove",ev=>showTip(
        `<strong>${n.name}</strong>HS ${n.code}<br>${n.stage} · ${n.role}<br>Level ${displayLv(stepMap.get(n.cn)||0)} (final = ${maxStep})`+
        (pv?`<br>Imp: ${fmtV(pv.imp)} | Exp: ${fmtV(pv.exp)}`:""),ev))
      .on("mouseleave",hideTip);
    if(isKey||isSel) labelItems.push({x,y,r,code:n.code,isFinal,isSel,isKey,op,fill:isSel?"#fff":"rgba(255,255,255,.6)"});
  });

  // Labels: top/bottom bands with collision avoidance; final product label to right
  const labelG=svg.append("g").attr("pointer-events","none");
  const nonFinal=labelItems.filter(l=>!l.isFinal);
  const finalLbl=labelItems.filter(l=>l.isFinal);
  nonFinal.forEach(l=>{
    l.band=l.y<=H/2?"top":"bot";
    if(l.band==="top"){l.labelY=l.y-l.r-4;l.anchorY=l.y-l.r-1;}
    else{l.labelY=l.y+l.r+9;l.anchorY=l.y+l.r+1;}
  });
  const LH=10,SEP=34;
  const topItems=nonFinal.filter(l=>l.band==="top").sort((a,b)=>a.x-b.x);
  topItems.forEach((l,i)=>{
    for(let j=0;j<i;j++){if(Math.abs(topItems[j].x-l.x)<SEP&&topItems[j].labelY-l.labelY<LH) l.labelY=topItems[j].labelY-LH-1;}
    l.labelY=Math.max(8,l.labelY);
  });
  const botItems=nonFinal.filter(l=>l.band==="bot").sort((a,b)=>a.x-b.x);
  botItems.forEach((l,i)=>{
    for(let j=0;j<i;j++){if(Math.abs(botItems[j].x-l.x)<SEP&&l.labelY-botItems[j].labelY<LH) l.labelY=botItems[j].labelY+LH+1;}
    l.labelY=Math.min(H-3,l.labelY);
  });
  [...topItems,...botItems].forEach(l=>{
    const connEndY=l.band==="top"?l.labelY+2:l.labelY-9;
    labelG.append("line").attr("x1",l.x).attr("y1",l.anchorY).attr("x2",l.x).attr("y2",connEndY)
      .attr("stroke",l.isSel?"rgba(255,255,255,.65)":"rgba(255,255,255,.30)")
      .attr("stroke-width",.75).attr("stroke-dasharray","3,2");
    labelG.append("text").attr("x",l.x).attr("y",l.labelY).attr("text-anchor","middle")
      .attr("font-size",l.isSel?"7.5":"6").attr("font-weight","700")
      .attr("fill",l.fill).attr("opacity",l.op).text(l.code);
  });
  finalLbl.forEach(l=>{
    labelG.append("text").attr("x",l.x+l.r+5).attr("y",l.y).attr("dy",".35em")
      .attr("text-anchor","start").attr("font-size",l.isSel?"7.5":"6.5")
      .attr("font-weight","700").attr("fill",l.fill).attr("opacity",l.op).text(l.code);
  });
}

function drawTreemap(c){
  const tmSelCode=(currentProduct>0&&c.product_views&&c.product_views[currentProduct])?c.product_views[currentProduct].code:null;
  const svg=d3.select("#tm-svg");svg.selectAll("*").remove();
  const el=document.getElementById("tm-svg");
  const W=el.clientWidth||600,H=el.clientHeight||170;
  svg.attr("viewBox",`0 0 ${W} ${H}`);
  svg.append("rect").attr("width",W).attr("height",H).attr("fill","transparent");
  const isImp=tlMode==="imports",isBal=tlMode==="balance";
  const dir=isImp?"Imports":isBal?"Net Balance":"Exports";
  document.getElementById("tm-title").textContent="Trade Composition - "+dir+" "+c.ref_year;
  const raw=(c.den_products||[]).map(p=>{
    const v=isImp?(p.imp||0):isBal?Math.abs((p.exp||0)-(p.imp||0)):(p.exp||0);
    let sr=p.stage+"|"+p.role;
    if(sr==="Upstream|Processed Material") sr="Midstream|Processed Material";
    return {code:p.code,name:p.name,stage:p.stage,role:p.role,sr:sr,value:v,rawExp:p.exp||0,rawImp:p.imp||0};
  }).filter(p=>p.value>0);
  if(!raw.length){svg.append("text").attr("x",W/2).attr("y",H/2).attr("text-anchor","middle").attr("fill","rgba(255,255,255,.25)").attr("font-size","11").text("No data for current direction");return;}
  const total=d3.sum(raw,d=>d.value);
  const byGroup=d3.group(raw,d=>d.sr);
  const rootData={name:"root",children:[...byGroup.entries()].map(([sr,prods])=>({name:sr,children:prods}))};
  const root=d3.hierarchy(rootData).sum(d=>d.value||0).sort((a,b)=>b.value-a.value);
  d3.treemap().size([W,H]).paddingOuter(1).paddingInner(0.5).tile(d3.treemapSquarify.ratio(1.6))(root);
  root.children.forEach(grp=>{
    const gx=grp.x0,gy=grp.y0,gw=grp.x1-grp.x0,gh=grp.y1-grp.y0;
    const col=SR_COLORS[grp.data.name]||"#9ca3af";
    const role=grp.data.name.split("|")[1]||grp.data.name;
    svg.append("rect").attr("x",gx).attr("y",gy).attr("width",gw).attr("height",gh).attr("fill",col).attr("opacity",0.09);
    const ghostSize=Math.min(gw/Math.max(role.length,4)*1.8,gh*0.46,42);
    if(ghostSize>9){svg.append("text").attr("x",gx+gw/2).attr("y",gy+gh/2).attr("dominant-baseline","middle").attr("text-anchor","middle").attr("font-size",ghostSize).attr("font-weight","900").attr("fill","rgba(0,0,0,.22)").attr("pointer-events","none").text(role);}
  });
  root.leaves().forEach(d=>{
    const col=SR_COLORS[d.parent.data.name]||"#9ca3af";
    const w=d.x1-d.x0,h=d.y1-d.y0;
    const share=d.value/total;
    const isTmSel=tmSelCode&&d.data.code===tmSelCode;
    if(isTmSel){svg.append("rect").attr("x",d.x0-2).attr("y",d.y0-2).attr("width",w+4).attr("height",h+4).attr("fill","none").attr("stroke","rgba(255,255,255,.55)").attr("stroke-width",3).attr("rx",2).attr("pointer-events","none");}
    svg.append("rect").attr("x",d.x0).attr("y",d.y0).attr("width",w).attr("height",h)
      .attr("fill",col).attr("opacity",isTmSel?1.0:0.82)
      .attr("stroke",isTmSel?"#ffffff":"#0d1520").attr("stroke-width",isTmSel?1.5:0.5)
      .on("mousemove",ev=>showTip(`<strong>${d.data.name}</strong>HS ${d.data.code}<br>${d.parent.data.name}<br>`+(isImp?`Imp: ${fmtV(d.data.rawImp)}`:isBal?`Net: ${fmtV(d.data.value)}`:`Exp: ${fmtV(d.data.rawExp)}`),ev))
      .on("mouseleave",hideTip);
    if(w>28&&h>14){
      const fs=Math.min(15,Math.max(8,Math.sqrt(w*h)/9));
      const nfs=Math.max(6.5,fs*0.80);
      const maxCh1=Math.max(5,Math.floor(w/(fs*0.62)));
      const nm1=d.data.name.length>maxCh1?d.data.name.substring(0,maxCh1-2)+"...":d.data.name;
      svg.append("text").attr("x",d.x0+4).attr("y",d.y0+fs+2).attr("font-size",fs).attr("font-weight","700").attr("fill","rgba(255,255,255,.95)").attr("pointer-events","none").text(nm1);
      let nextY=d.y0+fs*2+3;
      if(h>fs*2.8&&w>36){svg.append("text").attr("x",d.x0+4).attr("y",nextY).attr("font-size",nfs).attr("fill","rgba(255,255,255,.65)").attr("pointer-events","none").text("HS "+d.data.code);nextY+=nfs+3;}
      if(h>nextY-d.y0+4&&share>=0.01){svg.append("text").attr("x",d.x0+4).attr("y",nextY).attr("font-size",nfs).attr("fill","rgba(255,255,255,.50)").attr("pointer-events","none").text((share*100).toFixed(1)+"%");}
    }
  });
}

function drawScatter(c){
  const svg=d3.select("#sc-svg");svg.selectAll("*").remove();
  const el=document.getElementById("sc-svg");
  const W=el.clientWidth||460,H=el.clientHeight||200;
  const m={top:16,right:14,bottom:34,left:46};
  const w=W-m.left-m.right,h=H-m.top-m.bottom;
  const s=svg.attr("viewBox",`0 0 ${W} ${H}`);
  s.append("rect").attr("width",W).attr("height",H).attr("fill","transparent");
  const g=s.append("g").attr("transform",`translate(${m.left},${m.top})`);
  const isPct=scMode==="pct",isAllMode=currentProduct===0;
  const pv=isAllMode?null:c.product_views[currentProduct];
  const pvColor=isAllMode?c.color:PROD_COLORS[(currentProduct-1)%PROD_COLORS.length];
  let valid,xField,modeLabel,isBalance=false;
  if(isAllMode){
    const xAgg=tlMode==="imports"?(isPct?"ip":"ib"):tlMode==="balance"?"__bal":(isPct?"ep":"eb");
    isBalance=tlMode==="balance";modeLabel=tlMode==="imports"?"Imports":tlMode==="balance"?"Balance":"Exports";xField=xAgg;
    if(!c.scatter||!c.scatter.length){g.append("text").attr("x",w/2).attr("y",h/2).attr("text-anchor","middle").attr("fill","rgba(255,255,255,.3)").text("No scatter data");return;}
    const aug=c.scatter.map(d=>({...d,__bal:isPct?(d.ep||0)-(d.ip||0):(d.eb||0)-(d.ib||0)}));
    const withX=aug.filter(d=>d[xField]!=null&&!isNaN(d[xField])&&d.pc!=null);
    const top40=new Set([...withX].sort((a,b)=>Math.abs(b[xField])-Math.abs(a[xField])).slice(0,40).map(d=>d.iso3));
    top40.add(c.focal);valid=withX.filter(d=>top40.has(d.iso3));
  } else {
    modeLabel="Exports";xField=isPct?"ep":"eb";
    const kpsc=pv&&pv.kp_scatter;
    if(!kpsc||!kpsc.length){g.append("text").attr("x",w/2).attr("y",h/2).attr("text-anchor","middle").attr("fill","rgba(255,255,255,.3)").text("No per-product data");return;}
    valid=kpsc.filter(d=>d[xField]!=null&&!isNaN(d[xField])&&d.pc!=null);
  }
  if(!valid.length) return;
  const xMin=isBalance?Math.min(0,d3.min(valid,d=>d[xField])||0)*1.15:0;
  const xMax=(d3.max(valid,d=>Math.abs(d[xField]))||1)*1.12;
  const xSc=d3.scaleLinear().domain([xMin,xMax]).range([0,w]).nice();
  const ySc=d3.scaleLinear().domain([0,1.05]).range([h,0]);
  const maxX=d3.max(valid,d=>Math.abs(d[xField]))||1;
  const rSc=d3.scaleSqrt().domain([0,maxX]).range([3,isAllMode?9:11]);
  const xFmt=isPct?d=>`${d.toFixed(1)}%`:d=>`$${d.toFixed(1)}B`;
  g.append("g").attr("transform",`translate(0,${h})`).call(d3.axisBottom(xSc).ticks(4).tickFormat(xFmt)).selectAll("text").attr("font-size","9").attr("fill","rgba(255,255,255,.4)");
  g.select(".domain").remove();
  g.append("g").call(d3.axisLeft(ySc).ticks(4).tickFormat(d3.format(".1f"))).selectAll("text").attr("font-size","9").attr("fill","rgba(255,255,255,.4)");
  g.select(".domain").remove();g.selectAll(".tick line").remove();
  ySc.ticks(4).forEach(v=>{g.append("line").attr("x1",0).attr("x2",w).attr("y1",ySc(v)).attr("y2",ySc(v)).attr("stroke","rgba(255,255,255,.05)");});
  g.append("line").attr("x1",0).attr("x2",w).attr("y1",ySc(.5)).attr("y2",ySc(.5)).attr("stroke","rgba(255,255,255,.15)").attr("stroke-dasharray","4,3");
  if(isBalance){g.append("line").attr("x1",xSc(0)).attr("x2",xSc(0)).attr("y1",0).attr("y2",h).attr("stroke","rgba(255,255,255,.12)").attr("stroke-dasharray","4,3");}
  const dotColor=d=>{if(d.iso3===c.focal) return "#073309";return isAllMode?(REGION_COLOR[d.region]||"#9ca3af"):pvColor+"55";};
  const dotStroke=d=>d.iso3===c.focal?"#3cb54a":isAllMode?"rgba(255,255,255,.15)":pvColor;
  const dotSW=d=>d.iso3===c.focal?2:isAllMode?0.6:1.2;
  g.selectAll(".dot").data(valid).enter().append("circle").attr("class","dot")
    .attr("cx",d=>xSc(d[xField])).attr("cy",d=>ySc(d.pc))
    .attr("r",d=>d.iso3===c.focal?Math.max(rSc(Math.abs(d[xField])),8):Math.max(rSc(Math.abs(d[xField])),3))
    .attr("fill",dotColor).attr("stroke",dotStroke).attr("stroke-width",dotSW)
    .attr("opacity",d=>d.iso3===c.focal?1:0.62)
    .on("mousemove",(ev,d)=>showTip(`<strong>${d.name}</strong>PC: ${d.pc.toFixed(3)}<br>${modeLabel} 2023: ${isPct?(d[xField]||0).toFixed(3)+"%":"$"+(d[xField]||0).toFixed(2)+"B"}`+(!isAllMode&&pv?`<br>${pv.label}`:""),ev))
    .on("mouseleave",hideTip);
  const LABEL_SET=new Set([c.focal,"CHN","USA","DEU","JPN","KOR","IND","ZAF","PER","BOL","CHL","AUS","CAN"]);
  g.selectAll(".dl").data(valid.filter(d=>LABEL_SET.has(d.iso3)&&d.iso3!==c.focal)).enter().append("text").attr("class","dl")
    .attr("x",d=>xSc(d[xField])+Math.max(rSc(Math.abs(d[xField])),3)+2).attr("y",d=>ySc(d.pc)+3.5)
    .attr("font-size","7.5").attr("font-weight","500").attr("fill","rgba(255,255,255,.38)").attr("opacity",.9).text(d=>d.iso3);
  if(valid.find(d=>d.iso3===c.focal)){
    const fd=valid.find(d=>d.iso3===c.focal);
    const fLabel=isAllMode?`${c.focal} (All ${c.tech})`:`${c.focal} - ${pv.label.substring(0,14)}`;
    g.append("text").attr("x",xSc(fd[xField])+12).attr("y",ySc(fd.pc)+3.5).attr("font-size","10").attr("font-weight","700").attr("fill","#3cb54a").text(fLabel);
  }
  const scTitle=document.getElementById("sc-title");
  if(scTitle) scTitle.textContent=isAllMode?`Competitiveness vs ${modeLabel} 2023`:`Competitiveness - ${pv.label}`;
  g.append("text").attr("x",w/2).attr("y",h+30).attr("text-anchor","middle").attr("font-size","9").attr("fill","rgba(255,255,255,.35)").text(`${modeLabel} 2023 (${isPct?"% GDP":"$B"}) - top 40`);
  g.append("text").attr("transform","rotate(-90)").attr("x",-h/2).attr("y",-34).attr("text-anchor","middle").attr("font-size","9").attr("fill","rgba(255,255,255,.35)").text("PC Score");
}

(function buildSrLegend(){
  const el=document.getElementById("tl-sr-legend");if(!el) return;
  const SR_GROUPS=[
    {stage:"UPSTREAM",srs:["Upstream|Raw Material"]},
    {stage:"MIDSTREAM",srs:["Midstream|Processed Material","Midstream|Process Equipment","Midstream|Product Component"]},
    {stage:"DOWNSTREAM",srs:["Downstream|Product Component","Downstream|Process Equipment"]},
    {stage:"FINAL",srs:["Final Product|Final Product"]}
  ];
  const roleLabel=sr=>sr.split("|")[1];
  SR_GROUPS.forEach(grp=>{
    const col=document.createElement("div");col.className="sr-group";
    const title=document.createElement("div");title.className="sr-group-title";title.textContent=grp.stage;
    col.appendChild(title);
    grp.srs.forEach(sr=>{
      const item=document.createElement("div");item.className="sr-item";
      item.innerHTML=`<span class="sr-dot" style="background:${SR_COLORS[sr]||"#9ca3af"}"></span>${roleLabel(sr)}`;
      col.appendChild(item);
    });
    el.appendChild(col);
  });
})();

requestAnimationFrame(()=>{
  initMap();
  drawTimeline(ALL_CASES[0]);drawDendrite(ALL_CASES[0]);drawScatter(ALL_CASES[0]);drawTreemap(ALL_CASES[0]);
});

window.addEventListener("resize",()=>{
  const el=document.getElementById("map-svg");
  const W=el.clientWidth,H=el.clientHeight;if(!W||!H) return;
  mapProjection.scale(Math.max(W/5.0,H/3.3)*0.75).translate([W*.55,H*.48]);
  mapPath=d3.geoPath().projection(mapProjection);
  if(worldTopo){
    const countries=topojson.feature(worldTopo,worldTopo.objects.countries);
    countries.features.forEach(f=>{const numId=+f.id;const iso3=Object.keys(ISO3N).find(k=>ISO3N[k]===numId);if(iso3) centroids[iso3]=mapProjection(d3.geoCentroid(f));});
  }
  updateAll();drawTimeline(ALL_CASES[currentIdx]);drawDendrite(ALL_CASES[currentIdx]);drawScatter(ALL_CASES[currentIdx]);drawTreemap(ALL_CASES[currentIdx]);
});
</script>
